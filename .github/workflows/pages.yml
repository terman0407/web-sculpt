name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # アクションは node24 ランタイムのものを使う。node20 のままだと
      # 「Node.js 20 is deprecated … being forced to run on Node.js 24」と警告が出る。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '26'

      # ブラウザ不要のテスト全部。壊れていたら公開しない。
      # 以前は core.test.mjs だけを門番にしていたが、それだと 12 個あるテストの
      # 1 個しか見ていない。ここが落ちるとデプロイが静かに止まり、公開ページが
      # 古いまま残る（実際に 2 コミットぶん気付かなかった）ので、門番は広く取る。
      - name: Test
        run: npm test && npm run test:modules

      # 単一ファイル版 websculpt.html を最新のソースから作り直す
      - name: Build single-file bundle
        run: node build.mjs

      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp -r index.html websculpt.html css js wasm _site/
          cp -r docs _site/ 2>/dev/null || true
          cp README.md _site/ 2>/dev/null || true
          # Jekyll の処理を無効化（_ 始まりのファイルを消されないように）
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
