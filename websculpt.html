<!DOCTYPE html>
<!-- WebSculpt 単一ファイル版 — このファイルをブラウザで開くだけで動きます（サーバ不要）。
     ソースは js/ 以下のモジュール版。編集後に `node build.mjs` で再生成します。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebSculpt — WebGPU 3D スカルプト</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9744b'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23f5c0a4'/%3E%3C/svg%3E">
<style>
/* --------------------------------------------------------------------------
   WebSculpt UI
   -------------------------------------------------------------------------- */
:root {
  --bg:        #0c0d10;
  --panel:     #16181d;
  --panel-2:   #1c1f25;
  --line:      #262a32;
  --line-2:    #333844;
  --text:      #dfe3ea;
  --text-dim:  #8b93a3;
  --accent:    #d9744b;
  --accent-2:  #f0925f;
  --accent-dim:#5a3527;
  --ok:        #63b37f;
  --radius:    7px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------- トップバー ---------- */
#topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 46px;
  min-height: 46px;
  padding: 0 14px;
  background: linear-gradient(#1b1e24, #14161a);
  border-bottom: 1px solid var(--line);
  z-index: 5;
}
.brand {
  font-size: 15px;
  letter-spacing: 0.4px;
  color: var(--text-dim);
  white-space: nowrap;
}
.brand b { color: var(--text); font-weight: 600; }
.brand .tag {
  margin-left: 8px;
  padding: 2px 6px;
  font-size: 10px;
  letter-spacing: 0.6px;
  border: 1px solid var(--accent-dim);
  border-radius: 4px;
  color: var(--accent-2);
  vertical-align: 2px;
}
.meshbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.meshbar::-webkit-scrollbar { display: none; }
.meshbar .btnrow { margin: 0; }
.stats {
  margin-left: auto;
  display: flex;
  gap: 14px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stats b { color: var(--text); font-weight: 600; }
.stats .dim { color: #5f6673; }

.mesh-select {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 5px 8px;
  font: inherit;
  outline: none;
}
.mesh-select:hover { border-color: var(--accent-dim); }

/* ---------- レイアウト ---------- */
#bodyrow {
  display: flex;
  flex: 1;
  min-height: 0;
}
#leftbar {
  width: 116px;
  min-width: 116px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 8px 6px;
}
#rightbar {
  width: 292px;
  min-width: 292px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  overflow-y: auto;
}
#viewport {
  position: relative;
  flex: 1;
  min-width: 0;
  background: #000;
}
#gpu {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

/* スクロールバー */
#leftbar::-webkit-scrollbar, #rightbar::-webkit-scrollbar { width: 9px; }
#leftbar::-webkit-scrollbar-thumb, #rightbar::-webkit-scrollbar-thumb {
  background: #2c313a; border-radius: 5px;
}
#leftbar::-webkit-scrollbar-track, #rightbar::-webkit-scrollbar-track { background: transparent; }

/* ---------- ブラシパレット ---------- */
.brushlist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.brush {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 1px 5px;
  background: var(--panel-2);
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.brush:hover { background: #23272f; color: var(--text); }
.brush .bi { font-size: 15px; line-height: 1; }
.brush .bn { font-size: 9px; letter-spacing: 0; text-align: center; line-height: 1.2; }
.brush.on {
  background: linear-gradient(#3b241b, #2a1a14);
  border-color: var(--accent);
  color: var(--accent-2);
}

/* ---------- 右パネル ---------- */
.panel { padding: 4px 0 40px; }
.section { border-bottom: 1px solid var(--line); }
.sec-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 12px;
  background: none;
  border: 0;
  color: var(--text);
  font: inherit;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  text-align: left;
}
.sec-head:hover { background: #1a1d23; }
.sec-head .chev { color: var(--text-dim); font-size: 10px; transition: transform .15s; }
.section.collapsed .sec-head .chev { transform: rotate(-90deg); }
.sec-body { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.section.collapsed .sec-body { display: none; }

/* コントロール共通 */
.ctl-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.ctl-top label { color: var(--text-dim); font-size: 11.5px; }
.ctl-top .val { color: var(--text); font-variant-numeric: tabular-nums; font-size: 11.5px; }

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 16px;
  background: transparent;
  outline: none;
  margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  background: #2b303a;
  border-radius: 3px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--accent);
  border: 1px solid #1a1c21;
  cursor: pointer;
}
input[type=range]:hover::-webkit-slider-thumb { background: var(--accent-2); }
input[type=range]::-moz-range-track { height: 4px; background: #2b303a; border-radius: 3px; }
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border: 1px solid #1a1c21;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}

/* トグル */
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.toggle:hover { border-color: var(--line-2); color: var(--text); }
.toggle .box {
  width: 13px; height: 13px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  flex: 0 0 auto;
  position: relative;
}
.toggle.on { color: var(--text); border-color: var(--accent-dim); }
.toggle.on .box { background: var(--accent); border-color: var(--accent); }
.toggle.on .box::after {
  content: "";
  position: absolute; left: 3.5px; top: 1px;
  width: 4px; height: 7px;
  border: solid #16181d; border-width: 0 2px 2px 0;
  transform: rotate(40deg);
}

/* ボタン */
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  flex: 1 1 auto;
  padding: 6px 9px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: #24282f; border-color: var(--line-2); }
.btn:active { background: #2c313a; }
.btn.wide { flex: 1 1 100%; }
.btn.primary {
  background: linear-gradient(#3d2519, #2c1a12);
  border-color: var(--accent);
  color: var(--accent-2);
  font-weight: 600;
  padding: 8px 9px;
}
.btn.primary:hover { background: linear-gradient(#4a2d1e, #351f15); }
.btn.sym { font-weight: 600; letter-spacing: 1px; }
.btn.sym.on {
  background: linear-gradient(#3b241b, #2a1a14);
  border-color: var(--accent);
  color: var(--accent-2);
}

/* セグメント */
.segmented { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg {
  flex: 1;
  padding: 6px 0;
  background: var(--panel-2);
  border: 0;
  border-right: 1px solid var(--line);
  color: var(--text-dim);
  font: inherit;
  cursor: pointer;
}
.seg:last-child { border-right: 0; }
.seg:hover { color: var(--text); background: #24282f; }
.seg.on { background: var(--accent-dim); color: var(--accent-2); }

/* 色 */
input[type=color] {
  width: 100%;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--panel-2);
  cursor: pointer;
}
.swatches { display: flex; gap: 4px; margin-top: 6px; }
.sw {
  flex: 1;
  height: 17px;
  border: 1px solid #00000060;
  border-radius: 3px;
  cursor: pointer;
  padding: 0;
}
.sw:hover { outline: 1px solid var(--accent); }

/* マテリアル */
.matgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mat {
  padding: 3px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  line-height: 0;
}
.mat canvas { width: 100%; height: auto; border-radius: 4px; }
.mat:hover { border-color: var(--line-2); }
.mat.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

.note { margin: 2px 0 0; color: var(--text-dim); font-size: 11px; line-height: 1.55; }
.sublabel { color: var(--text-dim); font-size: 11.5px; margin-bottom: -4px; }

table.keys { width: 100%; border-collapse: collapse; font-size: 11px; }
table.keys td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid #1f232a; }
table.keys td:first-child { color: var(--accent-2); white-space: nowrap; width: 46%; }
table.keys td:last-child { color: var(--text-dim); }

/* ---------- トースト ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(12px);
  padding: 8px 16px;
  background: #14161ae0;
  border: 1px solid var(--line-2);
  border-radius: 20px;
  color: var(--text);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  max-width: 80%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 減衰カーブプレビュー ---------- */
.falloff-wrap {
  background: #101216;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px;
  margin-bottom: 4px;
  line-height: 0;
}
canvas.falloff { width: 100%; height: 52px; display: block; }

/* ---------- 分割レベル表示 ---------- */
.lvl {
  padding: 6px 9px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.lvl.on { color: var(--accent-2); border-color: var(--accent-dim); }

/* ---------- 保存スロット ---------- */
input.text {
  width: 100%;
  padding: 6px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  outline: none;
}
input.text:focus { border-color: var(--accent); }
.projlist { display: flex; flex-direction: column; gap: 4px; }
.projrow { display: flex; align-items: center; gap: 5px; }
.projname {
  flex: 1;
  min-width: 0;
  padding: 5px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.projname:hover { border-color: var(--accent-dim); color: var(--accent-2); }
.projmeta { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.projdel {
  width: 24px; height: 26px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  flex: 0 0 auto;
}
.projdel:hover { color: #e0705e; border-color: #5a2a22; }

/* ---------- 確認ダイアログ ---------- */
.ask {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #08090baa;
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s;
  z-index: 30;
}
.ask.show { opacity: 1; pointer-events: all; }
.ask-card {
  max-width: 420px;
  padding: 20px 22px;
  background: #16181df2;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  text-align: center;
}
.ask-card p { margin: 0 0 16px; color: var(--text); line-height: 1.7; }
.ask-btns { display: flex; gap: 8px; justify-content: center; }
.ask-btns .btn { min-width: 96px; flex: 0 0 auto; }

/* ---------- 処理中オーバーレイ ---------- */
.busy {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #08090b99;
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s;
  z-index: 20;
}
.busy.show { opacity: 1; pointer-events: all; }
.busy-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  background: #16181def;
  border: 1px solid var(--line-2);
  border-radius: 10px;
}
.busy-card p { margin: 0; color: var(--text); }
.busy-card .spinner { width: 20px; height: 20px; border-width: 2px; }

/* ---------- ローディング / 致命的エラー ---------- */
.loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #0c0d10;
  color: var(--text-dim);
  z-index: 10;
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid #2b303a;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.fatal {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: #08090bee;
  z-index: 100;
  padding: 24px;
}
.fatal .card {
  max-width: 520px;
  padding: 28px 30px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  text-align: center;
}
.fatal .ico { font-size: 34px; color: var(--accent); }
.fatal h2 { margin: 10px 0 8px; font-size: 17px; }
.fatal p { margin: 6px 0; color: var(--text-dim); line-height: 1.7; }
.fatal .small { margin-top: 16px; font-size: 11.5px; color: #6d7482; }
.fatal code {
  background: #22262d; padding: 1px 5px; border-radius: 3px; font-size: 11px;
}

@media (max-width: 1080px) {
  #rightbar { width: 250px; min-width: 250px; }
  #leftbar { width: 72px; min-width: 72px; }
  .brush .bn { font-size: 9px; }
}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">Web<b>Sculpt</b><span class="tag">WebGPU</span></div>
    <div id="meshBar" class="meshbar"></div>
    <div id="stats" class="stats"></div>
  </header>

  <div id="bodyrow">
    <aside id="leftbar">
      <div id="brushList" class="brushlist"></div>
    </aside>

    <main id="viewport">
      <canvas id="gpu"></canvas>
      <div id="toast" class="toast"></div>
      <div id="busy" class="busy">
        <div class="busy-card">
          <div class="spinner"></div>
          <p id="busyMsg">処理中…</p>
        </div>
      </div>
      <div id="ask" class="ask">
        <div class="ask-card">
          <p id="askMsg"></p>
          <div class="ask-btns">
            <button id="askNo" class="btn">いいえ</button>
            <button id="askYes" class="btn primary">はい</button>
          </div>
        </div>
      </div>
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>WebGPU デバイスと MatCap を初期化中…</p>
      </div>
    </main>

    <aside id="rightbar">
      <div id="rightPanel" class="panel"></div>
    </aside>
  </div>
</div>

<div id="fatal" class="fatal">
  <div class="card">
    <div class="ico">⚠</div>
    <h2 id="fatalMsg">エラー</h2>
    <p id="fatalDetail"></p>
    <p class="small">
      対応環境: Chrome / Edge 113+、Safari 18+、WebGPU を有効化した Firefox。<br>
      <code>chrome://gpu</code> で WebGPU の状態を確認できます。
    </p>
  </div>
</div>

<script>
/* WebSculpt — 単一ファイルビルド（自動生成: build.mjs / 編集しないでください） */
(function () {
'use strict';
const __M = Object.create(null);

/* ===== store.js ===== */
__M['store.js'] = (function () {
// ---------------------------------------------------------------------------
// store.js - ブラウザ内保存
//
//   設定（ブラシ・表示など）  → localStorage（数 KB の JSON）
//   メッシュ本体              → IndexedDB（localStorage は 5MB 前後で足りない。
//                               IndexedDB なら型付き配列をそのまま保存できる）
//
// オートセーブはストローク終了から一定時間後に 1 回だけ走らせ、
// 次回起動時に「復元しますか」と聞ける状態にしておく。
// ---------------------------------------------------------------------------

const DB_NAME = 'websculpt';
const DB_VERSION = 1;
const STORE = 'projects';
const SETTINGS_KEY = 'websculpt.settings.v1';
const AUTOSAVE_NAME = '__autosave__';

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!self.indexedDB) { reject(new Error('この環境では IndexedDB が使えません')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'name' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB を開けません'));
  });
  return dbPromise;
}

function tx(mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const store = t.objectStore(STORE);
    let result;
    try { result = fn(store); } catch (e) { reject(e); return; }
    t.oncomplete = () => resolve(result && result.__req ? result.__req.result : result);
    t.onerror = () => reject(t.error || new Error('IndexedDB エラー'));
    t.onabort = () => reject(t.error || new Error('IndexedDB 中断'));
  }));
}

// --- 設定（localStorage） --------------------------------------------------

const SETTING_KEYS = [
  'brush', 'radiusPx', 'strength', 'focalShift', 'lazyRadius', 'usePressure',
  'pressureSize', 'pressureStrength', 'backfaceMask',
  'dynTopo', 'decimate', 'detail', 'maxVerts',
  'dynaResolution', 'dynaSmooth', 'dynaTransferColor',
  'material', 'wireframe', 'ao', 'aoIntensity', 'aoRadius', 'aoPower',
  'cavity', 'peak', 'cavityGain', 'grid', 'exposure', 'maskDarken',
  'renderScale', 'invertOrbitY', 'bgPreset', 'paintColor', 'symmetry',
];

function saveSettings(state) {
  try {
    const o = {};
    for (const k of SETTING_KEYS) {
      if (state[k] === undefined) continue;
      o[k] = (k === 'symmetry' || k === 'paintColor') ? JSON.parse(JSON.stringify(state[k])) : state[k];
    }
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(o));
    return true;
  } catch { return false; }
}

function loadSettings(state) {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    for (const k of SETTING_KEYS) {
      if (o[k] === undefined) continue;
      if (k === 'symmetry') {
        if (o.symmetry && typeof o.symmetry === 'object') {
          state.symmetry.x = !!o.symmetry.x;
          state.symmetry.y = !!o.symmetry.y;
          state.symmetry.z = !!o.symmetry.z;

    ox = bb.min[0] - pad + h * JIT[0];
    oy = bb.min[1] - pad + h * JIT[1];
    oz = bb.min[2] - pad + h * JIT[2];
    nx = Math.ceil((ex + pad * 2) / h) + 1;
    ny = Math.ceil((ey + pad * 2) / h) + 1;
    nz = Math.ceil((ez + pad * 2) / h) + 1;
    if (nx * ny * nz <= maxVoxels) break;
    h *= 1.12;
  }
  const sy = nx, sz = nx * ny;
  const total = nx * ny * nz;

  const band = h * 2.0;                // 少なくとも sqrt(3)*h 必要（セル対角）
  // 初期値を band にしておくと、下の下界カリングが 1 枚目の三角形から効く。
  // 帯域外の voxel は符号しか使わないので、正確な距離が入っていなくても問題ない。
  const field = new Float32Array(total).fill(band);
  const closest = transferColor ? new Int32Array(total).fill(-1) : null;
  const P = mesh.positions, T = mesh.tris;

  mark('grid');
  // ---- 2. 狭帯域の符号なし距離場 ---------------------------------------
  // 全体の 9 割を占める部分。WASM が使えればそちらへ（結果は JS 版と完全一致）。
  const gp = { nx, ny, nz, ox, oy, oz, h, band };
  let usedWasm = false, usedParallel = false;
  // 十分大きいときだけワーカーに出す（小さいと転送のほうが高くつく）
  const heavy = mesh.liveTris >= 60000 || total >= 400000;
  if (opts.parallel !== false && heavy && parallelState() === 'ready') {
    usedParallel = await parallelSplat(mesh, field, closest, gp);
    usedWasm = usedParallel;
  }
  if (!usedWasm && opts.wasm !== false && wasmFieldReady()) {
    usedWasm = wasmSplat(mesh, field, closest, gp);
  }

  // WASM が使えなかったときの JS 版（アルゴリズムは同一）
  if (!usedWasm) for (let t = 0; t < mesh.nt; t++) {
    const ti = t * 3;
    const ia = T[ti], ib = T[ti + 1], ic = T[ti + 2];
    if (ia === ib && ib === ic) continue;
    const a = ia * 3, b = ib * 3, c = ic * 3;
    const ax = P[a], ay = P[a + 1], az = P[a + 2];
    const bx = P[b], by = P[b + 1], bz = P[b + 2];
    const cx = P[c], cy = P[c + 1], cz = P[c + 2];

    const tx0 = Math.min(ax, bx, cx), tx1 = Math.max(ax, bx, cx);
    const ty0 = Math.min(ay, by, cy), ty1 = Math.max(ay, by, cy);
    const tz0 = Math.min(az, bz, cz), tz1 = Math.max(az, bz, cz);

    // 走査すべきは「三角形から band 以内にある格子点」。格子点 i の座標は ox + i*h
    // なので下限は ceil、上限は floor が正しい。floor/ceil を逆に取ると軸ごとに
    // 2 セル余分に回ることになり、点に近い三角形では 7^3 と 5^3 で 2.7 倍の差が出る。
    const i0 = Math.max(0, Math.ceil((tx0 - band - ox) / h));
    const i1 = Math.min(nx - 1, Math.floor((tx1 + band - ox) / h));
    const j0 = Math.max(0, Math.ceil((ty0 - band - oy) / h));
    const j1 = Math.min(ny - 1, Math.floor((ty1 + band - oy) / h));
    const k0 = Math.max(0, Math.ceil((tz0 - band - oz) / h));
    const k1 = Math.min(nz - 1, Math.floor((tz1 + band - oz) / h));

    // AABB までの距離は三角形までの距離の下界になる。これを軸ごとに外へ括り出して
    // 「確実に現在値より遠い voxel」を pointTriDist2 を呼ばずに捨てる。
    for (let k = k0; k <= k1; k++) {
      const pz = oz + k * h;
      const ez = pz < tz0 ? tz0 - pz : (pz > tz1 ? pz - tz1 : 0);
      const e2z = ez * ez;
      if (e2z >= band * band) continue;                       // この z 面は丸ごと不要
      for (let j = j0; j <= j1; j++) {
        const py = oy + j * h;
        const ey = py < ty0 ? ty0 - py : (py > ty1 ? py - ty1 : 0);
        const e2zy = e2z + ey * ey;
        if (e2zy >= band * band) continue;                    // この行は丸ごと不要
        let idx = i0 + j * sy + k * sz;
        for (let i = i0; i <= i1; i++, idx++) {
          const px = ox + i * h;
          const cur = field[idx];
          const ex = px < tx0 ? tx0 - px : (px > tx1 ? px - tx1 : 0);
          if (e2zy + ex * ex >= cur * cur) continue;          // 下界が既存値以上 → 更新されない
          // 平方で比較して大半の voxel で sqrt を省く
          const d2 = pointTriDist2(px, py, pz, ax, ay, az, bx, by, bz, cx, cy, cz);
          if (d2 < cur * cur) {
            field[idx] = Math.sqrt(d2);
            if (closest) closest[idx] = t;
          }
        }
      }
    }
  }

  mark('distance');
  // ---- 3. 内外判定 ------------------------------------------------------
  //
  // 境界の有無は「全辺を Map に入れて 1 面しかない辺を探す」のが素直だが、
  // 300 万面だと 900 万件の Map 操作で 1.4 秒かかっていた。
  // 実際に知りたいのは「巻き数が信用できるか」なので、スキャンラインを
  // 走査し終えたときに巻き数が 0 に戻るかどうかで判定する（追加コストなし）。
  // 閉じたメッシュならレイは必ず外側で始まり外側で終わるので必ず 0 に戻る。
  const far = band + h;
  let openMesh = false;

  {
    // Z 方向のスキャンラインごとに符号付き交差（巻き数）を集める
    const lines = new Array(nx * ny);
    for (let t = 0; t < mesh.nt; t++) {
      const ti = t * 3;
      const ia = T[ti], ib = T[ti + 1], ic = T[ti + 2];
      if (ia === ib && ib === ic) continue;
      const a = ia * 3, b = ib * 3, c = ic * 3;
      const ax = P[a], ay = P[a + 1], az = P[a + 2];
      const bx = P[b], by = P[b + 1], bz = P[b + 2];
      const cx = P[c], cy = P[c + 1], cz = P[c + 2];

      // XY 平面に射影した符号付き面積（= 法線の z 成分の符号）
      const area2 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
      if (Math.abs(area2) < 1e-20) continue;
      const dir = area2 > 0 ? -1 : 1;   // 法線 -Z なら +Z 進行のレイは「入る」

      const i0 = Math.max(0, Math.ceil((Math.min(ax, bx, cx) - ox) / h));
      const i1 = Math.min(nx - 1, Math.floor((Math.max(ax, bx, cx) - ox) / h));
      const j0 = Math.max(0, Math.ceil((Math.min(ay, by, cy) - oy) / h));
      const j1 = Math.min(ny - 1, Math.floor((Math.max(ay, by, cy) - oy) / h));
      if (i1 < i0 || j1 < j0) continue;

      const inv = 1 / area2;
      for (let j = j0; j <= j1; j++) {
        const py = oy + j * h;
        for (let i = i0; i <= i1; i++) {
          const px = ox + i * h;
          // 2D 重心座標で内包判定
          const w0 = ((bx - px) * (cy - py) - (by - py) * (cx - px)) * inv;
          if (w0 < 0 || w0 > 1) continue;
          const w1 = ((cx - px) * (ay - py) - (cy - py) * (ax - px)) * inv;
          if (w1 < 0 || w1 > 1) continue;
          const w2 = 1 - w0 - w1;
          if (w2 < 0 || w2 > 1) continue;
          const zc = az * w0 + bz * w1 + cz * w2;
          const li = i + j * nx;
          let L = lines[li];
          if (!L) { L = lines[li] = []; }
          L.push(zc, dir);
        }
      }
    }

    // まず全ラインの巻き数が 0 に戻るか確認する（= 境界がないか）
    const orders = new Array(nx * ny);
    for (let li = 0; li < lines.length; li++) {
      const L = lines[li];
      if (!L) continue;
      const n = L.length / 2;
      const order = new Int32Array(n);
      for (let q = 0; q < n; q++) order[q] = q;
      const sorted = Array.prototype.sort.call(order, (p, r) => L[p * 2] - L[r * 2]);
      orders[li] = sorted;
      let wind = 0;
      for (let q = 0; q < n; q++) wind += L[q * 2 + 1];
      if (wind !== 0) { openMesh = true; break; }
    }

    let insideCount = 0;
    if (!openMesh) {
      for (let j = 0; j < ny; j++) {
        for (let i = 0; i < nx; i++) {
          const li = i + j * nx;
          const L = lines[li];
          if (!L) continue;
          const order = orders[li];
          const n = order.length;
          let wind = 0, q = 0;
          const colBase = i + j * sy;
          for (let k = 0; k < nz; k++) {
            const pz = oz + k * h;
            while (q < n && L[order[q] * 2] <= pz) { wind += L[order[q] * 2 + 1]; q++; }
            if (wind !== 0) {
              const idx = colBase + k * sz;
              field[idx] = -Math.min(field[idx], far);
              insideCount++;
            }
          }
        }
      }
      // 内側が 1 つも無い = Z レイから見て中身がない。
      // 面が XZ 平面に乗っている板（射影面積 0 で交差を生まない）や、
      // 1 ボクセル未満の薄い閉殻がこれに当たる。どちらもシェル化が正しい。
      if (insideCount === 0) openMesh = true;
    }

    if (openMesh) {
      // 境界があるメッシュは巻き数が使えないので、厚みを持つシェルとして扱う。
      // （平面をダイナメッシュすると板になる）
      const thickness = h * 1.25;
      for (let i = 0; i < total; i++) {
        field[i] = Math.min(Math.abs(field[i]), far) - thickness;
      }
    } else {
      // 内側にならなかった voxel は外側として帯域外をクランプする
      for (let i = 0; i < total; i++) {
        if (field[i] > 0) field[i] = Math.min(field[i], far);
      }
    }
  }

  mark('inside');
  // ---- 4. Surface Nets --------------------------------------------------
  const verts = [];
  const idxOut = [];
  const cellTri = transferColor ? [] : null;
  const nxy = nx * ny;
  let bufA = new Int32Array(nxy).fill(-1);   // 現在の z 層
  let bufB = new Int32Array(nxy).fill(-1);   // 1 つ前の z 層
  const grid = new Float64Array(8);

  const quad = (a, b, c, d) => {
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    idxOut.push(a, b, c, a, c, d);
  };

  for (let cz = 0; cz < nz - 1; cz++) {
    bufA.fill(-1);
    for (let cy = 0; cy < ny - 1; cy++) {
      for (let cx = 0; cx < nx - 1; cx++) {
        const base = cx + cy * sy + cz * sz;
        let mask = 0;
        for (let b = 0; b < 8; b++) {
          const g = field[base + (b & 1) + ((b >> 1) & 1) * sy + ((b >> 2) & 1) * sz];
          grid[b] = g;
          if (g > 0) mask |= (1 << b);
        }
        if (mask === 0 || mask === 0xff) continue;

        const em = EDGE_TABLE[mask];
        let vx = 0, vy = 0, vz = 0, cnt = 0;
        for (let e = 0; e < 12; e++) {
          if (!(em & (1 << e))) continue;
          const ea = CUBE_EDGES[e * 2], eb = CUBE_EDGES[e * 2 + 1];
          const ga = grid[ea], gb = grid[eb];
          const den = ga - gb;
          if (Math.abs(den) < 1e-20) continue;
          const t = ga / den;
          let px = ea & 1, py = (ea >> 1) & 1, pz = (ea >> 2) & 1;
          const axis = ea ^ eb;
          if (axis === 1) px += t; else if (axis === 2) py += t; else pz += t;
          vx += px; vy += py; vz += pz; cnt++;
        }
        if (cnt === 0) continue;
        const inv = 1 / cnt;
        const vi = verts.length / 3;
        verts.push(
          ox + (cx + vx * inv) * h,
          oy + (cy + vy * inv) * h,
          oz + (cz + vz * inv) * h,
        );
        if (cellTri) cellTri.push(closest[base] >= 0 ? closest[base] : -1);
        const cur = cx + cy * nx;
        bufA[cur] = vi;

        // 角 0 から伸びる 3 本の辺に符号変化があれば、その辺を囲む 4 セルで面を張る。
        // 角 0 が外側（field > 0）かどうかで巻き方向を反転させ、法線を外向きに揃える。
        const positive0 = (mask & 1) !== 0;
        if ((em & 1) && cy > 0 && cz > 0) {           // x 方向の辺 → (y, z) 側の 4 セル
          const A = bufA[cur], B = bufA[cur - nx], C = bufB[cur - nx], D = bufB[cur];
          if (positive0) quad(A, D, C, B); else quad(A, B, C, D);
        }
        if ((em & 2) && cz > 0 && cx > 0) {           // y 方向の辺 → (z, x) 側の 4 セル
          const A = bufA[cur], B = bufB[cur], C = bufB[cur - 1], D = bufA[cur - 1];
          if (positive0) quad(A, D, C, B); else quad(A, B, C, D);
        }
        if ((em & 4) && cx > 0 && cy > 0) {           // z 方向の辺 → (x, y) 側の 4 セル
          const A = bufA[cur], B = bufA[cur - 1], C = bufA[cur - nx - 1], D = bufA[cur - nx];
          if (positive0) quad(A, D, C, B); else quad(A, B, C, D);
        }
      }
    }
    const tmp = bufB; bufB = bufA; bufA = tmp;
  }

  mark('surfaceNets');
  // ---- 5. 多様体修復（1 ボクセル未満の薄い部分で必要になる） ------------
  const rep = repairManifold(new Float32Array(verts), new Uint32Array(idxOut));
  const positions = rep.positions;
  const indices = rep.indices;

  mark('repair');
  // ---- 6. Taubin スムージング ------------------------------------------
  if (smoothIters > 0 && positions.length > 0) {
    taubinSmooth(positions, indices, smoothIters, 0.55, 0.58);
  }

  mark('smooth');
  // ---- 7. 色の転写 ------------------------------------------------------
  let colors = null;
  if (transferColor && cellTri) {
    colors = new Float32Array(positions.length);
    const C = mesh.colors;
    const nOut = positions.length / 3;
    for (let v = 0; v < nOut; v++) {
      const s = rep.attrSource[v];
      const t = (s >= 0 && s < cellTri.length) ? cellTri[s] : -1;
      const o = v * 3;
      if (t < 0) { colors[o] = 1; colors[o + 1] = 1; colors[o + 2] = 1; continue; }
      const ti = t * 3;
      const a = T[ti] * 3, b = T[ti + 1] * 3, c = T[ti + 2] * 3;
      colors[o] = (C[a] + C[b] + C[c]) / 3;
      colors[o + 1] = (C[a + 1] + C[b + 1] + C[c + 1]) / 3;
      colors[o + 2] = (C[a + 2] + C[b + 2] + C[c + 2]) / 3;
    }
  }

  mark('color');

  return {
    positions, indices, colors,
    stats: {
      phase,
      inputTris: mesh.liveTris,
      wasm: usedWasm,
      parallel: usedParallel,
      parTiming: usedParallel ? Object.assign({}, lastTiming) : null,
      resolution: res,
      grid: [nx, ny, nz],
      voxelSize: h,
      openMesh,
      verts: positions.length / 3,
      tris: indices.length / 3,
      repair: rep.stats,
      ms: Date.now() - t0,
    },
  };
}

// ---------------------------------------------------------------------------
// 多様体修復
//
// Surface Nets は 1 セルに 1 頂点しか置かないため、1 ボクセル程度しか厚みのない
// 部分では 1 頂点が 2 枚のシートに使われ、非多様体な辺 / 頂点が生じることがある
// （デュアルコンタリング共通の既知の限界）。
// 彫刻側は多様体を前提にしているので、抽出後にここで必ず閉多様体へ直す。
//
//   1. 3 枚以上の面が付いた辺は、向きの整合が取れる 2 枚だけ残して他を削除
//   2. 面の連結成分が 2 つ以上ある頂点を複製して切り離す
//   3. 空いた穴（境界ループ）を重心ファンで閉じる
// ---------------------------------------------------------------------------

const EKEY = 2097152;

function buildEdgeFaces(tris, nf) {
  const map = new Map();
  for (let f = 0; f < nf; f++) {
    const i = f * 3;
    if (tris[i] < 0) continue;
    for (let e = 0; e < 3; e++) {
      const a = tris[i + e], b = tris[i + (e + 1) % 3];
      const key = a < b ? a * EKEY + b : b * EKEY + a;
      let L = map.get(key);
      if (!L) { L = []; map.set(key, L); }
      L.push(f);
    }
  }
  return map;
}

/**
 * 抽出結果を必ず「閉じた多様体」に直す。
 * @returns {{positions, indices, attrSource, stats}}
 *   attrSource[newVertexIndex] = 元の抽出頂点インデックス（属性の引き直し用）
 */
function repairManifold(positionsIn, indicesIn) {
  const nv0 = positionsIn.length / 3;

  // まず 1 回だけ辺マップを作り、直すものが無ければ即返す（通常はこちら）
  {
    const map = buildEdgeFaces(indicesIn, indicesIn.length / 3);
    let dirty = false;
    for (const L of map.values()) if (L.length !== 2) { dirty = true; break; }
    if (!dirty) {
      const id = new Int32Array(nv0);
      for (let v = 0; v < nv0; v++) id[v] = v;
      return {
        positions: positionsIn, indices: indicesIn, attrSource: id,
        stats: { facesRemoved: 0, verticesSplit: 0, holesFilled: 0, nonManifold: 0, boundary: 0, clean: true },
      };
    }
  }

  const pos = Array.from(positionsIn);
  const tris = Array.from(indicesIn);
  const src = new Array(nv0);
  for (let v = 0; v < nv0; v++) src[v] = v;
  let nf = tris.length / 3;
  let facesRemoved = 0, verticesSplit = 0, holesFilled = 0;

  const hasDirected = (f, a, b) => {
    const i = f * 3;
    return (tris[i] === a && tris[i + 1] === b)
      || (tris[i + 1] === a && tris[i + 2] === b)
      || (tris[i + 2] === a && tris[i] === b);
  };

  // ---- 1. 3 枚以上付いた辺を 2 枚に間引く ------------------------------
  for (let pass = 0; pass < 8; pass++) {
    const map = buildEdgeFaces(tris, nf);
    let removed = 0;
    for (const [key, L] of map) {
      if (L.length <= 2) continue;
      const a = Math.floor(key / EKEY), b = key % EKEY;
      const live = L.filter(f => tris[f * 3] >= 0);
      if (live.length <= 2) continue;
      // 向きが逆の 2 枚（a→b と b→a）を優先して残す
      const fwd = live.filter(f => hasDirected(f, a, b));
      const rev = live.filter(f => hasDirected(f, b, a));
      const keep = new Set();
      if (fwd.length && rev.length) { keep.add(fwd[0]); keep.add(rev[0]); }
      else { keep.add(live[0]); keep.add(live[1]); }
      for (const f of live) {
        if (keep.has(f)) continue;
        tris[f * 3] = -1; tris[f * 3 + 1] = -1; tris[f * 3 + 2] = -1;
        removed++;
      }
    }
    facesRemoved += removed;
    if (removed === 0) break;
  }

  // ---- 2. 非多様体頂点の分離 -------------------------------------------
  {
    const nv0 = pos.length / 3;
    const incident = new Array(nv0);
    for (let f = 0; f < nf; f++) {
      const i = f * 3;
      if (tris[i] < 0) continue;
      for (let e = 0; e < 3; e++) {
        const v = tris[i + e];
        if (!incident[v]) incident[v] = [];
        incident[v].push(f);
      }
    }
    for (let v = 0; v < nv0; v++) {
      const fs = incident[v];
      if (!fs || fs.length < 2) continue;
      // v の周りで辺を共有する面同士を結び、連結成分に分ける
      const other = (f) => {
        const i = f * 3;
        const a = tris[i], b = tris[i + 1], c = tris[i + 2];
        if (a === v) return [b, c];
        if (b === v) return [c, a];
        return [a, b];
      };
      const byNbr = new Map();
      for (const f of fs) {
        for (const u of other(f)) {
          let L = byNbr.get(u);
          if (!L) { L = []; byNbr.set(u, L); }
          L.push(f);
        }
      }
      const comp = new Map();
      let nComp = 0;
      for (const f of fs) {
        if (comp.has(f)) continue;
        const id = nComp++;
        const stack = [f];
        comp.set(f, id);
        while (stack.length) {
          const g = stack.pop();
          for (const u of other(g)) {
            for (const hh of (byNbr.get(u) || [])) {
              if (!comp.has(hh)) { comp.set(hh, id); stack.push(hh); }
            }
          }
        }
      }
      if (nComp <= 1) continue;
      // 成分 0 は元の頂点をそのまま使い、1 以降は複製する
      const dup = new Array(nComp).fill(-1);
      for (let c = 1; c < nComp; c++) {
        dup[c] = pos.length / 3;
        pos.push(pos[v * 3], pos[v * 3 + 1], pos[v * 3 + 2]);
        src.push(src[v]);
        verticesSplit++;
      }
      for (const f of fs) {
        const c = comp.get(f);
        if (c === 0) continue;
        const i = f * 3;
        for (let e = 0; e < 3; e++) if (tris[i + e] === v) tris[i + e] = dup[c];
      }
    }
  }

  // ---- 3. 穴埋め --------------------------------------------------------
  {
    const map = buildEdgeFaces(tris, nf);
    // 境界辺を「穴側の向き」（面の巻きと逆）で集める
    const next = new Map();
    for (const [key, L] of map) {
      const live = L.filter(f => tris[f * 3] >= 0);
      if (live.length !== 1) continue;
      const a = Math.floor(key / EKEY), b = key % EKEY;
      const f = live[0];
      const [s, e] = hasDirected(f, a, b) ? [b, a] : [a, b];

        const ui = u * 3;
        const d = (P[ui] - px) ** 2 + (P[ui + 1] - py) ** 2 + (P[ui + 2] - pz) ** 2;
        if (d < nd) { nd = d; next = u; }
      }
    }
    if (next < 0) return cur;
    cur = next; cd = nd; ci = cur * 3;
  }
  return cur;
}

// ---------------------------------------------------------------------------

class History {
  constructor(limit = 24, byteLimit = 320 * 1024 * 1024) {
    this.limit = limit;
    this.byteLimit = byteLimit;
    this.states = [];
    this.cur = -1;
  }
  reset(mesh) {
    this.states = [mesh.snapshot()];
    this.cur = 0;
  }
  commit(mesh) {
    if (this.cur < this.states.length - 1) this.states.length = this.cur + 1;
    this.states.push(mesh.snapshot());
    this.cur = this.states.length - 1;
    // 件数とメモリ量の両方で古い履歴を捨てる（最新 2 件は必ず残す）
    while (this.states.length > this.limit
      || (this.states.length > 2 && this.bytes() > this.byteLimit)) {
      this.states.shift();
      this.cur--;
    }
  }
  canUndo() { return this.cur > 0; }
  canRedo() { return this.cur >= 0 && this.cur < this.states.length - 1; }
  undo(mesh) {
    if (!this.canUndo()) return false;
    this.cur--;
    mesh.restore(this.states[this.cur]);
    return true;
  }
  redo(mesh) {
    if (!this.canRedo()) return false;
    this.cur++;
    mesh.restore(this.states[this.cur]);
    return true;
  }
  bytes() {
    let b = 0;
    for (const s of this.states) {
      b += s.positions.byteLength + s.colors.byteLength + s.mask.byteLength
        + s.vAlive.byteLength + s.tris.byteLength;
    }
    return b;
  }
}

// ---------------------------------------------------------------------------

class MirrorState {
  constructor() {
    this.seed = -1;
    this.lastPoint = V3.create();
    this.center = V3.create();
    this.lockedVerts = null;   // move ブラシ用の固定領域
    this.lockedCount = 0;
    this.verts = [];
    this.tris = [];
    this.count = 0;
  }
}

class Sculptor {
  constructor(mesh, state) {
    this.mesh = mesh;
    this.state = state;
    this.engine = new BrushEngine();
    this.history = new History();

    this.vStamp = new Int32Array(0);
    this.tStamp = new Int32Array(0);
    this.stamp = 0;
    this.queue = new Int32Array(0);
    this.normalSet = [];
    this.curvSet = [];
    this.curvPending = [];      // フレーム末にまとめて曲率を直す頂点
    this.cvStamp = new Int32Array(0);
    this.cvStampId = 1;
    this._movedVerts = [];      // dyntopo のコラプスで位置が動いた頂点
    this.nStamp = new Int32Array(0);
    this.levels = new SubdivLevels();

    this.mirrors = [];
    for (let i = 0; i < 8; i++) this.mirrors.push(new MirrorState());
    this.activeMirrors = [[1, 1, 1]];

    this.hoverSeed = -1;
    this.stroking = false;
    this.strokeBrush = 'clay';
    this.strokeDir = 1;
    this.topoChanged = false;
    this.dabCount = 0;
    this._delta = V3.create();
    this._pt = V3.create();
    this._mp = V3.create();
    this._step = V3.create();
    this._walk = V3.create();

    this.history.reset(mesh);
  }

  setMesh(mesh) {
    this.mesh = mesh;
    this.history.reset(mesh);
    this.stroking = false;
    this.hoverSeed = -1;
    this.levels.clear();
    this.dropPendingCurvature();
  }

  /**
   * ブラシカーソル表示用にカーソル位置の表面法線を得る。
   * ホバー用シードを 1-ring 降下で追従させるので毎フレーム呼んでも安価。
   */
  surfaceNormalAt(point, out) {
    const m = this.mesh;
    if (m.liveVerts === 0) return false;
    let s = this.hoverSeed;
    if (s < 0 || s >= m.nv || !m.isVertAlive(s)) s = nearestVertexBrute(m, point);
    else {
      const d = descend(m, s, point);
      s = d < 0 ? nearestVertexBrute(m, point) : d;
      // 最急降下が局所解に落ちた場合だけ全走査でやり直す
      if (s >= 0) {
        const i = s * 3, P = m.positions;
        const dist = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
        const tol = Math.max(this.state.worldRadius * 2, this.targetEdgeLength(this.state.worldRadius) * 4);
        if (dist > tol) s = nearestVertexBrute(m, point);
      }
    }
    if (s < 0) return false;
    this.hoverSeed = s;
    const i = s * 3;
    out[0] = m.normals[i]; out[1] = m.normals[i + 1]; out[2] = m.normals[i + 2];
    return true;
  }

  // stamp は単調増加させる。新しく確保した配列はゼロ埋め、既存配列の値は
  // すべて現在の stamp より小さいので、カウンタをリセットしなければ衝突しない。
  _ensureStamps() {
    const m = this.mesh;
    if (this.vStamp.length < m.capV) {
      this.vStamp = new Int32Array(m.capV);
      this.nStamp = new Int32Array(m.capV);
      this.cvStamp = new Int32Array(m.capV);
      this.queue = new Int32Array(m.capV);
    }
    if (this.tStamp.length < m.capT) {
      this.tStamp = new Int32Array(m.capT);
    }
  }

  /** ブラシ球内の連結頂点と、それに接する三角形を収集 */
  _gather(ms, center, radius) {
    const m = this.mesh;
    this._ensureStamps();
    const id = ++this.stamp;
    const vS = this.vStamp, tS = this.tStamp, q = this.queue;
    const P = m.positions, T = m.tris;
    const verts = ms.verts, tris = ms.tris;
    verts.length = 0; tris.length = 0;

    const cx = center[0], cy = center[1], cz = center[2];
    const r2 = radius * radius;
    let head = 0, tail = 0;

    const seed = ms.seed;
    if (seed < 0 || seed >= m.nv || !m.isVertAlive(seed)) { ms.count = 0; return; }
    vS[seed] = id;
    q[tail++] = seed;

    while (head < tail) {
      const v = q[head++];
      verts.push(v);
      const r = m.ring[v];
      if (!r) continue;
      for (let j = 0; j < r.length; j++) {
        const t = r[j];
        if (tS[t] !== id) { tS[t] = id; tris.push(t); }
        const ti = t * 3;
        for (let e = 0; e < 3; e++) {
          const u = T[ti + e];
          if (vS[u] === id) continue;
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < q.length) q[tail++] = u;
        }
      }
    }
    ms.count = verts.length;
  }

  /**
   * 移動した頂点とその近傍の法線と曲率を再計算する。
   * 曲率は 1-ring 平均に依存するので、法線より 1 段広い範囲を更新する。
   */
  _updateNormals(verts, count) {
    const m = this.mesh;
    this._ensureStamps();
    const T = m.tris;

    // 1 段目: 移動頂点 + その 1-ring（法線の更新範囲）
    const id1 = ++this.stamp;
    const nS = this.nStamp;
    const set = this.normalSet;
    set.length = 0;
    for (let k = 0; k < count; k++) {
      const v = verts[k];
      if (nS[v] !== id1) { nS[v] = id1; set.push(v); }
      const r = m.ring[v];
      if (!r) continue;
      for (let j = 0; j < r.length; j++) {
        const ti = r[j] * 3;
        for (let e = 0; e < 3; e++) {
          const u = T[ti + e];
          if (nS[u] !== id1) { nS[u] = id1; set.push(u); }
        }
      }
    }
    m.computeNormalsFor(set, set.length);

    // 曲率は見た目（キャビティ陰影）にしか使わず、彫刻の挙動には影響しない。
    // 1 フレームに何十ダブも打たれるので、ここでは「後で計算する頂点」を
    // 積むだけにして、実際の計算はフレーム末に 1 回だけ行う。
    const cs = this.cvStamp, cid = this.cvStampId;
    const pend = this.curvPending;
    for (let k = 0; k < set.length; k++) {
      const v = set[k];
      if (cs[v] !== cid) { cs[v] = cid; pend.push(v); }
    }
  }

  /**
   * 溜まっていた曲率の再計算をまとめて行う。毎フレーム 1 回、描画前に呼ぶ。
   * @returns {number} 更新した頂点数
   */
  flushCurvature() {
    const pend = this.curvPending;
    if (pend.length === 0) return 0;
    const m = this.mesh;
    this._ensureStamps();
    const T = m.tris;

    // 法線が変わった頂点の隣も曲率が変わるので 1-ring 広げる
    const id = ++this.stamp;
    const nS = this.nStamp;
    const cset = this.curvSet;
    cset.length = 0;
    for (let k = 0; k < pend.length; k++) {
      const v = pend[k];
      if (v >= m.nv || !m.isVertAlive(v)) continue;
      if (nS[v] !== id) { nS[v] = id; cset.push(v); }
      const r = m.ring[v];
      if (!r) continue;
      for (let j = 0; j < r.length; j++) {
        const ti = r[j] * 3;
        for (let e = 0; e < 3; e++) {
          const u = T[ti + e];
          if (nS[u] !== id) { nS[u] = id; cset.push(u); }
        }
      }
    }
    pend.length = 0;
    this.cvStampId++;
    if (cset.length === 0) return 0;
    m.computeCurvatureFor(cset, cset.length);
    m.smoothCurvatureFor(cset, cset.length);
    for (let k = 0; k < cset.length; k++) m.markVert(cset[k]);
    return cset.length;
  }

  /** メッシュを差し替えたときなど、溜まっている曲率更新を捨てる */
  dropPendingCurvature() {
    this.curvPending.length = 0;
    this.cvStampId++;
  }

  /**
   * 目標エッジ長（world）。ブラシ半径に比例させることで、
   * 「ブラシの見た目の大きさに対して一定のポリゴン密度」になる（Sculptris Pro 方式）。
   * detail 0 → ブラシ直径あたり約 9 分割、detail 1 → 約 44 分割。
   */
  targetEdgeLength(radius) {
    const d = clamp(this.state.detail, 0, 1);
    return radius * (0.22 - 0.175 * d);
  }

  // --- ストローク --------------------------------------------------------

  beginStroke(brush, point, dir) {
    const m = this.mesh;
    this.stroking = true;
    this.strokeBrush = brush;
    this.strokeDir = dir;
    this.topoChanged = false;
    this.dabCount = 0;
    this.engine.beginStroke();
    this.activeMirrors = buildMirrors(this.state.symmetry);

    for (let i = 0; i < this.activeMirrors.length; i++) {
      const ms = this.mirrors[i];
      const sgn = this.activeMirrors[i];
      V3.set(this._mp, point[0] * sgn[0], point[1] * sgn[1], point[2] * sgn[2]);
      ms.seed = nearestVertexBrute(m, this._mp);
      V3.copy(ms.lastPoint, this._mp);
      V3.copy(ms.center, this._mp);
      ms.lockedVerts = null;
      ms.lockedCount = 0;
    }
    V3.set(this._delta, 0, 0, 0);
    this._dabAll(point, this._delta, true);
  }

  /**
   * ストローク中のサンプル追加。前回位置から spacing 間隔でダブを打つので
   * フレームレートに依存しない。
   */
  addSample(point) {
    if (!this.stroking) return;
    const brush = this.strokeBrush;
    const radius = this.state.worldRadius;
    const ms0 = this.mirrors[0];

    if (brush === 'move') {
      // グラブ：領域を固定し、カーソル差分だけ動かす
      V3.sub(this._delta, point, ms0.lastPoint);
      if (V3.lenSq(this._delta) < 1e-14) return;
      this._dabAll(point, this._delta, false);
      return;
    }

    const spacing = Math.max(radius * 0.16, 1e-6);
    V3.sub(this._delta, point, ms0.lastPoint);
    let dist = V3.len(this._delta);
    if (dist < spacing) {
      if (usesDelta(brush)) return;
      // 動いていなくても圧を掛け続けたいブラシ（塗り系）は薄く継続
      if (brush === 'paint' || brush === 'mask' || brush === 'smooth') {
        V3.set(this._delta, 0, 0, 0);
        this._dabAll(point, this._delta, false, 0.35);
      }
      return;
    }

    // カーソルが大きく飛んだフレームで何十ダブも打つとフレームが数百 ms 固まる。
    // 上限本数に加えて時間予算でも打ち切り、1 フレームの作業量を有界にする。
    // 打ち切った場合も lastPoint は進めた所までなので、次フレームで続きから再開する。
    const steps = Math.min(32, Math.max(1, Math.floor(dist / spacing)));
    const step = this._step, p = this._walk;
    V3.scale(step, this._delta, 1 / steps);
    V3.copy(p, ms0.lastPoint);
    const budget = this.state.strokeBudgetMs > 0 ? this.state.strokeBudgetMs : Infinity;
    const t0 = budget === Infinity ? 0 : performance.now();
    for (let s = 0; s < steps; s++) {
      V3.add(p, p, step);
      this._dabAll(p, step, false);
      // 1 ダブが数十 ms かかることがあるので、間引かず毎回見る
      if (budget !== Infinity && performance.now() - t0 > budget) break;
    }
  }

  endStroke() {
    if (!this.stroking) return;
    this.stroking = false;
    const m = this.mesh;
    if (this.dabCount > 0) {
      // compact は頂点番号を詰め替えるので、その前に曲率を確定させる
      this.flushCurvature();
      if (m.compact()) {
        this.topoChanged = true;
        this.dropPendingCurvature();
      }
      this.history.commit(m);
    }
  }

  _dabAll(point, delta, first, scale = 1) {
    const mirrors = this.activeMirrors;
    for (let i = 0; i < mirrors.length; i++) {
      const sgn = mirrors[i];
      const ms = this.mirrors[i];
      V3.set(this._mp, point[0] * sgn[0], point[1] * sgn[1], point[2] * sgn[2]);
      V3.set(this._pt, delta[0] * sgn[0], delta[1] * sgn[1], delta[2] * sgn[2]);
      this._dab(ms, this._mp, this._pt, first, scale);
      V3.copy(ms.lastPoint, this._mp);
    }
    this.dabCount++;
  }

  _dab(ms, point, delta, first, scale) {
    const m = this.mesh;
    const st = this.state;
    const brush = this.strokeBrush;
    const radius = st.worldRadius;
    if (radius <= 0) return;

    // --- シード追従 -----------------------------------------------------
    let seed = descend(m, ms.seed, point);
    if (seed < 0) seed = nearestVertexBrute(m, point);
    else {
      const i = seed * 3, P = m.positions;
      const d = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
      const tol = Math.max(radius, this.targetEdgeLength(radius) * 3);
      if (d > tol) seed = nearestVertexBrute(m, point);
    }
    if (seed < 0) return;
    ms.seed = seed;

    // --- move ブラシ: 固定領域 ------------------------------------------
    if (brush === 'move') {
      if (first || !ms.lockedVerts) {
        this._gather(ms, point, radius);
        ms.lockedVerts = ms.verts.slice();
        ms.lockedCount = ms.count;
        V3.copy(ms.center, point);
      } else {
        V3.add(ms.center, ms.center, delta);
      }
      if (ms.lockedCount === 0) return;
      this.engine.apply(m, {
        type: 'move',
        verts: ms.lockedVerts, count: ms.lockedCount,
        center: ms.center, radius,
        strength: (st.effStrength !== undefined ? st.effStrength : st.strength) * scale, dir: this.strokeDir,
        delta, color: st.paintColor, ignoreMask: false,
        focal: st.focalShift, toCamera: st.toCamera, backface: st.backfaceMask,
      });
      this._updateNormals(ms.lockedVerts, ms.lockedCount);
      return;
    }

    // --- 領域収集 -------------------------------------------------------
    // 半径より少し広めに 1 回だけ集め、dyntopo とブラシ適用で共用する。
    // 半径の外側は減衰が 0 になるので、余分に含めても結果は変わらない。
    const gatherR = radius * 1.1;
    this._gather(ms, point, gatherR);

    // --- 動的トポロジ ---------------------------------------------------
    if (st.dynTopo && needsTopology(brush) && ms.count > 0) {
      const target = this.targetEdgeLength(radius);
      const moved = this._movedVerts;
      moved.length = 0;
      // 1 ダブで作れる頂点数を領域サイズに比例させる。粗い面に大きなブラシを
      // 当てたときに 1 フレームで数千頂点作って固まるのを防ぐ。
      // 上限に当たっても次のダブで続きが分割されるので、数フレームで目標密度に届く。
      const ch = refineRegion(m, ms.tris, point, radius, target, {
        subdivide: true,
        decimate: st.decimate,
        maxVerts: st.maxVerts,
        maxNewPerStep: Math.max(150, Math.min(300, ms.count)),
        moved,
      });
      if (ch) {
        this.topoChanged = true;
        // トポロジが変わったのでシードを取り直して領域を集め直す
        let s2 = descend(m, ms.seed, point);
        if (s2 < 0 || !m.isVertAlive(s2)) s2 = nearestVertexBrute(m, point);
        ms.seed = s2;
        if (s2 >= 0) this._gather(ms, point, gatherR);
        // 形状が動いたのはコラプス先だけなので、そこだけ法線を直せば足りる
        if (moved.length) this._updateNormals(moved, moved.length);
      }
    }

    if (ms.count === 0) return;

    this.engine.apply(m, {
      type: brush,
      verts: ms.verts, count: ms.count,
      center: point, radius,
      strength: (st.effStrength !== undefined ? st.effStrength : st.strength) * scale, dir: this.strokeDir,
      delta, color: st.paintColor,
      ignoreMask: brush === 'mask',
      focal: st.focalShift, toCamera: st.toCamera, backface: st.backfaceMask,
    });

    if (brush !== 'paint' && brush !== 'mask') {
      this._updateNormals(ms.verts, ms.count);
    }
  }

  // --- グローバル操作 ---------------------------------------------------

  clearMask() {
    const m = this.mesh;
    m.mask.fill(0, 0, m.nv);
    m.markAllDirty();
    this.history.commit(m);
  }

  invertMask() {
    const m = this.mesh;
    for (let v = 0; v < m.nv; v++) m.mask[v] = 1 - m.mask[v];
    m.markAllDirty();
    this.history.commit(m);
  }

  fillColor(rgb) {
    const m = this.mesh;
    for (let v = 0; v < m.nv; v++) {
      const mk = 1 - clamp(m.mask[v], 0, 1);
      const i = v * 3;
      m.colors[i] += (rgb[0] - m.colors[i]) * mk;
      m.colors[i + 1] += (rgb[1] - m.colors[i + 1]) * mk;
      m.colors[i + 2] += (rgb[2] - m.colors[i + 2]) * mk;
    }
    m.markAllDirty();
    this.history.commit(m);
  }

  /** 全体を数回ラプラシアン平滑化 */
  /** 保存データからメッシュを差し替える */
  loadGeometry(positions, indices, colors, mask) {
    const m = this.mesh;
    m.setGeometry(positions, indices, colors, mask);
    this._invalidateSeeds();
    this.levels.clear();
    this.history.reset(m);
  }

  smoothAll(iterations = 1, amount = 0.5) {
    const m = this.mesh;
    const P = m.positions, T = m.tris;
    const tmp = new Float32Array(m.nv * 3);
    for (let it = 0; it < iterations; it++) {
      for (let v = 0; v < m.nv; v++) {
        if (!m.isVertAlive(v)) continue;
        const r = m.ring[v];
        let sx = 0, sy = 0, sz = 0, c = 0;
        if (r) {
          for (let j = 0; j < r.length; j++) {
            const ti = r[j] * 3;
            for (let e = 0; e < 3; e++) {
              const u = T[ti + e];
              if (u === v) continue;
              const iu = u * 3;
              sx += P[iu]; sy += P[iu + 1]; sz += P[iu + 2]; c++;
            }
          }
        }
        const i = v * 3;
        if (c === 0) { tmp[i] = P[i]; tmp[i + 1] = P[i + 1]; tmp[i + 2] = P[i + 2]; continue; }
        const k = amount * (1 - clamp(m.mask[v], 0, 1));
        tmp[i] = P[i] + (sx / c - P[i]) * k;
        tmp[i + 1] = P[i + 1] + (sy / c - P[i + 1]) * k;
        tmp[i + 2] = P[i + 2] + (sz / c - P[i + 2]) * k;
      }
      P.set(tmp.subarray(0, m.nv * 3));
    }
    m.computeAllNormals();
    m.computeAllCurvature();
    m.markAllDirty();
    this.history.commit(m);
  }

  /**
   * ダイナメッシュ：ボクセル化 → 等値面抽出でトポロジを作り直す。
   * 自己交差や分離した部品が和集合として healing される。
   * @returns {object} 統計（頂点数・所要時間など）
   */
  async dynamesh(opts = {}) {
    const m = this.mesh;
    const r = await dynamesh(m, opts);
    if (r.positions.length === 0 || r.indices.length === 0) {
      return Object.assign({ failed: true }, r.stats);
    }
    m.setGeometry(r.positions, r.indices, r.colors);
    this._invalidateSeeds();
    this.levels.clear();          // 接続が変わるので分割レベルは破棄（ZBrush と同じ）
    this.history.commit(m);
    return r.stats;
  }

  _invalidateSeeds() {
    this.hoverSeed = -1;
    for (const ms of this.mirrors) { ms.seed = -1; ms.lockedVerts = null; ms.lockedCount = 0; }
  }

  // --- 分割レベル（SDiv） ------------------------------------------------

  divide() {

  @builtin(position) pos : vec4<f32>,

};

@vertex

  var q = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0, -1.0), vec2<f32>( 1.0,  1.0),
    vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0,  1.0), vec2<f32>(-1.0,  1.0),

  return o;

fn gridLine(coord : vec2<f32>, width : f32) -> f32 {
  let d = abs(fract(coord - vec2<f32>(0.5, 0.5)) - vec2<f32>(0.5, 0.5));
  let w = fwidth(coord) * width;
  let g = d / max(w, vec2<f32>(1e-6, 1e-6));
  return 1.0 - clamp(min(g.x, g.y), 0.0, 1.0);

struct GridOut {
  @location(0) color  : vec4<f32>,
  @location(1) normal : vec4<f32>,
};

@fragment

  let coarse = gridLine(i.wxz / (sp * 10.0), thick);

  if (abs(i.wxz.x) < axisW.x) { col = vec3<f32>(0.32, 0.46, 0.88); a = max(a, 0.80); }

  a = a * u.gridCol.a;

  o.normal = vec4<f32>(0.0, 0.0, 1.0, 1.0);

}

struct Kernel { s : array<vec4<f32>, 24> };

@group(0) @binding(1) var depthTex  : texture_depth_2d;
@group(0) @binding(2) var normalTex : texture_2d<f32>;
@group(0) @binding(3) var aoOut     : texture_storage_2d<rgba8unorm, write>;
@group(0) @binding(4) var<uniform> k : Kernel;

fn hash21(p : vec2<f32>) -> f32 {
  var p3 = fract(p.xyx * vec3<f32>(0.1031, 0.1030, 0.0973));
  p3 = p3 + vec3<f32>(dot(p3, p3.yzx + vec3<f32>(33.33, 33.33, 33.33)));
  return fract((p3.x + p3.y) * p3.z);
}

fn viewPos(coord : vec2<i32>, d : f32) -> vec3<f32> {
  let uv = (vec2<f32>(f32(coord.x), f32(coord.y)) + vec2<f32>(0.5, 0.5)) * u.rt.zw;
  let ndc = vec3<f32>(uv.x * 2.0 - 1.0, (1.0 - uv.y) * 2.0 - 1.0, d);
  let p = u.invProj * vec4<f32>(ndc, 1.0);
  return p.xyz / p.w;

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {

  let c = vec2<i32>(i32(gid.x), i32(gid.y));
  if (c.x >= dim.x || c.y >= dim.y) { return; }

  let d = textureLoad(depthTex, c, 0);
  if (d >= 0.99999) {
    textureStore(aoOut, c, vec4<f32>(1.0, 1.0, 1.0, 1.0));
    return;
  }

  let vp = viewPos(c, d);
  let n = normalize(textureLoad(normalTex, c, 0).xyz);

  let a = hash21(vec2<f32>(f32(c.x), f32(c.y))) * 6.2831853;
  let rv = vec3<f32>(cos(a), sin(a), 0.0);
  var t = rv - n * dot(rv, n);
  let tl = length(t);
  if (tl < 1e-4) {
    t = normalize(select(vec3<f32>(1.0, 0.0, 0.0), vec3<f32>(0.0, 1.0, 0.0), abs(n.x) > 0.9));
  } else {
    t = t / tl;
  }
  let b = cross(n, t);

  let radius = u.aoP.x;
  let bias = u.aoP.z;
  var occ = 0.0;
  let N = 24;
  for (var i = 0; i < N; i = i + 1) {
    let ks = k.s[i].xyz;
    let sp = vp + (t * ks.x + b * ks.y + n * ks.z) * radius;
    let cp = u.proj * vec4<f32>(sp, 1.0);
    if (cp.w <= 0.0) { continue; }
    var suv = cp.xy / cp.w;
    suv = vec2<f32>(suv.x * 0.5 + 0.5, 1.0 - (suv.y * 0.5 + 0.5));
    if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) { continue; }
    let sc = vec2<i32>(i32(suv.x * f32(dim.x)), i32(suv.y * f32(dim.y)));
    let sd = textureLoad(depthTex, clamp(sc, vec2<i32>(0, 0), dim - vec2<i32>(1, 1)), 0);
    if (sd >= 0.99999) { continue; }
    let sceneZ = viewPos(sc, sd).z;

    if (sceneZ >= sp.z + bias) {

      occ = occ + rc;

  var ao = 1.0 - occ / f32(N);
  ao = pow(clamp(ao, 0.0, 1.0), u.aoP.w);
  textureStore(aoOut, c, vec4<f32>(ao, ao, ao, 1.0));
}
`;

@group(0) @binding(2) var depthTex: texture_depth_2d;

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {

  let c = vec2<i32>(i32(gid.x), i32(gid.y));
  if (c.x >= dim.x || c.y >= dim.y) { return; }

  let dc = textureLoad(depthTex, c, 0);
  if (dc >= 0.99999) {
    textureStore(aoOut, c, vec4<f32>(1.0, 1.0, 1.0, 1.0));
    return;
  }
  let lc = linearDepthFromNdc(dc, u.params.x, u.params.y);

  var sum = 0.0;
  var wsum = 0.0;
  for (var dy = -2; dy <= 2; dy = dy + 1) {

      let sd = textureLoad(depthTex, sc, 0);

      let s = textureLoad(aoIn, sc, 0).r;
      sum = sum + s * dw;
      wsum = wsum + dw;

const PRESENT_WGSL = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u : Uniforms;
@group(0) @binding(1) var colTex : texture_2d<f32>;
@group(0) @binding(2) var aoTex  : texture_2d<f32>;
@group(0) @binding(3) var smp    : sampler;

struct VSOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) uv : vec2<f32>,
};

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VSOut {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0)
  );

  o.pos = vec4<f32>(p[vi], 0.0, 1.0);
  o.uv = vec2<f32>((p[vi].x + 1.0) * 0.5, 1.0 - (p[vi].y + 1.0) * 0.5);
  return o;

fn luma(c : vec3<f32>) -> f32 { return dot(c, vec3<f32>(0.299, 0.587, 0.114)); }

fn srgbEncode(c : vec3<f32>) -> vec3<f32> {
  let lo = c * 12.92;
  let hi = 1.055 * pow(max(c, vec3<f32>(1e-5, 1e-5, 1e-5)), vec3<f32>(1.0 / 2.4, 1.0 / 2.4, 1.0 / 2.4)) - vec3<f32>(0.055);
  return select(hi, lo, c <= vec3<f32>(0.0031308));
}

fn fetch(uv : vec2<f32>) -> vec3<f32> {
  return textureSampleLevel(colTex, smp, uv, 0.0).rgb;
}

// FXAA (console 版相当)
fn fxaa(uv : vec2<f32>) -> vec3<f32> {
  let rcp = u.rt.zw;
  let m  = fetch(uv);
  let nw = fetch(uv + vec2<f32>(-rcp.x, -rcp.y));
  let ne = fetch(uv + vec2<f32>( rcp.x, -rcp.y));
  let sw = fetch(uv + vec2<f32>(-rcp.x,  rcp.y));
  let se = fetch(uv + vec2<f32>( rcp.x,  rcp.y));
  let lm = luma(m);
  let lnw = luma(nw); let lne = luma(ne); let lsw = luma(sw); let lse = luma(se);
  let lmin = min(lm, min(min(lnw, lne), min(lsw, lse)));
  let lmax = max(lm, max(max(lnw, lne), max(lsw, lse)));
  if (lmax - lmin < lmax * 0.10 + 0.018) { return m; }

  var dir = vec2<f32>(-((lnw + lne) - (lsw + lse)), ((lnw + lsw) - (lne + lse)));
  let reduce = max((lnw + lne + lsw + lse) * 0.25 * 0.125, 1.0 / 128.0);
  let rcpMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + reduce);
  dir = clamp(dir * rcpMin, vec2<f32>(-8.0, -8.0), vec2<f32>(8.0, 8.0)) * rcp;

  let rA = 0.5 * (fetch(uv + dir * (1.0 / 3.0 - 0.5)) + fetch(uv + dir * (2.0 / 3.0 - 0.5)));
  let rB = rA * 0.5 + 0.25 * (fetch(uv + dir * -0.5) + fetch(uv + dir * 0.5));
  let lb = luma(rB);
  if (lb < lmin || lb > lmax) { return rA; }
  return rB;
}

@fragment
fn fs(i : VSOut) -> @location(0) vec4<f32> {

  if (u.params.w > 0.5) {
    let ao = textureSampleLevel(aoTex, smp, i.uv, 0.0).r;

  var c = fxaa(i.uv);

  return vec4<f32>(srgbEncode(c), 1.0);
}

fn main() {

  let cx = i32(pp.cursor.x);
  let cy = i32(pp.cursor.y);
  let rad = i32(pp.cursor.z);

  var bestX = -1;
  var bestY = -1;

        bestD = d;
        bestX = x;
        bestY = y;
