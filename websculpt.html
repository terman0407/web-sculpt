    this._alphaRot = 0;
    this._dabSeq = 0;          // ストローク内のダブ番号（スプレーの乱数の種）
    this.strokeSeed = 0;
    this._spray = V3.create();
    this._sizeMul = 1;
    this._mirCenters = null;   // 全ミラーのダブ中心（担当分け用）
    this._mirCount = 1;
    this._mirIndex = 0;
    this._ownBuf = null;
    this._snapPos = null;      // ダブ開始時の座標（持ち分の判定用）
    this._snapStamp = null;
    this._snapId = 0;
    this._snapTouched = null;
    this._snapTouchedCount = 0;
    this._mirMat = null;       // ミラーの 3x3 行列 + 中心（不動点判定用）
    this._mirMatCount = 0;
    this._symEps = 1e-9;
    this._frameN0 = V3.create();   // ミラー 0 のブラシ向き
    this._frameC0 = V3.create();   // ミラー 0 の重心
    this._frameN = V3.create();
    this._frameC = V3.create();
    this._frameOK = false;
    this._useFrame = false;
    this._strokeId = DEFAULT_STROKE;
    this._strokeParams = strokeDefaults(DEFAULT_STROKE);

    this.history.reset(mesh);
  }

  /**
   * いまの state からミラー写像の一覧を作る。
   * ローカルシンメトリはモデルの中心を基準にするので bounds を見る
   * （毎ダブではなくストローク開始時に 1 回だけ呼ばれる）。
   */
  buildActiveMirrors() {
    const st = this.state;
    let center = null;
    if (st.localSymmetry) center = this.mesh.bounds().center;
    return buildMirrors(st.symmetry, st.radial, center);
  }

  setMesh(mesh) {
    this.mesh = mesh;
    this.history.reset(mesh);
    this.stroking = false;
    this.hoverSeed = -1;
    this._avgDabMs = 0;
    this.levels.clear();
    this.dropPendingCurvature();
  }

  /**
   * ブラシカーソル表示用にカーソル位置の表面法線を得る。
   * ホバー用シードを 1-ring 降下で追従させるので毎フレーム呼んでも安価。
   */
  surfaceNormalAt(point, out) {
    const m = this.mesh;
    if (m.liveVerts === 0) return false;
    let s = this.hoverSeed;
    if (s < 0 || s >= m.nv || !m.isVertAlive(s)) s = nearestVertexBrute(m, point);
    else {
      const d = descend(m, s, point);
      s = d < 0 ? nearestVertexBrute(m, point) : d;
      // 最急降下が局所解に落ちた場合だけ全走査でやり直す
      if (s >= 0) {
        const i = s * 3, P = m.positions;
        const dist = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
        const tol = Math.max(this.state.worldRadius * 2, this.targetEdgeLength(this.state.worldRadius) * 4);
        if (dist > tol) s = nearestVertexBrute(m, point);
      }
    }
    if (s < 0) return false;
    this.hoverSeed = s;
    const i = s * 3;
    out[0] = m.normals[i]; out[1] = m.normals[i + 1]; out[2] = m.normals[i + 2];
    return true;
  }

  // stamp は単調増加させる。新しく確保した配列はゼロ埋め、既存配列の値は
  // すべて現在の stamp より小さいので、カウンタをリセットしなければ衝突しない。
  _ensureStamps() {
    const m = this.mesh;
    if (this.vStamp.length < m.capV) {
      this.vStamp = new Int32Array(m.capV);
      this.nStamp = new Int32Array(m.capV);
      this.cvStamp = new Int32Array(m.capV);
      this.queue = new Int32Array(m.capV);
    }
    if (this.tStamp.length < m.capT) {
      this.tStamp = new Int32Array(m.capT);
    }
  }

  /** list を count 件入る大きさまで広げる（内容は保持する） */
  static _grow(list, count) {
    if (list.length >= count) return list;
    const a = new Int32Array(Math.max(1024, count, list.length * 2));
    a.set(list);
    return a;
  }

  /**
   * ブラシ球内の連結頂点と、それに接する三角形を収集。
   *
   * 頂点リストは BFS のキューそのもの（取り出した順 = 収集順）なので、
   * 別配列に積み直さずキューを ms.verts として使い回す。
   */
  _gather(ms, center, radius) {
    const m = this.mesh;
    this._ensureStamps();
    const id = ++this.stamp;
    const vS = this.vStamp, tS = this.tStamp, q = this.queue;
    const P = m.positions, T = m.tris;
    const RC = m.ringCount, RD = m.ringData, REX = m.ringExt;
    const qlen = q.length;
    let TR = this.gTris;
    ms.verts = q; ms.tris = TR;
    ms.count = 0; ms.triCount = 0;

    const cx = center[0], cy = center[1], cz = center[2];
    const r2 = radius * radius;
    let head = 0, tail = 0, nt = 0;

    const seed = ms.seed;
    if (seed < 0 || seed >= m.nv || !m.isVertAlive(seed)) return;
    vS[seed] = id;
    q[tail++] = seed;

    while (head < tail) {
      const v = q[head++];
      const rc = RC[v];
      if (rc === 0) continue;
      const inline = rc <= RING_STRIDE;
      const rbase = inline ? v * RING_STRIDE : 0;
      const rex = inline ? null : REX[v];
      if (nt + rc > TR.length) { TR = Sculptor._grow(TR, nt + rc); this.gTris = TR; ms.tris = TR; }
      for (let j = 0; j < rc; j++) {
        const t = inline ? RD[rbase + j] : rex[j];
        if (tS[t] !== id) { tS[t] = id; TR[nt++] = t; }
        const ti = t * 3;
        // 3 頂点は毎回全部見るのでループを展開する
        let u = T[ti];
        if (vS[u] !== id) {
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < qlen) q[tail++] = u;
        }
        u = T[ti + 1];
        if (vS[u] !== id) {
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < qlen) q[tail++] = u;
        }
        u = T[ti + 2];
        if (vS[u] !== id) {
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < qlen) q[tail++] = u;
        }
      }
    }
    ms.count = tail;
    ms.triCount = nt;
  }

  /**
   * 移動した頂点とその近傍の法線と曲率を再計算する。
   * 曲率は 1-ring 平均に依存するので、法線より 1 段広い範囲を更新する。
   */
  /**
   * @param verts 動いた頂点
   * @param count 有効数
   * @param tris  verts に接する三角形（_gather が集めたものをそのまま渡す）。
   *              渡すと ring を辿り直さずに済むぶん大幅に速い。
   */
  _updateNormals(verts, count, tris = null, triCount = 0) {
    const m = this.mesh;
    this._ensureStamps();
    const T = m.tris;

    // 1 段目: 移動頂点 + その 1-ring（法線の更新範囲）
    const id1 = ++this.stamp;
    const nS = this.nStamp;
    // tris 経路の上限は count + triCount*3 で確定するので先に確保しておく
    // （以降は境界確認が要らない）。ring 経路は上限が読めないので途中で広げる。
    const bound = tris ? count + triCount * 3 : count + 64;
    let set = this.normalSet;
    if (set.length < bound) { set = new Int32Array(Math.max(1024, bound)); this.normalSet = set; }
    let ns = 0;
    if (tris) {
      // 「verts に接する三角形の全頂点」= verts + その 1-ring。
      // 三角形リストを 1 回舐めるだけで済み、ring の間接参照が消える。
      for (let k = 0; k < count; k++) {
        const v = verts[k];
        if (nS[v] !== id1) { nS[v] = id1; set[ns++] = v; }
      }
      for (let k = 0; k < triCount; k++) {
        const ti = tris[k] * 3;
        let u = T[ti];
        if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
        u = T[ti + 1];
        if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
        u = T[ti + 2];
        if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
      }
    } else {
      const RC = m.ringCount, RD = m.ringData, REX = m.ringExt;
      for (let k = 0; k < count; k++) {
        const v = verts[k];
        if (nS[v] !== id1) { nS[v] = id1; set[ns++] = v; }
        const rc = RC[v];
        if (rc === 0) continue;
        const inline = rc <= RING_STRIDE;
        const rb = inline ? v * RING_STRIDE : 0;
        const rex = inline ? null : REX[v];
        if (ns + rc * 3 > set.length) { set = Sculptor._grow(set, ns + rc * 3); this.normalSet = set; }
        for (let j = 0; j < rc; j++) {
          const ti = (inline ? RD[rb + j] : rex[j]) * 3;
          let u = T[ti];
          if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
          u = T[ti + 1];
          if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
          u = T[ti + 2];
          if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
        }
      }
    }
    this.normalCount = ns;
    // 面法線を 1 面 1 回だけ計算する版も試したが、そのための三角形集合を
    // 作るコストのほうが上回ったので頂点ごとの計算のままにしてある。
    m.computeNormalsFor(set, ns);

    // 曲率は見た目（キャビティ陰影）にしか使わず、彫刻の挙動には影響しない。
    // 1 フレームに何十ダブも打たれるので、ここでは「後で計算する頂点」を
    // 積むだけにして、実際の計算はフレーム末に 1 回だけ行う。
    const cs = this.cvStamp, cid = this.cvStampId;
    let pend = this.curvPending, pn = this.curvPendCount;
    if (pn + ns > pend.length) { pend = Sculptor._grow(pend, pn + ns); this.curvPending = pend; }
    for (let k = 0; k < ns; k++) {
      const v = set[k];
      if (cs[v] !== cid) { cs[v] = cid; pend[pn++] = v; }
    }
    this.curvPendCount = pn;
  }

  /**
   * 溜まっていた曲率の再計算をまとめて行う。毎フレーム 1 回、描画前に呼ぶ。
   * @returns {number} 更新した頂点数
   */
  flushCurvature() {
    const pend = this.curvPending;
    const pn = this.curvPendCount;
    if (pn === 0) return 0;
    const m = this.mesh;
    this._ensureStamps();

    // pend には既に「動いた頂点 + その 1-ring」が入っている（_updateNormals が
    // 法線更新の対象として積んだもの）。ここでさらに 1-ring 広げると集合が 3 倍に
    // 膨らみ、高密度では 1 フレーム 30ms 近くかかる。曲率は陰影にしか効かず、
    // 境界のわずかな誤差は次のダブで上書きされるので広げない。
    const id = ++this.stamp;
    const nS = this.nStamp;
    let cset = this.curvSet;
    if (cset.length < pn) { cset = new Int32Array(Math.max(1024, pn)); this.curvSet = cset; }
    let cn = 0;
    for (let k = 0; k < pn; k++) {
      const v = pend[k];
      if (v >= m.nv || !m.isVertAlive(v)) continue;
      if (nS[v] !== id) { nS[v] = id; cset[cn++] = v; }
    }
    this.curvPendCount = 0;
    this.curvCount = cn;
    this.cvStampId++;
    if (cn === 0) return 0;
    m.computeCurvatureFor(cset, cn);
    m.smoothCurvatureFor(cset, cn);
    for (let k = 0; k < cn; k++) m.markVert(cset[k]);
    return cn;
  }

  /** メッシュを差し替えたときなど、溜まっている曲率更新を捨てる */
  dropPendingCurvature() {
    this.curvPendCount = 0;
    this.cvStampId++;
  }

  /**
   * 目標エッジ長（world）。ブラシ半径に比例させることで、
   * 「ブラシの見た目の大きさに対して一定のポリゴン密度」になる（Sculptris Pro 方式）。
   * detail 0 → ブラシ直径あたり約 9 分割、detail 1 → 約 44 分割。
   */
  /**
   * point に近い頂点を返す。まず候補（前回のシード）から 1-ring 降下し、
   * 遠すぎるときだけ全走査に落とす。260 万頂点だと全走査は 1 回 45ms かかるので、
   * ストローク開始のたびに走らせると無視できないヒッチになる。
   */
  _seedNear(point, hint) {
    const m = this.mesh;
    if (m.liveVerts === 0) return -1;
    if (hint >= 0 && hint < m.nv && m.isVertAlive(hint)) {
      const s = descend(m, hint, point);
      if (s >= 0) {
        const i = s * 3, P = m.positions;
        const d = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
        const tol = Math.max(this.state.worldRadius, this.targetEdgeLength(this.state.worldRadius) * 4);
        if (d <= tol) return s;
      }
    }
    return nearestVertexBrute(m, point);
  }

  targetEdgeLength(radius) {
    const d = clamp(this.state.detail, 0, 1);
    return radius * (0.22 - 0.175 * d);
  }

  // --- ストローク --------------------------------------------------------

  beginStroke(brush, point, dir) {
    const m = this.mesh;
    this.stroking = true;
    this.strokeBrush = brush;
    this.strokeDir = dir;
    this.topoChanged = false;
    this.dabCount = 0;
    this._dabSeq = 0;
    // ストロークごとの乱数の種。決定論にしたいので時計は使わず、
    // ストローク番号と開始位置から作る（同じ操作なら同じ模様になる）。
    this.strokeSeed = (this.engine.strokeId * 2654435761
      + Math.round(point[0] * 8191) * 40503
      + Math.round(point[1] * 8191) * 7919
      + Math.round(point[2] * 8191) * 104729) | 0;
    const sid = this.state.stroke || DEFAULT_STROKE;
    this._strokeId = STROKE_BY_ID.has(sid) ? sid : DEFAULT_STROKE;
    this._strokeParams = Object.assign(strokeDefaults(this._strokeId),
      (this.state.strokeParams && this.state.strokeParams[this._strokeId]) || {});
    this.engine.beginStroke();
    this.activeMirrors = this.buildActiveMirrors();
    this._buildMirrorMatrices();
    // ラジアルシンメトリでミラー数が増えるので、足りなければ足す
    while (this.mirrors.length < this.activeMirrors.length) this.mirrors.push(new MirrorState());

    for (let i = 0; i < this.activeMirrors.length; i++) {
      const ms = this.mirrors[i];
      mirrorPoint(this.activeMirrors[i], point, this._mp);
      // 全頂点走査は 260 万頂点で 1 ミラーあたり 45ms かかる。
      // ホバー中に追従させているシードから降下すれば通常はそれで足りる。
      ms.seed = this._seedNear(this._mp, i === 0 ? this.hoverSeed : this.mirrors[i].seed);
      V3.copy(ms.lastPoint, this._mp);
      V3.copy(ms.center, this._mp);
      ms.lockedVerts = null;
      ms.lockedCount = 0;
    }
    V3.set(this._delta, 0, 0, 0);
    this._dabAll(point, this._delta, true);
  }

  /**
   * ストローク中のサンプル追加。前回位置から spacing 間隔でダブを打つので
   * フレームレートに依存しない。
   */
  addSample(point) {
    if (!this.stroking) return;
    const brush = this.strokeBrush;
    const radius = this.state.worldRadius;
    const ms0 = this.mirrors[0];

    if (brush === 'move') {
      // グラブ：領域を固定し、カーソル差分だけ動かす
      V3.sub(this._delta, point, ms0.lastPoint);
      if (V3.lenSq(this._delta) < 1e-14) return;
      this._dabAll(point, this._delta, false);
      return;
    }

    // ダブ間隔。0.16R だと通常のドラッグ速度で 3 フレームに 1 回しか置かれず、
    // ストロークが「点を並べた」ように見える。細かくして、そのぶん 1 ダブの
    // 強さを間隔に比例させると、総量を変えずに連続的な当たりになる。
    const spacingFrac = (this.state.dabSpacing > 0 ? this.state.dabSpacing : 0.16);
    const budgetMs = this.state.strokeBudgetMs > 0 ? this.state.strokeBudgetMs : 12;
    // 1 ダブの実測コストが予算を超える密度では、間隔そのものを広げる。
    // そうしないと「毎フレーム 1 ダブ = 毎フレーム数十 ms」で固まってしまう。
    // 軽い状況では係数 1 のままなので、設定した細かい間隔がそのまま効く。
    const load = this._avgDabMs > 0.05 ? Math.max(1, this._avgDabMs / budgetMs) : 1;
    const spacing = Math.max(radius * spacingFrac * load, 1e-6);
    V3.sub(this._delta, point, ms0.lastPoint);
    let dist = V3.len(this._delta);
    if (dist < spacing) {
      if (usesDelta(brush)) return;
      // 動いていなくても圧を掛け続けたいブラシ（塗り系）は薄く継続
      if (brush === 'paint' || brush === 'mask' || brush === 'smooth') {
        V3.set(this._delta, 0, 0, 0);
        this._dabAll(point, this._delta, false, 0.35 * spacingFrac / 0.16);
      }
      return;
    }

    // カーソルが大きく飛んだフレームで何十ダブも打つとフレームが数百 ms 固まる。
    // 上限本数に加えて時間予算でも打ち切り、1 フレームの作業量を有界にする。
    // 打ち切った場合も lastPoint は進めた所までなので、次フレームで続きから再開する。
    let steps = Math.min(64, Math.max(1, Math.floor(dist / spacing)));

    // 1 ダブの実測コストから、このフレームで打てる本数を見積もって上限にする。
    // 高密度では 1 ダブ数十 ms かかるので、間隔だけ細かくすると毎フレーム
    // 数百 ms 固まってしまう。逆に軽い状況では細かい間隔がそのまま通る。
    if (this._avgDabMs > 0.05) {
      const affordable = Math.max(1, Math.floor(budgetMs / this._avgDabMs));
      if (steps > affordable) steps = affordable;
    }

    // 1 ダブの強さは「実際に進んだ距離」に比例させる。こうすると間隔を変えても
    // 本数が制限されても、ストローク全体で置かれる量がほぼ一定になる。
    const dabScale = clamp((dist / steps) / (radius * 0.16), 0.05, 4);

    const step = this._step, p = this._walk;
    V3.scale(step, this._delta, 1 / steps);
    V3.copy(p, ms0.lastPoint);
    const budget = budgetMs;
    const tStart = performance.now();
    let done = 0;
    for (let s = 0; s < steps; s++) {
      V3.add(p, p, step);
      this._dabAll(p, step, false, dabScale);
      done++;
      // 1 ダブが数十 ms かかることがあるので、間引かず毎回見る
      if (performance.now() - tStart > budget) break;
    }
    // 実測コストを指数移動平均で覚えておく（次フレームの本数見積もりに使う）
    if (done > 0) {
      const per = (performance.now() - tStart) / done;
      this._avgDabMs = this._avgDabMs > 0 ? this._avgDabMs * 0.7 + per * 0.3 : per;
    }
  }

  endStroke() {
    if (!this.stroking) return;
    this.stroking = false;
    const m = this.mesh;
    if (this.dabCount > 0) {
      // compact は頂点番号を詰め替えるので、その前に曲率を確定させる
      this.flushCurvature();
      if (m.compact()) {
        this.topoChanged = true;
        this.dropPendingCurvature();
      }
      this.history.commit(m);
    }
  }

  _dabAll(point, delta, first, scale = 1) {
    const mirrors = this.activeMirrors;
    // スプレー系のストロークは、ダブごとに位置を接平面上でばらつかせ、
    // 半径にもゆらぎを入れる。ミラーより手前で 1 回だけ計算して、
    // ミラー先にも同じ散らしが写るようにする（左右対称を保つため）。
    const sp = this._strokeParams;
    let sPoint = point, sScale = scale;
    this._sizeMul = 1;
    if (sp && (sp.scatter > 0 || sp.sizeJitter > 0)) {
      this._updateDabFrame(this.mirrors[0], delta);
      const r = this.state.worldRadius;
      const seq = this._dabSeq;
      if (sp.scatter > 0) {
        const a = hash01(seq * 4 + 1, this.strokeSeed) * Math.PI * 2;
        const rr = Math.sqrt(hash01(seq * 4 + 2, this.strokeSeed)) * sp.scatter * r;
        const U = this._tanU, V = this._tanV;
        const ox = Math.cos(a) * rr, oy = Math.sin(a) * rr;
        V3.set(this._spray,
          point[0] + U[0] * ox + V[0] * oy,
          point[1] + U[1] * ox + V[1] * oy,
          point[2] + U[2] * ox + V[2] * oy);
        sPoint = this._spray;
      }
      if (sp.sizeJitter > 0) {
        // 0.35〜1.0 の範囲で縮める。大きくする方向へ振ると領域が広がって重くなる
        this._sizeMul = 1 - hash01(seq * 4 + 3, this.strokeSeed) * sp.sizeJitter * 0.65;
      }
    }
    // 担当分けのために、全ミラーのダブ中心を先に集めておく
    const nm = mirrors.length;
    if (!this._mirCenters || this._mirCenters.length < nm * 3) this._mirCenters = new Float32Array(nm * 3);
    const MC = this._mirCenters;
    this._mirCount = nm;
    for (let i = 0; i < nm; i++) {
      mirrorPoint(mirrors[i], sPoint, this._mp);
      MC[i * 3] = this._mp[0]; MC[i * 3 + 1] = this._mp[1]; MC[i * 3 + 2] = this._mp[2];
    }
    // ブラシの向き（平均法線）と重心は 1 枚目のミラーが求めたものを鏡像にして使う。
    // 2 枚目以降が自分で計算すると、1 枚目が既に動かした頂点まで平均に入って
    // 左右で値が変わり、頂点単位のずれがストロークごとに溜まっていた
    // （実測: 6 ストロークで 1.5e-3 → 7.1e-3）。
    this._frameOK = false;
    if (nm > 1) { this._snapId = (this._snapId || 0) + 1; this._snapTouchedCount = 0; }
    for (let i = 0; i < nm; i++) {
      const ms = this.mirrors[i];
      V3.set(this._mp, MC[i * 3], MC[i * 3 + 1], MC[i * 3 + 2]);
      mirrorVector(mirrors[i], delta, this._pt);
      this._mirIndex = i;
      if (nm > 1 && i > 0 && this._frameOK) {
        mirrorVector(mirrors[i], this._frameN0, this._frameN);
        mirrorPoint(mirrors[i], this._frameC0, this._frameC);
        this._useFrame = true;
      } else {
        this._useFrame = false;
      }
      this._dab(ms, this._mp, this._pt, first, sScale);
      // 1 枚目が実際にブラシを掛けたときのフレームを控える
      if (nm > 1 && i === 0) {
        const an = this.engine.avgN;
        if (an[0] || an[1] || an[2]) {
          V3.copy(this._frameN0, an);
          V3.copy(this._frameC0, this.engine.centroid);
          this._frameOK = true;
        }
      }
      V3.copy(ms.lastPoint, this._mp);
    }
    // 全ミラーを掛けたあとに、平面／軸の上の頂点を制約へ戻す
    this._enforceSymmetry();
    this.dabCount++;
    this._dabSeq++;
  }

  /**
   * ミラー領域が重なる部分の担当を決める。
   *
   * シンメトリ平面の近くを彫ると、その頂点は複数のミラーの領域に入る。
   * 素直に順番へ適用すると
   *   * 減衰が 2 回掛かって中心線付近だけ倍の深さになる
   *     （実測: 平面上に 1 ダブで変位 5.46e-2 → 1.08e-1 とちょうど 2 倍）
   *   * 1 つめのミラーが動かした結果を 2 つめが読むので、左右で結果が違う
   * という 2 つの問題が出る。
   *
   * そこで「その頂点にいちばん近いダブ中心を持つミラーが書き込む」ことにする。
   * 鏡像なら半空間の分割、ラジアルなら軸まわりの扇形の分割になり、
   * ミラー群の作用で担当セルが入れ替わるだけなので**構成として対称**になる。
   * 担当が重ならないので適用順にも依存しない。
   *
   * ただし「どれか 1 枚だけ」にすると、シンメトリ平面の**上**にある頂点が
   * 平面から押し出されてしまう。平面上の頂点は自分自身が鏡像なので、
   * 以前は 2 枚のミラーの X 成分が打ち消し合って平面上に留まっていたのが、
   * 1 枚だけにしたことで打ち消されなくなる（実測: 8 頂点が 3.6e-2 ずれた）。
   * そこで同距離のミラーには 1/枚数 ずつ持ち分を配る。こうすると
   *   * 合計の大きさは 1 ダブぶん（二重にならない）
   *   * 平面に垂直な成分は打ち消し合う（平面上に留まる）
   * の両方が成り立つ。ZBrush で継ぎ目が割れないのと同じ挙動になる。
   *
   * 平均法線と重心は担当外の頂点も入れて計算する（brushes 側で重みへ掛けるのは
   * その計算のあと）。半分だけで平均すると法線が平面側へ傾き、継ぎ目が折れる。
   *
   * @returns {Float32Array|null} 領域頂点ごとの持ち分 0..1。ミラーが 1 枚なら null
   */
  /**
   * ダブ開始時の座標を控える（持ち分の判定に使う）。
   * ミラーごとに、その領域のうちまだ控えていない頂点だけを記録する。
   * 全頂点ぶんの配列は capV × 3 で 260 万頂点なら 31MB になるので、
   * シンメトリが 2 枚以上のときだけ確保する。
   */
  _snapshotRegion(verts, count) {
    const m = this.mesh;
    if (!this._snapPos || this._snapPos.length < m.capV * 3) {
      this._snapPos = new Float32Array(m.capV * 3);
      this._snapStamp = new Int32Array(m.capV);
      this._snapId = 1;
    }
    if (!this._snapTouched || this._snapTouched.length < m.capV) {
      this._snapTouched = new Int32Array(m.capV);
    }
    const SP = this._snapPos, SS = this._snapStamp, sid = this._snapId, P = m.positions;
    const TL = this._snapTouched;
    let tn = this._snapTouchedCount;
    for (let k = 0; k < count; k++) {
      const v = verts[k];
      if (SS[v] === sid) continue;
      SS[v] = sid;
      const i = v * 3;
      SP[i] = P[i]; SP[i + 1] = P[i + 1]; SP[i + 2] = P[i + 2];
      if (tn < TL.length) TL[tn++] = v;
    }
    this._snapTouchedCount = tn;
  }

  /**
   * ミラーの線形部分を 3x3 行列にして控える（ストローク開始時に 1 回）。
   * 不動点判定はホットループなので、mirrorPoint の呼び出しではなく
   * ここで作った行列でインライン展開する。
   * 並びは 1 ミラーあたり 12 要素: m00..m22（行優先）, cx, cy, cz。
   */
  _buildMirrorMatrices() {
    const mirrors = this.activeMirrors;
    const nm = mirrors.length;
    if (!this._mirMat || this._mirMat.length < nm * 12) this._mirMat = new Float64Array(nm * 12);
    const M = this._mirMat;
    for (let j = 0; j < nm; j++) {
      const mir = mirrors[j];
      const s = mir.s, ang = mir.ang, ax = mir.axis;
      const cs = Math.cos(ang), sn = Math.sin(ang);
      // R(ax, ang) の 3x3
      let r00 = 1, r01 = 0, r02 = 0, r10 = 0, r11 = 1, r12 = 0, r20 = 0, r21 = 0, r22 = 1;
      if (ang !== 0) {
        if (ax === 0) { r11 = cs; r12 = -sn; r21 = sn; r22 = cs; }
        else if (ax === 1) { r00 = cs; r02 = sn; r20 = -sn; r22 = cs; }
        else { r00 = cs; r01 = -sn; r10 = sn; r11 = cs; }
      }
      // M = R * diag(s)
      const o = j * 12;
      M[o] = r00 * s[0]; M[o + 1] = r01 * s[1]; M[o + 2] = r02 * s[2];
      M[o + 3] = r10 * s[0]; M[o + 4] = r11 * s[1]; M[o + 5] = r12 * s[2];
      M[o + 6] = r20 * s[0]; M[o + 7] = r21 * s[1]; M[o + 8] = r22 * s[2];
      M[o + 9] = mir.c[0]; M[o + 10] = mir.c[1]; M[o + 11] = mir.c[2];
    }
    this._mirMatCount = nm;
    // 不動点判定のしきい値。回転行列の sin(π) が 1.2e-16 なので厳密比較では
    // 180 度回転を含む群を取りこぼす。bounds() はここで 1 回だけ見る
    // （毎ダブ呼ぶと 260 万頂点で全体の 3 割を食っていた）。
    this._symEps = 1e-9 * Math.max(1, this.mesh.bounds().radius);
  }

  /**
   * ミラー群の不動点にある頂点を、その制約の上に留める。
   *
   * シンメトリ平面の上にある頂点は自分自身が鏡像なので、対称性から
   * 「平面に垂直な向きには動けない」。これは近似ではなく制約なので、
   * 明示的に課すのが正しい。
   *
   * 課さないと何が起きるか（実測）: 持ち分を 0.5 ずつ配っても、ミラー 1 の
   * 減衰重みはミラー 0 が動かした後の座標で計算されるため X が完全には
   * 打ち消されない（+1.32e-3 と -1.10e-3 で残差 2.18e-4）。すると次のダブでは
   * もう「同距離」と判定されず持ち分が 1.0 と 0.0 に割れて片側だけが動き、
   * 1 ストロークで 7.8e-3、6 ストロークで 9.1e-2 まで暴走していた。
   *
   * どの面／軸が不動点になるかを state のフラグから決めてはいけない。
   * 例えば「X ミラー + Y 軸まわり 4 分割」の群には Z 平面の鏡映も含まれる
   * （180 度回転 × X 反転 = Z 反転）。実測でその 8 頂点だけが 6.4e-2 ずれていた。
   * そこでミラー集合そのものを見て、
   *   「スナップショット位置を自分自身へ写すミラー」＝ その頂点の安定化部分群
   * を求め、その群にわたって現在位置を平均する。有限群の平均は不変部分空間への
   * 射影になるので、面・軸・それらの交わりを区別せず一様に正しく扱える。
   *
   * 対象はダブ開始時のスナップショットに入っている頂点だけ（このダブで
   * 触った可能性がある頂点）。全頂点を毎ダブ走査すると 260 万頂点で重すぎる。
   */
  _enforceSymmetry() {
    const nm = this._mirCount;
    if (nm <= 1) return;
    const SS = this._snapStamp, SP = this._snapPos, sid = this._snapId;
    if (!SS) return;
    const M = this._mirMat;
    if (!M || this._mirMatCount < nm) return;
    const P = this.mesh.positions;
    const verts = this._snapTouched;
    const n = this._snapTouchedCount;
    const eps = this._symEps;
    const eps2 = eps * eps;

    for (let k = 0; k < n; k++) {
      const v = verts[k];
      if (SS[v] !== sid) continue;
      const i = v * 3;
      const sx = SP[i], sy = SP[i + 1], sz = SP[i + 2];
      const cx = P[i], cy = P[i + 1], cz = P[i + 2];
      let cnt = 0;
      let ax = cx, ay = cy, az = cz;
      for (let j = 1; j < nm; j++) {
        const o = j * 12;
        const ox = M[o + 9], oy = M[o + 10], oz = M[o + 11];
        // スナップショット位置の像
        const dx = sx - ox, dy = sy - oy, dz = sz - oz;
        const bx = M[o] * dx + M[o + 1] * dy + M[o + 2] * dz + ox;
        const by = M[o + 3] * dx + M[o + 4] * dy + M[o + 5] * dz + oy;
        const bz = M[o + 6] * dx + M[o + 7] * dy + M[o + 8] * dz + oz;
        const ex = bx - sx, ey = by - sy, ez = bz - sz;
        if (ex * ex + ey * ey + ez * ez > eps2) continue;   // この頂点を動かすミラー
        // 不動にするミラー: 現在位置の像を足し込む
        const gx = cx - ox, gy = cy - oy, gz = cz - oz;
        ax += M[o] * gx + M[o + 1] * gy + M[o + 2] * gz + ox;
        ay += M[o + 3] * gx + M[o + 4] * gy + M[o + 5] * gz + oy;
        az += M[o + 6] * gx + M[o + 7] * gy + M[o + 8] * gz + oz;
        cnt++;
      }
      if (cnt === 0) continue;
      const inv = 1 / (cnt + 1);
      P[i] = ax * inv; P[i + 1] = ay * inv; P[i + 2] = az * inv;
    }
  }
  _ownership(verts, count, myIndex, radius) {
    const centers = this._mirCenters;
    const nm = this._mirCount;
    if (nm <= 1 || !centers) return null;
    let own = this._ownBuf;
    if (!own || own.length < count) own = this._ownBuf = new Float32Array(Math.max(1024, count * 2));
    const P = this.mesh.positions;
    // 距離の比較は「このダブを始めた時点」の座標で行う。現在の座標で比べると、
    // ミラー 0 が既に動かしたぶんだけ頂点が自分の側へ寄って見え、
    // ミラー 1 が「相手のほうが近い」と判断して持ち分 0 になる。
    // 実測ではそれで平面上の頂点の X が打ち消されず 7.8e-3 ずれていた。
    const SP = this._snapPos, SS = this._snapStamp, sid = this._snapId;
    const mx = centers[myIndex * 3], my = centers[myIndex * 3 + 1], mz = centers[myIndex * 3 + 2];
    // 「同距離」の判定はブラシ半径に対する相対許容差で行う。厳密等号だと、
    // 平面上の頂点の x が厳密な 0 ではない（1e-12 程度は乗っている）ために
    // 同距離を取りこぼし、平面から押し出されてしまう。
    // 距離差 |dA-dB| < eps*R を二乗距離の差に直すと |d-mine| < 2*eps*R^2。
    const tol = 2e-5 * radius * radius;
    for (let k = 0; k < count; k++) {
      const v = verts[k], i = v * 3;
      const snap = SS && SS[v] === sid;
      const px = snap ? SP[i] : P[i];
      const py = snap ? SP[i + 1] : P[i + 1];
      const pz = snap ? SP[i + 2] : P[i + 2];
      const mine = (px - mx) ** 2 + (py - my) ** 2 + (pz - mz) ** 2;
      // 自分より明確に近いミラーが 1 枚でもあれば担当外。
      // 同距離のミラーには 1/枚数 ずつ配る。
      let closer = 0, tied = 1;
      for (let j = 0; j < nm; j++) {
        if (j === myIndex) continue;
        const d = (px - centers[j * 3]) ** 2 + (py - centers[j * 3 + 1]) ** 2 + (pz - centers[j * 3 + 2]) ** 2;
        if (d < mine - tol) { closer++; break; }
        if (d <= mine + tol) tied++;
      }
      own[k] = closer > 0 ? 0 : 1 / tied;
    }
    return own;
  }

  /**
   * ダブの接平面の基底を作る。ブラシアルファはこの (U, V) 上でサンプルされる。
   *
   * 法線はシード頂点のものを使う（ブラシの平均法線は apply の中で初めて求まるので、
   * 掛ける前には使えない）。U はストローク方向に合わせる（ZBrush の Align to Stroke）か、
   * 合わせない設定なら法線から決まる安定した軸にする。
   */
  _updateDabFrame(ms, delta) {
    const st = this.state;
    const m = this.mesh;
    const U = this._tanU, V = this._tanV;
    const seed = ms.seed;
    let nx = 0, ny = 1, nz = 0;
    if (seed >= 0 && seed < m.nv) {
      const i = seed * 3;
      nx = m.normals[i]; ny = m.normals[i + 1]; nz = m.normals[i + 2];
      const l = Math.hypot(nx, ny, nz);
      if (l > 1e-12) { nx /= l; ny /= l; nz /= l; } else { nx = 0; ny = 1; nz = 0; }
    }
    // U の元になる方向
    let ux = 0, uy = 0, uz = 0;
    const align = st.alphaAlign !== false;
    if (align && delta && (delta[0] || delta[1] || delta[2])) {
      ux = delta[0]; uy = delta[1]; uz = delta[2];
    } else {
      // 法線と平行にならない軸を選ぶ（|n| の一番小さい成分の軸）
      const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
      if (ax <= ay && ax <= az) { ux = 1; }
      else if (ay <= az) { uy = 1; }
      else { uz = 1; }
    }
    // 法線成分を抜いて接平面へ落とす
    const d = ux * nx + uy * ny + uz * nz;
    ux -= nx * d; uy -= ny * d; uz -= nz * d;
    let l = Math.hypot(ux, uy, uz);
    if (l < 1e-12) {
      // 退化したら別の軸でやり直す
      ux = ny; uy = nz; uz = nx;
      const d2 = ux * nx + uy * ny + uz * nz;
      ux -= nx * d2; uy -= ny * d2; uz -= nz * d2;
      l = Math.hypot(ux, uy, uz) || 1;
    }
    U[0] = ux / l; U[1] = uy / l; U[2] = uz / l;
    // V = n × U（右手系）
    V[0] = ny * U[2] - nz * U[1];
    V[1] = nz * U[0] - nx * U[2];
    V[2] = nx * U[1] - ny * U[0];

    // 回転。spin が有効なストロークではダブごとに擬似ランダムに回す。
    // Math.random は使わない（同じストロークが同じ結果になるようにする）。
    const sp = this._strokeParams;
    if (sp && sp.spin) {
      const h = hash01(this._dabSeq * 2 + 1, this.strokeSeed);
      this._alphaRot = h * Math.PI * 2;
    } else {
      this._alphaRot = 0;
    }
  }

  /**
   * ペイント色。colorSpray では明度と色相をダブごとに少し散らす。
   * ZBrush の ColorSpray 相当で、鱗や岩肌を塗るときに単調にならない。
   */
  _dabColor() {
    const st = this.state;
    const sp = this._strokeParams;
    const j = sp && sp.colorJitter ? sp.colorJitter : 0;
    if (j <= 0) return st.paintColor;
    const c = st.paintColor;
    const out = this._jitterColor || (this._jitterColor = [0, 0, 0]);
    const seq = this._dabSeq;
    for (let k = 0; k < 3; k++) {
      const h = hash01(seq * 8 + 5 + k, this.strokeSeed) * 2 - 1;
      out[k] = clamp(c[k] * (1 + h * j), 0, 1);
    }
    return out;
  }

  _dab(ms, point, delta, first, scale) {
    const m = this.mesh;
    const st = this.state;
    const brush = this.strokeBrush;
    // スプレー系はダブごとに半径が揺れる（_dabAll が決めた倍率を掛ける）
    const radius = st.worldRadius * (this._sizeMul || 1);
    if (radius <= 0) return;
    // アルファを使うなら接平面の基底を作る。使わないなら計算しない
    const alphaId = st.alpha || null;
    if (alphaId) this._updateDabFrame(ms, delta);

    // --- シード追従 -----------------------------------------------------
    let seed = descend(m, ms.seed, point);
    if (seed < 0) seed = nearestVertexBrute(m, point);
    else {
      const i = seed * 3, P = m.positions;
      const d = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
      const tol = Math.max(radius, this.targetEdgeLength(radius) * 3);
      if (d > tol) seed = nearestVertexBrute(m, point);
    }
    if (seed < 0) return;
    ms.seed = seed;

    // --- move ブラシ: 固定領域 ------------------------------------------
    if (brush === 'move') {
      if (first || !ms.lockedVerts) {
        this._gather(ms, point, radius);
        ms.lockedVerts = ms.verts.slice(0, ms.count);
        ms.lockedCount = ms.count;
        V3.copy(ms.center, point);
      } else {
        V3.add(ms.center, ms.center, delta);
      }
      if (ms.lockedCount === 0) return;
      const rec = this.recorder;
      if (this._mirCount > 1) this._snapshotRegion(ms.lockedVerts, ms.lockedCount);
      if (rec) rec.before(m, ms.lockedVerts, ms.lockedCount);
      this.engine.apply(m, {
        type: 'move',
        verts: ms.lockedVerts, count: ms.lockedCount,
        center: ms.center, radius,
        strength: (st.effStrength !== undefined ? st.effStrength : st.strength) * scale, dir: this.strokeDir,
        delta, color: st.paintColor, ignoreMask: false,
        focal: st.focalShift, toCamera: st.toCamera, backface: st.backfaceMask,
        alpha: alphaId, tangent: this._tanU, bitangent: this._tanV, alphaRotation: this._alphaRot,
        own: this._ownership(ms.lockedVerts, ms.lockedCount, this._mirIndex, radius),
        frameN: this._useFrame ? this._frameN : null, frameC: this._useFrame ? this._frameC : null,
      });
      if (rec) rec.after(m, ms.lockedVerts, ms.lockedCount);
      this._updateNormals(ms.lockedVerts, ms.lockedCount);
      return;
    }

    // --- 領域収集 -------------------------------------------------------
    // 半径より少し広めに 1 回だけ集め、dyntopo とブラシ適用で共用する。
    // 半径の外側は減衰が 0 になるので、余分に含めても結果は変わらない。
    const gatherR = radius * 1.1;
    this._gather(ms, point, gatherR);

    // --- 動的トポロジ ---------------------------------------------------
    if (st.dynTopo && needsTopology(brush) && ms.count > 0) {
      const target = this.targetEdgeLength(radius);
      const moved = this._movedVerts;
      moved.length = 0;
      // 1 ダブで作れる頂点数を領域サイズに比例させる。粗い面に大きなブラシを
      // 当てたときに 1 フレームで数千頂点作って固まるのを防ぐ。
      // 上限に当たっても次のダブで続きが分割されるので、数フレームで目標密度に届く。
      const ch = refineRegion(m, ms.tris, ms.triCount, point, radius, target, {
        subdivide: true,

fn fxaa(uv : vec2<f32>) -> vec3<f32> {
  let rcp = u.rt.zw;
  let m  = fetch(uv);
  let nw = fetch(uv + vec2<f32>(-rcp.x, -rcp.y));
  let ne = fetch(uv + vec2<f32>( rcp.x, -rcp.y));
  let sw = fetch(uv + vec2<f32>(-rcp.x,  rcp.y));
  let se = fetch(uv + vec2<f32>( rcp.x,  rcp.y));
  let lm = luma(m);
  let lnw = luma(nw); let lne = luma(ne); let lsw = luma(sw); let lse = luma(se);
  let lmin = min(lm, min(min(lnw, lne), min(lsw, lse)));
  let lmax = max(lm, max(max(lnw, lne), max(lsw, lse)));
  if (lmax - lmin < lmax * 0.10 + 0.018) { return m; }

  var dir = vec2<f32>(-((lnw + lne) - (lsw + lse)), ((lnw + lsw) - (lne + lse)));
  let reduce = max((lnw + lne + lsw + lse) * 0.25 * 0.125, 1.0 / 128.0);
  let rcpMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + reduce);
  dir = clamp(dir * rcpMin, vec2<f32>(-8.0, -8.0), vec2<f32>(8.0, 8.0)) * rcp;

  let rA = 0.5 * (fetch(uv + dir * (1.0 / 3.0 - 0.5)) + fetch(uv + dir * (2.0 / 3.0 - 0.5)));
  let rB = rA * 0.5 + 0.25 * (fetch(uv + dir * -0.5) + fetch(uv + dir * 0.5));
  let lb = luma(rB);
  if (lb < lmin || lb > lmax) { return rA; }
  return rB;
}

@fragment

  if (u.params.w > 0.5) {
    let ao = textureSampleLevel(aoTex, smp, i.uv, 0.0).r;
    return vec4<f32>(srgbEncode(vec3<f32>(ao, ao, ao)), 1.0);
  }
  var c = fxaa(i.uv);

}

@group(0) @binding(1) var depthTex : texture_depth_2d;
@group(0) @binding(2) var<uniform> pp : PickParams;
@group(0) @binding(3) var<storage, read_write> outBuf : PickResult;

@compute @workgroup_size(1, 1, 1)
fn main() {
  let dim = vec2<i32>(textureDimensions(depthTex));
  let cx = i32(pp.cursor.x);
  let cy = i32(pp.cursor.y);
  let rad = i32(pp.cursor.z);

  var bestD = 1.0;
  var bestX = -1;
  var bestY = -1;
  var bestDist = 1.0e30;

  for (var dy = -rad; dy <= rad; dy = dy + 1) {
    for (var dx = -rad; dx <= rad; dx = dx + 1) {
      let x = cx + dx;
      let y = cy + dy;
      if (x < 0 || y < 0 || x >= dim.x || y >= dim.y) { continue; }
      let d = textureLoad(depthTex, vec2<i32>(x, y), 0);
      if (d >= 0.999999) { continue; }
      let dist = f32(dx * dx + dy * dy);
      if (dist < bestDist) {
        bestDist = dist;
        bestD = d;
        bestX = x;
        bestY = y;
      }

    outBuf.world = vec4<f32>(0.0, 0.0, 0.0, 0.0);

@group(1) @binding(0) var<uniform> r : RingU;

struct VSOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) fade : f32,

@vertex
fn vs(@builtin(vertex_index) vi : u32, @builtin(instance_index) ii : u32) -> VSOut {
  let segs = u32(r.info.x);

  let ringIdx = vi / perRing;

  let seg = local / 2u;
  let end = local % 2u;

  var scale = 1.0;

  o.pos = u.viewProj * r.xf[ii] * vec4<f32>(p, 1.0);
  o.fade = select(1.0, 0.45, ringIdx == 1u);
  return o;
}

 *   params : そのまま <input type=range> にできる形（step も入れてある）
 * 既定値は「ボタンを押したら効果が分かる」量にしてある（0 だと何も起きない）。
 */
const DEFORMS = [
  {
    id: 'taper', jp: 'テーパー', name: 'Taper',
    hint: '軸に沿って先細りさせる。+ で軸の + 側が太り − 側が細くなる',
    axis: true,
    params: [{ key: 'amount', jp: '量', min: -1, max: 1, def: 0.5, step: 0.01 }],
  },
  {
    id: 'twist', jp: 'ツイスト', name: 'Twist',
    hint: '軸まわりに捻る。軸の両端で ±指定角ぶん回る',
    axis: true,
    params: [{ key: 'amount', jp: '角度（度）', min: -720, max: 720, def: 90, step: 1 }],
  },
  {
    id: 'bend', jp: 'ベンド', name: 'Bend',
    hint: '軸に沿って円弧に巻きつけて曲げる。中央の断面は動かない',
    axis: true,
    params: [{ key: 'amount', jp: '角度（度）', min: -180, max: 180, def: 60, step: 1 }],
  },
  {
    id: 'inflate', jp: 'インフレート', name: 'Inflate',
    hint: '各頂点の法線方向に膨張／収縮させる（軸に依存しない）',
    axis: false,
    params: [{ key: 'amount', jp: '量', min: -0.5, max: 0.5, def: 0.06, step: 0.005 }],
  },
  {
    id: 'spherize', jp: 'スフィアライズ', name: 'Spherize',
    hint: 'バウンディング球へ寄せる。1 で完全な球になる',
    axis: false,
    params: [{ key: 'amount', jp: 'ブレンド', min: 0, max: 1, def: 0.5, step: 0.01 }],
  },
  {
    id: 'flattenAxis', jp: 'フラット化', name: 'Flatten',
    hint: '指定軸の座標を中央へ潰す。1 で完全な平面になる',
    axis: true,
    params: [{ key: 'amount', jp: '量', min: 0, max: 1, def: 0.5, step: 0.01 }],
  },
  {
    id: 'stretch', jp: 'ストレッチ', name: 'Stretch',
    hint: '指定軸方向に伸縮する。+1 で 2 倍、−0.5 で半分',
    axis: true,
    params: [{ key: 'amount', jp: '量', min: -0.9, max: 3, def: 0.3, step: 0.01 }],
  },
  {
    id: 'noise', jp: 'ノイズ', name: 'Noise',
    hint: '法線方向に決定論的なノイズを乗せる。同じ設定なら必ず同じ結果',
    axis: false,
    params: [
      { key: 'amount', jp: '強さ', min: -0.3, max: 0.3, def: 0.04, step: 0.002 },
      { key: 'scale', jp: '細かさ', min: 0.5, max: 32, def: 6, step: 0.5 },
    ],
  },
  {
    id: 'smoothAll', jp: 'スムーズ（全体）', name: 'Smooth All',
    hint: '全体を 1-ring 平均で平滑化する。反復するほど滑らかで小さくなる',
    axis: false,
    params: [
      { key: 'amount', jp: '量', min: 0, max: 1, def: 0.5, step: 0.01 },
      { key: 'iterations', jp: '反復', min: 1, max: 20, def: 3, step: 1 },
    ],
  },
];

const DEFORM_IDS = DEFORMS.map(d => d.id);
const DEFORM_BY_ID = new Map(DEFORMS.map(d => [d.id, d]));

/** その変形の既定オプション（UI の初期値・applyDeform への素の引数に使える） */
function defaultOpts(id) {
  const d = DEFORM_BY_ID.get(id);
  if (!d) return null;
  const o = { axis: 1 };                       // Y は人体・柱状のモデルで最も使う軸
  for (let i = 0; i < d.params.length; i++) o[d.params[i].key] = d.params[i].def;
  return o;
}

// ---------------------------------------------------------------------------
// 共通の下準備
// ---------------------------------------------------------------------------

/**
 * スライダー値の解決。UI から undefined / NaN（空欄）/ 範囲外が来ても
 * 既定値と min/max で挟み込む。ここで弾かないと 1 頂点が NaN になった時点で
 * 法線計算を通じて全体に伝播し、モデルが画面から消える。
 */
function param(def, key, opts) {
  const ps = def.params;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    if (p.key !== key) continue;
    const v = opts[key];
    if (typeof v !== 'number' || !Number.isFinite(v)) return p.def;
    return clamp(v, p.min, p.max);
  }
  return 0;
}

/**
 * 軸・中心・正規化スケールを決める。
 * 中心は既定でバウンディングボックス中心、opts.center で上書きできる。
 */
function resolve(mesh, def, opts) {
  const bb = mesh.bounds();
  const a = (opts.axis === 0 || opts.axis === 1 || opts.axis === 2) ? opts.axis : 1;
  const c = (opts.center && opts.center.length >= 3) ? opts.center : bb.center;
  return {
    a,
    au: (a + 1) % 3,          // 断面を張る 2 軸（右手系の巡回順）
    av: (a + 2) % 3,
    cen: [c[0], c[1], c[2]],
    // 軸方向の半幅。潰れたモデル（平面など）で 0 割りしないよう下限を置く
    half: Math.max(1e-6, (bb.max[a] - bb.min[a]) * 0.5),
    unit: bb.radius,          // 長さの基準（法線変位・ノイズ周波数をスケール不変にする）
    amount: param(def, 'amount', opts),
    scale: param(def, 'scale', opts),
    iterations: Math.max(1, Math.round(param(def, 'iterations', opts))),
    bb,
  };
}

// ---------------------------------------------------------------------------
// 決定論的ノイズ
// ---------------------------------------------------------------------------

// Math.random は使わない。座標から決まる整数ハッシュにすることで、
// 同じメッシュ・同じ設定なら必ず同じ結果になる（Undo → 再適用でぶれない）。
// 乗算はすべて Math.imul で 32bit に閉じる（浮動小数の精度落ちで
// ハッシュが崩れるのを防ぐ）。
function hash31(ix, iy, iz) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(iz, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// 格子値ノイズ（-1..1）。頂点ごとの純粋なハッシュだと紙やすり状の白色雑音に
// なってしまい「細かさ」を制御できないので、整数格子の値を smoothstep で
// 補間して空間周波数を持たせている。
function valueNoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const uz = fz * fz * (3 - 2 * fz);
  const c000 = hash31(ix, iy, iz), c100 = hash31(ix + 1, iy, iz);
  const c010 = hash31(ix, iy + 1, iz), c110 = hash31(ix + 1, iy + 1, iz);
  const c001 = hash31(ix, iy, iz + 1), c101 = hash31(ix + 1, iy, iz + 1);
  const c011 = hash31(ix, iy + 1, iz + 1), c111 = hash31(ix + 1, iy + 1, iz + 1);
  const x00 = c000 + (c100 - c000) * ux, x10 = c010 + (c110 - c010) * ux;
  const x01 = c001 + (c101 - c001) * ux, x11 = c011 + (c111 - c011) * ux;
  const y0 = x00 + (x10 - x00) * uy, y1 = x01 + (x11 - x01) * uy;
  return (y0 + (y1 - y0) * uz) * 2 - 1;
}

// ---------------------------------------------------------------------------
// 各変形。すべて同じ骨格:
//   生存頂点だけ走査 → 目標位置を求める → weight でブレンド →
//   非有限なら捨てる → 書き戻す → 実際に動いた数を数える
// ホットループなので this / mesh へのプロパティ読みは全部ループ外へ退避する。
//
// 「動いた」の判定は必ず *書き戻したあとの* Float32Array と比べる。計算途中の値は
// double なので、float32 の 1 ULP に届かない変位（微小な amount、あるいは中心を
// double で渡されたときの桁落ち）でも「≠」になってしまい、実際には 1 ビットも
// 変わっていないのに changed > 0 になる。そうなると applyDeform が全体の
// 法線・曲率を作り直し（数百万頂点で 100ms 級）、geomVersion まで進めてしまう。
// ---------------------------------------------------------------------------

function taper(mesh, o, st) {
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const a = o.a, au = o.au, av = o.av;
  const ca = o.cen[a], cu = o.cen[au], cv = o.cen[av];
  const invHalf = 1 / o.half, amount = o.amount;
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    let t = (P[b + a] - ca) * invHalf;
    t = t < -1 ? -1 : (t > 1 ? 1 : t);       // 中心を外に置いても暴走させない
    let s = 1 + amount * t;
    if (s < 0) s = 0;                        // 断面が反転して裏返るのを防ぐ
    const pu = P[b + au], pv = P[b + av];
    const nu = pu + ((cu + (pu - cu) * s) - pu) * w;
    const nvv = pv + ((cv + (pv - cv) * s) - pv) * w;
    if (!Number.isFinite(nu) || !Number.isFinite(nvv)) { skipped++; continue; }
    P[b + au] = nu; P[b + av] = nvv;
    if (P[b + au] !== pu || P[b + av] !== pv) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

function twist(mesh, o, st) {
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const a = o.a, au = o.au, av = o.av;
  const ca = o.cen[a], cu = o.cen[au], cv = o.cen[av];
  const invHalf = 1 / o.half;
  const maxAng = o.amount * Math.PI / 180;
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    let t = (P[b + a] - ca) * invHalf;
    t = t < -1 ? -1 : (t > 1 ? 1 : t);
    // 回転角そのものに weight を掛ける。位置の線形補間では回転が弦になって
    // 半分マスクされた頂点が軸へ寄ってしまうため（回転は等長でなくなる）。
    const ang = maxAng * t * w;
    const cs = Math.cos(ang), sn = Math.sin(ang);
    const pu = P[b + au], pv = P[b + av];
    const du = pu - cu, dv = pv - cv;
    const nu = cu + du * cs - dv * sn;
    const nvv = cv + du * sn + dv * cs;
    if (!Number.isFinite(nu) || !Number.isFinite(nvv)) { skipped++; continue; }
    P[b + au] = nu; P[b + av] = nvv;
    if (P[b + au] !== pu || P[b + av] !== pv) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

// 軸に沿った直線を半径 R の円弧に巻きつける。t=0（中央）の断面は不動点になり、
// 角度 0 で厳密に恒等写像になる形にしてある（amount を小さくすれば連続的に効く）。
function bend(mesh, o, st) {
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const a = o.a, au = o.au, av = o.av;
  const ca = o.cen[a], cu = o.cen[au];
  const half = o.half, invHalf = 1 / half;
  const total = o.amount * Math.PI / 180;
  let changed = 0, masked = 0, skipped = 0;
  if (Math.abs(total) < 1e-9) { st.changed = 0; st.masked = 0; st.skipped = 0; return; }
  const R = half / total;                    // 曲率半径（total の符号で曲がる向きが決まる）
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    const pa = P[b + a], pu = P[b + au];
    let t = (pa - ca) * invHalf;
    t = t < -1 ? -1 : (t > 1 ? 1 : t);
    const ang = total * t;
    const arm = R - (pu - cu);
    const ta = ca + arm * Math.sin(ang);
    const tu = cu + R - arm * Math.cos(ang);
    const na = pa + (ta - pa) * w;
    const nu = pu + (tu - pu) * w;
    if (!Number.isFinite(na) || !Number.isFinite(nu)) { skipped++; continue; }
    P[b + a] = na; P[b + au] = nu;
    if (P[b + a] !== pa || P[b + au] !== pu) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

function inflate(mesh, o, st) {
  const P = mesh.positions, N = mesh.normals, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const amp = o.amount * o.unit;             // モデルの大きさに比例させてスケール不変に
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    const d = amp * w;
    const px = P[b], py = P[b + 1], pz = P[b + 2];
    const nx = px + N[b] * d, ny = py + N[b + 1] * d, nz = pz + N[b + 2] * d;
    if (!Number.isFinite(nx) || !Number.isFinite(ny) || !Number.isFinite(nz)) { skipped++; continue; }
    P[b] = nx; P[b + 1] = ny; P[b + 2] = nz;
    if (P[b] !== px || P[b + 1] !== py || P[b + 2] !== pz) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

// 半径にはバウンディング球の半径ではなく中心からの平均距離を使う。
// 半対角線を使うと立方体のような形が一気に膨れ上がって「球へ寄せた」感じに
// ならないため、体積がだいたい保たれるほうを取った。
function spherize(mesh, o, st) {
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const cx = o.cen[0], cy = o.cen[1], cz = o.cen[2];
  const amount = o.amount;
  let sum = 0, cnt = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const b = i * 3;
    const dx = P[b] - cx, dy = P[b + 1] - cy, dz = P[b + 2] - cz;
    sum += Math.sqrt(dx * dx + dy * dy + dz * dz); cnt++;
  }
  const R = cnt > 0 ? sum / cnt : o.unit;
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    const px = P[b], py = P[b + 1], pz = P[b + 2];
    const dx = px - cx, dy = py - cy, dz = pz - cz;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d < 1e-12) continue;                 // 中心と一致 → 寄せる向きが決まらない
    const s = (R / d - 1) * amount * w;
    const nx = px + dx * s, ny = py + dy * s, nz = pz + dz * s;
    if (!Number.isFinite(nx) || !Number.isFinite(ny) || !Number.isFinite(nz)) { skipped++; continue; }
    P[b] = nx; P[b + 1] = ny; P[b + 2] = nz;
    if (P[b] !== px || P[b + 1] !== py || P[b + 2] !== pz) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

function flattenAxis(mesh, o, st) {
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const a = o.a, ca = o.cen[a], amount = o.amount;
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    const pa = P[b + a];
    const na = pa + (ca - pa) * amount * w;
    if (!Number.isFinite(na)) { skipped++; continue; }
    P[b + a] = na;
    if (P[b + a] !== pa) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

function stretch(mesh, o, st) {
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const a = o.a, ca = o.cen[a];
  let f = 1 + o.amount;
  if (f < 0) f = 0;                          // 負の倍率で裏返さない
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    const pa = P[b + a];
    const na = pa + ((ca + (pa - ca) * f) - pa) * w;
    if (!Number.isFinite(na)) { skipped++; continue; }
    P[b + a] = na;
    if (P[b + a] !== pa) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

function noise(mesh, o, st) {
  const P = mesh.positions, N = mesh.normals, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv;
  const cx = o.cen[0], cy = o.cen[1], cz = o.cen[2];
  const freq = o.scale / o.unit;             // 「モデル半径あたり何山」
  const amp = o.amount * o.unit;
  let changed = 0, masked = 0, skipped = 0;
  for (let i = 0; i < nv; i++) {
    if (A[i] === 0) continue;
    const w = 1 - clamp(MK[i], 0, 1);
    if (w <= 0) { masked++; continue; }
    const b = i * 3;
    const px = P[b], py = P[b + 1], pz = P[b + 2];
    const gx = (px - cx) * freq, gy = (py - cy) * freq, gz = (pz - cz) * freq;
    // 2 オクターブ。1 オクターブだと粘土を握った程度の大きな凹凸しか出ず
    // 「ノイズ」に見えないため、倍の周波数を半分の振幅で足している。
    const n1 = valueNoise(gx, gy, gz);
    const n2 = valueNoise(gx * 2.017 + 19.31, gy * 2.017 - 7.77, gz * 2.017 + 3.53);
    const d = (n1 + n2 * 0.5) * (1 / 1.5) * amp * w;
    const nx = px + N[b] * d, ny = py + N[b + 1] * d, nz = pz + N[b + 2] * d;
    if (!Number.isFinite(nx) || !Number.isFinite(ny) || !Number.isFinite(nz)) { skipped++; continue; }
    P[b] = nx; P[b + 1] = ny; P[b + 2] = nz;
    if (P[b] !== px || P[b + 1] !== py || P[b + 2] !== pz) changed++;
  }
  st.changed = changed; st.masked = masked; st.skipped = skipped;
}

// 1-ring 平均のヤコビ反復。ring[] を頂点ごとに辿るのではなく三角形を 1 回
// 走査して隣接和を積む（mesh.computeAllCurvature と同じ方針）。配列の間接参照が
// 消えるので数百万頂点でも実用的な速度になる。
// スクラッチはモジュールに残して使い回す。毎回 nv*4 バイト × 4 本を確保すると
// パレットを触るたびに数十 MB の GC を起こすため。
let _smSum = new Float32Array(0);
let _smCnt = new Float32Array(0);
let _smOrig = new Float32Array(0);

function smoothAll(mesh, o, st) {
  const P = mesh.positions, T = mesh.tris, A = mesh.vAlive, MK = mesh.mask;
  const nv = mesh.nv, nt = mesh.nt;
  const amount = o.amount, iters = o.iterations;
  if (_smSum.length < nv * 3) {
    _smSum = new Float32Array(nv * 3);
    _smCnt = new Float32Array(nv);
    _smOrig = new Float32Array(nv * 3);
  }
  const S = _smSum, C = _smCnt;
  let changed = 0, masked = 0, skipped = 0;
  // 「動いたか」は開始時との比較で数える（反復の途中で元の位置に戻る頂点もある）
  const before = _smOrig;
  before.set(P.subarray(0, nv * 3));
  for (let it = 0; it < iters; it++) {
    S.fill(0, 0, nv * 3); C.fill(0, 0, nv);
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const ia = T[i], ib = T[i + 1], ic = T[i + 2];
      if (ia === ib && ib === ic) continue;   // 退化 = 削除済み
      const a = ia * 3, b = ib * 3, c = ic * 3;

 * どちらを見ても答えは同じだが、常に a 側を見ると 1 頂点に何万面も集まる形
 * （円錐の頂点・UV 球の極・扇状に潰れたダイナメッシュ）で全体が Σvalence²
 * に化ける。実測で 32,000 面の扇に 0.8 秒かかっていた（正則な 130 万面が
 * 70ms なのに）。扇の反対側の端点は価数 2〜3 なので、小さい方を選ぶだけで
 * 面数に線形へ戻る。
 */
function edgeNeighbor(T, RC, RD, REX, t, a, b) {
  let p = a, q = b;
  if (RC[b] < RC[a]) { p = b; q = a; }
  const rc = RC[p];
  if (rc === 0) return -1;
  if (rc <= RING_STRIDE) {
    const base = p * RING_STRIDE;
    for (let j = 0; j < rc; j++) {
      const u = RD[base + j];
      if (u === t) continue;
      const i = u * 3;
      if (T[i] === q || T[i + 1] === q || T[i + 2] === q) return u;
    }
    return -1;
  }
  const ex = REX[p];
  for (let j = 0; j < rc; j++) {
    const u = ex[j];
    if (u === t) continue;
    const i = u * 3;
    if (T[i] === q || T[i + 1] === q || T[i + 2] === q) return u;
  }
  return -1;
}

/**
 * 面法線を out に入れて長さ（= 面積の 2 倍）を返す。
 * 正規化しないのは、2 面の内積を比べるときに割り算 1 回で足りるため。
 */
function faceNormal(P, T, t, out) {
  const i = t * 3;
  const a = T[i] * 3, b = T[i + 1] * 3, c = T[i + 2] * 3;
  const ax = P[a], ay = P[a + 1], az = P[a + 2];
  const e1x = P[b] - ax, e1y = P[b + 1] - ay, e1z = P[b + 2] - az;
  const e2x = P[c] - ax, e2y = P[c + 1] - ay, e2z = P[c + 2] - az;
  const nx = e1y * e2z - e1z * e2y;
  const ny = e1z * e2x - e1x * e2z;
  const nz = e1x * e2y - e1y * e2x;
  out[0] = nx; out[1] = ny; out[2] = nz;
  return Math.sqrt(nx * nx + ny * ny + nz * nz);
}

// ---------------------------------------------------------------------------

class PolyGroups {
  constructor() {
    this.groups = new Int32Array(0);     // 三角形 → グループ ID（-1 = 退化スロット）
    this.vis = new Uint8Array(0);        // 三角形 → 1 = 表示 / 0 = 非表示

    // 可視操作は必ず全ての生きた面を舐めるので、その場で数え直して
    // _visCount を常に正しく保つ。差分で足し引きするだけだと、履歴の巻き戻しや
    // トポロジ変化を挟んだときにずれてもう戻せない。
    this._visCount = 0;
    this._liveTris = 0;
    this._groupCount = 1;
    this._nt = 0;
    this._guard = -1;                    // 最後に同期した時点の mesh.topoVersion
    // 「今が初期状態（全部 1 グループ・全部可視）かどうか」。dyntopo 中は
    // 毎ダブで topoVersion が変わるので sync() ごとにリセットが走るが、
    // ポリグループを一度も使っていなければ配列は既に初期状態なので
    // 数百万要素の fill を毎フレームやる意味がない。
    this._pristine = true;

    // 呼び出し側が「前回と変わったか」を 1 個の整数で見られるようにする。
    // buildVisibleIndices() は O(nt) なので毎フレーム呼ばせたくない。
    this.visVersion = 0;
    this.groupVersion = 0;

    this._queue = new Int32Array(0);     // 面の BFS キュー（面は 1 回しか入らない）
    this._vflag = new Uint8Array(0);     // grow / shrink 用の頂点フラグ
    this._indices = new Uint32Array(0);  // 描画用インデックス（作り直さず使い回す）
    this._gcol = new Float32Array(0);    // グループ色のキャッシュ
    this._n1 = new Float64Array(3);
    this._n2 = new Float64Array(3);
  }

  // --- 容量とトポロジ ------------------------------------------------------

  get groupCount() { return this._groupCount; }
  /** 全部見えているか（描画側は true なら通常のインデックスバッファでよい） */
  get allVisible() { return this._visCount >= this._liveTris; }

  /** 容量を mesh に合わせ、トポロジが変わっていたら初期状態へ戻す */
  sync(mesh) {
    const nt = mesh.nt;
    if (this.groups.length < nt) {
      const cap = Math.max(2048, Math.ceil(nt * 1.5));
      const g = new Int32Array(cap);
      g.set(this.groups);
      this.groups = g;
      const v = new Uint8Array(cap);
      v.set(this.vis);
      v.fill(1, this.vis.length);        // 増えた枠の既定は「表示」
      this.vis = v;
    }
    // 面が増えたのに topoVersion が変わっていない、という経路は本来ないが、
    // あったとしても「未初期化のグループ ID で描く」ことは避ける。
    if (nt > this._nt) {
      this.groups.fill(0, this._nt, nt);
      this.vis.fill(1, this._nt, nt);
    }
    this._nt = nt;
    this._liveTris = mesh.liveTris;
    const ok = this.validate(mesh);
    if (ok && this._visCount > this._liveTris) this._visCount = this._liveTris;
    return ok;
  }

  /**
   * トポロジ変化の検出。変わっていたら reset() して false を返す。
   * 三角形 ID の意味が変わったあとのグループ／可視情報は復元できないので捨てる。
   */
  validate(mesh) {
    if (this._guard === mesh.topoVersion) return true;
    this.reset(mesh);
    return false;
  }

  /** 全部 1 グループ・全部可視に戻す */
  reset(mesh) {
    if (!this._pristine) {
      this.groups.fill(0);
      this.vis.fill(1);
      this._pristine = true;
      // 版を進めるのは本当に状態が変わったときだけ。dyntopo 中は毎ダブ
      // ここを通るので、無条件に進めると描画側が毎フレーム
      // インデックスを作り直すことになる。
      this.visVersion++;
      this.groupVersion++;
    }
    this._groupCount = 1;
    if (mesh) {
      this._liveTris = mesh.liveTris;
      this._nt = mesh.nt;
      this._guard = mesh.topoVersion;
    }
    this._visCount = this._liveTris;
    return this._stats(0);
  }

  /**
   * 三角形 → グループ ID。長さは容量なので mesh.nt で区切って読むこと。
   * 死んだスロットは assign() の直後だけ -1 で、リセット直後は 0 になっている
   * （モジュール先頭のコメント参照）。生死は mesh.isTriAlive(t) で見ること。
   */
  groupsOf(mesh) {
    this.sync(mesh);
    return this.groups;                  // 有効範囲は [0, mesh.nt)
  }

  groupColor(id) { return groupColorOf(id); }

  isVisible(t) {
    if (t < 0) return false;
    // 同期前のスロットは既定状態（可視）として答える
    return t >= this.vis.length ? true : this.vis[t] === 1;
  }

  visibleCount() { return this._visCount; }
  hiddenCount() { return this._liveTris - this._visCount; }

  /** グループごとの面数（UI の一覧表示用） */
  groupSizes(mesh) {
    this.sync(mesh);
    const T = mesh.tris, G = this.groups, nt = mesh.nt;
    const out = new Int32Array(Math.max(1, this._groupCount));
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const g = G[t];
      if (g >= 0 && g < out.length) out[g]++;
    }
    return out;
  }

  // --- 自動グループ分け ---------------------------------------------------

  /**
   * @param method GROUP_METHOD_IDS のいずれか
   * @param opts   angle: byNormalAngle のしきい値（度, 既定 30）
   *               threshold: byMask のマスクしきい値（既定 0.5）
   * @returns {{groups, tris, method, visible, hidden}}
   */
  assign(mesh, method, opts = {}) {
    this.sync(mesh);
    let groups = 0;
    switch (method) {
      case 'byConnectivity': case 'connectivity':
        groups = this._byConnectivity(mesh); break;
      case 'byNormalAngle': case 'normalAngle':
        groups = this._byNormalAngle(mesh, opts.angle === undefined ? 30 : opts.angle); break;
      case 'byMask': case 'mask':
        groups = this._bySplit(mesh, 0, opts.threshold === undefined ? MASK_THRESHOLD : opts.threshold); break;
      case 'byVisible': case 'visible':
        groups = this._bySplit(mesh, 1, 0); break;
      case 'all': case 'none':
        groups = this._all(mesh); break;
      default:
        // 知らない手法で黙って全部 1 グループにされると原因が追いにくいので、
        // 何も変えずに ok:false を返す。
        return { groups: this._groupCount, tris: 0, method, ok: false,
          visible: this._visCount, hidden: this._liveTris - this._visCount };
    }
    this._groupCount = groups;
    this._pristine = false;
    this.groupVersion++;
    return { groups, tris: this._liveTris, method, ok: true,
      visible: this._visCount, hidden: this._liveTris - this._visCount };
  }

  /**
   * 連結成分ごと。頂点を共有していれば同じグループ（1 点で触れている 2 枚も同じ塊と見る）。
   *
   * 頂点に「ring はもう展開した」印を付けるので、ring を舐める回数は
   * 頂点ごとに 1 回、全体で Σvalence = O(面数)。印を付けないと面ごとに
   * 3 頂点ぶん舐め直すことになり Σvalence² になる。正則なメッシュなら
   * 定数 6 倍の差だが、1 頂点に何万面も集まる形では二乗に跳ねて
   * 32,000 面で 1 秒かかった（印を付けると 3ms）。
   * 一度展開した頂点の面は全部同じ gid が入っているので、2 度目に見ても
   * 新しく見つかる面は無い（別の成分からその頂点に到達することもできない）。
   */
  _byConnectivity(mesh) {
    const T = mesh.tris, G = this.groups, nt = mesh.nt, nv = mesh.nv;
    const RC = mesh.ringCount, RD = mesh.ringData, REX = mesh.ringExt;
    const q = this._ensureQueue(nt);
    const seen = this._ensureVFlag(nv);
    seen.fill(0, 0, nv);
    G.fill(-1, 0, nt);
    let gid = 0;
    for (let seed = 0; seed < nt; seed++) {
      if (G[seed] !== -1) continue;
      const si = seed * 3;
      if (T[si] === T[si + 1] && T[si + 1] === T[si + 2]) continue;
      let head = 0, tail = 0;
      G[seed] = gid;
      q[tail++] = seed;
      while (head < tail) {
        const ti = q[head++] * 3;
        for (let e = 0; e < 3; e++) {
          const v = T[ti + e];
          if (seen[v] === 1) continue;
          seen[v] = 1;
          const rc = RC[v];
          if (rc === 0) continue;
          if (rc <= RING_STRIDE) {
            const base = v * RING_STRIDE;
            for (let j = 0; j < rc; j++) {
              const u = RD[base + j];
              if (G[u] === -1) { G[u] = gid; q[tail++] = u; }
            }
          } else {
            const ex = REX[v];
            for (let j = 0; j < rc; j++) {
              const u = ex[j];
              if (G[u] === -1) { G[u] = gid; q[tail++] = u; }
            }
          }
        }
      }
      gid++;
    }
    return gid;
  }

  /**
   * 隣接面の法線角がしきい値を超える辺で分ける（スムーズグループ相当）。
   * しきい値以下の辺だけを渡って BFS するので、結果は「なめらかに繋がった面の集合」。
   *
   * 面法線はその場で作る。前計算して配列に持つと 100 万面で 12MB 常駐する一方、
   * 外積は面あたり 4 回で済むため（自分 1 回 + 隣 3 回）割に合わない。
   * 面積 0 の面と裏返った面は角度が出ないので硬い辺として扱う（＝跨がない）。
   */
  _byNormalAngle(mesh, angleDeg) {
    const T = mesh.tris, P = mesh.positions, G = this.groups, nt = mesh.nt;
    const RC = mesh.ringCount, RD = mesh.ringData, REX = mesh.ringExt;
    const q = this._ensureQueue(nt);
    const n1 = this._n1, n2 = this._n2;
    // 角度が NaN（UI の数値入力が空のときの parseFloat など）だと cosT が NaN に
    // なり「どの辺も硬い」判定になって面数と同じ数のグループができる。
    // 130 万面でそれをやると groupSizes / グループ色の確保だけで数十 MB 使うので、
    // 静かに既定値へ落とす。文字列で来ても動くように単項 + で数値化してから見る。
    const deg = +angleDeg;
    const cosT = Math.cos(clamp(Number.isFinite(deg) ? deg : 30, 0, 180) * Math.PI / 180);
    G.fill(-1, 0, nt);
    let gid = 0;
    for (let seed = 0; seed < nt; seed++) {
      if (G[seed] !== -1) continue;
      const si = seed * 3;
      if (T[si] === T[si + 1] && T[si + 1] === T[si + 2]) continue;
      let head = 0, tail = 0;
      G[seed] = gid;
      q[tail++] = seed;
      while (head < tail) {
        const t = q[head++];
        const ti = t * 3;
        const a = T[ti], b = T[ti + 1], c = T[ti + 2];
        const l1 = faceNormal(P, T, t, n1);
        if (l1 <= 0) continue;
        const n1x = n1[0], n1y = n1[1], n1z = n1[2];
        for (let e = 0; e < 3; e++) {
          const ea = e === 0 ? a : (e === 1 ? b : c);
          const eb = e === 0 ? b : (e === 1 ? c : a);
          const u = edgeNeighbor(T, RC, RD, REX, t, ea, eb);
          if (u < 0 || G[u] !== -1) continue;
          const l2 = faceNormal(P, T, u, n2);
          if (l2 <= 0) continue;
          const d = (n1x * n2[0] + n1y * n2[1] + n1z * n2[2]) / (l1 * l2);
          if (d >= cosT) { G[u] = gid; q[tail++] = u; }
        }
      }
      gid++;
    }
    return gid;
  }

  /**
   * 2 分割（kind 0 = マスク / kind 1 = 可視）。
   * 片方が空のときは ID を詰めて 1 グループにする（空グループを残さない）。
   */
  _bySplit(mesh, kind, threshold) {
    const T = mesh.tris, G = this.groups, nt = mesh.nt;
    const MK = mesh.mask, V = this.vis;
    const inv3 = 1 / 3;
    let n0 = 0, n1 = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) { G[t] = -1; continue; }
      let second;
      if (kind === 0) second = (MK[a] + MK[b] + MK[c]) * inv3 >= threshold;
      else second = V[t] === 0;
      if (second) { G[t] = 1; n1++; } else { G[t] = 0; n0++; }
    }
    if (n1 === 0) return n0 > 0 ? 1 : 0;
    if (n0 === 0) {
      for (let t = 0; t < nt; t++) if (G[t] === 1) G[t] = 0;
      return 1;
    }
    return 2;
  }

  _all(mesh) {
    const T = mesh.tris, G = this.groups, nt = mesh.nt;
    let live = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      if (T[i] === T[i + 1] && T[i + 1] === T[i + 2]) { G[t] = -1; continue; }
      G[t] = 0; live++;
    }
    return live > 0 ? 1 : 0;
  }

  // --- 表示操作 -----------------------------------------------------------

  hideGroup(mesh, id) { return this._setGroupVis(mesh, id, 0); }
  showGroup(mesh, id) { return this._setGroupVis(mesh, id, 1); }

  _setGroupVis(mesh, id, on) {
    this.sync(mesh);
    if (id < 0) return this._stats(0);    // -1 は退化スロット用の番号。表示操作の対象外
    const T = mesh.tris, G = this.groups, V = this.vis, nt = mesh.nt;
    let changed = 0, vc = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      if (G[t] === id && V[t] !== on) { V[t] = on; changed++; }
      if (V[t] === 1) vc++;
    }
    this._visCount = vc;
    return this._stats(changed);
  }

  /** そのグループだけを表示する（Ctrl+Shift クリックのハイド操作そのもの） */
  showGroupOnly(mesh, id) {
    this.sync(mesh);
    const T = mesh.tris, G = this.groups, V = this.vis, nt = mesh.nt;
    let changed = 0, vc = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const on = G[t] === id ? 1 : 0;
      if (V[t] !== on) { V[t] = on; changed++; }
      vc += on;
    }
    this._visCount = vc;
    return this._stats(changed);
  }

  showAll(mesh) {
    this.sync(mesh);
    const T = mesh.tris, V = this.vis, nt = mesh.nt;
    let changed = 0, vc = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      if (V[t] !== 1) { V[t] = 1; changed++; }
      vc++;
    }
    this._visCount = vc;
    return this._stats(changed);
  }

  invertVisible(mesh) {
    this.sync(mesh);
    const T = mesh.tris, V = this.vis, nt = mesh.nt;
    let changed = 0, vc = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const on = V[t] === 1 ? 0 : 1;
      V[t] = on; changed++;
      vc += on;
    }
    this._visCount = vc;
    return this._stats(changed);
  }

  /** マスクされている面を隠す（mask >= threshold は「保護されている」側） */
  hideMasked(mesh, threshold = MASK_THRESHOLD) { return this._maskVis(mesh, threshold, false); }
  /** マスクされている面だけを表示する */
  showMaskedOnly(mesh, threshold = MASK_THRESHOLD) { return this._maskVis(mesh, threshold, true); }

  _maskVis(mesh, threshold, only) {
    this.sync(mesh);
    const T = mesh.tris, V = this.vis, MK = mesh.mask, nt = mesh.nt;
    const inv3 = 1 / 3;
    let changed = 0, vc = 0;
    for (let t = 0; t < nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const masked = (MK[a] + MK[b] + MK[c]) * inv3 >= threshold;
      // only=false は「マスクされた面を隠す」だけなので、今隠れている面は触らない。
      // only=true は表示状態を作り直す（マスクされた面だけが見える状態にする）。
      let on;
      if (only) on = masked ? 1 : 0;
      else on = masked ? 0 : V[t];
      if (V[t] !== on) { V[t] = on; changed++; }
      vc += on;
    }
    this._visCount = vc;
    return this._stats(changed);
  }

  /**
   * 表示領域を steps 段だけ広げる。頂点を共有している面が次の段になる。
   *
   * 段ごとに「可視面の頂点」へ印を付けてから隠れている面を見る 2 パス構成。
   * 面から面へ辿ると 1 段のうちに連鎖して一気に広がってしまうので、
   * 印を先に確定させることが必要。1 段が O(面数 + 頂点数)。
   */
  growVisible(mesh, steps = 1) { return this._dilate(mesh, steps, 1); }
  /** 表示領域を steps 段だけ狭める（境界の面から順に隠れる） */
  shrinkVisible(mesh, steps = 1) { return this._dilate(mesh, steps, 0); }

  _dilate(mesh, steps, on) {
    this.sync(mesh);
    const T = mesh.tris, V = this.vis, nt = mesh.nt, nv = mesh.nv;
    const flag = this._ensureVFlag(nv);
    const from = on === 1 ? 1 : 0;       // 印を付ける側（広げるなら可視、狭めるなら非可視）
    const n = Math.max(0, Math.round(steps || 0));
    let changed = 0;
    for (let it = 0; it < n; it++) {
      flag.fill(0, 0, nv);
      for (let t = 0; t < nt; t++) {
        if (V[t] !== from) continue;
        const i = t * 3;
        const a = T[i], b = T[i + 1], c = T[i + 2];
        if (a === b && b === c) continue;
        flag[a] = 1; flag[b] = 1; flag[c] = 1;
      }
      let step = 0;
      for (let t = 0; t < nt; t++) {
        if (V[t] === from) continue;
        const i = t * 3;
        const a = T[i], b = T[i + 1], c = T[i + 2];
        if (a === b && b === c) continue;
        if (flag[a] === 1 || flag[b] === 1 || flag[c] === 1) { V[t] = on; step++; }
      }
      if (step === 0) break;             // これ以上動かない
      changed += step;
    }
    if (changed > 0) this._visCount += on === 1 ? changed : -changed;
    return this._stats(changed);
  }

  // --- 描画への出口 -------------------------------------------------------

  /**
   * 可視な三角形だけを詰めたインデックス配列を作る。
   *
   * 返す indices は使い回しのバッファなので、長さではなく count（描くインデックス数）
   * を見ること。allVisible が true なら呼び出し側は通常のインデックスバッファに

    onChange: v => { state.usePressure = v; },

  slider(bs, {

    ['#d8d3c8', '#c8503c', '#e0a060', '#6f9f5a', '#4e7fa8', '#8a6fa8', '#2a2a2e', '#f2efe6']
      .forEach(hex => {
        const b = el('button', 'sw', sw);
        b.style.background = hex;
        b.onclick = () => { ci.value = hex; state.paintColor = srgbHexToLinear(hex); };

  // --- シンメトリ -------------------------------------------------------
  const sy = section(right, 'シンメトリ');
  const symRow = el('div', 'btnrow', sy);
  const symBtns = {};
  for (const ax of ['x', 'y', 'z']) {

      state.symmetry[ax] = !state.symmetry[ax];
      b.classList.toggle('on', state.symmetry[ax]);
    };
    symBtns[ax] = b;
  }

  // --- トポロジ ---------------------------------------------------------
  const tp = section(right, '動的トポロジ');

    label: 'ダイナミックトポロジ', value: state.dynTopo,
    title: 'ストローク中に自動で再分割する（G キー）',
    onChange: v => { state.dynTopo = v; },

    label: '間引き（デシメート）', value: state.decimate,
    title: '短くなった辺を統合してポリゴンを節約する',
    onChange: v => { state.decimate = v; },

    label: 'ディテール', min: 0, max: 1, step: 0.01, value: state.detail,

    label: '最大頂点数', min: 100000, max: 2000000, step: 50000, value: state.maxVerts,

    { label: '辺の長さを均一化', title: '現在の平均エッジ長で全体を均一化（トポロジは組み替えない）', onClick: () => app.remesh() },

  ]);

  // --- 分割レベル（SDiv） -----------------------------------------------

  const dm = section(right, 'ダイナメッシュ');

  slider(dm, {
    label: '仕上げスムーズ', min: 0, max: 4, step: 1, value: state.dynaSmooth,

    'メッシュ全体をボクセル化して均一なトポロジに作り直します。'

  {
    el('div', 'subhead', al).textContent = 'ブラシアルファ（断面形状）';

    const mkAlpha = (id, label, title) => {

      b.onclick = () => {
        state.alpha = id;

      };
      alphaBtns.set(id, b);
    };
    mkAlpha('', 'なし', 'アルファを使わない（通常の丸い当たり）');

      label: 'ストローク方向に合わせる', value: state.alphaAlign,

      label: s.jp, value: s.id, title: s.hint,

    // ストロークごとのパラメータ。選んだものだけ出す
    strokeParamBox = el('div', 'ctl-group', al);
    syncStrokeParams = () => {
      strokeParamBox.textContent = '';
      const meta = STROKES.find((s) => s.id === state.stroke);
      if (!meta || !meta.params || meta.params.length === 0) {
        strokeParamBox.style.display = 'none';
        return;
      }
      strokeParamBox.style.display = '';
      const o = state.strokeParams[state.stroke];
      const RANGE = {
        spacing: { min: 0.02, max: 0.6, step: 0.01, jp: 'ダブ間隔' },
        scatter: { min: 0, max: 2, step: 0.05, jp: '散らし' },
        sizeJitter: { min: 0, max: 1, step: 0.05, jp: 'サイズのゆらぎ' },
        colorJitter: { min: 0, max: 1, step: 0.05, jp: '色のゆらぎ' },
      };
      for (const key of meta.params) {
        const r = RANGE[key];
        if (!r) continue;
        slider(strokeParamBox, {
          label: r.jp, min: r.min, max: r.max, step: r.step, value: o[key],
          title: meta.hint,
          onInput: (v) => { o[key] = v; },
        });
      }
      toggle(strokeParamBox, {
        label: 'ダブごとに回す', value: !!o.spin,
        title: 'アルファの向きをダブごとにランダムに回す（同じストロークなら同じ結果）',
        onChange: (on) => { o.spin = on; },
      });
    };
    syncStrokeParams();

    el('p', 'note', al).textContent =
      'アルファはブラシの断面形状です。鱗・ひび・布目などをスタンプのように押せます。'
      + 'スプレーは同じストロークなら必ず同じ模様になるので、Undo してやり直しても結果が変わりません。';
  }

  // --- デフォーメーション -----------------------------------------------
  // ZBrush の Deformation パレット相当。スライダーは値を決めるだけで、

  // onInput で毎回掛けるとドラッグ中に何十回も適用されてしまう。
  const df = section(right, 'デフォーム', true);
  {
    const axisRow = el('div', null, df);
    el('div', 'subhead', axisRow).textContent = '軸';
    const axisSeg = axisPicker(axisRow, state.deform.axis, (v) => { state.deform.axis = v; });
    deformAxisSeg = axisSeg;
    for (const d of DEFORMS) {
      const box = el('div', 'ctl-group', df);
      const head = el('div', 'subhead', box);
      head.textContent = `${d.jp}　${d.name}`;
      head.title = d.hint;
      const o = state.deform.params[d.id];
      for (const q of (d.params || [])) {
        slider(box, {
          label: q.jp, min: q.min, max: q.max, step: q.step, value: o[q.key],
          title: d.hint,
          fmt: (v) => (q.step >= 1 ? String(Math.round(v)) : v.toFixed(2)),
          onInput: (v) => { o[q.key] = v; },
        });
      }
      btnRow(box, [{
        label: '適用', cls: d.axis ? '' : 'wide',
        title: d.hint + (d.axis ? '' : '（軸は使いません）'),
        onClick: () => app.tools.applyDeform(d.id),
      }]);
      if (!d.axis) box.dataset.noaxis = '1';
    }
    el('p', 'note', df).textContent =
      '選んだ軸に沿ってモデル全体を変形します。マスクした部分は保護されます。'
      + 'スライダーを 0 に戻しても形は戻りません（Undo で戻します）。'
      + '膨張・球化・ノイズ・スムーズは軸を使いません。';
  }

  // --- マスクツール -----------------------------------------------------
  const mkt = section(right, 'マスクツール', true);
  {
    el('div', 'subhead', mkt).textContent = '合成方法';
    segmented(mkt, [
      { label: '置換', value: 'replace', title: '既存のマスクを置き換える' },
      { label: '加算', value: 'add', title: '既存のマスクに足す' },
      { label: '減算', value: 'sub', title: '既存のマスクから引く' },
    ], state.mask.mode, (v) => { state.mask.mode = v; });

    for (const op of MASK_OPS) {
      const ps = (op.params || []).filter((q) => q.type === 'float' || q.type === 'int'
        || (q.min !== undefined && q.max !== undefined));
      if (ps.length === 0) continue;
      const box = el('div', 'ctl-group', mkt);
      const head = el('div', 'subhead', box);
      head.textContent = op.jp;
      head.title = op.hint;
      const o = state.mask.params[op.id];
      for (const q of ps) {
        slider(box, {
          label: q.jp, min: q.min, max: q.max, step: q.step || 1, value: o[q.key],
          title: op.hint,
          fmt: (v) => ((q.step || 1) >= 1 ? String(Math.round(v)) : v.toFixed(2)),
          onInput: (v) => { o[q.key] = v; },
        });
      }
      // 凹凸の選択があるものだけ（キャビティ）
      if ((op.params || []).some((q) => q.key === 'side')) {
        segmented(box, [
          { label: '溝', value: 'concave' }, { label: '稜線', value: 'convex' }, { label: '両方', value: 'both' },
        ], o.side, (v) => { o.side = v; });
      }
      btnRow(box, [{ label: '適用', cls: 'wide', title: op.hint, onClick: () => app.tools.applyMaskOp(op.id) }]);
    }
    // パラメータのない単純な操作はまとめてボタン列に
    const simple = MASK_OPS.filter((op) => (op.params || []).length === 0);
    if (simple.length) {
      el('div', 'subhead', mkt).textContent = '単純操作';
      btnRow(mkt, simple.map((op) => ({
        label: op.jp, title: op.hint, onClick: () => app.tools.applyMaskOp(op.id),
      })));
    }
    el('p', 'note', mkt).textContent =
      '色で選択は現在のペイント色を、法線で選択は現在の視線方向を基準にします。';
  }

  // --- スカルプトレイヤー -----------------------------------------------
  const ly = section(right, 'スカルプトレイヤー', true);
  {
    layerList = listBox(ly, {
      empty: '（レイヤーなし。「＋」で追加）',
      refresh: () => refreshLayers(),
      onSelect: (i) => app.tools.layerSelect(i),
      onToggle: (i, on) => app.tools.layerSetVisible(i, on),
      onRename: (i, name) => app.tools.layerRename(i, name),

    layerIcons = iconRow(ly, [
      { id: 'add', label: '＋', title: 'レイヤーを追加して記録を始める', onClick: () => app.tools.layerAdd() },
      { id: 'dup', label: '複製', title: '選択中のレイヤーを複製', onClick: () => withLayer((i) => app.tools.layerDuplicate(i)) },
      { id: 'bake', label: '焼込', title: '選択中のレイヤーをベース形状へ焼き込む', onClick: () => withLayer((i) => app.tools.layerBake(i)) },
      { id: 'del', label: '削除', title: '選択中のレイヤーを削除', onClick: () => withLayer((i) => app.tools.layerRemove(i)) },
    ]);
    layerInt = slider(ly, {
      label: '強度', min: -1, max: 1, step: 0.01, value: 1,
      title: '選択中のレイヤーの効き（マイナスで反転）',

    el('p', 'note', ly).textContent =
      '記録中のレイヤーに彫刻の差分が入り、強度を下げるとその彫刻だけ弱まります。'

  }

  const pg = section(right, 'ポリグループ', true);
  {
    el('div', 'subhead', pg).textContent = 'グループを作る';
    btnRow(pg, GROUP_METHODS.map((g) => ({
      label: g.jp, title: g.hint, onClick: () => app.tools.groupAssign(g.id),
    })));
    groupAngleSlider = slider(pg, {
      label: '法線角のしきい値', min: 5, max: 90, step: 1, value: state.groupAngle,

      onInput: (v) => { state.groupAngle = v; },

    groupViewToggle = toggle(pg, {

      title: 'ポリグループを色分けして表示（ポリペイントは一時的に隠れます）',
      onChange: (on) => app.tools.setGroupView(on),

    el('div', 'subhead', pg).textContent = '表示 / 非表示';
    groupList = listBox(pg, {

      onSelect: (i) => app.tools.groupVisibility('showGroupOnly', i),

      { label: '全表示', onClick: () => app.tools.groupVisibility('showAll') },
      { label: '反転', onClick: () => app.tools.groupVisibility('invertVisible') },

      { label: 'マスクだけ', title: 'マスクした部分だけ表示する', onClick: () => app.tools.groupVisibility('showMaskedOnly') },

      + 'トポロジが変わるとグループは作り直しになります。';

  // --- モーフターゲット --------------------------------------------------
  const mo = section(right, 'モーフターゲット', true);
  {
    btnRow(mo, [
      { label: '記憶', cls: 'primary', title: 'いまの形をモーフターゲットとして記憶する', onClick: () => app.tools.morphStore() },
      { label: '入れ替え', title: '記憶した形といまの形を入れ替える（ZBrush の Switch）', onClick: () => app.tools.morphSwitch() },
    ]);

    morphInfo = el('p', 'note', mo);

      + 'モーフブラシ（左のパレット）で塗った所だけ戻すこともできます。';

  const cl = section(right, 'クリップ / トリム', true);
  {

    clipModeSeg = segmented(cl, [
      { label: 'オフ', value: 'off', title: '通常の彫刻に戻る' },
      { label: 'クリップ', value: 'clip', title: '平面の裏側を平面上へ押しつける（トポロジは変わらない）' },

    el('div', 'subhead', cl).textContent = '軸平面で切る';
    for (const [ai, an] of [[0, 'X'], [1, 'Y'], [2, 'Z']]) {
      btnRow(cl, [
        { label: `${an}+ を残す`, title: `${an} が正の側を残す`, onClick: () => app.tools.applyAxisPlane(state.clipMode === 'off' ? 'trim' : state.clipMode, ai, 0, 1) },
        { label: `${an}- を残す`, title: `${an} が負の側を残す`, onClick: () => app.tools.applyAxisPlane(state.clipMode === 'off' ? 'trim' : state.clipMode, ai, 0, -1) },
      ]);
    }
    el('div', 'subhead', cl).textContent = 'ミラー & ウェルド';
