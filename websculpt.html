      const ti = (ex ? ex[j] : RD[base + j]) * 3;
      for (let e = 0; e < 3; e++) {
        const u = T[ti + e];
        if (u === cur) continue;
        const ui = u * 3;
        const d = (P[ui] - px) ** 2 + (P[ui + 1] - py) ** 2 + (P[ui + 2] - pz) ** 2;
        if (d < nd) { nd = d; next = u; }
      }
    }
    if (next < 0) return cur;
    cur = next; cd = nd; ci = cur * 3;
  }
  return cur;
}

// ---------------------------------------------------------------------------

class History {
  constructor(limit = 24, byteLimit = 320 * 1024 * 1024) {
    this.limit = limit;
    this.byteLimit = byteLimit;
    this.states = [];
    this.cur = -1;
  }
  reset(mesh) {
    this.states = [mesh.snapshot()];
    this.cur = 0;
  }
  commit(mesh) {
    if (this.cur < this.states.length - 1) this.states.length = this.cur + 1;
    // 直前の履歴を渡すと、接続が変わっていなければ tris などを共有してくれる
    this.states.push(mesh.snapshot(this.states[this.states.length - 1]));
    this.cur = this.states.length - 1;
    // 件数とメモリ量の両方で古い履歴を捨てる（最新 2 件は必ず残す）
    while (this.states.length > this.limit
      || (this.states.length > 2 && this.bytes() > this.byteLimit)) {
      this.states.shift();
      // 捨てた履歴が持っていた配列を後続が共有していることがある。共有されて
      // いる限り解放されないので、残った先頭を「持ち主」に付け替えないと
      // bytes() がそのぶんを数え落とす（実際には減っていないのに減ったと見える）。
      if (this.states.length) this.states[0].shared = [];
      this.cur--;
    }
  }
  canUndo() { return this.cur > 0; }
  canRedo() { return this.cur >= 0 && this.cur < this.states.length - 1; }
  undo(mesh) {
    if (!this.canUndo()) return false;
    this.cur--;
    mesh.restore(this.states[this.cur]);
    return true;
  }
  redo(mesh) {
    if (!this.canRedo()) return false;
    this.cur++;
    mesh.restore(this.states[this.cur]);
    return true;
  }
  /**
   * 履歴が実際に抱えているバイト数。
   * 前の履歴と共有している配列は数えない（1 本を複数の履歴が指しているだけなので、
   * 数えると実際の何倍にも見えて履歴が早く捨てられる）。
   */
  bytes() {
    let b = 0;
    for (const s of this.states) {
      const sh = s.shared || [];
      for (const k of ['positions', 'colors', 'mask', 'vAlive', 'tris']) {
        if (!sh.includes(k)) b += s[k].byteLength;
      }
    }
    return b;
  }

  /** 履歴の内訳（診断とテスト用） */
  info() {
    let sharedArrays = 0;
    for (const s of this.states) sharedArrays += (s.shared || []).length;
    return {
      states: this.states.length, cur: this.cur, sharedArrays,
      bytes: this.bytes(), limit: this.limit, byteLimit: this.byteLimit,
    };
  }
}

// ---------------------------------------------------------------------------

class MirrorState {
  constructor() {
    this.seed = -1;
    this.lastPoint = V3.create();
    this.center = V3.create();
    this.lockedVerts = null;   // move ブラシ用の固定領域
    this.lockedCount = 0;
    // verts / tris は Sculptor が持つ共有スクラッチ配列を指す。
    // 次に _gather を呼ぶまでしか有効でない（_dab はミラーごとに
    // 収集 → 適用 → 法線更新まで完結するので、これで足りる）。
    this.verts = null;
    this.tris = null;
    this.count = 0;
    this.triCount = 0;
  }
}

class Sculptor {
  constructor(mesh, state) {
    this.mesh = mesh;
    this.state = state;
    this.engine = new BrushEngine();
    this.history = new History();

    this.vStamp = new Int32Array(0);
    this.tStamp = new Int32Array(0);
    this.stamp = 0;
    this.queue = new Int32Array(0);
    // 領域は 1 ダブで数万頂点になる。ここを JS 配列 + push で持つと
    // 1 ダブあたり十数万回の push になり、それ自体が数 ms かかっていた。
    // すべて Int32Array + 件数カウンタに置き換えてある。
    this.gTris = new Int32Array(0);   // _gather が集めた三角形
    this.normalSet = new Int32Array(0);
    this.normalCount = 0;
    this.curvSet = new Int32Array(0);
    this.curvCount = 0;
    this.curvPending = new Int32Array(0);   // フレーム末にまとめて曲率を直す頂点
    this.curvPendCount = 0;
    this.cvStamp = new Int32Array(0);
    this.cvStampId = 1;
    this._movedVerts = [];      // dyntopo のコラプスで位置が動いた頂点（数十個なので配列のまま）
    this.nStamp = new Int32Array(0);
    this.levels = new SubdivLevels();

    this.mirrors = [];
    for (let i = 0; i < 8; i++) this.mirrors.push(new MirrorState());
    this.activeMirrors = buildMirrors({ x: false, y: false, z: false });

    this.hoverSeed = -1;
    this.stroking = false;
    this.strokeBrush = 'clay';
    this.strokeDir = 1;
    this.topoChanged = false;
    this.dabCount = 0;
    this._delta = V3.create();
    this._pt = V3.create();
    this._mp = V3.create();
    this._step = V3.create();
    this._avgDabMs = 0;         // 1 ダブの実測コスト（EMA）
    this._walk = V3.create();
    // 彫刻の差分を記録したい人（スカルプトレイヤー）を挿すための穴。
    // { before(mesh, verts, count), after(mesh, verts, count) } を持つオブジェクト。
    // sculptor が layers.js を直接 import すると依存が逆流するので、
    // 外から差してもらう形にしてある。
    this.recorder = null;
    this.morphHook = null;   // モーフブラシの実処理（tools が差す）

    // ブラシアルファ用のダブ接平面。ダブごとに作り直して brushes へ渡す。
    this._tanU = V3.create();
    this._tanV = V3.create();
    this._alphaRot = 0;
    this._dabSeq = 0;          // ストローク内のダブ番号（スプレーの乱数の種）
    this.strokeSeed = 0;
    this._spray = V3.create();
    this._sizeMul = 1;
    this._mirCenters = null;   // 全ミラーのダブ中心（担当分け用）
    this._mirCount = 1;
    this._mirIndex = 0;
    this._ownBuf = null;
    this._snapPos = null;      // ダブ開始時の座標（持ち分の判定用）
    this._snapStamp = null;
    this._snapId = 0;
    this._snapTouched = null;
    this._snapTouchedCount = 0;
    this._mirMat = null;       // ミラーの 3x3 行列 + 中心（不動点判定用）
    this._mirMatCount = 0;
    this._symEps = 1e-9;
    this._frameN0 = V3.create();   // ミラー 0 のブラシ向き
    this._frameC0 = V3.create();   // ミラー 0 の重心
    this._frameN = V3.create();
    this._frameC = V3.create();
    this._frameOK = false;
    this._useFrame = false;
    this._strokeId = DEFAULT_STROKE;
    this._strokeParams = strokeDefaults(DEFAULT_STROKE);

    this.history.reset(mesh);
  }

  /**
   * いまの state からミラー写像の一覧を作る。
   * ローカルシンメトリはモデルの中心を基準にするので bounds を見る
   * （毎ダブではなくストローク開始時に 1 回だけ呼ばれる）。
   */
  buildActiveMirrors() {
    const st = this.state;
    let center = null;
    if (st.localSymmetry) center = this.mesh.bounds().center;
    return buildMirrors(st.symmetry, st.radial, center);
  }

  setMesh(mesh) {
    this.mesh = mesh;
    this.history.reset(mesh);
    this.stroking = false;
    this.hoverSeed = -1;
    this._avgDabMs = 0;
    this.levels.clear();
    this.dropPendingCurvature();
  }

  /**
   * ブラシカーソル表示用にカーソル位置の表面法線を得る。
   * ホバー用シードを 1-ring 降下で追従させるので毎フレーム呼んでも安価。
   */
  surfaceNormalAt(point, out) {
    const m = this.mesh;
    if (m.liveVerts === 0) return false;
    let s = this.hoverSeed;
    if (s < 0 || s >= m.nv || !m.isVertAlive(s)) s = nearestVertexBrute(m, point);
    else {
      const d = descend(m, s, point);
      s = d < 0 ? nearestVertexBrute(m, point) : d;
      // 最急降下が局所解に落ちた場合だけ全走査でやり直す
      if (s >= 0) {
        const i = s * 3, P = m.positions;
        const dist = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
        const tol = Math.max(this.state.worldRadius * 2, this.targetEdgeLength(this.state.worldRadius) * 4);
        if (dist > tol) s = nearestVertexBrute(m, point);
      }
    }
    if (s < 0) return false;
    this.hoverSeed = s;
    const i = s * 3;
    out[0] = m.normals[i]; out[1] = m.normals[i + 1]; out[2] = m.normals[i + 2];
    return true;
  }

  // stamp は単調増加させる。新しく確保した配列はゼロ埋め、既存配列の値は
  // すべて現在の stamp より小さいので、カウンタをリセットしなければ衝突しない。
  _ensureStamps() {
    const m = this.mesh;
    if (this.vStamp.length < m.capV) {
      this.vStamp = new Int32Array(m.capV);
      this.nStamp = new Int32Array(m.capV);
      this.cvStamp = new Int32Array(m.capV);
      this.queue = new Int32Array(m.capV);
    }
    if (this.tStamp.length < m.capT) {
      this.tStamp = new Int32Array(m.capT);
    }
  }

  /** list を count 件入る大きさまで広げる（内容は保持する） */
  static _grow(list, count) {
    if (list.length >= count) return list;
    const a = new Int32Array(Math.max(1024, count, list.length * 2));
    a.set(list);
    return a;
  }

  /**
   * ブラシ球内の連結頂点と、それに接する三角形を収集。
   *
   * 頂点リストは BFS のキューそのもの（取り出した順 = 収集順）なので、
   * 別配列に積み直さずキューを ms.verts として使い回す。
   */
  _gather(ms, center, radius) {
    const m = this.mesh;
    this._ensureStamps();
    const id = ++this.stamp;
    const vS = this.vStamp, tS = this.tStamp, q = this.queue;
    const P = m.positions, T = m.tris;
    const RC = m.ringCount, RD = m.ringData, REX = m.ringExt;
    const qlen = q.length;
    let TR = this.gTris;
    ms.verts = q; ms.tris = TR;
    ms.count = 0; ms.triCount = 0;

    const cx = center[0], cy = center[1], cz = center[2];
    const r2 = radius * radius;
    let head = 0, tail = 0, nt = 0;

    const seed = ms.seed;
    if (seed < 0 || seed >= m.nv || !m.isVertAlive(seed)) return;
    vS[seed] = id;
    q[tail++] = seed;

    while (head < tail) {
      const v = q[head++];
      const rc = RC[v];
      if (rc === 0) continue;
      const inline = rc <= RING_STRIDE;
      const rbase = inline ? v * RING_STRIDE : 0;
      const rex = inline ? null : REX[v];
      if (nt + rc > TR.length) { TR = Sculptor._grow(TR, nt + rc); this.gTris = TR; ms.tris = TR; }
      for (let j = 0; j < rc; j++) {
        const t = inline ? RD[rbase + j] : rex[j];
        if (tS[t] !== id) { tS[t] = id; TR[nt++] = t; }
        const ti = t * 3;
        // 3 頂点は毎回全部見るのでループを展開する
        let u = T[ti];
        if (vS[u] !== id) {
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < qlen) q[tail++] = u;
        }
        u = T[ti + 1];
        if (vS[u] !== id) {
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < qlen) q[tail++] = u;
        }
        u = T[ti + 2];
        if (vS[u] !== id) {
          vS[u] = id;
          const ui = u * 3;
          const dx = P[ui] - cx, dy = P[ui + 1] - cy, dz = P[ui + 2] - cz;
          if (dx * dx + dy * dy + dz * dz <= r2 && tail < qlen) q[tail++] = u;
        }
      }
    }
    ms.count = tail;
    ms.triCount = nt;
  }

  /**
   * 移動した頂点とその近傍の法線と曲率を再計算する。
   * 曲率は 1-ring 平均に依存するので、法線より 1 段広い範囲を更新する。
   */
  /**
   * @param verts 動いた頂点
   * @param count 有効数
   * @param tris  verts に接する三角形（_gather が集めたものをそのまま渡す）。
   *              渡すと ring を辿り直さずに済むぶん大幅に速い。
   */
  _updateNormals(verts, count, tris = null, triCount = 0) {
    const m = this.mesh;
    this._ensureStamps();
    const T = m.tris;

    // 1 段目: 移動頂点 + その 1-ring（法線の更新範囲）
    const id1 = ++this.stamp;
    const nS = this.nStamp;
    // tris 経路の上限は count + triCount*3 で確定するので先に確保しておく
    // （以降は境界確認が要らない）。ring 経路は上限が読めないので途中で広げる。
    const bound = tris ? count + triCount * 3 : count + 64;
    let set = this.normalSet;
    if (set.length < bound) { set = new Int32Array(Math.max(1024, bound)); this.normalSet = set; }
    let ns = 0;
    if (tris) {
      // 「verts に接する三角形の全頂点」= verts + その 1-ring。
      // 三角形リストを 1 回舐めるだけで済み、ring の間接参照が消える。
      for (let k = 0; k < count; k++) {
        const v = verts[k];
        if (nS[v] !== id1) { nS[v] = id1; set[ns++] = v; }
      }
      for (let k = 0; k < triCount; k++) {
        const ti = tris[k] * 3;
        let u = T[ti];
        if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
        u = T[ti + 1];
        if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
        u = T[ti + 2];
        if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
      }
    } else {
      const RC = m.ringCount, RD = m.ringData, REX = m.ringExt;
      for (let k = 0; k < count; k++) {
        const v = verts[k];
        if (nS[v] !== id1) { nS[v] = id1; set[ns++] = v; }
        const rc = RC[v];
        if (rc === 0) continue;
        const inline = rc <= RING_STRIDE;
        const rb = inline ? v * RING_STRIDE : 0;
        const rex = inline ? null : REX[v];
        if (ns + rc * 3 > set.length) { set = Sculptor._grow(set, ns + rc * 3); this.normalSet = set; }
        for (let j = 0; j < rc; j++) {
          const ti = (inline ? RD[rb + j] : rex[j]) * 3;
          let u = T[ti];
          if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
          u = T[ti + 1];
          if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
          u = T[ti + 2];
          if (nS[u] !== id1) { nS[u] = id1; set[ns++] = u; }
        }
      }
    }
    this.normalCount = ns;
    // 面法線を 1 面 1 回だけ計算する版も試したが、そのための三角形集合を
    // 作るコストのほうが上回ったので頂点ごとの計算のままにしてある。
    m.computeNormalsFor(set, ns);

    // 曲率は見た目（キャビティ陰影）にしか使わず、彫刻の挙動には影響しない。
    // 1 フレームに何十ダブも打たれるので、ここでは「後で計算する頂点」を
    // 積むだけにして、実際の計算はフレーム末に 1 回だけ行う。
    const cs = this.cvStamp, cid = this.cvStampId;
    let pend = this.curvPending, pn = this.curvPendCount;
    if (pn + ns > pend.length) { pend = Sculptor._grow(pend, pn + ns); this.curvPending = pend; }
    for (let k = 0; k < ns; k++) {
      const v = set[k];
      if (cs[v] !== cid) { cs[v] = cid; pend[pn++] = v; }
    }
    this.curvPendCount = pn;
  }

  /**
   * 溜まっていた曲率の再計算をまとめて行う。毎フレーム 1 回、描画前に呼ぶ。
   * @returns {number} 更新した頂点数
   */
  flushCurvature() {
    const pend = this.curvPending;
    const pn = this.curvPendCount;
    if (pn === 0) return 0;
    const m = this.mesh;
    this._ensureStamps();

    // pend には既に「動いた頂点 + その 1-ring」が入っている（_updateNormals が
    // 法線更新の対象として積んだもの）。ここでさらに 1-ring 広げると集合が 3 倍に
    // 膨らみ、高密度では 1 フレーム 30ms 近くかかる。曲率は陰影にしか効かず、
    // 境界のわずかな誤差は次のダブで上書きされるので広げない。
    const id = ++this.stamp;
    const nS = this.nStamp;
    let cset = this.curvSet;
    if (cset.length < pn) { cset = new Int32Array(Math.max(1024, pn)); this.curvSet = cset; }
    let cn = 0;
    for (let k = 0; k < pn; k++) {
      const v = pend[k];
      if (v >= m.nv || !m.isVertAlive(v)) continue;
      if (nS[v] !== id) { nS[v] = id; cset[cn++] = v; }
    }
    this.curvPendCount = 0;
    this.curvCount = cn;
    this.cvStampId++;
    if (cn === 0) return 0;
    m.computeCurvatureFor(cset, cn);
    m.smoothCurvatureFor(cset, cn);
    for (let k = 0; k < cn; k++) m.markVert(cset[k]);
    return cn;
  }

  /** メッシュを差し替えたときなど、溜まっている曲率更新を捨てる */
  dropPendingCurvature() {
    this.curvPendCount = 0;
    this.cvStampId++;
  }

  /**
   * 目標エッジ長（world）。ブラシ半径に比例させることで、
   * 「ブラシの見た目の大きさに対して一定のポリゴン密度」になる（Sculptris Pro 方式）。
   * detail 0 → ブラシ直径あたり約 9 分割、detail 1 → 約 44 分割。
   */
  /**
   * point に近い頂点を返す。まず候補（前回のシード）から 1-ring 降下し、
   * 遠すぎるときだけ全走査に落とす。260 万頂点だと全走査は 1 回 45ms かかるので、
   * ストローク開始のたびに走らせると無視できないヒッチになる。
   */
  _seedNear(point, hint) {
    const m = this.mesh;
    if (m.liveVerts === 0) return -1;
    if (hint >= 0 && hint < m.nv && m.isVertAlive(hint)) {
      const s = descend(m, hint, point);
      if (s >= 0) {
        const i = s * 3, P = m.positions;
        const d = Math.hypot(P[i] - point[0], P[i + 1] - point[1], P[i + 2] - point[2]);
        const tol = Math.max(this.state.worldRadius, this.targetEdgeLength(this.state.worldRadius) * 4);
        if (d <= tol) return s;
      }
    }
    return nearestVertexBrute(m, point);
  }

  targetEdgeLength(radius) {
    const d = clamp(this.state.detail, 0, 1);
    return radius * (0.22 - 0.175 * d);
  }

  // --- ストローク --------------------------------------------------------

  beginStroke(brush, point, dir) {
    const m = this.mesh;
    this.stroking = true;
    this.strokeBrush = brush;
    this.strokeDir = dir;
    this.topoChanged = false;
    this.dabCount = 0;
    this._dabSeq = 0;
    // ストロークごとの乱数の種。決定論にしたいので時計は使わず、
    // ストローク番号と開始位置から作る（同じ操作なら同じ模様になる）。
    this.strokeSeed = (this.engine.strokeId * 2654435761
      + Math.round(point[0] * 8191) * 40503
      + Math.round(point[1] * 8191) * 7919
      + Math.round(point[2] * 8191) * 104729) | 0;
    const sid = this.state.stroke || DEFAULT_STROKE;
    this._strokeId = STROKE_BY_ID.has(sid) ? sid : DEFAULT_STROKE;
    this._strokeParams = Object.assign(strokeDefaults(this._strokeId),
      (this.state.strokeParams && this.state.strokeParams[this._strokeId]) || {});
    this.engine.beginStroke();
    this.activeMirrors = this.buildActiveMirrors();
    this._buildMirrorMatrices();
    // ラジアルシンメトリでミラー数が増えるので、足りなければ足す
    while (this.mirrors.length < this.activeMirrors.length) this.mirrors.push(new MirrorState());

    for (let i = 0; i < this.activeMirrors.length; i++) {
      const ms = this.mirrors[i];
      mirrorPoint(this.activeMirrors[i], point, this._mp);
      // 全頂点走査は 260 万頂点で 1 ミラーあたり 45ms かかる。
      // ホバー中に追従させているシードから降下すれば通常はそれで足りる。
      ms.seed = this._seedNear(this._mp, i === 0 ? this.hoverSeed : this.mirrors[i].seed);
      V3.copy(ms.lastPoint, this._mp);
      V3.copy(ms.center, this._mp);
      ms.lockedVerts = null;
      ms.lockedCount = 0;
    }
    V3.set(this._delta, 0, 0, 0);
    this._dabAll(point, this._delta, true);
  }

  /**
   * ストローク中のサンプル追加。前回位置から spacing 間隔でダブを打つので
   * フレームレートに依存しない。
   */
  addSample(point) {
    if (!this.stroking) return;
    const brush = this.strokeBrush;
    const radius = this.state.worldRadius;
    const ms0 = this.mirrors[0];

    if (brush === 'move') {
      // グラブ：領域を固定し、カーソル差分だけ動かす
      V3.sub(this._delta, point, ms0.lastPoint);
      if (V3.lenSq(this._delta) < 1e-14) return;
      this._dabAll(point, this._delta, false);
      return;
    }

    // ダブ間隔。0.16R だと通常のドラッグ速度で 3 フレームに 1 回しか置かれず、
    // ストロークが「点を並べた」ように見える。細かくして、そのぶん 1 ダブの
    // 強さを間隔に比例させると、総量を変えずに連続的な当たりになる。
    const spacingFrac = (this.state.dabSpacing > 0 ? this.state.dabSpacing : 0.16);
    const budgetMs = this.state.strokeBudgetMs > 0 ? this.state.strokeBudgetMs : 12;
    // 1 ダブの実測コストが予算を超える密度では、間隔そのものを広げる。
    // そうしないと「毎フレーム 1 ダブ = 毎フレーム数十 ms」で固まってしまう。
    // 軽い状況では係数 1 のままなので、設定した細かい間隔がそのまま効く。
    const load = this._avgDabMs > 0.05 ? Math.max(1, this._avgDabMs / budgetMs) : 1;
    const spacing = Math.max(radius * spacingFrac * load, 1e-6);
    V3.sub(this._delta, point, ms0.lastPoint);
    let dist = V3.len(this._delta);
    if (dist < spacing) {
      if (usesDelta(brush)) return;
      // 動いていなくても圧を掛け続けたいブラシ（塗り系）は薄く継続
      if (brush === 'paint' || brush === 'mask' || brush === 'smooth') {
        V3.set(this._delta, 0, 0, 0);
        this._dabAll(point, this._delta, false, 0.35 * spacingFrac / 0.16);
      }
      return;
    }

    // カーソルが大きく飛んだフレームで何十ダブも打つとフレームが数百 ms 固まる。
    // 上限本数に加えて時間予算でも打ち切り、1 フレームの作業量を有界にする。
    // 打ち切った場合も lastPoint は進めた所までなので、次フレームで続きから再開する。
    let steps = Math.min(64, Math.max(1, Math.floor(dist / spacing)));

    // 1 ダブの実測コストから、このフレームで打てる本数を見積もって上限にする。
    // 高密度では 1 ダブ数十 ms かかるので、間隔だけ細かくすると毎フレーム
    // 数百 ms 固まってしまう。逆に軽い状況では細かい間隔がそのまま通る。
    if (this._avgDabMs > 0.05) {
      const affordable = Math.max(1, Math.floor(budgetMs / this._avgDabMs));
      if (steps > affordable) steps = affordable;
    }

    // 1 ダブの強さは「実際に進んだ距離」に比例させる。こうすると間隔を変えても
    // 本数が制限されても、ストローク全体で置かれる量がほぼ一定になる。
    const dabScale = clamp((dist / steps) / (radius * 0.16), 0.05, 4);

    const step = this._step, p = this._walk;
    V3.scale(step, this._delta, 1 / steps);
    V3.copy(p, ms0.lastPoint);
    const budget = budgetMs;
    const tStart = performance.now();
    let done = 0;
    for (let s = 0; s < steps; s++) {
      V3.add(p, p, step);
      this._dabAll(p, step, false, dabScale);
      done++;
      // 1 ダブが数十 ms かかることがあるので、間引かず毎回見る
      if (performance.now() - tStart > budget) break;
    }
    // 実測コストを指数移動平均で覚えておく（次フレームの本数見積もりに使う）
    if (done > 0) {
      const per = (performance.now() - tStart) / done;
      this._avgDabMs = this._avgDabMs > 0 ? this._avgDabMs * 0.7 + per * 0.3 : per;
    }
  }

  endStroke() {
    if (!this.stroking) return;
    this.stroking = false;
    const m = this.mesh;
    if (this.dabCount > 0) {
      // compact は頂点番号を詰め替えるので、その前に曲率を確定させる
      this.flushCurvature();
      if (m.compact()) {
        this.topoChanged = true;
        this.dropPendingCurvature();
      }
      this.history.commit(m);
    }
  }

  _dabAll(point, delta, first, scale = 1) {
    const mirrors = this.activeMirrors;
    // スプレー系のストロークは、ダブごとに位置を接平面上でばらつかせ、
    // 半径にもゆらぎを入れる。ミラーより手前で 1 回だけ計算して、
    // ミラー先にも同じ散らしが写るようにする（左右対称を保つため）。
    const sp = this._strokeParams;
    let sPoint = point, sScale = scale;
    this._sizeMul = 1;
    if (sp && (sp.scatter > 0 || sp.sizeJitter > 0)) {
      this._updateDabFrame(this.mirrors[0], delta);
      const r = this.state.worldRadius;
      const seq = this._dabSeq;
      if (sp.scatter > 0) {
        const a = hash01(seq * 4 + 1, this.strokeSeed) * Math.PI * 2;
        const rr = Math.sqrt(hash01(seq * 4 + 2, this.strokeSeed)) * sp.scatter * r;
        const U = this._tanU, V = this._tanV;
        const ox = Math.cos(a) * rr, oy = Math.sin(a) * rr;
        V3.set(this._spray,
          point[0] + U[0] * ox + V[0] * oy,
          point[1] + U[1] * ox + V[1] * oy,
          point[2] + U[2] * ox + V[2] * oy);
        sPoint = this._spray;
      }
      if (sp.sizeJitter > 0) {
        // 0.35〜1.0 の範囲で縮める。大きくする方向へ振ると領域が広がって重くなる
        this._sizeMul = 1 - hash01(seq * 4 + 3, this.strokeSeed) * sp.sizeJitter * 0.65;
      }
    }
    // 担当分けのために、全ミラーのダブ中心を先に集めておく
    const nm = mirrors.length;
    if (!this._mirCenters || this._mirCenters.length < nm * 3) this._mirCenters = new Float32Array(nm * 3);
    const MC = this._mirCenters;
    this._mirCount = nm;
    for (let i = 0; i < nm; i++) {
      mirrorPoint(mirrors[i], sPoint, this._mp);
      MC[i * 3] = this._mp[0]; MC[i * 3 + 1] = this._mp[1]; MC[i * 3 + 2] = this._mp[2];
    }
    // ブラシの向き（平均法線）と重心は 1 枚目のミラーが求めたものを鏡像にして使う。
    // 2 枚目以降が自分で計算すると、1 枚目が既に動かした頂点まで平均に入って
    // 左右で値が変わり、頂点単位のずれがストロークごとに溜まっていた
    // （実測: 6 ストロークで 1.5e-3 → 7.1e-3）。
    this._frameOK = false;
    if (nm > 1) { this._snapId = (this._snapId || 0) + 1; this._snapTouchedCount = 0; }
    for (let i = 0; i < nm; i++) {
      const ms = this.mirrors[i];
      V3.set(this._mp, MC[i * 3], MC[i * 3 + 1], MC[i * 3 + 2]);
      mirrorVector(mirrors[i], delta, this._pt);
      this._mirIndex = i;
      if (nm > 1 && i > 0 && this._frameOK) {
        mirrorVector(mirrors[i], this._frameN0, this._frameN);
        mirrorPoint(mirrors[i], this._frameC0, this._frameC);
        this._useFrame = true;
      } else {
        this._useFrame = false;
      }
      this._dab(ms, this._mp, this._pt, first, sScale);
      // 1 枚目が実際にブラシを掛けたときのフレームを控える
      if (nm > 1 && i === 0) {
        const an = this.engine.avgN;
        if (an[0] || an[1] || an[2]) {
          V3.copy(this._frameN0, an);
          V3.copy(this._frameC0, this.engine.centroid);
          this._frameOK = true;
        }
      }
      V3.copy(ms.lastPoint, this._mp);
    }
    // 全ミラーを掛けたあとに、平面／軸の上の頂点を制約へ戻す
    this._enforceSymmetry();
    this.dabCount++;
    this._dabSeq++;
  }

  /**
   * ミラー領域が重なる部分の担当を決める。
   *
   * シンメトリ平面の近くを彫ると、その頂点は複数のミラーの領域に入る。
   * 素直に順番へ適用すると
   *   * 減衰が 2 回掛かって中心線付近だけ倍の深さになる
   *     （実測: 平面上に 1 ダブで変位 5.46e-2 → 1.08e-1 とちょうど 2 倍）
   *   * 1 つめのミラーが動かした結果を 2 つめが読むので、左右で結果が違う
   * という 2 つの問題が出る。
   *
   * そこで「その頂点にいちばん近いダブ中心を持つミラーが書き込む」ことにする。
   * 鏡像なら半空間の分割、ラジアルなら軸まわりの扇形の分割になり、
   * ミラー群の作用で担当セルが入れ替わるだけなので**構成として対称**になる。
   * 担当が重ならないので適用順にも依存しない。
   *
   * ただし「どれか 1 枚だけ」にすると、シンメトリ平面の**上**にある頂点が
   * 平面から押し出されてしまう。平面上の頂点は自分自身が鏡像なので、
   * 以前は 2 枚のミラーの X 成分が打ち消し合って平面上に留まっていたのが、
   * 1 枚だけにしたことで打ち消されなくなる（実測: 8 頂点が 3.6e-2 ずれた）。
   * そこで同距離のミラーには 1/枚数 ずつ持ち分を配る。こうすると
   *   * 合計の大きさは 1 ダブぶん（二重にならない）
   *   * 平面に垂直な成分は打ち消し合う（平面上に留まる）
   * の両方が成り立つ。ZBrush で継ぎ目が割れないのと同じ挙動になる。
   *
   * 平均法線と重心は担当外の頂点も入れて計算する（brushes 側で重みへ掛けるのは
   * その計算のあと）。半分だけで平均すると法線が平面側へ傾き、継ぎ目が折れる。
   *
   * @returns {Float32Array|null} 領域頂点ごとの持ち分 0..1。ミラーが 1 枚なら null
   */
  /**
   * ダブ開始時の座標を控える（持ち分の判定に使う）。
   * ミラーごとに、その領域のうちまだ控えていない頂点だけを記録する。
   * 全頂点ぶんの配列は capV × 3 で 260 万頂点なら 31MB になるので、
   * シンメトリが 2 枚以上のときだけ確保する。
   */
  _snapshotRegion(verts, count) {
    const m = this.mesh;
    if (!this._snapPos || this._snapPos.length < m.capV * 3) {
      this._snapPos = new Float32Array(m.capV * 3);
      this._snapStamp = new Int32Array(m.capV);
      this._snapId = 1;
    }
    if (!this._snapTouched || this._snapTouched.length < m.capV) {
      this._snapTouched = new Int32Array(m.capV);
    }
    const SP = this._snapPos, SS = this._snapStamp, sid = this._snapId, P = m.positions;
    const TL = this._snapTouched;
    let tn = this._snapTouchedCount;
    for (let k = 0; k < count; k++) {
      const v = verts[k];
      if (SS[v] === sid) continue;
      SS[v] = sid;
      const i = v * 3;
      SP[i] = P[i]; SP[i + 1] = P[i + 1]; SP[i + 2] = P[i + 2];
      if (tn < TL.length) TL[tn++] = v;
    }
    this._snapTouchedCount = tn;
  }

  /**
   * ミラーの線形部分を 3x3 行列にして控える（ストローク開始時に 1 回）。
   * 不動点判定はホットループなので、mirrorPoint の呼び出しではなく
   * ここで作った行列でインライン展開する。
   * 並びは 1 ミラーあたり 12 要素: m00..m22（行優先）, cx, cy, cz。
   */
  _buildMirrorMatrices() {
    const mirrors = this.activeMirrors;
    const nm = mirrors.length;
    if (!this._mirMat || this._mirMat.length < nm * 12) this._mirMat = new Float64Array(nm * 12);
    const M = this._mirMat;
    for (let j = 0; j < nm; j++) {
      const mir = mirrors[j];
      const s = mir.s, ang = mir.ang, ax = mir.axis;
      const cs = Math.cos(ang), sn = Math.sin(ang);
      // R(ax, ang) の 3x3
      let r00 = 1, r01 = 0, r02 = 0, r10 = 0, r11 = 1, r12 = 0, r20 = 0, r21 = 0, r22 = 1;
      if (ang !== 0) {
        if (ax === 0) { r11 = cs; r12 = -sn; r21 = sn; r22 = cs; }
        else if (ax === 1) { r00 = cs; r02 = sn; r20 = -sn; r22 = cs; }
        else { r00 = cs; r01 = -sn; r10 = sn; r11 = cs; }
      }
      // M = R * diag(s)
      const o = j * 12;
      M[o] = r00 * s[0]; M[o + 1] = r01 * s[1]; M[o + 2] = r02 * s[2];
      M[o + 3] = r10 * s[0]; M[o + 4] = r11 * s[1]; M[o + 5] = r12 * s[2];
      M[o + 6] = r20 * s[0]; M[o + 7] = r21 * s[1]; M[o + 8] = r22 * s[2];
      M[o + 9] = mir.c[0]; M[o + 10] = mir.c[1]; M[o + 11] = mir.c[2];
    }
    this._mirMatCount = nm;
    // 不動点判定のしきい値。回転行列の sin(π) が 1.2e-16 なので厳密比較では
    // 180 度回転を含む群を取りこぼす。bounds() はここで 1 回だけ見る
    // （毎ダブ呼ぶと 260 万頂点で全体の 3 割を食っていた）。
    this._symEps = 1e-9 * Math.max(1, this.mesh.bounds().radius);
  }

  /**
   * ミラー群の不動点にある頂点を、その制約の上に留める。
   *
   * シンメトリ平面の上にある頂点は自分自身が鏡像なので、対称性から
   * 「平面に垂直な向きには動けない」。これは近似ではなく制約なので、
   * 明示的に課すのが正しい。
   *
   * 課さないと何が起きるか（実測）: 持ち分を 0.5 ずつ配っても、ミラー 1 の
   * 減衰重みはミラー 0 が動かした後の座標で計算されるため X が完全には
   * 打ち消されない（+1.32e-3 と -1.10e-3 で残差 2.18e-4）。すると次のダブでは
   * もう「同距離」と判定されず持ち分が 1.0 と 0.0 に割れて片側だけが動き、
   * 1 ストロークで 7.8e-3、6 ストロークで 9.1e-2 まで暴走していた。
   *
   * どの面／軸が不動点になるかを state のフラグから決めてはいけない。
   * 例えば「X ミラー + Y 軸まわり 4 分割」の群には Z 平面の鏡映も含まれる
   * （180 度回転 × X 反転 = Z 反転）。実測でその 8 頂点だけが 6.4e-2 ずれていた。
   * そこでミラー集合そのものを見て、
   *   「スナップショット位置を自分自身へ写すミラー」＝ その頂点の安定化部分群
   * を求め、その群にわたって現在位置を平均する。有限群の平均は不変部分空間への
   * 射影になるので、面・軸・それらの交わりを区別せず一様に正しく扱える。
   *
   * 対象はダブ開始時のスナップショットに入っている頂点だけ（このダブで
   * 触った可能性がある頂点）。全頂点を毎ダブ走査すると 260 万頂点で重すぎる。
   */
  _enforceSymmetry() {
    const nm = this._mirCount;
    if (nm <= 1) return;
    const SS = this._snapStamp, SP = this._snapPos, sid = this._snapId;
    if (!SS) return;
    const M = this._mirMat;
    if (!M || this._mirMatCount < nm) return;
    const P = this.mesh.positions;
    const verts = this._snapTouched;
    const n = this._snapTouchedCount;
    const eps = this._symEps;
    const eps2 = eps * eps;

    for (let k = 0; k < n; k++) {
      const v = verts[k];
      if (SS[v] !== sid) continue;
      const i = v * 3;
      const sx = SP[i], sy = SP[i + 1], sz = SP[i + 2];
      const cx = P[i], cy = P[i + 1], cz = P[i + 2];
      let cnt = 0;
      let ax = cx, ay = cy, az = cz;
      for (let j = 1; j < nm; j++) {
        const o = j * 12;
        const ox = M[o + 9], oy = M[o + 10], oz = M[o + 11];
        // スナップショット位置の像
        const dx = sx - ox, dy = sy - oy, dz = sz - oz;
        const bx = M[o] * dx + M[o + 1] * dy + M[o + 2] * dz + ox;
        const by = M[o + 3] * dx + M[o + 4] * dy + M[o + 5] * dz + oy;
        const bz = M[o + 6] * dx + M[o + 7] * dy + M[o + 8] * dz + oz;
        const ex = bx - sx, ey = by - sy, ez = bz - sz;
        if (ex * ex + ey * ey + ez * ez > eps2) continue;   // この頂点を動かすミラー
        // 不動にするミラー: 現在位置の像を足し込む
        const gx = cx - ox, gy = cy - oy, gz = cz - oz;
        ax += M[o] * gx + M[o + 1] * gy + M[o + 2] * gz + ox;
        ay += M[o + 3] * gx + M[o + 4] * gy + M[o + 5] * gz + oy;
        az += M[o + 6] * gx + M[o + 7] * gy + M[o + 8] * gz + oz;
        cnt++;
      }
      if (cnt === 0) continue;
      const inv = 1 / (cnt + 1);
      P[i] = ax * inv; P[i + 1] = ay * inv; P[i + 2] = az * inv;
    }
  }
  _ownership(verts, count, myIndex, radius) {
    const centers = this._mirCenters;
    const nm = this._mirCount;
    if (nm <= 1 || !centers) return null;
    let own = this._ownBuf;
    if (!own || own.length < count) own = this._ownBuf = new Float32Array(Math.max(1024, count * 2));
    const P = this.mesh.positions;
    // 距離の比較は「このダブを始めた時点」の座標で行う。現在の座標で比べると、
    // ミラー 0 が既に動かしたぶんだけ頂点が自分の側へ寄って見え、
    // ミラー 1 が「相手のほうが近い」と判断して持ち分 0 になる。
    // 実測ではそれで平面上の頂点の X が打ち消されず 7.8e-3 ずれていた。
    const SP = this._snapPos, SS = this._snapStamp, sid = this._snapId;
    const mx = centers[myIndex * 3], my = centers[myIndex * 3 + 1], mz = centers[myIndex * 3 + 2];
    // 「同距離」の判定はブラシ半径に対する相対許容差で行う。厳密等号だと、
    // 平面上の頂点の x が厳密な 0 ではない（1e-12 程度は乗っている）ために
    // 同距離を取りこぼし、平面から押し出されてしまう。
    // 距離差 |dA-dB| < eps*R を二乗距離の差に直すと |d-mine| < 2*eps*R^2。
    const tol = 2e-5 * radius * radius;
    for (let k = 0; k < count; k++) {
      const v = verts[k], i = v * 3;
      const snap = SS && SS[v] === sid;
      const px = snap ? SP[i] : P[i];
      const py = snap ? SP[i + 1] : P[i + 1];
      const pz = snap ? SP[i + 2] : P[i + 2];
      const mine = (px - mx) ** 2 + (py - my) ** 2 + (pz - mz) ** 2;
      // 自分より明確に近いミラーが 1 枚でもあれば担当外。
      // 同距離のミラーには 1/枚数 ずつ配る。
      let closer = 0, tied = 1;
      for (let j = 0; j < nm; j++) {
        if (j === myIndex) continue;
        const d = (px - centers[j * 3]) ** 2 + (py - centers[j * 3 + 1]) ** 2 + (pz - centers[j * 3 + 2]) ** 2;
        if (d < mine - tol) { closer++; break; }
        if (d <= mine + tol) tied++;
      }
      own[k] = closer > 0 ? 0 : 1 / tied;
    }
    return own;
  }

  /**
   * ダブの接平面の基底を作る。ブラシアルファはこの (U, V) 上でサンプルされる。
   *
   * 法線はシード頂点のものを使う（ブラシの平均法線は apply の中で初めて求まるので、
   * 掛ける前には使えない）。U はストローク方向に合わせる（ZBrush の Align to Stroke）か、
   * 合わせない設定なら法線から決まる安定した軸にする。
   */
  _updateDabFrame(ms, delta) {
    const st = this.state;
    const m = this.mesh;
    const U = this._tanU, V = this._tanV;
    const seed = ms.seed;
    let nx = 0, ny = 1, nz = 0;
    if (seed >= 0 && seed < m.nv) {
      const i = seed * 3;
      nx = m.normals[i]; ny = m.normals[i + 1]; nz = m.normals[i + 2];
      const l = Math.hypot(nx, ny, nz);
      if (l > 1e-12) { nx /= l; ny /= l; nz /= l; } else { nx = 0; ny = 1; nz = 0; }

  @builtin(position) pos : vec4<f32>,
  @location(0) wxz : vec2<f32>,
};

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VSOut {
  var q = array<vec2<f32>, 6>(
    vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0, -1.0), vec2<f32>( 1.0,  1.0),
    vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0,  1.0), vec2<f32>(-1.0,  1.0),
  );

  let p = q[vi] * s;

  o.pos = u.viewProj * vec4<f32>(p.x, u.grid.w, p.y, 1.0);
  o.wxz = p;
  return o;

fn gridLine(coord : vec2<f32>, width : f32) -> f32 {
  let d = abs(fract(coord - vec2<f32>(0.5, 0.5)) - vec2<f32>(0.5, 0.5));
  let w = fwidth(coord) * width;
  let g = d / max(w, vec2<f32>(1e-6, 1e-6));
  return 1.0 - clamp(min(g.x, g.y), 0.0, 1.0);

struct GridOut {
  @location(0) color  : vec4<f32>,
  @location(1) normal : vec4<f32>,
};

  let coarse = gridLine(i.wxz / (sp * 10.0), thick);

  if (abs(i.wxz.x) < axisW.x) { col = vec3<f32>(0.32, 0.46, 0.88); a = max(a, 0.80); }

const SSAO_WGSL = COMMON + /* wgsl */`
// サンプル数は uniform（bprA.z）で決める。実時間表示は 24、仕上げは 64。
// 配列は最大数ぶん確保しておき、ループ回数だけを変える。
struct Kernel { s : array<vec4<f32>, 64> };

@group(0) @binding(0) var<uniform> u : Uniforms;
@group(0) @binding(1) var depthTex  : texture_depth_2d;
@group(0) @binding(2) var normalTex : texture_2d<f32>;
@group(0) @binding(3) var aoOut     : texture_storage_2d<rgba8unorm, write>;
@group(0) @binding(4) var<uniform> k : Kernel;

fn hash21(p : vec2<f32>) -> f32 {
  var p3 = fract(p.xyx * vec3<f32>(0.1031, 0.1030, 0.0973));
  p3 = p3 + vec3<f32>(dot(p3, p3.yzx + vec3<f32>(33.33, 33.33, 33.33)));
  return fract((p3.x + p3.y) * p3.z);
}

fn viewPos(coord : vec2<i32>, d : f32) -> vec3<f32> {
  let uv = (vec2<f32>(f32(coord.x), f32(coord.y)) + vec2<f32>(0.5, 0.5)) * u.rt.zw;
  let ndc = vec3<f32>(uv.x * 2.0 - 1.0, (1.0 - uv.y) * 2.0 - 1.0, d);
  let p = u.invProj * vec4<f32>(ndc, 1.0);
  return p.xyz / p.w;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
  let dim = vec2<i32>(textureDimensions(depthTex));
  let c = vec2<i32>(i32(gid.x), i32(gid.y));
  if (c.x >= dim.x || c.y >= dim.y) { return; }

  let d = textureLoad(depthTex, c, 0);
  if (d >= 0.99999) {
    textureStore(aoOut, c, vec4<f32>(1.0, 1.0, 1.0, 1.0));
    return;
  }

  let vp = viewPos(c, d);
  let n = normalize(textureLoad(normalTex, c, 0).xyz);

  let a = hash21(vec2<f32>(f32(c.x), f32(c.y))) * 6.2831853;
  let rv = vec3<f32>(cos(a), sin(a), 0.0);
  var t = rv - n * dot(rv, n);
  let tl = length(t);
  if (tl < 1e-4) {
    t = normalize(select(vec3<f32>(1.0, 0.0, 0.0), vec3<f32>(0.0, 1.0, 0.0), abs(n.x) > 0.9));
  } else {
    t = t / tl;
  }
  let b = cross(n, t);

  let radius = u.aoP.x;
  let bias = u.aoP.z;
  var occ = 0.0;
  let N = clamp(i32(u.bprA.z), 1, 64);
  for (var i = 0; i < N; i = i + 1) {
    let ks = k.s[i].xyz;
    let sp = vp + (t * ks.x + b * ks.y + n * ks.z) * radius;
    let cp = u.proj * vec4<f32>(sp, 1.0);
    if (cp.w <= 0.0) { continue; }
    var suv = cp.xy / cp.w;
    suv = vec2<f32>(suv.x * 0.5 + 0.5, 1.0 - (suv.y * 0.5 + 0.5));
    if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) { continue; }
    let sc = vec2<i32>(i32(suv.x * f32(dim.x)), i32(suv.y * f32(dim.y)));
    let sd = textureLoad(depthTex, clamp(sc, vec2<i32>(0, 0), dim - vec2<i32>(1, 1)), 0);
    if (sd >= 0.99999) { continue; }
    let sceneZ = viewPos(sc, sd).z;
    // view 空間では手前ほど z が大きい（-Z 方向を見る）
    if (sceneZ >= sp.z + bias) {
      let rc = smoothstep(0.0, 1.0, radius / max(1e-5, abs(vp.z - sceneZ)));
      occ = occ + rc;
    }
  }
  var ao = 1.0 - occ / f32(N);
  ao = pow(clamp(ao, 0.0, 1.0), u.aoP.w);
  textureStore(aoOut, c, vec4<f32>(ao, ao, ao, 1.0));
}
`;

@group(0) @binding(4) var depthTex  : texture_depth_2d;

struct VSOut {
  @builtin(position) pos : vec4<f32>,
  @location(0) uv : vec2<f32>,
};

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VSOut {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0)

  o.uv = vec2<f32>((p[vi].x + 1.0) * 0.5, 1.0 - (p[vi].y + 1.0) * 0.5);

fn luma(c : vec3<f32>) -> f32 { return dot(c, vec3<f32>(0.299, 0.587, 0.114)); }

fn srgbEncode(c : vec3<f32>) -> vec3<f32> {
  let lo = c * 12.92;
  let hi = 1.055 * pow(max(c, vec3<f32>(1e-5, 1e-5, 1e-5)), vec3<f32>(1.0 / 2.4, 1.0 / 2.4, 1.0 / 2.4)) - vec3<f32>(0.055);
  return select(hi, lo, c <= vec3<f32>(0.0031308));
}

fn fetch(uv : vec2<f32>) -> vec3<f32> {
  return textureSampleLevel(colTex, smp, uv, 0.0).rgb;
}

// FXAA (console 版相当)
fn fxaa(uv : vec2<f32>) -> vec3<f32> {
  let rcp = u.rt.zw;
  let m  = fetch(uv);
  let nw = fetch(uv + vec2<f32>(-rcp.x, -rcp.y));
  let ne = fetch(uv + vec2<f32>( rcp.x, -rcp.y));
  let sw = fetch(uv + vec2<f32>(-rcp.x,  rcp.y));
  let se = fetch(uv + vec2<f32>( rcp.x,  rcp.y));
  let lm = luma(m);
  let lnw = luma(nw); let lne = luma(ne); let lsw = luma(sw); let lse = luma(se);
  let lmin = min(lm, min(min(lnw, lne), min(lsw, lse)));
  let lmax = max(lm, max(max(lnw, lne), max(lsw, lse)));
  if (lmax - lmin < lmax * 0.10 + 0.018) { return m; }

  var dir = vec2<f32>(-((lnw + lne) - (lsw + lse)), ((lnw + lsw) - (lne + lse)));
  let reduce = max((lnw + lne + lsw + lse) * 0.25 * 0.125, 1.0 / 128.0);
  let rcpMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + reduce);
  dir = clamp(dir * rcpMin, vec2<f32>(-8.0, -8.0), vec2<f32>(8.0, 8.0)) * rcp;

  let rA = 0.5 * (fetch(uv + dir * (1.0 / 3.0 - 0.5)) + fetch(uv + dir * (2.0 / 3.0 - 0.5)));
  let rB = rA * 0.5 + 0.25 * (fetch(uv + dir * -0.5) + fetch(uv + dir * 0.5));
  let lb = luma(rB);
  if (lb < lmin || lb > lmax) { return rA; }
  return rB;
}

/**
 * 輪郭線。仕上げレンダリングでだけ使う（bprB.x = 0 なら丸ごと飛ぶ）。
 *
 * 深度の段差と法線の折れの両方を見る。深度だけだと同じ奥行きで重なった面の境目が
 * 出ず、法線だけだと平行な面が重なった所に線が出ない。
 * 深度差は線形深度に対する相対値で見る（絶対値だと遠景で線が出なくなる）。
 */
fn outlineEdge(uv : vec2<f32>, px : f32) -> f32 {
  let dim = vec2<i32>(textureDimensions(depthTex));
  let c = vec2<i32>(i32(uv.x * f32(dim.x)), i32(uv.y * f32(dim.y)));
  let step = max(1, i32(px));
  let dc = textureLoad(depthTex, clamp(c, vec2<i32>(0), dim - vec2<i32>(1)), 0);
  if (dc >= 0.99999) { return 0.0; }
  let lc = linearDepthFromNdc(dc, u.params.x, u.params.y);
  let nc = normalize(textureLoad(normalTex, clamp(c, vec2<i32>(0), dim - vec2<i32>(1)), 0).xyz);

  var dMax = 0.0;
  var nMin = 1.0;
  var offs = array<vec2<i32>, 4>(
    vec2<i32>(step, 0), vec2<i32>(-step, 0), vec2<i32>(0, step), vec2<i32>(0, -step));
  for (var k = 0; k < 4; k = k + 1) {
    let sc = clamp(c + offs[k], vec2<i32>(0), dim - vec2<i32>(1));
    let sd = textureLoad(depthTex, sc, 0);
    if (sd >= 0.99999) { dMax = max(dMax, 1.0); continue; }   // 背景との境目
    let ls = linearDepthFromNdc(sd, u.params.x, u.params.y);
    dMax = max(dMax, abs(ls - lc) / max(1e-5, lc) * 12.0);
    let sn = normalize(textureLoad(normalTex, sc, 0).xyz);
    nMin = min(nMin, dot(nc, sn));
  }
  let dEdge = smoothstep(0.25, 0.8, dMax);
  let nEdge = smoothstep(0.85, 0.35, nMin);
  return clamp(max(dEdge, nEdge), 0.0, 1.0);

@fragment
fn fs(i : VSOut) -> @location(0) vec4<f32> {

@group(0) @binding(1) var depthTex : texture_depth_2d;

@compute @workgroup_size(1, 1, 1)
fn main() {

  let cx = i32(pp.cursor.x);
  let cy = i32(pp.cursor.y);
  let rad = i32(pp.cursor.z);

  var bestD = 1.0;
  var bestX = -1;
  var bestY = -1;
  var bestDist = 1.0e30;

  for (var dy = -rad; dy <= rad; dy = dy + 1) {
    for (var dx = -rad; dx <= rad; dx = dx + 1) {

      let y = cy + dy;

      let d = textureLoad(depthTex, vec2<i32>(x, y), 0);
      if (d >= 0.999999) { continue; }
      let dist = f32(dx * dx + dy * dy);
      if (dist < bestDist) {
        bestDist = dist;
        bestD = d;
        bestX = x;
        bestY = y;
      }

    outBuf.world = vec4<f32>(0.0, 0.0, 0.0, 0.0);
    return;

  let uv = (vec2<f32>(f32(bestX), f32(bestY)) + vec2<f32>(0.5, 0.5)) * u.rt.zw;

const NORMAL_FORMAT = 'rgba16float';
const DEPTH_FORMAT = 'depth32float';
const AO_FORMAT = 'rgba8unorm';
const RING_SEGMENTS = 96;
const PICK_SEARCH = 4;               // カーソル周辺の深度探索半径（px）
const PICK_BYTES = 16;               // vec4<f32>
// シャドウマップの一辺。2048² の depth32float で 16MB。仕上げレンダリング専用で、
// 実時間表示では描画すらしないので常時確保でも実害はない。
const SHADOW_SIZE = 2048;

/** 1 / 2 / 5 × 10^n に丸める（グリッド間隔用） */
function niceStep(x) {
  if (!(x > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(x)));
  const m = x / e;
  const s = m < 1.5 ? 1 : (m < 3.5 ? 2 : (m < 7.5 ? 5 : 10));
  return s * e;
}

function ssaoKernel(n = 24) {
  const a = new Float32Array(n * 4);
  let seed = 12345;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < n; i++) {
    let x, y, z, l;
    do {
      x = rnd() * 2 - 1; y = rnd() * 2 - 1; z = rnd();
      l = Math.hypot(x, y, z);
    } while (l < 0.15 || l > 1);
    x /= l; y /= l; z /= l;
    let s = i / n;
    s = 0.18 + 0.82 * s * s;
    a[i * 4] = x * s; a[i * 4 + 1] = y * s; a[i * 4 + 2] = z * s; a[i * 4 + 3] = 0;
  }
  return a;
}

class Renderer {
  constructor(canvas, device, context, format) {
    this.canvas = canvas;
    this.device = device;
    this.context = context;
    this.format = format;

    this.renderScale = 1;
    this.rtW = 1; this.rtH = 1;
    this.targets = null;

    this.uniformData = new Float32Array(UNIFORM_FLOATS);
    this.uniformBuf = device.createBuffer({
      size: UNIFORM_FLOATS * 4,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // AO のサンプル方向。実時間表示は先頭 24 個、仕上げレンダリングは 64 個を使う
    // （シェーダ側はループ回数を uniform で変えるだけ）。
    this.kernelBuf = device.createBuffer({
      size: 64 * 16,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(this.kernelBuf, 0, ssaoKernel(64));

    // リングオーバーレイ用ユニフォーム: mat4x4 * 8 + color + info
    this.ringData = new Float32Array(8 * 16 + 4 + 4);
    this.ringBuf = device.createBuffer({
      size: this.ringData.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // --- メッシュ用 GPU バッファ ---
    this.gpuCapV = 0;
    this.gpuCapT = 0;

    // 非アクティブなサブツールの静的バッファ（id → スロット）
    this.staticSlots = new Map();

    // 部分表示用インデックス（0 なら全部描く）
    this.visIb = null;
    this.visCap = 0;
    this.visCount = 0;
    // オーバーレイ線（位置 vec3 + 色 vec4 = 7 float / 頂点）
    this.overlayBuf = null;
    this.overlayCap = 0;
    this.overlayCount = 0;
    this.overlayFront = true;
    this.vbPos = null; this.vbNrm = null; this.vbCol = null; this.vbMask = null; this.vbCurv = null;
    this.ib = null;
    this.wireIb = null;
    this.wireCapT = 0;
    this.wireCount = 0;
    this.wireVersion = -1;
    this.wireBuiltAt = 0;

    // --- ピッキング ---
    this.pickParams = new Float32Array(4);
    this.pickParamsBuf = device.createBuffer({
      size: 16,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    this.pickResultBuf = device.createBuffer({
      size: PICK_BYTES,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
    });
    this.pickPool = [];
    for (let i = 0; i < 3; i++) {
      this.pickPool.push({
        buffer: device.createBuffer({
          size: PICK_BYTES,
          usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
        }),
        busy: false,
      });
    }
    this.pickRequest = null;
    this.pick = { ok: false, point: new Float32Array(3) };

    this.frame = 0;
    this._buildStatic();
    this.resize();
  }

  static async create(canvas) {
    if (!navigator.gpu) throw new Error('このブラウザは WebGPU に対応していません。');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('WebGPU アダプタを取得できませんでした。');
    const device = await adapter.requestDevice({
      requiredLimits: {
        maxBufferSize: Math.min(adapter.limits.maxBufferSize, 512 * 1024 * 1024),
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
      },
    });
    const context = canvas.getContext('webgpu');
    if (!context) throw new Error('webgpu コンテキストを取得できませんでした。');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: 'opaque' });
    const r = new Renderer(canvas, device, context, format);
    r.adapterInfo = adapter.info || {};
    device.lost.then((info) => {
      console.error('WebGPU device lost:', info.message);
      if (r.onDeviceLost) r.onDeviceLost(info);
    });
    return r;
  }

  // -----------------------------------------------------------------------
  // パイプライン / 静的リソース
  // -----------------------------------------------------------------------
  _buildStatic() {
    const d = this.device;
    // パイプラインの生成が失敗しても例外にならず、使ったときに
    // 「is invalid due to a previous error」という形で初めて表に出る。
    // それだと原因のシェーダが分からないので、ここで捕まえて記録する。
    // スコープは **この関数の最後で** 閉じること（すぐ pop すると何も入らない）。
    this.buildError = null;
    d.pushErrorScope('validation');

    // binding 3/4 はシャドウマップ。使うのは MESH シェーダだけだが、
    // bglMain は BG / WIRE / GRID / OVERLAY でも共有している。WebGPU では
    // シェーダがレイアウトの一部だけを使うのは許されるので、まとめて持たせる。
    this.bglMain = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
        { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float', viewDimension: '2d-array' } },
        { binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
        { binding: 3, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'depth' } },
        { binding: 4, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'comparison' } },
      ],
    });
    this.bglRing = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
      ],
    });
    // シャドウマップを描くパス専用。**bgMain は使えない**。
    // bgMain にはシャドウマップ自体がテクスチャとして入っているので、
    // 同じパスで「書き込み対象」と「読み取り対象」を兼ねることになり、
    // WebGPU に弾かれる（usage includes writable usage and another usage
    // in the same synchronization scope）。ユニフォームだけを渡す。
    this.bglShadow = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
      ],
    });
    this.bglSSAO = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
        { binding: 1, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'depth' } },
        { binding: 2, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'float' } },
        { binding: 3, visibility: GPUShaderStage.COMPUTE, storageTexture: { access: 'write-only', format: AO_FORMAT } },
        { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
      ],
    });
    this.bglBlur = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
        { binding: 1, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'float' } },
        { binding: 2, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'depth' } },
        { binding: 3, visibility: GPUShaderStage.COMPUTE, storageTexture: { access: 'write-only', format: AO_FORMAT } },
      ],
    });
    this.bglPick = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
        { binding: 1, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'depth' } },
        { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
        { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      ],
    });
    this.bglPresent = d.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
        { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
        { binding: 2, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
        { binding: 3, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
        // 輪郭線と透明背景の判定に深度と法線を読む
        { binding: 4, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'depth' } },
        { binding: 5, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
      ],
    });

    const mod = (code) => d.createShaderModule({ code });
    const bgMod = mod(BG_WGSL);
    const meshMod = mod(MESH_WGSL);
    const wireMod = mod(WIRE_WGSL);
    const gridMod = mod(GRID_WGSL);
    const overlayMod = mod(OVERLAY_WGSL);
    const ssaoMod = mod(SSAO_WGSL);
    const blurMod = mod(BLUR_WGSL);
    const presentMod = mod(PRESENT_WGSL);
    const ringMod = mod(RING_WGSL);
    const pickMod = mod(PICK_WGSL);

    const mainLayout = d.createPipelineLayout({ bindGroupLayouts: [this.bglMain] });
    const depthState = (write, compare) => ({
      format: DEPTH_FORMAT, depthWriteEnabled: write, depthCompare: compare,
    });

    this.pipeBg = d.createRenderPipeline({
      layout: mainLayout,
      vertex: { module: bgMod, entryPoint: 'vs' },
      fragment: {
        module: bgMod, entryPoint: 'fs',
        targets: [{ format: COLOR_FORMAT }, { format: NORMAL_FORMAT }],
      },
      primitive: { topology: 'triangle-list' },
      depthStencil: depthState(false, 'always'),
    });

    const vbLayouts = [
      { arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] },
      { arrayStride: 12, attributes: [{ shaderLocation: 1, offset: 0, format: 'float32x3' }] },
      { arrayStride: 12, attributes: [{ shaderLocation: 2, offset: 0, format: 'float32x3' }] },
      { arrayStride: 4, attributes: [{ shaderLocation: 3, offset: 0, format: 'float32' }] },
      { arrayStride: 4, attributes: [{ shaderLocation: 4, offset: 0, format: 'float32' }] },
    ];
    const alphaBlend = {
      color: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' },
      alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' },
    };

    this.pipeMesh = d.createRenderPipeline({
      layout: mainLayout,
      vertex: { module: meshMod, entryPoint: 'vs', buffers: vbLayouts },
      fragment: {
        module: meshMod, entryPoint: 'fs',
        targets: [{ format: COLOR_FORMAT }, { format: NORMAL_FORMAT }],
      },
      primitive: { topology: 'triangle-list', cullMode: 'none' },
      depthStencil: depthState(true, 'less'),
    });

    // シャドウマップ（深度だけ。色の添付なし）
    const shadowMod = mod(SHADOW_WGSL);
    this.pipeShadow = d.createRenderPipeline({
      layout: d.createPipelineLayout({ bindGroupLayouts: [this.bglShadow] }),
      vertex: {
        module: shadowMod, entryPoint: 'vs',
        buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }],
      },
      primitive: { topology: 'triangle-list', cullMode: 'none' },
      depthStencil: depthState(true, 'less'),
    });
    this.bgShadow = d.createBindGroup({
      layout: this.bglShadow,
      entries: [{ binding: 0, resource: { buffer: this.uniformBuf } }],
    });

    this.pipeWire = d.createRenderPipeline({
      layout: mainLayout,
      vertex: {
        module: wireMod, entryPoint: 'vs',
        buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }],
      },
      fragment: {
        module: wireMod, entryPoint: 'fs',
        targets: [
          {
            format: COLOR_FORMAT,
            blend: {
              color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
              alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' },
            },
          },
          { format: NORMAL_FORMAT, writeMask: 0 },
        ],
      },
      primitive: { topology: 'line-list' },
      depthStencil: depthState(false, 'less-equal'),
    });

    // オーバーレイの線。頂点は (位置 vec3, 色 vec4) の 28 バイトストライド。
    // depth 付き（形状に隠れる）と depth 無し（常に手前）の 2 本を作り、
    // ハンドルは「隠れる線を薄く + 手前の線を濃く」の重ね描きで見やすくする。
    const overlayVB = [{
      arrayStride: 28,
      attributes: [
        { shaderLocation: 0, offset: 0, format: 'float32x3' },
        { shaderLocation: 1, offset: 12, format: 'float32x4' },
      ],
    }];
    const overlayTargets = [
      { format: COLOR_FORMAT, blend: alphaBlend },
      { format: NORMAL_FORMAT, writeMask: 0 },
    ];
    this.pipeOverlay = d.createRenderPipeline({
      layout: mainLayout,
      vertex: { module: overlayMod, entryPoint: 'vs', buffers: overlayVB },
      fragment: { module: overlayMod, entryPoint: 'fs', targets: overlayTargets },
      primitive: { topology: 'line-list' },
      depthStencil: depthState(false, 'less-equal'),
    });
    this.pipeOverlayFront = d.createRenderPipeline({
      layout: mainLayout,
      vertex: { module: overlayMod, entryPoint: 'vs', buffers: overlayVB },
      fragment: { module: overlayMod, entryPoint: 'fs', targets: overlayTargets },
      primitive: { topology: 'line-list' },
      depthStencil: depthState(false, 'always'),
    });

    // フロアグリッドはメッシュの後に描く（深度テストのみ、書き込みなし）
    this.pipeGrid = d.createRenderPipeline({
      layout: mainLayout,
      vertex: { module: gridMod, entryPoint: 'vs' },
      fragment: {
        module: gridMod, entryPoint: 'fs',
        targets: [
          { format: COLOR_FORMAT, blend: alphaBlend },
          { format: NORMAL_FORMAT, writeMask: 0 },
        ],
      },
      primitive: { topology: 'triangle-list', cullMode: 'none' },
      depthStencil: depthState(false, 'less'),
    });

    this.pipeSSAO = d.createComputePipeline({
      layout: d.createPipelineLayout({ bindGroupLayouts: [this.bglSSAO] }),
      compute: { module: ssaoMod, entryPoint: 'main' },
    });
    this.pipeBlur = d.createComputePipeline({
      layout: d.createPipelineLayout({ bindGroupLayouts: [this.bglBlur] }),
      compute: { module: blurMod, entryPoint: 'main' },
    });
    this.pipePick = d.createComputePipeline({
      layout: d.createPipelineLayout({ bindGroupLayouts: [this.bglPick] }),
      compute: { module: pickMod, entryPoint: 'main' },
    });

    this.pipePresent = d.createRenderPipeline({
      layout: d.createPipelineLayout({ bindGroupLayouts: [this.bglPresent] }),
      vertex: { module: presentMod, entryPoint: 'vs' },
      fragment: { module: presentMod, entryPoint: 'fs', targets: [{ format: this.format }] },
      primitive: { topology: 'triangle-list' },
    });

    this.pipeRing = d.createRenderPipeline({
      layout: d.createPipelineLayout({ bindGroupLayouts: [this.bglMain, this.bglRing] }),
      vertex: { module: ringMod, entryPoint: 'vs' },
      fragment: {
        module: ringMod, entryPoint: 'fs',
        targets: [{
          format: this.format,
          blend: {
            color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
            alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' },
          },
        }],
      },
      primitive: { topology: 'line-list' },
    });

    // --- MatCap テクスチャ ---
    // MatCap は 1 枚 9ms かかる。起動時は表示中の 1 枚だけ作り、
    // 残りは初回描画のあとにアイドル時間で埋める（起動を 80ms ほど短縮）。
    const MC_SIZE = 256;
    this.matcapSize = MC_SIZE;
    this.matcapCount = MATERIALS.length;
    this.materialNames = MATERIALS.map(m => m.jp);
    this.matcapReady = new Uint8Array(this.matcapCount);
    this.matcapTex = d.createTexture({
      size: [MC_SIZE, MC_SIZE, this.matcapCount],
      format: 'rgba8unorm-srgb',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
    });
    this.ensureMatcap(0);

    this.linearSampler = d.createSampler({
      magFilter: 'linear', minFilter: 'linear',
      addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    });
    // 比較サンプラ。ハードウェアの深度比較 + 線形補間が使えるので、
    // 3x3 の PCF が実質 3x3 の「なめらかな」比較になる。
    this.shadowSampler = d.createSampler({
      compare: 'less-equal',
      magFilter: 'linear', minFilter: 'linear',
      addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    });
    this.matcapView = this.matcapTex.createView({ dimension: '2d-array' });
    this._ensureShadowMap(SHADOW_SIZE);
    this._rebuildMainBG();

    this.bgRing = d.createBindGroup({
      layout: this.bglRing,
      entries: [{ binding: 0, resource: { buffer: this.ringBuf } }],
    });

    d.popErrorScope().then((e) => {
      if (!e) return;
      this.buildError = e.message;
      console.error('パイプラインの生成に失敗しました:\n' + e.message);
    });
  }

  /** 指定マテリアルの MatCap をまだ作っていなければ生成して該当レイヤへ書く */
  ensureMatcap(index) {
    if (index < 0 || index >= this.matcapCount || this.matcapReady[index]) return false;
    const size = this.matcapSize;
    const data = generateMatcapLayer(index, size);
    this.device.queue.writeTexture(
      { texture: this.matcapTex, origin: { x: 0, y: 0, z: index } },
      data,
      { bytesPerRow: size * 4, rowsPerImage: size },
      { width: size, height: size, depthOrArrayLayers: 1 },
    );
    this.matcapReady[index] = 1;
    return true;
  }

  /** まだ作っていない MatCap を 1 枚だけ埋める。毎フレーム呼んで少しずつ進める */
  fillNextMatcap() {
    for (let i = 0; i < this.matcapCount; i++) {
      if (!this.matcapReady[i]) return this.ensureMatcap(i);
    }
    return false;
  }

  // -----------------------------------------------------------------------
  // リサイズ / レンダーターゲット
  // -----------------------------------------------------------------------
  setRenderScale(s) {
    const ns = clamp(s, 0.5, 2);
    if (Math.abs(ns - this.renderScale) < 1e-4) return;
    this.renderScale = ns;
    this.resize(true);
  }

  resize(force = false) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = Math.max(1, this.canvas.clientWidth || this.canvas.width);
    const cssH = Math.max(1, this.canvas.clientHeight || this.canvas.height);
    const cw = Math.max(1, Math.round(cssW * dpr));
    const ch = Math.max(1, Math.round(cssH * dpr));
    if (this.canvas.width !== cw || this.canvas.height !== ch) {
      this.canvas.width = cw;
      this.canvas.height = ch;
      force = true;
    }
    const w = Math.max(8, Math.round(cw * this.renderScale));
    const h = Math.max(8, Math.round(ch * this.renderScale));
    if (!force && w === this.rtW && h === this.rtH) return;
    this.rtW = w; this.rtH = h;
    this._resizeTo(w, h);
  }

  /**
   * 描画ターゲットとバインドグループを w×h で作り直す。
   * 仕上げレンダリングが一時的に解像度を上げるためにも使うので、
   * canvas のサイズ計算とは切り離してある。
   */
  _resizeTo(w, h) {
    const d = this.device;
    if (this.targets) {
      for (const t of Object.values(this.targets)) { if (t.destroy) t.destroy(); }
    }
    const color = d.createTexture({
      size: [w, h], format: COLOR_FORMAT,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    const normal = d.createTexture({
      size: [w, h], format: NORMAL_FORMAT,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    const depth = d.createTexture({
      size: [w, h], format: DEPTH_FORMAT,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    const ao = d.createTexture({
      size: [w, h], format: AO_FORMAT,
      usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING,
    });
    const aoBlur = d.createTexture({
      size: [w, h], format: AO_FORMAT,
      usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING,
    });
    this.targets = { color, normal, depth, ao, aoBlur };
    this.views = {
      color: color.createView(), normal: normal.createView(), depth: depth.createView(),
      ao: ao.createView(), aoBlur: aoBlur.createView(),
    };

    this.bgSSAO = d.createBindGroup({
      layout: this.bglSSAO,
      entries: [
        { binding: 0, resource: { buffer: this.uniformBuf } },
        { binding: 1, resource: this.views.depth },
        { binding: 2, resource: this.views.normal },
        { binding: 3, resource: this.views.ao },
        { binding: 4, resource: { buffer: this.kernelBuf } },
      ],
    });
    this.bgBlur = d.createBindGroup({
      layout: this.bglBlur,
      entries: [
        { binding: 0, resource: { buffer: this.uniformBuf } },
        { binding: 1, resource: this.views.ao },
        { binding: 2, resource: this.views.depth },
        { binding: 3, resource: this.views.aoBlur },
      ],
    });
    this.bgPick = d.createBindGroup({
      layout: this.bglPick,
      entries: [
        { binding: 0, resource: { buffer: this.uniformBuf } },
        { binding: 1, resource: this.views.depth },
        { binding: 2, resource: { buffer: this.pickParamsBuf } },
        { binding: 3, resource: { buffer: this.pickResultBuf } },
      ],
    });
    this.bgPresent = d.createBindGroup({
      layout: this.bglPresent,
      entries: [
        { binding: 0, resource: { buffer: this.uniformBuf } },
        { binding: 1, resource: this.views.color },
        { binding: 2, resource: this.views.aoBlur },
        { binding: 3, resource: this.linearSampler },
        { binding: 4, resource: this.views.depth },
        { binding: 5, resource: this.views.normal },
      ],
    });
    this._rebuildMainBG();
  }

  /**
   * bgMain を作り直す。シャドウマップの view を含むので、
   * シャドウマップを張り替えたときと解像度を変えたときの両方で呼ぶ。
   */
  _rebuildMainBG() {
    const d = this.device;
    if (!this.shadowTex) this._ensureShadowMap(SHADOW_SIZE);
    this.bgMain = d.createBindGroup({
      layout: this.bglMain,
      entries: [
        { binding: 0, resource: { buffer: this.uniformBuf } },
        { binding: 1, resource: this.matcapView },
        { binding: 2, resource: this.linearSampler },
        { binding: 3, resource: this.shadowView },
        { binding: 4, resource: this.shadowSampler },
      ],
    });
  }

  /** シャドウマップ（深度のみ）を用意する */
  _ensureShadowMap(size) {
    if (this.shadowTex && this.shadowSize === size) return;
    if (this.shadowTex) this.shadowTex.destroy();
    this.shadowSize = size;
    this.shadowTex = this.device.createTexture({
      size: [size, size], format: DEPTH_FORMAT,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    this.shadowView = this.shadowTex.createView();
  }

  // -----------------------------------------------------------------------
  // 非アクティブなサブツールの静的バッファ
  //
  // アクティブなサブツールは既存の vbPos… を dirty 転送で毎フレーム更新する。
  // 非アクティブなものは彫刻されないので、一度だけ丸ごと上げて置いておけばよい。
  // パイプラインと頂点レイアウトはアクティブと同じなので、描画時にバッファを
  // 差し替えるだけで済む。
  // -----------------------------------------------------------------------

  /** id のスロットを（無ければ作って）返す。geomVersion が変わっていたら上げ直す */
  ensureStatic(id, mesh) {
    let slot = this.staticSlots.get(id);
    const needCapV = mesh.nv, needCapT = mesh.nt;
    if (slot && (slot.capV < needCapV || slot.capT < needCapT)) {
      this.destroyStatic(id);
      slot = null;
    }
    const d = this.device;
    if (!slot) {
      const vu = GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST;
      const capV = Math.max(1, needCapV), capT = Math.max(1, needCapT);
      slot = {
        capV, capT,
        pos: d.createBuffer({ size: capV * 12, usage: vu }),
        nrm: d.createBuffer({ size: capV * 12, usage: vu }),
        col: d.createBuffer({ size: capV * 12, usage: vu }),
        msk: d.createBuffer({ size: capV * 4, usage: vu }),
        crv: d.createBuffer({ size: capV * 4, usage: vu }),
        ib: d.createBuffer({ size: capT * 12, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST }),
        count: 0,
        stamp: -1,
      };
      this.staticSlots.set(id, slot);
    }
    // 形や色が変わっていたら上げ直す。geomVersion と topoVersion の両方を見る
    const stamp = mesh.geomVersion * 1048576 + mesh.topoVersion;
    if (slot.stamp !== stamp) {
      d.queue.writeBuffer(slot.pos, 0, mesh.positions, 0, mesh.nv * 3);
      d.queue.writeBuffer(slot.nrm, 0, mesh.normals, 0, mesh.nv * 3);
      d.queue.writeBuffer(slot.col, 0, mesh.colors, 0, mesh.nv * 3);
      d.queue.writeBuffer(slot.msk, 0, mesh.mask, 0, mesh.nv);
      d.queue.writeBuffer(slot.crv, 0, mesh.curv, 0, mesh.nv);
      d.queue.writeBuffer(slot.ib, 0, mesh.tris, 0, mesh.nt * 3);
      slot.count = mesh.nt * 3;
      slot.stamp = stamp;
    }
    return slot;
  }

  destroyStatic(id) {
    const slot = this.staticSlots.get(id);
    if (!slot) return;
    for (const b of [slot.pos, slot.nrm, slot.col, slot.msk, slot.crv, slot.ib]) {
      if (b) b.destroy();
    }
    this.staticSlots.delete(id);
  }

  /** 使われていないスロットを片付ける（keep に無い id を捨てる） */
  pruneStatic(keep) {
    for (const id of [...this.staticSlots.keys()]) {
      if (!keep.has(id)) this.destroyStatic(id);
    }
    // drawSlots は破棄したスロットを掴んでいる可能性があるので必ず落とす。
    // 次のフレームで syncSubtoolSlots が作り直す。残すと破棄済みバッファを
    // バインドしかねない。
    this.drawSlots = null;
  }

  // -----------------------------------------------------------------------
  // メッシュ転送
  // -----------------------------------------------------------------------
  syncMesh(mesh) {
    const d = this.device;
    let full = false;

    if (mesh.capV > this.gpuCapV) {
      const cap = mesh.capV;
      for (const b of [this.vbPos, this.vbNrm, this.vbCol, this.vbMask, this.vbCurv]) if (b) b.destroy();
      const vu = GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST;
      this.vbPos = d.createBuffer({ size: cap * 12, usage: vu });
      this.vbNrm = d.createBuffer({ size: cap * 12, usage: vu });
      this.vbCol = d.createBuffer({ size: cap * 12, usage: vu });
      this.vbMask = d.createBuffer({ size: cap * 4, usage: vu });
      this.vbCurv = d.createBuffer({ size: cap * 4, usage: vu });
      this.gpuCapV = cap;
      full = true;
    }
    if (mesh.capT > this.gpuCapT) {
      if (this.ib) this.ib.destroy();
      this.ib = d.createBuffer({
        size: mesh.capT * 12,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });
      this.gpuCapT = mesh.capT;
      full = true;
    }

    if (full) {
      d.queue.writeBuffer(this.vbPos, 0, mesh.positions, 0, mesh.nv * 3);
      d.queue.writeBuffer(this.vbNrm, 0, mesh.normals, 0, mesh.nv * 3);
      d.queue.writeBuffer(this.vbCol, 0, mesh.colors, 0, mesh.nv * 3);
      d.queue.writeBuffer(this.vbMask, 0, mesh.mask, 0, mesh.nv);
      d.queue.writeBuffer(this.vbCurv, 0, mesh.curv, 0, mesh.nv);
      d.queue.writeBuffer(this.ib, 0, mesh.tris, 0, mesh.nt * 3);
      mesh.clearDirty();
      return;
    }

    // dirty をブロック単位で見て、連続する塊だけを転送する。
    // min〜max の 1 区間で送ると、ブラシが触れた頂点がインデックス上に
    // 散らばっている場合に配列全体（数百万頂点 = 100MB 超）を毎フレーム送ることになる。
    if (mesh.vBlockMax >= mesh.vBlockMin) {
      const blocks = mesh.vBlocks;
      let run = -1;
      for (let b = mesh.vBlockMin; b <= mesh.vBlockMax + 1; b++) {
        const on = b <= mesh.vBlockMax && blocks[b] === 1;
        if (on && run < 0) run = b;
        else if (!on && run >= 0) {
          const a = run * DIRTY_BLOCK;
          const e = Math.min(mesh.nv, b * DIRTY_BLOCK);
          const n = e - a;
          if (n > 0) {
            d.queue.writeBuffer(this.vbPos, a * 12, mesh.positions, a * 3, n * 3);
            d.queue.writeBuffer(this.vbNrm, a * 12, mesh.normals, a * 3, n * 3);
            d.queue.writeBuffer(this.vbCol, a * 12, mesh.colors, a * 3, n * 3);
            d.queue.writeBuffer(this.vbMask, a * 4, mesh.mask, a, n);
            d.queue.writeBuffer(this.vbCurv, a * 4, mesh.curv, a, n);
          }
          run = -1;
        }
      }
    }
    if (mesh.tBlockMax >= mesh.tBlockMin) {
      const blocks = mesh.tBlocks;
      let run = -1;
      for (let b = mesh.tBlockMin; b <= mesh.tBlockMax + 1; b++) {
        const on = b <= mesh.tBlockMax && blocks[b] === 1;
        if (on && run < 0) run = b;
        else if (!on && run >= 0) {
          const a = run * DIRTY_BLOCK;
          const e = Math.min(mesh.nt, b * DIRTY_BLOCK);
          if (e > a) d.queue.writeBuffer(this.ib, a * 12, mesh.tris, a * 3, (e - a) * 3);
          run = -1;
        }
      }
    }
    mesh.clearDirty();
  }

  /**
   * 部分表示のインデックスを差し替える。null / count 0 を渡すと全体表示に戻る。
   * ポリグループの表示状態が変わったときだけ呼ぶ（毎フレーム呼ぶものではない）。
   */
  setVisibleIndices(indices, count) {
    if (!indices || !count) { this.visCount = 0; return; }
    const d = this.device;
    if (!this.visIb || this.visCap < count) {
      if (this.visIb) this.visIb.destroy();
      this.visCap = Math.ceil(count * 1.4);
      this.visIb = d.createBuffer({
        size: this.visCap * 4,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });
    }
    d.queue.writeBuffer(this.visIb, 0, indices, 0, count);
    this.visCount = count;
  }

  /**
   * オーバーレイの線を差し替える。
   * @param {Float32Array} verts (x,y,z,r,g,b,a) を線分の端点ごとに並べたもの
   * @param {number} vertCount   頂点数（線分数 × 2）
   * @param {boolean} front      形状に隠れずに常に手前へ描くか
   */
  setOverlayLines(verts, vertCount, front = true) {
    if (!verts || !vertCount) { this.overlayCount = 0; return; }
    const d = this.device;
    const need = vertCount * 7;
    if (!this.overlayBuf || this.overlayCap < need) {
      if (this.overlayBuf) this.overlayBuf.destroy();
      this.overlayCap = Math.ceil(need * 1.5);
      this.overlayBuf = d.createBuffer({
        size: this.overlayCap * 4,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });
    }
    d.queue.writeBuffer(this.overlayBuf, 0, verts, 0, need);
    this.overlayCount = vertCount;
    this.overlayFront = front;
  }

  _syncWireframe(mesh, now) {
    if (mesh.topoVersion === this.wireVersion) return;
    if (this.wireVersion >= 0 && now - this.wireBuiltAt < 160) return;   // 構築を間引く
    const d = this.device;
    const need = mesh.liveTris * 6;
    if (need === 0) { this.wireCount = 0; this.wireVersion = mesh.topoVersion; return; }
    if (!this.wireIb || this.wireCapT < need) {
      if (this.wireIb) this.wireIb.destroy();
      this.wireCapT = Math.ceil(need * 1.4);
      this.wireIb = d.createBuffer({
        size: this.wireCapT * 4,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });
    }
    const arr = new Uint32Array(need);
    const T = mesh.tris;
    let w = 0;
    for (let t = 0; t < mesh.nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      arr[w++] = a; arr[w++] = b;
      arr[w++] = b; arr[w++] = c;
      arr[w++] = c; arr[w++] = a;
    }
    d.queue.writeBuffer(this.wireIb, 0, arr, 0, w);
    this.wireCount = w;
    this.wireVersion = mesh.topoVersion;
    this.wireBuiltAt = now;
  }

  // -----------------------------------------------------------------------
  // ピッキング
  // -----------------------------------------------------------------------
  /** CSS ピクセル座標で要求（次フレーム以降に this.pick が更新される） */
  requestPick(cssX, cssY) {
    this.pickRequest = { x: cssX, y: cssY };
  }

  _encodePick(encoder) {
    if (!this.pickRequest) return null;
    const slot = this.pickPool.find(s => !s.busy);
    if (!slot) return null;

    const dpr = this.canvas.width / Math.max(1, this.canvas.clientWidth || this.canvas.width);
    const px = Math.round(this.pickRequest.x * dpr * this.renderScale);
    const py = Math.round(this.pickRequest.y * dpr * this.renderScale);
    if (px < 0 || py < 0 || px >= this.rtW || py >= this.rtH) {
      this.pick.ok = false;
      return null;
    }

    this.pickParams[0] = px;
    this.pickParams[1] = py;
    this.pickParams[2] = PICK_SEARCH;
    this.pickParams[3] = 0;
    this.device.queue.writeBuffer(this.pickParamsBuf, 0, this.pickParams);

    const pass = encoder.beginComputePass();
    pass.setPipeline(this.pipePick);
    pass.setBindGroup(0, this.bgPick);
    pass.dispatchWorkgroups(1);
    pass.end();

    encoder.copyBufferToBuffer(this.pickResultBuf, 0, slot.buffer, 0, PICK_BYTES);
    slot.busy = true;
    return slot;
  }

  _resolvePick(slot) {
    slot.buffer.mapAsync(GPUMapMode.READ).then(() => {
      const f = new Float32Array(slot.buffer.getMappedRange().slice(0));
      slot.buffer.unmap();
      slot.busy = false;
      if (f[3] < 0.5 || !Number.isFinite(f[0]) || !Number.isFinite(f[1]) || !Number.isFinite(f[2])) {
        this.pick.ok = false;
        return;
      }
      this.pick.point[0] = f[0];
      this.pick.point[1] = f[1];
      this.pick.point[2] = f[2];
      this.pick.ok = true;
    }).catch(() => { slot.busy = false; });
  }

  // -----------------------------------------------------------------------
  // 描画
  // -----------------------------------------------------------------------
  /**
   * @param camera OrbitCamera
   * @param mesh   SculptMesh
   * @param state  表示設定
   * @param rings  [{pos:Float32Array(3), normal:Float32Array(3), radius:number}] 最大 8
   */
  render(camera, mesh, state, rings) {
    this.frame++;
    const d = this.device;
    const now = performance.now();

    // --- ユニフォーム ---
    const U = this.uniformData;
    U.set(camera.view, UO.view);
    U.set(camera.proj, UO.proj);
    U.set(camera.viewProj, UO.viewProj);
    U.set(camera.invProj, UO.invProj);
    U.set(camera.invViewProj, UO.invViewProj);
    U[UO.camPos] = camera.eye[0]; U[UO.camPos + 1] = camera.eye[1];
    U[UO.camPos + 2] = camera.eye[2]; U[UO.camPos + 3] = 1;
    U[UO.params] = camera.near;
    U[UO.params + 1] = camera.far;
    const matIdx = clamp(state.material | 0, 0, this.matcapCount - 1);
    this.ensureMatcap(matIdx);   // 未生成なら即座に作る（切り替え時 9ms）
    U[UO.params + 2] = matIdx;
    U[UO.params + 3] = state.debugView || 0;
    U[UO.rt] = this.rtW; U[UO.rt + 1] = this.rtH;
    U[UO.rt + 2] = 1 / this.rtW; U[UO.rt + 3] = 1 / this.rtH;
    // AO 半径はモデルスケールに追従させる（凹凸が見えるだけの大きさが必要）
    U[UO.aoP] = Math.max(1e-4, camera.modelRadius * 0.20 * state.aoRadius);
    U[UO.aoP + 1] = state.aoIntensity;
    U[UO.aoP + 2] = Math.max(1e-5, camera.modelRadius * 0.0015);
    U[UO.aoP + 3] = state.aoPower;
    U.set(state.bgTop, UO.bgTop);
    U.set(state.bgBot, UO.bgBot);
    U[UO.misc] = state.exposure;
    U[UO.misc + 1] = state.wireAlpha;
    U[UO.misc + 2] = state.maskDarken;
    U[UO.misc + 3] = state.ao ? 1 : 0;
    U[UO.cav] = state.cavity;
    U[UO.cav + 1] = state.peak;
    U[UO.cav + 2] = state.cavityGain;
    U[UO.cav + 3] = 0;
    // グリッド間隔はモデルサイズに合わせて 1-2-5 系列で丸める
    U[UO.grid] = niceStep(camera.modelRadius * 0.5);
    U[UO.grid + 1] = camera.modelRadius * 16;      // 板の広さ（フェード距離の基準にもなる）
    U[UO.grid + 2] = 1.0;
    U[UO.grid + 3] = state.gridY || 0;             // 床の高さ（モデルの底に合わせる）
    U.set(state.gridColor, UO.gridCol);
    this._writeBpr(null);
    d.queue.writeBuffer(this.uniformBuf, 0, U);

    // --- リング ---
    let ringInstances = 0;
    if (rings && rings.length) {
      ringInstances = Math.min(rings.length, 8);
      for (let i = 0; i < ringInstances; i++) this.ringData.set(rings[i].matrix, i * 16);
      const off = 8 * 16;
      this.ringData[off] = state.ringColor[0];
      this.ringData[off + 1] = state.ringColor[1];
      this.ringData[off + 2] = state.ringColor[2];
      this.ringData[off + 3] = state.ringColor[3];
      this.ringData[off + 4] = RING_SEGMENTS;
      this.ringData[off + 5] = 0.5;
      d.queue.writeBuffer(this.ringBuf, 0, this.ringData);
    }

    this.syncMesh(mesh);
    if (state.wireframe) this._syncWireframe(mesh, now);

    const encoder = d.createCommandEncoder();

    // --- パス1: 背景 + メッシュ + ワイヤ ---
    {
      const pass = encoder.beginRenderPass({
        colorAttachments: [
          { view: this.views.color, clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: 'clear', storeOp: 'store' },
          { view: this.views.normal, clearValue: { r: 0, g: 0, b: 1, a: 0 }, loadOp: 'clear', storeOp: 'store' },
        ],
        depthStencilAttachment: {
          view: this.views.depth, depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store',
        },
      });
      pass.setBindGroup(0, this.bgMain);

      pass.setPipeline(this.pipeBg);
      pass.draw(3);

      if (mesh.nt > 0 && this.ib) {
        pass.setPipeline(this.pipeMesh);
        pass.setVertexBuffer(0, this.vbPos);
        pass.setVertexBuffer(1, this.vbNrm);
        pass.setVertexBuffer(2, this.vbCol);
        pass.setVertexBuffer(3, this.vbMask);
        pass.setVertexBuffer(4, this.vbCurv);
        // 部分表示（ポリグループのハイド）中は、可視な三角形だけを詰めた
        // インデックスバッファを使う。退化三角形に書き換えて隠す方法もあるが、
        // それだとトポロジ自体を壊すので表示だけ差し替える。
        if (this.visCount > 0 && this.visIb) {
          pass.setIndexBuffer(this.visIb, 'uint32');
          pass.drawIndexed(this.visCount);
        } else {
          pass.setIndexBuffer(this.ib, 'uint32');
          pass.drawIndexed(mesh.nt * 3);
        }
      }

      // 非アクティブなサブツール（静的バッファから描く。彫刻されないので転送不要）
      if (this.drawSlots && this.drawSlots.length) {
        pass.setPipeline(this.pipeMesh);
        for (const sl of this.drawSlots) {
          if (!sl || sl.count === 0) continue;
          pass.setVertexBuffer(0, sl.pos);
          pass.setVertexBuffer(1, sl.nrm);
          pass.setVertexBuffer(2, sl.col);
          pass.setVertexBuffer(3, sl.msk);
          pass.setVertexBuffer(4, sl.crv);
          pass.setIndexBuffer(sl.ib, 'uint32');
          pass.drawIndexed(sl.count);
        }
      }

      // グリッドはメッシュの後（深度テストで隠れるように）
      if (state.grid) {
        pass.setPipeline(this.pipeGrid);
        pass.draw(6);
      }

      if (mesh.nt > 0 && this.ib && state.wireframe && this.wireCount > 0 && this.wireIb) {
        pass.setPipeline(this.pipeWire);
        pass.setVertexBuffer(0, this.vbPos);
        pass.setIndexBuffer(this.wireIb, 'uint32');
        pass.drawIndexed(this.wireCount);
      }

      // オーバーレイの線（トランスポーズのハンドル / クリップのガイド）。
      // 隠れる線を薄く重ねてから手前の線を描くと、奥行きが分かりつつ操作しやすい。
      if (this.overlayCount > 0 && this.overlayBuf) {
        pass.setPipeline(this.pipeOverlay);
        pass.setVertexBuffer(0, this.overlayBuf);
        pass.draw(this.overlayCount);
        if (this.overlayFront) {
          pass.setPipeline(this.pipeOverlayFront);
          pass.setVertexBuffer(0, this.overlayBuf);
          pass.draw(this.overlayCount);
        }
      }
      pass.end();
    }

    // --- パス2/3: SSAO ---
    if (state.ao) {
      const gx = Math.ceil(this.rtW / 8), gy = Math.ceil(this.rtH / 8);
      const p1 = encoder.beginComputePass();
      p1.setPipeline(this.pipeSSAO);
      p1.setBindGroup(0, this.bgSSAO);
      p1.dispatchWorkgroups(gx, gy);
      p1.end();
      const p2 = encoder.beginComputePass();
      p2.setPipeline(this.pipeBlur);
      p2.setBindGroup(0, this.bgBlur);
      p2.dispatchWorkgroups(gx, gy);
      p2.end();
    }

    // --- ピッキング（compute で 1 点だけ逆射影してリードバック） ---
    const pickSlot = this._encodePick(encoder);

    // --- パス4: present ---
    const canvasView = this.context.getCurrentTexture().createView();
    {
      const pass = encoder.beginRenderPass({
        colorAttachments: [
          { view: canvasView, clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' },
        ],
      });
      pass.setPipeline(this.pipePresent);
      pass.setBindGroup(0, this.bgPresent);
      pass.draw(3);
      pass.end();
    }

    // --- パス5: ブラシリング ---
    if (ringInstances > 0) {
      const pass = encoder.beginRenderPass({
        colorAttachments: [{ view: canvasView, loadOp: 'load', storeOp: 'store' }],
      });
      pass.setPipeline(this.pipeRing);
      pass.setBindGroup(0, this.bgMain);
      pass.setBindGroup(1, this.bgRing);
      pass.draw(RING_SEGMENTS * 2 * 2, ringInstances);
      pass.end();
    }

    d.queue.submit([encoder.finish()]);
    if (pickSlot) this._resolvePick(pickSlot);
  }

  // -----------------------------------------------------------------------
  // 仕上げレンダリング（ZBrush の BPR 相当）
  //
  // ここが GPU の使い所。彫刻の計算を GPU に出すと結果を CPU に戻す転送が
  // 支配的になって遅くなるが（実測 3.2ms 対 27ms）、レンダリングは結果を
  // 戻す必要がない。PNG にするときだけ 1 回読み戻す。
  //
  // やっていること:
  //   1. 光源から深度だけを描く（シャドウマップ）
  //   2. 解像度を 2〜4 倍に上げて本描画（影 + 拡散光つき）
  //   3. AO のサンプル数を 24 → 64 に上げる
  //   4. 輪郭線を合成

const el = (tag, cls, parent) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (parent) parent.appendChild(n);
  return n;
};
