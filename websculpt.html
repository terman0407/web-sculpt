const AXIS_COLOR = [[0.94, 0.29, 0.31], [0.44, 0.82, 0.27], [0.31, 0.53, 0.97]];
const CENTER_COLOR = [0.87, 0.88, 0.92];

const RING_SEGS = 48;        // 回転リングの描画分割数
const HIT_RING_SEGS = 32;    // ヒットテスト用の分割数。弦と弧のずれは半径の 0.5% で
                             // 許容距離よりずっと小さいので描画より粗くてよい
const HEAD_LEN = 0.14;       // 矢印の先端長 / 軸長
const HEAD_RAD = 0.045;
const PLANE_OFF = 0.42;      // 平面ハンドルの中心位置 / 軸長
const PLANE_HALF = 0.09;
const CENTER_HALF = 0.06;

// スナップ幅。角度と倍率は絶対値で決まるが、移動だけは世界の寸法が分からないので
// ハンドル長（= 呼び出し側が決めたギズモの大きさ）に対する比で決める。
const SNAP_ANGLE = Math.PI / 12;   // 15 度
const SNAP_FACTOR = 0.1;
const SNAP_MOVE_FRAC = 0.1;

const EPS_DIR = 1e-7;
const MIN_FACTOR = 0.01;     // これ以下に縮めない（負に通すと面が裏返る）
const MAX_FACTOR = 100;

// 四角ハンドルの角と立方体の辺。毎フレーム作らないようモジュール定数にしてある
const QUAD_U = [1, 1, -1, -1];
const QUAD_V = [1, -1, -1, 1];
const BOX_EDGES = [0, 1, 0, 2, 0, 4, 1, 3, 1, 5, 2, 3, 2, 6, 3, 7, 4, 5, 4, 6, 5, 7, 6, 7];

function growI32(src, n) {
  const a = new Int32Array(Math.max(1024, n, src.length * 2));
  a.set(src);
  return a;
}

/** レイ（原点 o・単位方向 d・t >= 0）と線分 [a,b] の最短距離の 2 乗 */
function raySegDist2(ox, oy, oz, dx, dy, dz, ax, ay, az, bx, by, bz) {
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const wx = ax - ox, wy = ay - oy, wz = az - oz;
  const uu = ux * ux + uy * uy + uz * uz;
  const ud = ux * dx + uy * dy + uz * dz;
  const uw = ux * wx + uy * wy + uz * wz;
  const dw = dx * wx + dy * wy + dz * wz;
  // s: 線分上の位置 0..1 / t: レイ上の位置 >= 0
  const den = uu - ud * ud;
  let s;
  if (den < 1e-12 * (uu + 1)) s = 0;                    // ほぼ平行
  else s = (ud * dw - uw) / den;
  if (s < 0) s = 0; else if (s > 1) s = 1;
  let t = dw + s * ud;
  if (t < 0) t = 0;
  const cx = ax + ux * s - (ox + dx * t);
  const cy = ay + uy * s - (oy + dy * t);
  const cz = az + uz * s - (oz + dz * t);
  return cx * cx + cy * cy + cz * cz;
}

/** レイと点の最短距離の 2 乗 */
function rayPointDist2(ox, oy, oz, dx, dy, dz, px, py, pz) {
  const wx = px - ox, wy = py - oy, wz = pz - oz;
  let t = wx * dx + wy * dy + wz * dz;
  if (t < 0) t = 0;
  const cx = wx - dx * t, cy = wy - dy * t, cz = wz - dz * t;
  return cx * cx + cy * cy + cz * cz;
}

/**
 * 3x3 対称行列のヤコビ回転による固有値分解。
 * a は破壊的に書き換える。固有ベクトル j は V の列（V[0*3+j], V[3+j], V[6+j]）。
 * 3x3 なので反復は数回で収束し、特性方程式の解析解より桁落ちに強い。
 */
function jacobiEigen3(a, V, w) {
  V[0] = 1; V[1] = 0; V[2] = 0;
  V[3] = 0; V[4] = 1; V[5] = 0;
  V[6] = 0; V[7] = 0; V[8] = 1;
  for (let sweep = 0; sweep < 16; sweep++) {
    const off = Math.abs(a[1]) + Math.abs(a[2]) + Math.abs(a[5]);
    if (off < 1e-18) break;
    for (let p = 0; p < 2; p++) {
      for (let q = p + 1; q < 3; q++) {
        const apq = a[p * 3 + q];
        if (Math.abs(apq) < 1e-20) continue;
        const app = a[p * 3 + p], aqq = a[q * 3 + q];
        const theta = (aqq - app) / (2 * apq);
        // theta = 0（対角が等しい）ときは 45 度回転になるよう符号 +1 を選ぶ
        const sg = theta >= 0 ? 1 : -1;
        const t = sg / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
        const c = 1 / Math.sqrt(t * t + 1), s = t * c;
        a[p * 3 + p] = app - t * apq;
        a[q * 3 + q] = aqq + t * apq;
        a[p * 3 + q] = 0; a[q * 3 + p] = 0;
        for (let r = 0; r < 3; r++) {
          if (r === p || r === q) continue;
          const arp = a[r * 3 + p], arq = a[r * 3 + q];
          a[r * 3 + p] = c * arp - s * arq; a[p * 3 + r] = a[r * 3 + p];
          a[r * 3 + q] = s * arp + c * arq; a[q * 3 + r] = a[r * 3 + q];
        }
        for (let r = 0; r < 3; r++) {
          const vrp = V[r * 3 + p], vrq = V[r * 3 + q];
          V[r * 3 + p] = c * vrp - s * vrq;
          V[r * 3 + q] = s * vrp + c * vrq;
        }
      }
    }
  }
  w[0] = a[0]; w[1] = a[4]; w[2] = a[8];
}

const EMPTY_HANDLES = [];

function makeHandleStore() {
  const list = [];
  // 矢印 = 軸 1 本 + 先端 4 本 + 先端の底リング 4 本 = 9 線分
  for (let i = 0; i < 3; i++) {
    list.push({ kind: 'move', axis: i, points: new Float32Array(9 * 6), color: AXIS_COLOR[i] });
  }
  for (let i = 0; i < 3; i++) {
    list.push({ kind: 'scale', axis: i, points: new Float32Array(4 * 6), color: AXIS_COLOR[i] });
  }
  for (let i = 0; i < 3; i++) {
    list.push({ kind: 'rotate', axis: i, points: new Float32Array(RING_SEGS * 6), color: AXIS_COLOR[i] });
  }
  list.push({ kind: 'uniform', axis: -1, points: new Float32Array(12 * 6), color: CENTER_COLOR });
  return list;
}

// ---------------------------------------------------------------------------

class Transpose {
  constructor() {
    this._active = false;
    this._pivot = new Float32Array(3);
    // 軸 i の単位ベクトルは _basis[i * 3 .. i * 3 + 2]（3 本の行として持つ）
    this._basis = new Float32Array(9);
    this._identityBasis();

    this._verts = new Int32Array(0);      // 領域頂点（weight > 0）
    this._weights = new Float32Array(0);  // 1 - mask
    this._count = 0;
    this._wsum = 0;
    // 領域は頂点インデックスの配列なので、外でトポロジが変わったら意味を失う。
    // SubdivLevels.validate と同じ流儀で topoVersion を控えて突き合わせる。
    this._guard = -1;
    this._orig = new Float32Array(0);     // ドラッグ開始時の座標（絶対変換の基準）
    this._nset = new Int32Array(0);       // 法線を直す頂点（領域 + その 1-ring）
    this._nsetCount = 0;
    this._stamp = new Int32Array(0);
    this._stampId = 0;

    this._handles = null;
    this._lastScale = 1;
    this._ringScratch = new Float64Array(12);   // 矢印の先端リング（毎フレーム使い回す）

    // --- ドラッグ状態 ---------------------------------------------------
    this._kind = null;
    this._axis = -1;
    this._dragPivot = new Float32Array(3);   // 開始時のピボット（変換の中心）
    this._dragBasis = new Float32Array(9);   // 開始時の基底（変換の軸）
    this._planeN = new Float32Array(3);      // uniform の参照平面法線（視線で固定）
    this._refDir = new Float32Array(3);      // uniform の参照方向（符号付き半径用）
    this._planeScratch = new Float64Array(3);
    this._s0 = 0;         // move: 軸上の開始位置
    this._sCur = 0;       // move: 直近の軸上位置（退化フレームで前値を保つ）
    this._angPrev = 0;    // rotate: 直近の生の角度
    this._angAcc = 0;     // rotate: 累積角（1 回転を超えても連続する）
    this._r0 = 0;         // scale: 開始半径
    this._u0 = 0; this._v0 = 0;  // scale: 平面内の開始方向（符号付き半径用）
    this._factor = 1;
    this._refOk = false;  // 基準量が取れているか（退化した掴み方だと取れない）
    this._lastChanged = 0;
    this._touched = false;
    this._normalsStale = false;

    this._D = new Float64Array(9);   // 変換 A から単位行列を引いたもの（後述）
    this._result = { changed: 0, kind: null, axis: -1, offset: 0, degrees: 0, factor: 1 };
  }

  _identityBasis() {
    const B = this._basis;
    B[0] = 1; B[1] = 0; B[2] = 0;
    B[3] = 0; B[4] = 1; B[5] = 0;
    B[6] = 0; B[7] = 0; B[8] = 1;
  }

  get active() { return this._active; }

  /**
   * 内部の配列も解放する（トランスポーズモードを抜けるとき）。
   * ドラッグ中なら先に endDrag / cancelDrag を呼ぶこと。mesh を受け取らないので
   * mods.normals = false で後回しにした法線をここでは清算できない。
   */
  clear() {
    this._active = false;
    this._kind = null;
    this._axis = -1;
    this._count = 0;
    this._wsum = 0;
    this._guard = -1;
    this._verts = new Int32Array(0);
    this._weights = new Float32Array(0);
    this._orig = new Float32Array(0);
    this._nset = new Int32Array(0);
    this._nsetCount = 0;
    // stamp は capV ぶん（数百万頂点で 12MB）あるので一緒に返す。
    // _stampId は増やしたままにしておけば、次に確保したゼロ埋め配列と衝突しない。
    this._stamp = new Int32Array(0);
    this._lastChanged = 0;
    this._touched = false;
    this._normalsStale = false;
    this._pivot[0] = 0; this._pivot[1] = 0; this._pivot[2] = 0;
    this._identityBasis();
  }

  /** ピボット（ワールド）。ドラッグ中の移動もここに反映される */
  pivot() { return [this._pivot[0], this._pivot[1], this._pivot[2]]; }

  /**
   * 基底。軸 i は [i * 3 + 0..2]。毎フレーム呼ばれるので内部配列をそのまま返す
   * （書き換えないこと）。
   */
  basis() { return this._basis; }

  /** 領域の統計（UI 表示用） */
  stats() {
    return { active: this._active, verts: this._count, weightSum: this._wsum, dragging: this._kind };
  }

  /**
   * 領域がまだこのメッシュのものか確かめる。ダイナメッシュ / 細分化 / 分離のあとは
   * 同じ頂点番号が別の頂点を指すので、控えた領域で書き込むと無関係な場所が動く
   * （範囲外は黙って捨てられるので気付けない）。false が返ったら setFromMask を
   * やり直す。beginDrag も内部でこれを通す。
   * @returns {boolean} まだ使えるか
   */
  validate(mesh) {
    if (!this._active) return false;
    if (mesh.topoVersion === this._guard) return true;
    this.clear();
    return false;
  }

  // --- 領域とピボットの決定 ----------------------------------------------

  /**
   * マスクされていない領域からピボットと基底を決める。
   * マスクが真っ白（全部 0）なら領域はメッシュ全体になる（ZBrush と同じ）。
   *
   * @param {SculptMesh} mesh
   * @param {object} opts
   *   basis     : 'world'（既定）| 'pca'  領域の主成分をローカル軸にする
   *   threshold : これ以下の weight は領域に入れない（既定 1e-4）
   * @returns {boolean} 領域が空なら false
   */
  setFromMask(mesh, opts = {}) {
    // ドラッグ中に呼ばれたら、その変形は確定済みとして扱い状態だけ捨てる。
    // mods.normals = false で後回しにしていたぶんはここで清算しておく。以後
    // endDrag は来ないので、やらないと法線が永久に 1 フレーム前のままになる。
    if (this._normalsStale && mesh.topoVersion === this._guard) {
      mesh.computeNormalsFor(this._nset, this._nsetCount);
    }
    this._normalsStale = false;
    this._kind = null;
    this._touched = false;
    this._lastChanged = 0;
    const thr = opts.threshold !== undefined ? opts.threshold : 1e-4;
    const nv = mesh.nv;
    const M = mesh.mask, A = mesh.vAlive, P = mesh.positions;

    // 件数を数えてから 1 回で確保する（push を使わないため）
    let n = 0;
    for (let v = 0; v < nv; v++) {
      if (A[v] === 0) continue;
      const mk = M[v];
      if (1 - (mk < 0 ? 0 : (mk > 1 ? 1 : mk)) > thr) n++;
    }
    if (n === 0) { this.clear(); return false; }

    if (this._verts.length < n) {
      this._verts = new Int32Array(n);
      this._weights = new Float32Array(n);
    }
    const V = this._verts, W = this._weights;
    let k = 0;
    let cx = 0, cy = 0, cz = 0, wsum = 0;
    for (let v = 0; v < nv; v++) {
      if (A[v] === 0) continue;
      const mk = M[v];
      const w = 1 - (mk < 0 ? 0 : (mk > 1 ? 1 : mk));
      if (w <= thr) continue;
      V[k] = v; W[k] = w; k++;
      const i = v * 3;
      cx += P[i] * w; cy += P[i + 1] * w; cz += P[i + 2] * w;
      wsum += w;
    }
    this._count = k;
    this._wsum = wsum;
    if (wsum <= 0) { this.clear(); return false; }

    // ピボットは加重重心。マスクのグラデーションがそのまま「引っぱりの中心」に
    // 効くので、部分マスクでも直感どおりの位置になる。
    const inv = 1 / wsum;
    this._pivot[0] = cx * inv; this._pivot[1] = cy * inv; this._pivot[2] = cz * inv;

    if (opts.basis === 'pca') this._basisFromPCA(mesh);
    else this._identityBasis();

    this._guard = mesh.topoVersion;
    this._active = true;
    return true;
  }

  /**
   * 領域の主成分を基底にする（ZBrush の Gizmo のローカル軸相当）。
   * 共分散行列は 3x3 なのでヤコビ回転で十分。
   */
  _basisFromPCA(mesh) {
    const P = mesh.positions, V = this._verts, W = this._weights, n = this._count;
    const px = this._pivot[0], py = this._pivot[1], pz = this._pivot[2];
    let cxx = 0, cyy = 0, czz = 0, cxy = 0, cxz = 0, cyz = 0;
    for (let k = 0; k < n; k++) {
      const i = V[k] * 3, w = W[k];
      const dx = P[i] - px, dy = P[i + 1] - py, dz = P[i + 2] - pz;
      cxx += dx * dx * w; cyy += dy * dy * w; czz += dz * dz * w;
      cxy += dx * dy * w; cxz += dx * dz * w; cyz += dy * dz * w;
    }
    const inv = 1 / this._wsum;
    // 対角が全部ゼロ（1 点に縮退）なら主成分は定まらないのでワールド軸に落とす
    if ((cxx + cyy + czz) * inv < 1e-20) { this._identityBasis(); return; }
    const a = new Float64Array(9);
    a[0] = cxx * inv; a[4] = cyy * inv; a[8] = czz * inv;
    a[1] = a[3] = cxy * inv;
    a[2] = a[6] = cxz * inv;
    a[5] = a[7] = cyz * inv;
    const Vm = new Float64Array(9), ev = new Float64Array(3);
    jacobiEigen3(a, Vm, ev);

    // 固有値の降順に並べる（3 個なので添字を直接入れ替える）
    let i0 = 0, i1 = 1, i2 = 2;
    if (ev[i1] > ev[i0]) { const t = i0; i0 = i1; i1 = t; }
    if (ev[i2] > ev[i0]) { const t = i0; i0 = i2; i2 = t; }
    if (ev[i2] > ev[i1]) { const t = i1; i1 = i2; i2 = t; }

    const B = this._basis;
    // 固有ベクトルの符号は不定なので「絶対値最大の成分を正にする」で固定する。
    // そうしないと同じ形に対して setFromMask を呼び直すたびに軸が反転して、
    // ハンドルの向きがちらつく。
    this._putEigen(B, 0, Vm, i0);
    this._putEigen(B, 1, Vm, i1);
    // 2 本目を 1 本目に直交化（固有ベクトルは数値誤差で完全直交ではない）
    {
      const d = B[3] * B[0] + B[4] * B[1] + B[5] * B[2];
      B[3] -= B[0] * d; B[4] -= B[1] * d; B[5] -= B[2] * d;
      const l = Math.hypot(B[3], B[4], B[5]);
      if (l < 1e-9) { this._identityBasis(); return; }
      B[3] /= l; B[4] /= l; B[5] /= l;
    }
    // 3 本目は外積で作る。第 3 固有ベクトルをそのまま使うと符号固定のあとで
    // 左手系になることがあり、回転の向きが軸ごとに食い違う。
    B[6] = B[1] * B[5] - B[2] * B[4];
    B[7] = B[2] * B[3] - B[0] * B[5];
    B[8] = B[0] * B[4] - B[1] * B[3];
  }

  _putEigen(B, row, Vm, col) {
    let x = Vm[col], y = Vm[3 + col], z = Vm[6 + col];
    const l = Math.hypot(x, y, z);
    if (l < 1e-12) { x = row === 0 ? 1 : 0; y = row === 1 ? 1 : 0; z = row === 2 ? 1 : 0; }
    else { x /= l; y /= l; z /= l; }
    const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
    const m = ax >= ay && ax >= az ? x : (ay >= az ? y : z);
    if (m < 0) { x = -x; y = -y; z = -z; }
    B[row * 3] = x; B[row * 3 + 1] = y; B[row * 3 + 2] = z;
  }

  // --- ハンドル形状 -------------------------------------------------------

  /**
   * ハンドルをワールド座標の線分リストとして返す。
   * points は 2 点ずつが 1 線分（line-list 用）で、要素数は常に 6 の倍数。
   * 回転リングも「円周上の点列」を線分に展開して返すので、呼び出し側は
   * 種類を区別せずそのまま線で描ける。
   *
   * 毎フレーム呼ばれるので配列は使い回す（返ってきた Float32Array を保持せず、
   * その場で GPU へ書くこと）。
   *
   * @param {number} scale ギズモの大きさ（ワールド）。矢印の全長 = リング半径
   */
  handles(scale = 1) {
    // 領域が無いときは空を返す。呼び出し側が active を見ずに描いても何も出ない
    if (!this._active) return EMPTY_HANDLES;
    if (!this._handles) this._handles = makeHandleStore();
    const H = this._handles;
    const L = scale > 0 ? scale : 1;
    this._lastScale = L;
    const B = this._basis;
    const px = this._pivot[0], py = this._pivot[1], pz = this._pivot[2];

    for (let i = 0; i < 3; i++) {
      const ax = B[i * 3], ay = B[i * 3 + 1], az = B[i * 3 + 2];
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
      const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];

      // --- 矢印 ---------------------------------------------------------
      {
        const p = H[i].points, rp = this._ringScratch;
        const bl = L * (1 - HEAD_LEN), hr = L * HEAD_RAD;
        const bx = px + ax * bl, by = py + ay * bl, bz = pz + az * bl;
        const tx = px + ax * L, ty = py + ay * L, tz = pz + az * L;
        p[0] = px; p[1] = py; p[2] = pz;
        p[3] = bx; p[4] = by; p[5] = bz;
        // 先端の底リング 4 点を (+u, +v, -u, -v) の順に作る
        for (let e = 0; e < 4; e++) {
          const su = e === 0 ? 1 : (e === 2 ? -1 : 0);
          const sv = e === 1 ? 1 : (e === 3 ? -1 : 0);
          const o = e * 3;
          rp[o] = bx + (ux * su + vx * sv) * hr;
          rp[o + 1] = by + (uy * su + vy * sv) * hr;
          rp[o + 2] = bz + (uz * su + vz * sv) * hr;
        }
        // 「先端 → 各点」と「隣り合う点どうし」で円錐の輪郭になる
        let o = 6;
        for (let e = 0; e < 4; e++) {
          const a0 = e * 3;
          p[o] = tx; p[o + 1] = ty; p[o + 2] = tz;
          p[o + 3] = rp[a0]; p[o + 4] = rp[a0 + 1]; p[o + 5] = rp[a0 + 2];
          o += 6;
        }
        for (let e = 0; e < 4; e++) {
          const a0 = e * 3, b0 = ((e + 1) & 3) * 3;
          p[o] = rp[a0]; p[o + 1] = rp[a0 + 1]; p[o + 2] = rp[a0 + 2];
          p[o + 3] = rp[b0]; p[o + 4] = rp[b0 + 1]; p[o + 5] = rp[b0 + 2];
          o += 6;
        }
      }

      // --- 平面スケールハンドル（法線が軸 i / 面内が軸 j,k）-------------
      {
        const p = H[3 + i].points;
        const off = L * PLANE_OFF, h = L * PLANE_HALF;
        const cx = px + (ux + vx) * off, cy = py + (uy + vy) * off, cz = pz + (uz + vz) * off;
        let o = 0;
        for (let e = 0; e < 4; e++) {
          const f = (e + 1) & 3;
          p[o] = cx + (ux * QUAD_U[e] + vx * QUAD_V[e]) * h;
          p[o + 1] = cy + (uy * QUAD_U[e] + vy * QUAD_V[e]) * h;
          p[o + 2] = cz + (uz * QUAD_U[e] + vz * QUAD_V[e]) * h;
          p[o + 3] = cx + (ux * QUAD_U[f] + vx * QUAD_V[f]) * h;
          p[o + 4] = cy + (uy * QUAD_U[f] + vy * QUAD_V[f]) * h;
          p[o + 5] = cz + (uz * QUAD_U[f] + vz * QUAD_V[f]) * h;
          o += 6;
        }
      }

      // --- 回転リング ---------------------------------------------------
      {
        const p = H[6 + i].points;
        const dth = (Math.PI * 2) / RING_SEGS;
        let o = 0, c0 = L, s0 = 0;
        for (let e = 0; e < RING_SEGS; e++) {
          const th = (e + 1) * dth;
          const c1 = Math.cos(th) * L, s1 = Math.sin(th) * L;
          p[o] = px + ux * c0 + vx * s0;
          p[o + 1] = py + uy * c0 + vy * s0;
          p[o + 2] = pz + uz * c0 + vz * s0;
          p[o + 3] = px + ux * c1 + vx * s1;
          p[o + 4] = py + uy * c1 + vy * s1;
          p[o + 5] = pz + uz * c1 + vz * s1;
          c0 = c1; s0 = s1;
          o += 6;
        }
      }
    }

    // --- 中心の箱（一様スケール）-----------------------------------------
    {
      const p = H[9].points;
      const h = L * CENTER_HALF;
      for (let e = 0; e < 24; e++) {
        const s = BOX_EDGES[e];
        const sx = (s & 1) ? 1 : -1, sy = (s & 2) ? 1 : -1, sz = (s & 4) ? 1 : -1;
        p[e * 3] = px + (B[0] * sx + B[3] * sy + B[6] * sz) * h;
        p[e * 3 + 1] = py + (B[1] * sx + B[4] * sy + B[7] * sz) * h;
        p[e * 3 + 2] = pz + (B[2] * sx + B[5] * sy + B[8] * sz) * h;
      }
    }
    return H;
  }

  // --- ヒットテスト -------------------------------------------------------

  /**
   * どのハンドルに当たったかを返す。
   *
   * @param {ArrayLike<number>} rayOrigin ワールド
   * @param {ArrayLike<number>} rayDir    ワールド（正規化していなくてよい）
   * @param {number} tol 画面上の許容距離をワールドに換算した値
   * @param {number} scale handles() に渡すのと同じギズモの大きさ
   * @returns {{kind: string, axis: number}|null}
   */
  hitTest(rayOrigin, rayDir, tol, scale = this._lastScale) {
    if (!this._active) return null;
    const L = scale > 0 ? scale : 1;
    this._lastScale = L;
    let dx = rayDir[0], dy = rayDir[1], dz = rayDir[2];
    const dl = Math.hypot(dx, dy, dz);
    if (dl < 1e-20) return null;
    dx /= dl; dy /= dl; dz /= dl;
    const ox = rayOrigin[0], oy = rayOrigin[1], oz = rayOrigin[2];
    const t = tol > 0 ? tol : L * 0.04;
    const B = this._basis;
    const px = this._pivot[0], py = this._pivot[1], pz = this._pivot[2];

    // 「距離 / そのハンドルの許容半径」が最小のものを選ぶ。許容半径がハンドルごとに
    // 違う（点ハンドルは自分の大きさぶん広い）ので、生の距離では比べられない。
    let best = 1, kind = null, axis = -1;

    // 中心は矢印の根元と重なる。先に見て厳密不等号で比べることで、
    // ど真ん中を掴んだら一様スケールになる（他ツールと同じ挙動）。
    {
      const r = t + L * CENTER_HALF;
      const s = Math.sqrt(rayPointDist2(ox, oy, oz, dx, dy, dz, px, py, pz)) / r;
      if (s < best) { best = s; kind = 'uniform'; axis = -1; }
    }
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
      const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];
      const off = L * PLANE_OFF;
      const r = t + L * PLANE_HALF;
      const s = Math.sqrt(rayPointDist2(ox, oy, oz, dx, dy, dz,
        px + (ux + vx) * off, py + (uy + vy) * off, pz + (uz + vz) * off)) / r;
      if (s < best) { best = s; kind = 'scale'; axis = i; }
    }
    for (let i = 0; i < 3; i++) {
      const s = Math.sqrt(raySegDist2(ox, oy, oz, dx, dy, dz, px, py, pz,
        px + B[i * 3] * L, py + B[i * 3 + 1] * L, pz + B[i * 3 + 2] * L)) / t;
      if (s < best) { best = s; kind = 'move'; axis = i; }
    }
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
      const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];
      const dth = (Math.PI * 2) / HIT_RING_SEGS;
      let d2 = Infinity, c0 = L, s0 = 0;
      for (let e = 0; e < HIT_RING_SEGS; e++) {
        const th = (e + 1) * dth;
        const c1 = Math.cos(th) * L, s1 = Math.sin(th) * L;
        const q = raySegDist2(ox, oy, oz, dx, dy, dz,
          px + ux * c0 + vx * s0, py + uy * c0 + vy * s0, pz + uz * c0 + vz * s0,
          px + ux * c1 + vx * s1, py + uy * c1 + vy * s1, pz + uz * c1 + vz * s1);
        if (q < d2) d2 = q;
        c0 = c1; s0 = s1;
      }
      const s = Math.sqrt(d2) / t;
      if (s < best) { best = s; kind = 'rotate'; axis = i; }
    }
    return kind === null ? null : { kind, axis };
  }

  // --- ドラッグ -----------------------------------------------------------

  /**
   * ドラッグ開始。領域の座標を控え、ハンドル種別ごとの基準量を求める。
   * 前回の setFromMask からトポロジが変わっていたら領域を捨てて false を返す
   * （validate 参照）。
   * @returns {boolean} 掴めたか
   */
  beginDrag(mesh, hit, rayOrigin, rayDir) {
    if (!this._active || !hit || this._count === 0) return false;
    if (!this.validate(mesh)) return false;
    const kind = hit.kind;
    if (kind !== 'move' && kind !== 'rotate' && kind !== 'scale' && kind !== 'uniform') return false;
    let dx = rayDir[0], dy = rayDir[1], dz = rayDir[2];
    const dl = Math.hypot(dx, dy, dz);
    if (dl < 1e-20) return false;
    dx /= dl; dy /= dl; dz /= dl;

    // 開始時の座標を控える。これがあるので毎フレーム「元位置からの絶対変換」で
    // 書けて、cancelDrag もビット単位で元へ戻せる（f32 → f32 のコピーは無損失）。
    const n = this._count;
    if (this._orig.length < n * 3) this._orig = new Float32Array(n * 3);
    const P = mesh.positions, V = this._verts, O = this._orig;
    for (let k = 0; k < n; k++) {
      const i = V[k] * 3, o = k * 3;
      O[o] = P[i]; O[o + 1] = P[i + 1]; O[o + 2] = P[i + 2];
    }
    // トポロジはドラッグ中に変わらないので、法線を直す集合は 1 回だけ作る
    this._buildNormalSet(mesh);

    this._kind = kind;
    this._axis = kind === 'uniform' ? -1 : (hit.axis | 0);
    this._dragPivot.set(this._pivot);
    this._dragBasis.set(this._basis);
    this._factor = 1;
    this._angAcc = 0;
    this._lastChanged = 0;
    this._touched = false;
    this._normalsStale = false;
    this._refOk = false;

    const B = this._dragBasis;
    const i3 = this._axis * 3;
    const ox = rayOrigin[0], oy = rayOrigin[1], oz = rayOrigin[2];
    if (kind === 'move') {
      // 視線が軸と重なっていると軸上の位置が決まらない。そこで 0 を基準にすると
      // 最初の有効フレームで形が飛ぶので、回転と同じく「最初に取れたフレーム」を
      // 基準にする（取れるまでは変位ゼロ）。
      const s = this._axisParam(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2], NaN);
      this._refOk = Number.isFinite(s);
      this._s0 = this._refOk ? s : 0;
      this._sCur = this._s0;
    } else if (kind === 'rotate') {
      const a = this._planeAngle(ox, oy, oz, dx, dy, dz, this._axis);
      if (Number.isFinite(a)) { this._angPrev = a; this._refOk = true; }
    } else if (kind === 'scale') {
      const j = (this._axis + 1) % 3, k = (this._axis + 2) % 3;
      const q = this._planeHit(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2]);
      if (q) {
        const cu = q[0] * B[j * 3] + q[1] * B[j * 3 + 1] + q[2] * B[j * 3 + 2];
        const cv = q[0] * B[k * 3] + q[1] * B[k * 3 + 1] + q[2] * B[k * 3 + 2];
        const r = Math.hypot(cu, cv);
        if (r > 1e-9) {
          // 掴んだ向きを基準方向にして「符号付きの半径」で倍率を測る。
          // 単純な距離だとピボットを通り越したときに倍率が折り返してしまう。
          this._u0 = cu / r; this._v0 = cv / r; this._r0 = r; this._refOk = true;
        }
      }
    } else {
      // uniform: 視線に垂直な平面を開始時の向きで固定する。毎フレーム視線から
      // 取り直すと透視投影では法線がわずかに変わり、倍率がふらつく。
      this._planeN[0] = -dx; this._planeN[1] = -dy; this._planeN[2] = -dz;
      const q = this._planeHit(ox, oy, oz, dx, dy, dz,
        this._planeN[0], this._planeN[1], this._planeN[2]);
      if (q) {
        const r = Math.hypot(q[0], q[1], q[2]);
        if (r > 1e-9) {
          this._refDir[0] = q[0] / r; this._refDir[1] = q[1] / r; this._refDir[2] = q[2] / r;
          this._r0 = r; this._refOk = true;
        }
      }
    }
    return true;
  }

  /**
   * 新しいレイでドラッグを更新する。常に開始時の座標から作り直すので、
   * 同じレイで何度呼んでも結果は変わらない（べき等）。
   *
   * @param {object} mods
   *   snap    : 移動 / 角度 / 倍率をきりの良い値に丸める
   *   normals : false を渡すと法線の再計算を飛ばす（endDrag でまとめて直す）。
   *             数百万頂点で対話性を優先したいときだけ使う
   * @returns {{changed:number, kind:string, axis:number, offset:number, degrees:number, factor:number}}
   *          戻り値のオブジェクトは使い回す（毎フレームのゴミを作らないため）。
   */
  updateDrag(mesh, rayOrigin, rayDir, mods = null) {
    const res = this._result;
    res.changed = 0; res.kind = this._kind; res.axis = this._axis;
    res.offset = 0; res.degrees = 0; res.factor = 1;
    if (!this._active || !this._kind) return res;

    let dx = rayDir[0], dy = rayDir[1], dz = rayDir[2];
    const dl = Math.hypot(dx, dy, dz);
    if (dl < 1e-20) return res;
    dx /= dl; dy /= dl; dz /= dl;
    const ox = rayOrigin[0], oy = rayOrigin[1], oz = rayOrigin[2];
    const snap = !!(mods && mods.snap);
    const B = this._dragBasis;
    const px = this._dragPivot[0], py = this._dragPivot[1], pz = this._dragPivot[2];
    const i3 = this._axis * 3;
    let changed = 0;

    if (this._kind === 'move') {
      const ax = B[i3], ay = B[i3 + 1], az = B[i3 + 2];
      const s = this._axisParam(ox, oy, oz, dx, dy, dz, ax, ay, az, NaN);
      if (Number.isFinite(s)) {
        if (!this._refOk) { this._s0 = s; this._refOk = true; }
        this._sCur = s;   // 退化フレームでは前値を保つ（形が飛ばない）
      }
      let off = this._sCur - this._s0;
      if (snap) {
        const step = Math.max(1e-9, this._lastScale * SNAP_MOVE_FRAC);
        off = Math.round(off / step) * step;
      }
      changed = this._applyTranslate(mesh, ax * off, ay * off, az * off);
      this._pivot[0] = px + ax * off;
      this._pivot[1] = py + ay * off;
      this._pivot[2] = pz + az * off;
      res.offset = off;
    } else if (this._kind === 'rotate') {
      const a = this._planeAngle(ox, oy, oz, dx, dy, dz, this._axis);
      if (Number.isFinite(a)) {
        if (!this._refOk) { this._angPrev = a; this._refOk = true; }
        // 差分を -π..π に畳んで足すことで、1 回転を超えても連続に増える
        let d = a - this._angPrev;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        this._angPrev = a;
        this._angAcc += d;
      }
      let ang = this._angAcc;
      if (snap) ang = Math.round(ang / SNAP_ANGLE) * SNAP_ANGLE;
      this._rotationDelta(B[i3], B[i3 + 1], B[i3 + 2], ang);
      changed = this._applyLinear(mesh);
      this._rotateBasis();
      res.degrees = ang * 180 / Math.PI;
    } else {
      let f = this._factor;
      if (this._kind === 'scale') {
        const j = (this._axis + 1) % 3, k = (this._axis + 2) % 3;
        if (this._refOk) {
          const q = this._planeHit(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2]);
          if (q) {
            const cu = q[0] * B[j * 3] + q[1] * B[j * 3 + 1] + q[2] * B[j * 3 + 2];
            const cv = q[0] * B[k * 3] + q[1] * B[k * 3 + 1] + q[2] * B[k * 3 + 2];
            f = (cu * this._u0 + cv * this._v0) / this._r0;
          }
        }
        f = this._snapFactor(f, snap);
        this._factor = f;
        this._planeScaleDelta(j, k, f - 1);
      } else {
        if (this._refOk) {
          const q = this._planeHit(ox, oy, oz, dx, dy, dz,
            this._planeN[0], this._planeN[1], this._planeN[2]);
          if (q) {
            f = (q[0] * this._refDir[0] + q[1] * this._refDir[1] + q[2] * this._refDir[2]) / this._r0;
          }
        }
        f = this._snapFactor(f, snap);
        this._factor = f;
        const D = this._D, g = f - 1;
        D[0] = g; D[1] = 0; D[2] = 0;
        D[3] = 0; D[4] = g; D[5] = 0;
        D[6] = 0; D[7] = 0; D[8] = g;
      }
      changed = this._applyLinear(mesh);
      res.factor = f;
    }

    res.changed = changed;
    // 前フレームで動いていて今フレームで元に戻った場合も法線を直す必要がある
    // （位置は元どおりでも法線が前フレームのままになる）
    if (changed > 0 || this._lastChanged > 0) {
      mesh.geomVersion++;
      if (mods && mods.normals === false) {
        this._normalsStale = true;
      } else {
        mesh.computeNormalsFor(this._nset, this._nsetCount);
        this._normalsStale = false;
      }
    }
    if (changed > 0) this._touched = true;
    this._lastChanged = changed;
    return res;
  }

  /**
   * ドラッグ確定。ピボット / 基底はドラッグ中に更新した値をそのまま残す
   * （移動したら次のドラッグもその位置から始まる）。
   * 履歴の commit と曲率の再計算は呼び出し側で行う。
   */
  endDrag(mesh) {
    const kind = this._kind;
    let changed = 0;
    if (kind && this._touched) {
      if (this._normalsStale) {
        mesh.computeNormalsFor(this._nset, this._nsetCount);
        this._normalsStale = false;
      }
      const P = mesh.positions, V = this._verts, O = this._orig, n = this._count;
      for (let k = 0; k < n; k++) {
        const i = V[k] * 3, o = k * 3;
        if (P[i] !== O[o] || P[i + 1] !== O[o + 1] || P[i + 2] !== O[o + 2]) changed++;
      }
    }
    this._kind = null;
    this._axis = -1;
    this._lastChanged = 0;
    this._touched = false;
    return { changed, kind };
  }

  /** ドラッグ中止。開始時の座標へビット単位で戻す */
  cancelDrag(mesh) {
    if (!this._kind) return { changed: 0, kind: null };
    const kind = this._kind;
    const P = mesh.positions, V = this._verts, O = this._orig, n = this._count;
    let changed = 0;
    for (let k = 0; k < n; k++) {
      const v = V[k], i = v * 3, o = k * 3;
      if (P[i] !== O[o] || P[i + 1] !== O[o + 1] || P[i + 2] !== O[o + 2]) {
        P[i] = O[o]; P[i + 1] = O[o + 1]; P[i + 2] = O[o + 2];
        mesh.markVert(v);
        changed++;
      }
    }
    this._pivot.set(this._dragPivot);
    this._basis.set(this._dragBasis);
    if (changed > 0 || this._normalsStale) {
      mesh.geomVersion++;
      mesh.computeNormalsFor(this._nset, this._nsetCount);
      this._normalsStale = false;
    }
    this._kind = null;
    this._axis = -1;
    this._lastChanged = 0;
    this._touched = false;
    return { changed, kind };
  }

  // --- 内部：レイと基準量 -------------------------------------------------

  /**
   * 直線（ピボット + a * s）とレイの最近接位置 s。ほぼ平行なら fallback を返す。
   * 前フレームの値を fallback にすることで、視線が軸と重なったフレームでも
   * 形が飛ばない。
   */
  _axisParam(ox, oy, oz, dx, dy, dz, ax, ay, az, fallback) {
    const ad = ax * dx + ay * dy + az * dz;
    const den = 1 - ad * ad;
    if (den < 1e-9) return fallback;
    const rx = this._dragPivot[0] - ox, ry = this._dragPivot[1] - oy, rz = this._dragPivot[2] - oz;
    const ar = ax * rx + ay * ry + az * rz;
    const dr = dx * rx + dy * ry + dz * rz;
    return (ad * dr - ar) / den;
  }

  /**
   * ピボットを通り法線 n の平面とレイの交点（ピボット基準の相対座標）。
   * 交わらない / 背後なら null。1 フレーム数回しか呼ばないので配列で返す。
   */
  _planeHit(ox, oy, oz, dx, dy, dz, nx, ny, nz) {
    const nd = nx * dx + ny * dy + nz * dz;
    if (Math.abs(nd) < EPS_DIR) return null;
    const px = this._dragPivot[0], py = this._dragPivot[1], pz = this._dragPivot[2];
    const t = ((px - ox) * nx + (py - oy) * ny + (pz - oz) * nz) / nd;
    if (t <= 0) return null;
    const s = this._planeScratch;
    s[0] = ox + dx * t - px; s[1] = oy + dy * t - py; s[2] = oz + dz * t - pz;
    return s;
  }

  /**
   * 軸 i を法線とする平面上での角度。基底 (u, v, n) = (軸 i+1, 軸 i+2, 軸 i) は
   * u × v = n の右手系に並ぶので、ここで測った角がロドリゲス回転の符号と
   * そのまま一致する（軸ごとに符号を場合分けしなくてよい）。
   */
  _planeAngle(ox, oy, oz, dx, dy, dz, i) {
    const B = this._dragBasis;
    const i3 = i * 3;
    const q = this._planeHit(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2]);
    if (!q) return NaN;
    const j = (i + 1) % 3, k = (i + 2) % 3;
    const cu = q[0] * B[j * 3] + q[1] * B[j * 3 + 1] + q[2] * B[j * 3 + 2];
    const cv = q[0] * B[k * 3] + q[1] * B[k * 3 + 1] + q[2] * B[k * 3 + 2];
    if (Math.abs(cu) + Math.abs(cv) < 1e-12) return NaN;
    return Math.atan2(cv, cu);
  }

  _snapFactor(f, snap) {
    if (snap) f = Math.round(f / SNAP_FACTOR) * SNAP_FACTOR;
    return clamp(f, MIN_FACTOR, MAX_FACTOR);
  }

  // --- 内部：変換の適用 ---------------------------------------------------

  // 変換は「ピボット中心の線形変換 A」だが、保持するのは D = A - I。
  // 変位が D * (元位置 - ピボット) の 1 本の式になるので、回転 / 平面スケール /
  // 一様スケールを同じループで書けるうえ、変換なし（D = 0）のときに元の座標が

  for (let e = 0; e < 3; e++) {
    const a = T[i + e];
    const b = T[i + (e === 2 ? 0 : e + 1)];
    const sa = sign[a] * side, sb = sign[b] * side;
    if (sa >= 0) out[n++] = a;
    if ((sa > 0 && sb < 0) || (sa < 0 && sb > 0)) out[n++] = cutVertex(mesh, map, cl, a, b);
  }
  return n;
}

/**
 * verts とその 1-ring の法線・曲率を直す。切り口の周りだけで済むので、
 * 数百万頂点でも全体再計算（数十 ms）を避けられる。
 * @returns {number} 更新した頂点数
 */
function refreshAround(mesh, verts, count) {
  if (count <= 0) return 0;
  const nv = mesh.nv;
  const T = mesh.tris, RC = mesh.ringCount, RD = mesh.ringData, REX = mesh.ringExt;
  const A = mesh.vAlive;
  const seen = new Uint8Array(nv);
  let set = new Int32Array(Math.max(1024, count * 4));
  let n = 0;
  for (let k = 0; k < count; k++) {
    const v = verts[k];
    if (v < 0 || v >= nv || A[v] === 0) continue;
    if (seen[v] === 0) { seen[v] = 1; set = growI32(set, n + 1); set[n++] = v; }
    const rc = RC[v];
    if (rc === 0) continue;
    const inline = rc <= RING_STRIDE;
    const rb = inline ? v * RING_STRIDE : 0;
    const rex = inline ? null : REX[v];
    set = growI32(set, n + rc * 3);
    for (let j = 0; j < rc; j++) {
      const ti = (inline ? RD[rb + j] : rex[j]) * 3;
      let u = T[ti];
      if (seen[u] === 0) { seen[u] = 1; set[n++] = u; }
      u = T[ti + 1];
      if (seen[u] === 0) { seen[u] = 1; set[n++] = u; }
      u = T[ti + 2];
      if (seen[u] === 0) { seen[u] = 1; set[n++] = u; }
    }
  }
  if (n === 0) return 0;
  mesh.computeNormalsFor(set, n);
  mesh.computeCurvatureFor(set, n);
  mesh.smoothCurvatureFor(set, n);
  for (let k = 0; k < n; k++) mesh.markVert(set[k]);
  return n;
}

/** 三角形を 1 枚も持たなくなった頂点を回収する（裏側の頂点は全部これになる） */
function removeOrphans(mesh) {
  const A = mesh.vAlive, RC = mesh.ringCount;
  let removed = 0;
  for (let v = 0; v < mesh.nv; v++) {
    if (A[v] === 1 && RC[v] === 0) { mesh.removeVertex(v); removed++; }
  }
  return removed;
}

/**
 * 「両端が平面上にある境界辺」を輪郭ループとして拾い、重心へファンを張って塞ぐ。
 * 平面上に無い境界辺（元から開いていたメッシュの穴）は触らない。
 * @returns {object} { loops, added, addedTris, centers }
 */
function capPlanarHoles(mesh, cl) {
  const out = { loops: 0, added: 0, addedTris: 0, centers: [] };
  const onPlane = cl.onPlane;
  const nOn = onPlane.length;
  const nt = mesh.nt;
  const T = mesh.tris;

  // --- 候補となる有向辺（両端が平面上）を集める ---------------------------
  let ea = new Int32Array(256), eb = new Int32Array(256);
  let ne = 0;
  const seenDir = new Map();
  for (let t = 0; t < nt; t++) {
    const i = t * 3;
    const v0 = T[i], v1 = T[i + 1], v2 = T[i + 2];
    if (v0 === v1 && v1 === v2) continue;
    for (let e = 0; e < 3; e++) {
      const a = e === 0 ? v0 : (e === 1 ? v1 : v2);
      const b = e === 0 ? v1 : (e === 1 ? v2 : v0);
      if (a >= nOn || b >= nOn || onPlane[a] === 0 || onPlane[b] === 0) continue;
      ea = growI32(ea, ne + 1); eb = growI32(eb, ne + 1);
      ea[ne] = a; eb[ne] = b; ne++;
      const k = a * KEY_BASE + b;
      seenDir.set(k, (seenDir.get(k) || 0) + 1);
    }
  }
  if (ne === 0) return out;

  // 逆向きが存在しない有向辺だけが境界。平面上に乗っている内部辺
  // （平面と接している面や slice 済みの辺）はここで落ちる。
  const bA = new Int32Array(ne), bB = new Int32Array(ne);
  let bn = 0;
  for (let k = 0; k < ne; k++) {
    const a = ea[k], b = eb[k];
    if (seenDir.get(b * KEY_BASE + a)) continue;
    bA[bn] = a; bB[bn] = b; bn++;
  }
  if (bn < 3) return out;

  // --- 有向辺を繋いで輪郭を作る ------------------------------------------
  // 「頂点 → そこから出る境界辺」を単方向リストで持つ。ピンチ点（同じ頂点から
  // 境界辺が 2 本出る）でも辺を 1 本ずつ消費していけば複数の輪郭に分かれる。
  const head = new Map();
  const link = new Int32Array(bn);
  for (let k = 0; k < bn; k++) {
    const a = bA[k];
    link[k] = head.has(a) ? head.get(a) : -1;
    head.set(a, k);
  }
  const used = new Uint8Array(bn);
  let loop = new Int32Array(256);

  for (let k0 = 0; k0 < bn; k0++) {
    if (used[k0]) continue;
    const start = bA[k0];
    let ln = 0, e = k0, closed = false;
    for (let step = 0; step <= bn; step++) {
      used[e] = 1;
      loop = growI32(loop, ln + 1);
      loop[ln++] = e;
      const v = bB[e];
      if (v === start) { closed = true; break; }
      let next = -1;
      for (let j = head.has(v) ? head.get(v) : -1; j >= 0; j = link[j]) {
        if (used[j] === 0) { next = j; break; }
      }
      if (next < 0) break;
      e = next;
    }
    // 閉じなかった輪郭（非多様体な入力）は塞がない。塞ぐと余計に壊れる。
    if (!closed || ln < 3) continue;

    // 重心と、色 / マスクの平均。addVertex の前に計算しておく
    // （addVertex で配列が作り直される可能性があるため）。
    const P = mesh.positions, C = mesh.colors, MK = mesh.mask;
    let cx = 0, cy = 0, cz = 0, cr = 0, cg = 0, cb = 0, cm = 0;
    for (let k = 0; k < ln; k++) {
      const v = bA[loop[k]], i = v * 3;
      cx += P[i]; cy += P[i + 1]; cz += P[i + 2];
      cr += C[i]; cg += C[i + 1]; cb += C[i + 2];
      cm += MK[v];
    }
    const inv = 1 / ln;
    const cv = mesh.addVertex(cx * inv, cy * inv, cz * inv,
      cr * inv, cg * inv, cb * inv, cm * inv);
    out.centers.push(cv);
    out.added++;
    // 既存の面が a→b と巻いているので、穴側は b→a に巻かないと法線が裏返る
    for (let k = 0; k < ln; k++) {
      const idx = loop[k];
      mesh.addTriangle(bB[idx], bA[idx], cv);
      out.addedTris++;
    }
    out.loops++;
  }
  return out;
}

/** 平面上の頂点 + 追加した頂点を集めて法線 / 曲率を直す */
function refreshPlanar(mesh, cl, centers) {
  const onPlane = cl.onPlane;
  const A = mesh.vAlive;
  const lim = Math.min(mesh.nv, onPlane.length);
  let list = new Int32Array(Math.max(256, cl.nOn + centers.length + 16));
  let n = 0;
  for (let v = 0; v < lim; v++) {
    if (onPlane[v] === 1 && A[v] === 1) { list = growI32(list, n + 1); list[n++] = v; }
  }
  for (let k = 0; k < centers.length; k++) {
    const v = centers[k];
    if (v < mesh.nv && A[v] === 1) { list = growI32(list, n + 1); list[n++] = v; }
  }
  return refreshAround(mesh, list, n);
}

// ---------------------------------------------------------------------------
// Clip: 平面の裏側を平面上へ射影する（トポロジは変えない）
// ---------------------------------------------------------------------------

/**
 * 平面の裏側にある頂点を平面上へ射影する。ZBrush の ClipCurve と同じで
 * トポロジは変わらない（面が平面上に潰れて平らな断面に見える）。
 *
 * @param {SculptMesh} mesh
 * @param {object} plane { n: [x,y,z], d }
 * @param {object} opts
 *   falloff    : > 0 でソフトクリップ。平面から深さ falloff までは射影量を
 *                smoothstep で絞る（＝平面のすぐ手前は緩く動かす）。
 *                0（既定）なら完全に平面へ落とすハードクリップ。
 *   strength   : 0..1 の全体倍率（既定 1）
 *   ignoreMask : true でマスクを無視する
 * @returns {object} { changed, moved, back, maxMove, refreshed }
 */
function clipPlane(mesh, plane, opts = {}) {
  const res = { changed: false, moved: 0, back: 0, maxMove: 0, refreshed: 0 };
  const pl = unitPlane(plane);
  if (!pl || mesh.nv === 0) return res;

  // clamp(NaN) は NaN のままなので、そのまま倍率に使うと全頂点の座標が NaN になる。
  // 空スライダの parseFloat など NaN は簡単に混ざるので「動かさない」に倒す。
  const strength = opts.strength === undefined ? 1 : clamp(Number(opts.strength), 0, 1);
  if (!(strength > 0)) return res;
  // ソフトクリップ:
  //   「平面から離れるほど動かす量を緩める」を素直に書くと、深い所が平らに
  //   ならないうえに平面上の折れ目もそのまま残る（射影量の傾きが s=0 で不連続）。
  //   そこで帯の中で射影量を smoothstep で立ち上げる形にした。深さ falloff 以上は
  //   きっちり平面へ落ち、平面のすぐ手前だけ緩むので、鋭い稜線が丸い肩になる。
  //   代償として深さ 0.26*falloff ぶんだけ平面の裏に薄く残る。
  const w = (opts.falloff > 0 && Number.isFinite(opts.falloff)) ? opts.falloff : 0;
  const invW = w > 0 ? 1 / w : 0;
  const useMask = opts.ignoreMask !== true;

  const nv = mesh.nv;
  const P = mesh.positions, A = mesh.vAlive, MK = mesh.mask;
  const nx = pl.nx, ny = pl.ny, nz = pl.nz, d = pl.d;
  const list = new Int32Array(Math.max(64, mesh.liveVerts));
  let n = 0, back = 0, maxMove = 0;

  for (let v = 0; v < nv; v++) {
    if (A[v] === 0) continue;
    const i = v * 3;
    const s = P[i] * nx + P[i + 1] * ny + P[i + 2] * nz + d;
    if (s >= 0) continue;              // 表側は一切触らない
    back++;
    let f = strength;
    if (w > 0) {
      const u = -s * invW;
      if (u < 1) f *= u * u * (3 - 2 * u);
    }
    if (useMask) {
      // マスクの規約: 1 = 完全に保護されて動かない
      const mk = MK[v];
      f *= 1 - (mk < 0 ? 0 : (mk > 1 ? 1 : mk));
    }
    if (f <= 0) continue;
    const mv = -s * f;                 // 平面へ向かう移動量（s < 0 なので正）
    P[i] += nx * mv; P[i + 1] += ny * mv; P[i + 2] += nz * mv;
    list[n++] = v;
    if (mv > maxMove) maxMove = mv;
  }

  res.back = back; res.moved = n; res.maxMove = maxMove;
  if (n === 0) return res;
  res.changed = true;
  // 面の繋がりは変わらないので topoVersion は上げない（ワイヤフレームは再構築不要）
  res.refreshed = refreshAround(mesh, list, n);
  mesh.geomVersion++;
  return res;
}

// ---------------------------------------------------------------------------
// Trim: 平面の裏側を実際に切り落として切り口を塞ぐ
// ---------------------------------------------------------------------------

/**
 * 平面の裏側を切り落とし、切り口を三角形で塞ぐ（穴を残さない）。
 *
 * @param {SculptMesh} mesh
 * @param {object} plane { n: [x,y,z], d }
 * @param {object} opts
 *   cap : false で切り口を塞がない（mirrorWeld が使う）
 *   eps : 平面上と見なす距離（既定はモデル半径の 1e-5）
 * @returns {object} { changed, removed, removedTris, added, addedTris,
 *                     cutVerts, loops, snapped, refused }
 */
function trimPlane(mesh, plane, opts = {}) {
  const res = {
    changed: false, removed: 0, removedTris: 0, added: 0, addedTris: 0,
    cutVerts: 0, loops: 0, snapped: 0, refreshed: 0,
  };
  const pl = unitPlane(plane);
  if (!pl || mesh.nv === 0) return res;
  const doCap = opts.cap !== false;

  const cl = classify(mesh, pl, opts);
  if (cl.nBack === 0) return res;                                  // 裏側に何もない
  if (cl.nFront === 0) { res.refused = 'all-back'; return res; }    // 全部消えるので拒否

  // --- 跨ぐ / 捨てる三角形を数える ---------------------------------------
  // 実際に切る前に容量を確保しておく。途中で配列が作り直されると、
  // ローカルに持った tris / positions が古い配列を指してしまう。
  const nt0 = mesh.nt;
  let nCross = 0, nDrop = 0;
  {
    const T = mesh.tris, sign = cl.sign;
    for (let t = 0; t < nt0; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const sa = sign[a], sb = sign[b], sc = sign[c];
      const nb = (sa < 0 ? 1 : 0) + (sb < 0 ? 1 : 0) + (sc < 0 ? 1 : 0);
      if (nb === 0) continue;
      const nf = (sa > 0 ? 1 : 0) + (sb > 0 ? 1 : 0) + (sc > 0 ? 1 : 0);
      if (nf === 0) nDrop++; else nCross++;
    }
  }
  if (nCross === 0 && nDrop === 0) return res;
  // 跨ぐ三角形 1 枚が作る交点は最大 2 個、増える三角形は最大 1 枚
  mesh.reserve(mesh.nv + nCross * 2 + 4, mesh.nt + nCross + 4);
  growClass(cl, mesh.capV);
  res.snapped = snapToPlane(mesh, pl, cl);   // ここから先は必ず切る（= changed になる）

  // --- 切断 --------------------------------------------------------------
  {
    const map = new Map();
    const poly = new Int32Array(5);
    const T = mesh.tris, sign = cl.sign;
    for (let t = 0; t < nt0; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const sa = sign[a], sb = sign[b], sc = sign[c];
      const nb = (sa < 0 ? 1 : 0) + (sb < 0 ? 1 : 0) + (sc < 0 ? 1 : 0);
      if (nb === 0) continue;                       // 表側 / 平面上だけ → そのまま
      const nf = (sa > 0 ? 1 : 0) + (sb > 0 ? 1 : 0) + (sc > 0 ? 1 : 0);
      if (nf === 0) { mesh.removeTriangle(t); res.removedTris++; continue; }
      const np = clipTriangle(mesh, map, cl, i, 1, poly);
      // 表側は 3 or 4 角形。1 枚目は元のスロットを使い回して残りをファンで足す。
      // 新しい面は削除で空いたスロットに入ることがあるが、その頂点は
      // すべて sign >= 0 なので、このループが後で拾っても nb === 0 で素通りする。
      if (np < 3) { mesh.removeTriangle(t); res.removedTris++; continue; }
      mesh.setTriangle(t, poly[0], poly[1], poly[2]);
      for (let k = 3; k < np; k++) { mesh.addTriangle(poly[0], poly[k - 1], poly[k]); res.addedTris++; }
    }
    res.cutVerts = map.size;
    res.added += map.size;
  }

  // --- 切り口を塞ぐ ------------------------------------------------------
  let centers = [];
  if (doCap) {
    const cap = capPlanarHoles(mesh, cl);
    res.loops = cap.loops;
    res.added += cap.added;
    res.addedTris += cap.addedTris;
    centers = cap.centers;
  }

  res.removed = removeOrphans(mesh);
  res.changed = true;
  // ring は setTriangle / addTriangle / removeTriangle が差分で維持しており、
  // topoVersion もそこで上がっている。よって rebuildRings() は不要。
  res.refreshed = refreshPlanar(mesh, cl, centers);
  mesh.geomVersion++;
  mesh.markAllDirty();
  return res;
}

// ---------------------------------------------------------------------------
// Slice: 切らずに平面上へ辺を作る
// ---------------------------------------------------------------------------

/**
 * 平面に沿って辺を作るだけ（ZBrush の Slice）。形は変えず、
 * 平面を跨ぐ三角形を交点で割って両側に分ける。ポリグループの境界を作る用途。
 *
 * @returns {object} { changed, added, addedTris, cutVerts, snapped }
 */
function slicePlane(mesh, plane, opts = {}) {
  const res = { changed: false, added: 0, addedTris: 0, cutVerts: 0, snapped: 0, refreshed: 0 };
  const pl = unitPlane(plane);
  if (!pl || mesh.nv === 0) return res;

  const cl = classify(mesh, pl, opts);
  if (cl.nFront === 0 || cl.nBack === 0) return res;

  const nt0 = mesh.nt;
  let nCross = 0;
  {
    const T = mesh.tris, sign = cl.sign;
    for (let t = 0; t < nt0; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      const sa = sign[a], sb = sign[b], sc = sign[c];
      const nb = (sa < 0 ? 1 : 0) + (sb < 0 ? 1 : 0) + (sc < 0 ? 1 : 0);
      if (nb === 0) continue;
      const nf = (sa > 0 ? 1 : 0) + (sb > 0 ? 1 : 0) + (sc > 0 ? 1 : 0);
      if (nf > 0) nCross++;
    }
  }
  // 既に平面上に辺が通っている（= 跨ぐ面がない）なら何もしない。
  // 同じ平面で 2 回スライスしても増えないのはこの経路のおかげ。
  if (nCross === 0) return res;
  // 跨ぐ 1 枚が 3 枚になるので +2、交点は最大 2 個
  mesh.reserve(mesh.nv + nCross * 2 + 4, mesh.nt + nCross * 2 + 4);
  growClass(cl, mesh.capV);
  res.snapped = snapToPlane(mesh, pl, cl);   // ここから先は必ず切る（= changed になる）

  const map = new Map();
  const polyF = new Int32Array(5), polyB = new Int32Array(5);
  const T = mesh.tris, sign = cl.sign;
  for (let t = 0; t < nt0; t++) {
    const i = t * 3;
    const a = T[i], b = T[i + 1], c = T[i + 2];
    if (a === b && b === c) continue;
    const sa = sign[a], sb = sign[b], sc = sign[c];
    const nb = (sa < 0 ? 1 : 0) + (sb < 0 ? 1 : 0) + (sc < 0 ? 1 : 0);
    if (nb === 0) continue;
    const nf = (sa > 0 ? 1 : 0) + (sb > 0 ? 1 : 0) + (sc > 0 ? 1 : 0);
    if (nf === 0) continue;
    // 両側を先に切り出す（setTriangle で元の三角形を壊す前に読む必要がある）
    const cf = clipTriangle(mesh, map, cl, i, 1, polyF);
    const cbk = clipTriangle(mesh, map, cl, i, -1, polyB);
    if (cf < 3 || cbk < 3) continue;
    mesh.setTriangle(t, polyF[0], polyF[1], polyF[2]);
    for (let k = 3; k < cf; k++) { mesh.addTriangle(polyF[0], polyF[k - 1], polyF[k]); res.addedTris++; }
    for (let k = 2; k < cbk; k++) { mesh.addTriangle(polyB[0], polyB[k - 1], polyB[k]); res.addedTris++; }
  }
  res.cutVerts = map.size;
  res.added = map.size;
  res.changed = true;
  res.refreshed = refreshPlanar(mesh, cl, []);
  // 接続は変わった（topoVersion は addTriangle 側で上がる）。見た目の形は同じだが
  // スナップで平面上の頂点が eps ぶん動いているので geomVersion も進める。
  mesh.geomVersion++;
  mesh.markAllDirty();
  return res;
}

// ---------------------------------------------------------------------------
// Mirror and Weld
// ---------------------------------------------------------------------------

/**
 * 指定軸の平面で片側を捨て、残った側を鏡像コピーして接合部を溶接する。
 *
 * 溶接は「平面上の頂点を両側で共有する」形で行う。複製してから位置一致で
 * 溶接し直すと、一瞬でも同じ場所に 2 個並ぶぶん重複頂点と非多様体辺が残る。
 *
 * @param {SculptMesh} mesh
 * @param {string|number} axis 'x' | 'y' | 'z'（または 0/1/2）
 * @param {object} opts
 *   keep   : +1（既定）で軸の正側を残す。-1 で負側。
 *   offset : 鏡の位置（既定 0）
 *   eps    : 平面上と見なす距離
 * @returns {object} { changed, removed, removedTris, welded, added, addedTris,
 *                     trim, refused }
 *   refused = 'all-back'        : 残す側に何も残らない（trim が拒否した）
 *   refused = 'no-intersection' : 鏡がメッシュから離れている
 */
function mirrorWeld(mesh, axis, opts = {}) {
  const res = {
    changed: false, removed: 0, removedTris: 0, welded: 0, added: 0, addedTris: 0,
  };
  const ax = axisIndex(axis);
  if (ax < 0 || mesh.nv === 0) return res;
  const keep = (opts.keep !== undefined && opts.keep < 0) ? -1 : 1;
  // NaN は falsy なので || 0 で 0 になるが、Infinity は素通りしてしまう
  const offset = Number.isFinite(opts.offset) ? opts.offset : 0;
  const eps = planeEps(mesh, opts);

  // 鏡がメッシュの外側にあると trim が 1 枚も削らず、鏡像は溶接点 0 個の
  // 「離れた複製」になる（頂点も面も 2 倍になったうえで塊が 2 つ浮く）。
  // 事故以外の使い道がないので手前で拒否する。片側だけのモデルを鏡像化する
  // 正当な使い方では接合面の頂点が平面上にいるので、この判定は通る。
  {
    const P = mesh.positions, A = mesh.vAlive, nv = mesh.nv;
    let touches = false;
    for (let v = 0; v < nv; v++) {
      if (A[v] === 0) continue;

/** 筆圧を考慮した実効ブラシ半径 / 強さ */
function effectiveRadiusPx() {
  if (!state.usePressure || !ptr.isPen) return state.radiusPx;
  const p = clamp(ptr.pressure, 0.02, 1);
  return state.radiusPx * (1 - state.pressureSize + state.pressureSize * p);
}
function effectiveStrength() {
  if (!state.usePressure || !ptr.isPen) return state.strength;
  const p = clamp(ptr.pressure, 0.02, 1);
  return state.strength * (1 - state.pressureStrength + state.pressureStrength * p);
}

function updateWorldRadius() {
  let dist = camera.distance;
  if (renderer.pick.ok) {
    dist = V3.dist(renderer.pick.point, camera.eye);
  }
  state.worldRadius = Math.max(1e-6, effectiveRadiusPx() * camera.worldPerPixel(dist));
  state.effStrength = effectiveStrength();
  // バックフェイスマスク用の視線方向（表面 → カメラ）
  V3.sub(state.toCamera, camera.eye, camera.target);
  V3.normalize(state.toCamera, state.toCamera);
}

/** レイジーマウスのリードを更新して、ブラシが追う画面座標を返す */
function updateLazy() {
  if (!ptr.lazyInit) {
    ptr.lazyX = ptr.x; ptr.lazyY = ptr.y; ptr.lazyInit = true;
    return;
  }
  const r = Math.max(0, state.lazyRadius);
  if (r <= 0.5) { ptr.lazyX = ptr.x; ptr.lazyY = ptr.y; return; }
  const dx = ptr.x - ptr.lazyX, dy = ptr.y - ptr.lazyY;
  const len = Math.hypot(dx, dy);
  if (len > r) {
    const k = 1 - r / len;
    ptr.lazyX += dx * k;
    ptr.lazyY += dy * k;
  }
}

// ---------------------------------------------------------------------------
// 入力
// ---------------------------------------------------------------------------
function resolveBrush(e) {
  const ctrl = e.ctrlKey || e.metaKey;
  let brush = state.brush;
  let dir = 1;
  if (ctrl) {
    brush = 'mask';
    dir = e.altKey ? -1 : 1;
  } else if (e.shiftKey) {
    brush = 'smooth';
  } else if (e.altKey) {
    dir = -1;
  }
  return { brush, dir };
}

// ---------------------------------------------------------------------------
// トランスポーズ（ギズモ）と平面カットのドラッグ
// ---------------------------------------------------------------------------

// --- トランスポーズ ---------------------------------------------------------
// ZBrush の W キー相当のモーダル。有効な間はビューのドラッグがギズモ操作になる。
let gizmoHover = null;      // いまホバーしているハンドル { kind, axis }
let gizmoScale = 1;         // ハンドルの大きさ

/**
 * ハンドルの大きさをピボットまでの距離に比例させる。
 * モデルの大小や寄り引きで矢印の見た目が変わると掴みにくいので、
 * 画面上のサイズがほぼ一定に見えるようにしておく。
 */
function updateGizmoScale() {
  if (!tools || !tools.gizmo.active) return;
  gizmoScale = Math.max(1e-4, V3.dist(tools.gizmo.pivot(), camera.eye) * 0.16);
}

/** ハンドルの当たり判定の許容距離（画面 14px 相当をワールド長へ換算） */
function gizmoTolerance() {
  const d = V3.dist(tools.gizmo.pivot(), camera.eye);
  const h = Math.max(1, canvas.clientHeight);
  // 画角から「画面 1px が何ワールド長か」を出す
  const perPixel = (2 * d * Math.tan(camera.fov * 0.5)) / h;
  return Math.max(1e-6, perPixel * 14);
}

function applyTransposeMode(on) {
  if (!tools) return;
  if (on) {
    if (!tools.gizmoActivate()) { if (ui) ui.syncTranspose(false); return; }
    state.transposeMode = true;
    updateGizmoScale();
    tools.gizmoDrawHandles(gizmoScale, null);
  } else {
    state.transposeMode = false;
    tools.gizmoDeactivate();
    gizmoHover = null;
  }
  if (ui) ui.syncTranspose(state.transposeMode);
}

/** ホバー中のハンドルを更新して線を描き直す */
function updateGizmoHover(cssX, cssY) {
  if (!tools || !tools.gizmo.active) return;
  updateGizmoScale();
  screenRay(cssX, cssY);
  gizmoHover = tools.gizmo.hitTest(rayO, rayD, gizmoTolerance(), gizmoScale);
  tools.gizmoDrawHandles(gizmoScale, gizmoHover);
}

// --- 平面カット（クリップ / トリム / スライス） -----------------------------
// ドラッグの始点と終点をワールドへ落とし、その 2 点と視線方向で平面を作る。
// ZBrush の ClipCurve と同じ操作感で、線の表側が残る。
const clipDrag = {
  on: false, x0: 0, y0: 0,
  a: V3.create(), b: V3.create(), center: V3.create(), vd: V3.create(),
};

function clipDragBegin(cssX, cssY) {
  const c = mesh.bounds().center;
  V3.set(clipDrag.center, c[0], c[1], c[2]);
  if (!rayPlanePoint(cssX, cssY, clipDrag.center, clipDrag.a)) return false;
  V3.copy(clipDrag.b, clipDrag.a);
  clipDrag.on = true;
  clipDrag.x0 = cssX; clipDrag.y0 = cssY;
  // 平面の押し出し方向は視線。ドラッグ中は動かさないので 1 回だけ取る
  V3.sub(clipDrag.vd, camera.target, camera.eye);
  V3.normalize(clipDrag.vd, clipDrag.vd);
  drawClipGuide();
  return true;
}

function clipDragMove(cssX, cssY) {
  if (!clipDrag.on) return;
  if (rayPlanePoint(cssX, cssY, clipDrag.center, clipDrag.b)) drawClipGuide();
}

/** ドラッグ中の平面を線で見せる（切る前に位置と向きが分かるように） */
const _clipGuide = new Float32Array(10 * 7);
function drawClipGuide() {
  if (!renderer || !clipDrag.on) return;
  const a = clipDrag.a, b = clipDrag.b, vd = clipDrag.vd;
  const r = mesh.bounds().radius * 1.8;
  const p = [
    [a[0] - vd[0] * r, a[1] - vd[1] * r, a[2] - vd[2] * r],
    [a[0] + vd[0] * r, a[1] + vd[1] * r, a[2] + vd[2] * r],
    [b[0] + vd[0] * r, b[1] + vd[1] * r, b[2] + vd[2] * r],
    [b[0] - vd[0] * r, b[1] - vd[1] * r, b[2] - vd[2] * r],
  ];
  // 外周 4 本 + ドラッグ線そのもの
  const segs = [[0, 1], [1, 2], [2, 3], [3, 0], [0, 3]];
  const out = _clipGuide;
  let w = 0;
  for (const [i, j] of segs) {
    for (const k of [i, j]) {
      out[w] = p[k][0]; out[w + 1] = p[k][1]; out[w + 2] = p[k][2];
      out[w + 3] = 1.0; out[w + 4] = 0.52; out[w + 5] = 0.18; out[w + 6] = 0.92;
      w += 7;
    }
  }
  renderer.setOverlayLines(out, segs.length * 2, true);
}

function clipDragEnd() {
  if (!clipDrag.on) return;
  clipDrag.on = false;
  if (renderer) renderer.setOverlayLines(null, 0);
  if (V3.dist(clipDrag.a, clipDrag.b) < mesh.bounds().radius * 0.02) {
    ui.toast('ドラッグが短すぎます');
    return;
  }
  const plane = tools.planeFromDrag(clipDrag.a, clipDrag.b, clipDrag.vd);
  tools.applyPlane(state.clipMode, plane);
}

function bindInput() {
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const r = canvas.getBoundingClientRect();
    ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
    ptr.px = ptr.x; ptr.py = ptr.y;
    ptr.dx = 0; ptr.dy = 0;
    ptr.down = true; ptr.id = e.pointerId; ptr.inside = true;
    ptr.isPen = e.pointerType === 'pen';
    ptr.pressure = ptr.isPen ? (e.pressure || 0.5) : 1;
    // ストローク開始時はリードを掴んでいる点に合わせる（初動が遅れないように）
    ptr.lazyX = ptr.x; ptr.lazyY = ptr.y; ptr.lazyInit = true;

    if (e.button === 1 || (e.button === 0 && spaceDown)) {
      ptr.mode = 'pan';
    } else if (e.button === 2) {
      ptr.mode = 'orbit';
    } else if (e.button === 0 && state.transposeMode && tools.gizmo.active) {
      // ギズモのハンドルを掴んでいればトランスポーズ、外していれば視点回転
      screenRay(ptr.x, ptr.y);
      const hit = tools.gizmo.hitTest(rayO, rayD, gizmoTolerance(), gizmoScale);
      if (hit && tools.gizmo.beginDrag(mesh, hit, rayO, rayD)) {
        tools.gizmoBeginRecord();
        ptr.mode = 'gizmo';
        gizmoHover = hit;
        tools.gizmoDrawHandles(gizmoScale, gizmoHover);
      } else {
        ptr.mode = 'orbit';
      }
    } else if (e.button === 0 && state.clipMode !== 'off') {
      ptr.mode = clipDragBegin(ptr.x, ptr.y) ? 'clip' : 'orbit';
    } else if (e.button === 0) {
      if (renderer.pick.ok) {
        const rb = resolveBrush(e);
        activeBrush = rb.brush;
        activeDir = rb.dir;
        ptr.mode = 'sculpt';
        updateWorldRadius();
        V3.copy(tmpPoint, renderer.pick.point);
        grabPlanePoint = usesGrabPlane(activeBrush)
          ? V3.create(tmpPoint[0], tmpPoint[1], tmpPoint[2]) : null;
        sculptor.beginStroke(activeBrush, tmpPoint, activeDir);
      } else {
        ptr.mode = 'orbit';
      }
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    const nx = e.clientX - r.left, ny = e.clientY - r.top;
    ptr.dx += nx - ptr.x;
    ptr.dy += ny - ptr.y;
    ptr.x = nx; ptr.y = ny;
    ptr.inside = true;
    if (e.pointerType === 'pen') {
      ptr.isPen = true;
      ptr.pressure = e.pressure || ptr.pressure;
    }
    if (ptr.mode === 'gizmo') {
      screenRay(ptr.x, ptr.y);
      tools.gizmo.updateDrag(mesh, rayO, rayD, { snap: e.shiftKey });
      tools.gizmoDrawHandles(gizmoScale, gizmoHover);
    } else if (ptr.mode === 'clip') {
      clipDragMove(ptr.x, ptr.y);
    } else if (!ptr.down && state.transposeMode && tools && tools.gizmo.active) {
      // 掴んでいないときはホバー表示だけ更新する
      updateGizmoHover(ptr.x, ptr.y);
    }
  });

  const endPointer = () => {
    if (ptr.mode === 'gizmo') {
      const r = tools.gizmo.endDrag(mesh);
      tools.gizmoEndRecord();
      if (r.changed > 0) {
        sculptor.hoverSeed = -1;
        sculptor.dropPendingCurvature();
        mesh.computeAllCurvature();
        sculptor.history.commit(mesh);
        scheduleAutosave();
      }
      // 動かしたぶんピボットがずれるので立て直す
      tools.gizmoActivate();
      updateGizmoScale();
      tools.gizmoDrawHandles(gizmoScale, gizmoHover);
    } else if (ptr.mode === 'clip') {
      clipDragEnd();
    }
    if (ptr.mode === 'sculpt') {
      sculptor.endStroke();
      sculptor.checkLevels();
      ui.refreshLevels();
      frameCameraKeepView();     // 床の高さと AO 半径を追従させる
      scheduleAutosave();
    }
    ptr.down = false;
    ptr.mode = 'none';
    grabPlanePoint = null;
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { ptr.inside = false; });
  canvas.addEventListener('pointerenter', () => { ptr.inside = true; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const steps = Math.sign(e.deltaY) * Math.min(3, Math.max(1, Math.abs(e.deltaY) / 100));
    camera.zoom(steps);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const ctrl = e.ctrlKey || e.metaKey;

    if (ctrl && e.code === 'KeyZ') {
      e.preventDefault();
      if (e.shiftKey) app.redo(); else app.undo();
      return;
    }
    if (ctrl && e.code === 'KeyY') { e.preventDefault(); app.redo(); return; }
    if (ctrl) return;

    switch (e.code) {
      case 'Space': spaceDown = true; e.preventDefault(); break;
      case 'BracketLeft':
        state.radiusPx = clamp(state.radiusPx * 0.88, 6, 400); ui.syncFromState(); break;
      case 'BracketRight':
        state.radiusPx = clamp(state.radiusPx * 1.14, 6, 400); ui.syncFromState(); break;
      case 'Comma':
        state.strength = clamp(state.strength - 0.05, 0.01, 1); ui.syncFromState(); break;
      case 'Period':
        state.strength = clamp(state.strength + 0.05, 0.01, 1); ui.syncFromState(); break;
      case 'KeyX':
        state.symmetry.x = !state.symmetry.x; ui.syncFromState();
        ui.toast('X ミラー: ' + (state.symmetry.x ? 'ON' : 'OFF')); break;
      case 'KeyW':
        // ZBrush と同じで W はトランスポーズ。ワイヤフレームは Shift+W に移した
        if (e.shiftKey) { state.wireframe = !state.wireframe; ui.syncFromState(); }
        else app.toggleTranspose();
        break;
      case 'KeyC':
        // クリップのモードを順に切り替える（オフ → クリップ → トリム → スライス）
        {
          const order = ['off', 'clip', 'trim', 'slice'];
          state.clipMode = order[(order.indexOf(state.clipMode) + 1) % order.length];
          ui.syncFromState();
          const jp = { off: 'オフ', clip: 'クリップ', trim: 'トリム', slice: 'スライス' };
          ui.toast('平面カット: ' + jp[state.clipMode]);
        }
        break;
      case 'KeyA':
        state.ao = !state.ao; ui.syncFromState();
        ui.toast('AO: ' + (state.ao ? 'ON' : 'OFF')); break;
      case 'KeyG':
        state.dynTopo = !state.dynTopo; ui.syncFromState();
        ui.toast('動的トポロジ: ' + (state.dynTopo ? 'ON' : 'OFF')); break;
      case 'KeyM':
        ui.setMaterial((state.material + 1) % renderer.matcapCount); break;
      case 'KeyF':
        frameCamera(); ui.toast('全体表示'); break;
      case 'KeyD':
        app.dynamesh(); break;
      case 'KeyB':
        state.backfaceMask = !state.backfaceMask; ui.syncFromState();
        ui.toast('バックフェイスマスク: ' + (state.backfaceMask ? 'ON' : 'OFF')); break;
      case 'KeyL':
        state.lazyRadius = state.lazyRadius > 0.5 ? 0 : 24; ui.syncFromState();
        ui.toast('レイジーマウス: ' + (state.lazyRadius > 0.5 ? `ON (${state.lazyRadius}px)` : 'OFF')); break;
      case 'KeyH':
        state.grid = !state.grid; ui.syncFromState();
        ui.toast('フロアグリッド: ' + (state.grid ? 'ON' : 'OFF')); break;
      case 'PageUp':
        e.preventDefault(); app.levelUp(); break;
      case 'PageDown':
        e.preventDefault(); app.levelDown(); break;
      default: {
        const m = /^Digit(\d)$/.exec(e.code);
        if (m) {
          const idx = (parseInt(m[1], 10) + 9) % 10;   // 1→0, 0→9
          if (idx < BRUSH_IDS.length) ui.setBrush(BRUSH_IDS[idx]);
        }
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') spaceDown = false;
  });

  window.addEventListener('blur', () => { spaceDown = false; });
  window.addEventListener('resize', () => renderer.resize());
}

// ---------------------------------------------------------------------------
// フレーム処理
// ---------------------------------------------------------------------------
function processInput() {
  const dx = ptr.dx, dy = ptr.dy;
  ptr.dx = 0; ptr.dy = 0;

  if (!ptr.down || busy) return;

  if (ptr.mode === 'orbit') {
    camera.invertOrbitY = state.invertOrbitY;
    if (dx || dy) camera.orbit(dx, dy);
    return;
  }
  if (ptr.mode === 'pan') {
    if (dx || dy) camera.pan(dx, dy, canvas.clientHeight || 1);
    return;
  }
  if (ptr.mode !== 'sculpt') return;

  updateWorldRadius();

  if (usesGrabPlane(activeBrush)) {
    if (!grabPlanePoint) return;
    if (!rayPlanePoint(ptr.lazyX, ptr.lazyY, grabPlanePoint, tmpPoint)) return;
    sculptor.addSample(tmpPoint);
  } else {
    if (!renderer.pick.ok) return;
    V3.copy(tmpPoint, renderer.pick.point);
    sculptor.addSample(tmpPoint);
  }
}

function buildRings() {
  if (!ptr.inside && !ptr.down) return null;
  if (!renderer.pick.ok) return null;

  V3.copy(tmpPoint, renderer.pick.point);
  if (ptr.mode === 'sculpt' && usesGrabPlane(activeBrush) && grabPlanePoint) {
    rayPlanePoint(ptr.lazyX, ptr.lazyY, grabPlanePoint, tmpPoint);
  }

  let haveN = false;
  if (ptr.mode === 'sculpt' && sculptor.stroking) {
    const an = sculptor.engine.avgN;
    if (V3.lenSq(an) > 0.5) { V3.copy(tmpNormal, an); haveN = true; }
  }
  if (!haveN) haveN = sculptor.surfaceNormalAt(tmpPoint, tmpNormal);
  if (!haveN) V3.set(tmpNormal, 0, 0, 1);

  const mirrors = sculptor.stroking ? sculptor.activeMirrors : sculptor.buildActiveMirrors();

  ringOut.length = 0;
  // リングの枚数だけは上限を設ける。ラジアルシンメトリで 32 分割すると
  // カーソルのリングが 32 個出て何も見えなくなるため。
  const maxRings = Math.min(ringMats.length, state.lazyRadius > 0.5 ? 7 : 8);
  for (let i = 0; i < mirrors.length && i < maxRings; i++) {
    const mir = mirrors[i];
    const r = ringMats[i];
    mirrorPoint(mir, tmpPoint, r.pos);
    mirrorVector(mir, tmpNormal, r.nrm);
    M4.diskBasis(r.matrix, r.pos, r.nrm, state.worldRadius);
    ringOut.push(r);
  }

  // レイジーマウス有効時は、実カーソル位置にも小さな印を出して遅れを可視化する
  if (state.lazyRadius > 0.5 && ringOut.length < 8) {
    const d = Math.hypot(ptr.x - ptr.lazyX, ptr.y - ptr.lazyY);
    if (d > 1) {
      const r = ringMats[ringOut.length];
      if (rayPlanePoint(ptr.x, ptr.y, tmpPoint, r.pos)) {
        V3.copy(r.nrm, tmpNormal);
        M4.diskBasis(r.matrix, r.pos, r.nrm, state.worldRadius * 0.14);
        ringOut.push(r);
      }
    }
  }
  return ringOut;
}

let lastT = performance.now();
let fpsAvg = 60;
let statTimer = 0;

function loop(t) {
  const dt = Math.min(100, t - lastT);
  lastT = t;
  fpsAvg += ((1000 / Math.max(1, dt)) - fpsAvg) * 0.12;

  renderer.resize();
  updateLazy();
  processInput();
  camera.update(canvas.clientWidth || 1, canvas.clientHeight || 1);
  // 毎フレーム更新しないと、スライダーやキーで半径を変えてもカーソルリングに
  // 反映されない（彫刻を始めるまで古い値が使われてしまう）
  updateWorldRadius();
  // このフレームのダブで溜まった曲率更新をまとめて処理する
  sculptor.flushCurvature();

  const rings = buildRings();
  // ピックはレイジーマウスのリード位置で行う（ブラシが当たるのはそこ）
  if (ptr.inside || ptr.down) renderer.requestPick(ptr.lazyX, ptr.lazyY);
  else renderer.pickRequest = null;

  renderer.render(camera, mesh, state, rings);
  // 残りの MatCap を 1 フレーム 1 枚ずつ裏で用意する（起動を待たせない）
  renderer.fillNextMatcap();

  statTimer += dt;
  if (statTimer > 250) {
    statTimer = 0;
    ui.refreshStats({
      verts: mesh.liveVerts,
      tris: mesh.liveTris,
      fps: fpsAvg,
      mb: (mesh.byteSize() + sculptor.history.bytes()) / (1024 * 1024),
    });
  }

  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
function fatal(msg, detail) {
  const box = document.getElementById('fatal');
  box.style.display = 'flex';
  document.getElementById('fatalMsg').textContent = msg;
  document.getElementById('fatalDetail').textContent = detail || '';
  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
}

async function boot() {
  // （単一ファイル版では file:// でも動くためガードは不要）
  if (!navigator.gpu) {
    fatal('WebGPU が利用できません',
      'Chrome / Edge 113 以降、または WebGPU を有効にした Firefox / Safari で開いてください。'
      + ' 企業ポリシーや GPU ドライバの制限で無効化されている場合もあります。');
    return;
  }
  try {
    renderer = await Renderer.create(canvas);
  } catch (err) {
    fatal('WebGPU の初期化に失敗しました', String(err && err.message || err));
    return;
  }

  // 前回の設定を復元（メッシュは IndexedDB、設定は localStorage）
  store.loadSettings(state);
  app.setBackground(state.bgPreset);

  const g = PRIMITIVES.sphere();
  mesh.setGeometry(g.positions, g.indices);
  sculptor = new Sculptor(mesh, state);
  tools = new Tools({
    state,
    getMesh: () => mesh,
    getSculptor: () => sculptor,
    getRenderer: () => renderer,
    getUI: () => ui,
    redraw: () => { /* 毎フレーム描いているので即時の再描画要求は不要 */ },
    autosave: scheduleAutosave,
  });
  app.tools = tools;
  tools.syncRecorder();   // モーフブラシのフックもここで差される
  ui = buildUI(app);
  renderer.setRenderScale(state.renderScale);
  frameCamera();
  bindInput();
  ui.refreshLevels();
  ui.refreshProjects();

  // 距離場の WASM を裏で読み込む（失敗しても JS 版で動くので待たない）
  initWasmField().then(async (ok) => {
    if (!ok) { console.info('WASM 距離場は使えないため JS 版で動作します: ' + wasmFieldError()); return; }
    // ワーカープールも用意する（作れなければ単一スレッドのまま）
    await initParallelField(wasmFieldModule());
  });

  renderer.onDeviceLost = (info) => {
    fatal('GPU デバイスが失われました', info && info.message ? info.message : 'ページを再読み込みしてください。');
  };

  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';

  // 自動保存があれば復元を提案する（勝手に上書きはしない）
  let restored = false;
  try {
    const auto = await store.loadAutosave();
    if (auto && auto.verts > 0) {
      const when = new Date(auto.updated);
      const label = `${when.getHours()}:${String(when.getMinutes()).padStart(2, '0')}`;
      ui.setAutosaveMark(when);
      restored = await ui.askRestore(
        `${label} の自動保存が見つかりました（${auto.verts.toLocaleString()} 頂点）。復元しますか？`);
      if (restored) await app.loadProject(store.AUTOSAVE);
    }
  } catch { /* IndexedDB が使えない環境では黙って続行 */ }

  if (!restored) ui.toast('モデルの上を左ドラッグで彫刻、背景ドラッグで回転', 3600);

  window.addEventListener('beforeunload', () => { store.saveSettings(state); });

  lastT = performance.now();
  requestAnimationFrame(loop);
}

boot();

// デバッグ / 自動テスト用
window.__wasmState = wasmFieldState;
window.__parState = () => parallelState() + ':' + parallelWorkers();
// ダイナメッシュを差し替え前の生の形で呼べるようにしておく（並列と逐次の突き合わせ用）
window.__rawDynamesh = dynamesh;
window.WebSculpt = {
  state, mesh, camera, app, BRUSHES,
  pointer: ptr,
  get renderer() { return renderer; },
  get sculptor() { return sculptor; },
  get ui() { return ui; },
  get tools() { return tools; },
};
  return {};
})();
})();
</script>
</body>
</html>
