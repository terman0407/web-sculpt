<!DOCTYPE html>
<!-- WebSculpt 単一ファイル版 — このファイルをブラウザで開くだけで動きます（サーバ不要）。
     ソースは js/ 以下のモジュール版。編集後に `node build.mjs` で再生成します。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebSculpt — WebGPU 3D スカルプト</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9744b'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23f5c0a4'/%3E%3C/svg%3E">
<style>
/* --------------------------------------------------------------------------
   WebSculpt UI
   -------------------------------------------------------------------------- */
:root {
  --bg:        #0c0d10;
  --panel:     #16181d;
  --panel-2:   #1c1f25;
  --line:      #262a32;
  --line-2:    #333844;
  --text:      #dfe3ea;
  --text-dim:  #8b93a3;
  --accent:    #d9744b;
  --accent-2:  #f0925f;
  --accent-dim:#5a3527;
  --ok:        #63b37f;
  --radius:    7px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------- トップバー ---------- */
#topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 46px;
  min-height: 46px;
  padding: 0 14px;
  background: linear-gradient(#1b1e24, #14161a);
  border-bottom: 1px solid var(--line);
  z-index: 5;
}
.brand {
  font-size: 15px;
  letter-spacing: 0.4px;
  color: var(--text-dim);
  white-space: nowrap;
}
.brand b { color: var(--text); font-weight: 600; }
.brand .tag {
  margin-left: 8px;
  padding: 2px 6px;
  font-size: 10px;
  letter-spacing: 0.6px;
  border: 1px solid var(--accent-dim);
  border-radius: 4px;
  color: var(--accent-2);
  vertical-align: 2px;
}
.meshbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.meshbar::-webkit-scrollbar { display: none; }
.meshbar .btnrow { margin: 0; }
.stats {
  margin-left: auto;
  display: flex;
  gap: 14px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stats b { color: var(--text); font-weight: 600; }
.stats .dim { color: #5f6673; }

.mesh-select {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 5px 8px;
  font: inherit;
  outline: none;
}
.mesh-select:hover { border-color: var(--accent-dim); }

/* ---------- レイアウト ---------- */
#bodyrow {
  display: flex;
  flex: 1;
  min-height: 0;
}
#leftbar {
  width: 116px;
  min-width: 116px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 8px 6px;
}
#rightbar {
  width: 292px;
  min-width: 292px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  overflow-y: auto;
}
#viewport {
  position: relative;
  flex: 1;
  min-width: 0;
  background: #000;
}
#gpu {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

/* スクロールバー */
#leftbar::-webkit-scrollbar, #rightbar::-webkit-scrollbar { width: 9px; }
#leftbar::-webkit-scrollbar-thumb, #rightbar::-webkit-scrollbar-thumb {
  background: #2c313a; border-radius: 5px;
}
#leftbar::-webkit-scrollbar-track, #rightbar::-webkit-scrollbar-track { background: transparent; }

/* ---------- ブラシパレット ---------- */
.brushlist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.brush {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 1px 5px;
  background: var(--panel-2);
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.brush:hover { background: #23272f; color: var(--text); }
.brush .bi { font-size: 15px; line-height: 1; }
.brush .bn { font-size: 9px; letter-spacing: 0; text-align: center; line-height: 1.2; }
.brush.on {
  background: linear-gradient(#3b241b, #2a1a14);
  border-color: var(--accent);
  color: var(--accent-2);
}

/* ---------- 右パネル ---------- */
.panel { padding: 4px 0 40px; }
.section { border-bottom: 1px solid var(--line); }
.sec-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 12px;
  background: none;
  border: 0;
  color: var(--text);
  font: inherit;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  text-align: left;
}
.sec-head:hover { background: #1a1d23; }
.sec-head .chev { color: var(--text-dim); font-size: 10px; transition: transform .15s; }
.section.collapsed .sec-head .chev { transform: rotate(-90deg); }
.sec-body { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.section.collapsed .sec-body { display: none; }

/* コントロール共通 */
.ctl-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.ctl-top label { color: var(--text-dim); font-size: 11.5px; }
.ctl-top .val { color: var(--text); font-variant-numeric: tabular-nums; font-size: 11.5px; }

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 16px;
  background: transparent;
  outline: none;
  margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  background: #2b303a;
  border-radius: 3px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--accent);
  border: 1px solid #1a1c21;
  cursor: pointer;
}
input[type=range]:hover::-webkit-slider-thumb { background: var(--accent-2); }
input[type=range]::-moz-range-track { height: 4px; background: #2b303a; border-radius: 3px; }
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border: 1px solid #1a1c21;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}

/* トグル */
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.toggle:hover { border-color: var(--line-2); color: var(--text); }
.toggle .box {
  width: 13px; height: 13px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  flex: 0 0 auto;
  position: relative;
}
.toggle.on { color: var(--text); border-color: var(--accent-dim); }
.toggle.on .box { background: var(--accent); border-color: var(--accent); }
.toggle.on .box::after {
  content: "";
  position: absolute; left: 3.5px; top: 1px;
  width: 4px; height: 7px;
  border: solid #16181d; border-width: 0 2px 2px 0;
  transform: rotate(40deg);
}

/* ボタン */
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  flex: 1 1 auto;
  padding: 6px 9px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: #24282f; border-color: var(--line-2); }
.btn:active { background: #2c313a; }
.btn.wide { flex: 1 1 100%; }
.btn.primary {
  background: linear-gradient(#3d2519, #2c1a12);
  border-color: var(--accent);
  color: var(--accent-2);
  font-weight: 600;
  padding: 8px 9px;
}
.btn.primary:hover { background: linear-gradient(#4a2d1e, #351f15); }
.btn.sym { font-weight: 600; letter-spacing: 1px; }
.btn.sym.on {
  background: linear-gradient(#3b241b, #2a1a14);
  border-color: var(--accent);
  color: var(--accent-2);
}

/* セグメント */
.segmented { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg {
  flex: 1;
  padding: 6px 0;
  background: var(--panel-2);
  border: 0;
  border-right: 1px solid var(--line);
  color: var(--text-dim);
  font: inherit;
  cursor: pointer;
}
.seg:last-child { border-right: 0; }
.seg:hover { color: var(--text); background: #24282f; }
.seg.on { background: var(--accent-dim); color: var(--accent-2); }

/* 色 */
input[type=color] {
  width: 100%;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--panel-2);
  cursor: pointer;
}
.swatches { display: flex; gap: 4px; margin-top: 6px; }
.sw {
  flex: 1;
  height: 17px;
  border: 1px solid #00000060;
  border-radius: 3px;
  cursor: pointer;
  padding: 0;
}
.sw:hover { outline: 1px solid var(--accent); }

/* マテリアル */
.matgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mat {
  padding: 3px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  line-height: 0;
}
.mat canvas { width: 100%; height: auto; border-radius: 4px; }
.mat:hover { border-color: var(--line-2); }
.mat.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

.note { margin: 2px 0 0; color: var(--text-dim); font-size: 11px; line-height: 1.55; }
.sublabel { color: var(--text-dim); font-size: 11.5px; margin-bottom: -4px; }

table.keys { width: 100%; border-collapse: collapse; font-size: 11px; }
table.keys td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid #1f232a; }
table.keys td:first-child { color: var(--accent-2); white-space: nowrap; width: 46%; }
table.keys td:last-child { color: var(--text-dim); }

/* ---------- トースト ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(12px);
  padding: 8px 16px;
  background: #14161ae0;
  border: 1px solid var(--line-2);
  border-radius: 20px;
  color: var(--text);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  max-width: 80%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 減衰カーブプレビュー ---------- */
.falloff-wrap {
  background: #101216;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px;
  margin-bottom: 4px;
  line-height: 0;
}
canvas.falloff { width: 100%; height: 52px; display: block; }

/* ---------- 分割レベル表示 ---------- */
.lvl {
  padding: 6px 9px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.lvl.on { color: var(--accent-2); border-color: var(--accent-dim); }

/* ---------- 保存スロット ---------- */
input.text {
  width: 100%;
  padding: 6px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  outline: none;
}
input.text:focus { border-color: var(--accent); }
.projlist { display: flex; flex-direction: column; gap: 4px; }
.projrow { display: flex; align-items: center; gap: 5px; }
.projname {
  flex: 1;
  min-width: 0;
  padding: 5px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.projname:hover { border-color: var(--accent-dim); color: var(--accent-2); }
.projmeta { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.projdel {
  width: 24px; height: 26px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  flex: 0 0 auto;
}
.projdel:hover { color: #e0705e; border-color: #5a2a22; }

/* ---------- 確認ダイアログ ---------- */
.ask {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #08090baa;
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s;
  z-index: 30;
}
.ask.show { opacity: 1; pointer-events: all; }
.ask-card {
  max-width: 420px;
  padding: 20px 22px;
  background: #16181df2;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  text-align: center;
}
.ask-card p { margin: 0 0 16px; color: var(--text); line-height: 1.7; }
.ask-btns { display: flex; gap: 8px; justify-content: center; }
.ask-btns .btn { min-width: 96px; flex: 0 0 auto; }

/* ---------- 処理中オーバーレイ ---------- */
.busy {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #08090b99;
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s;
  z-index: 20;
}
.busy.show { opacity: 1; pointer-events: all; }
.busy-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  background: #16181def;
  border: 1px solid var(--line-2);
  border-radius: 10px;
}
.busy-card p { margin: 0; color: var(--text); }
.busy-card .spinner { width: 20px; height: 20px; border-width: 2px; }

/* ---------- ローディング / 致命的エラー ---------- */
.loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #0c0d10;
  color: var(--text-dim);
  z-index: 10;
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid #2b303a;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.fatal {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: #08090bee;
  z-index: 100;
  padding: 24px;
}
.fatal .card {
  max-width: 520px;
  padding: 28px 30px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  text-align: center;
}
.fatal .ico { font-size: 34px; color: var(--accent); }
.fatal h2 { margin: 10px 0 8px; font-size: 17px; }
.fatal p { margin: 6px 0; color: var(--text-dim); line-height: 1.7; }
.fatal .small { margin-top: 16px; font-size: 11.5px; color: #6d7482; }
.fatal code {
  background: #22262d; padding: 1px 5px; border-radius: 3px; font-size: 11px;
}

@media (max-width: 1080px) {
  #rightbar { width: 250px; min-width: 250px; }
  #leftbar { width: 72px; min-width: 72px; }
  .brush .bn { font-size: 9px; }
}

/* --- リスト（スカルプトレイヤー / ポリグループ） -------------------------- */
/* 行数が増えるので固定高さでスクロールさせる。パネル全体が伸びると
   下のセクションが押し出されて使いにくくなる。 */
.listbox {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 168px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 4px;
  background: #14161a;
}
.listbox:empty::after {
  content: attr(data-empty);
  color: var(--text-dim);
  font-size: 11.5px;
  padding: 6px 4px;
}
.lrow {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 5px;
  border-radius: 3px;
  cursor: pointer;
}
.lrow:hover { background: #1d2027; }
.lrow.on { background: var(--accent-dim); }
.lrow .swatch {
  width: 11px; height: 11px;
  border-radius: 2px;
  border: 1px solid #0006;
  flex: 0 0 auto;
}
.lrow .lname {
  flex: 1 1 auto;
  font-size: 11.5px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lrow.on .lname { color: var(--accent-2); }
.lrow .lnum {
  font-size: 10.5px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.lrow .eye {
  flex: 0 0 auto;
  width: 18px; height: 16px;
  border: 0; background: none; padding: 0;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  border-radius: 2px;
}
.lrow .eye:hover { background: #2a2e36; color: var(--text); }
.lrow .eye.off { color: #4a4e57; }
.lrow input.lname-edit {
  flex: 1 1 auto;
  background: #0f1114;
  border: 1px solid var(--accent);
  border-radius: 2px;
  color: var(--text);
  font: inherit;
  font-size: 11.5px;
  padding: 1px 4px;
  min-width: 0;
}

/* 小さめのアイコンボタン列（リストの下に置く追加・削除など） */
.iconrow { display: flex; gap: 4px; }
.iconrow .ibtn {
  flex: 1 1 auto;
  padding: 4px 0;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-dim);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.iconrow .ibtn:hover { background: #24282f; color: var(--text); }
.iconrow .ibtn:disabled { opacity: .38; cursor: default; }

/* アルファのサムネイル格子（マテリアルの .matgrid と同じ考え方） */
.alphagrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}
.alphagrid .alpha {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0;
  background: #0e1013;
  cursor: pointer;
  overflow: hidden;
  position: relative;
}
.alphagrid .alpha canvas { width: 100%; height: 100%; display: block; }
.alphagrid .alpha:hover { border-color: var(--line-2); }
.alphagrid .alpha.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* 見出しの小さなラベル（セクション内のグループ分け） */
.subhead {
  color: var(--text-dim);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin: 2px 0 -3px;
}

/* デフォーム / マスクツールの 1 項目ぶんのまとまり */
.ctl-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #14161a;
}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">Web<b>Sculpt</b><span class="tag">WebGPU</span></div>
    <div id="meshBar" class="meshbar"></div>
    <div id="stats" class="stats"></div>
  </header>

  <div id="bodyrow">
    <aside id="leftbar">
      <div id="brushList" class="brushlist"></div>
    </aside>

    <main id="viewport">
      <canvas id="gpu"></canvas>
      <div id="toast" class="toast"></div>
      <div id="busy" class="busy">
        <div class="busy-card">
          <div class="spinner"></div>
          <p id="busyMsg">処理中…</p>
        </div>
      </div>
      <div id="ask" class="ask">
        <div class="ask-card">
          <p id="askMsg"></p>
          <div class="ask-btns">
            <button id="askNo" class="btn">いいえ</button>
            <button id="askYes" class="btn primary">はい</button>
          </div>
        </div>
      </div>
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>WebGPU デバイスと MatCap を初期化中…</p>
      </div>
    </main>

    <aside id="rightbar">
      <div id="rightPanel" class="panel"></div>
    </aside>
  </div>

      for (let j = 0; j < 3; j++) {
        const w = T[i + j];
        if (w !== v && out.indexOf(w) < 0) out.push(w);
      }
    }
    return out;
  }

  valence(v) { return this.ringCount[v]; }

  // --- 法線 ---------------------------------------------------------------

  // このループはハイポリのブラシで最も重い場所の一つなので、
  //  * this.xxx のプロパティ読みを全部ローカルへ退避
  //  * valence <= RING_STRIDE（ほぼ全部）と、はみ出し組を別ループに分ける
  //    → 内側ループから ex ? ex[j] : RD[...] の分岐が消える
  //  * markVert() の呼び出しをインライン化してループ後に 1 回だけ書き戻す
  //    （呼び出しごとに this への読み書きが 8 回あった）
  // という形にしてある。アルゴリズムは変えていない。
  computeNormalsFor(list, count = list.length) {
    const P = this.positions, N = this.normals, T = this.tris;
    const RD = this.ringData, RC = this.ringCount, REX = this.ringExt;
    const VB = this.vBlocks;
    let dMin = this.vDirtyMin, dMax = this.vDirtyMax;
    let bMin = this.vBlockMin, bMax = this.vBlockMax;

    for (let k = 0; k < count; k++) {
      const v = list[k];
      const rc = RC[v];
      if (rc === 0) continue;
      let nx = 0, ny = 0, nz = 0;
      if (rc <= RING_STRIDE) {
        const base = v * RING_STRIDE;
        for (let j = 0; j < rc; j++) {
          const i = RD[base + j] * 3;
          const a = T[i] * 3, b = T[i + 1] * 3, c = T[i + 2] * 3;
          const ax = P[a], ay = P[a + 1], az = P[a + 2];
          const e1x = P[b] - ax, e1y = P[b + 1] - ay, e1z = P[b + 2] - az;
          const e2x = P[c] - ax, e2y = P[c + 1] - ay, e2z = P[c + 2] - az;
          nx += e1y * e2z - e1z * e2y;
          ny += e1z * e2x - e1x * e2z;
          nz += e1x * e2y - e1y * e2x;
        }
      } else {
        const ex = REX[v];
        for (let j = 0; j < rc; j++) {
          const i = ex[j] * 3;
          const a = T[i] * 3, b = T[i + 1] * 3, c = T[i + 2] * 3;
          const ax = P[a], ay = P[a + 1], az = P[a + 2];
          const e1x = P[b] - ax, e1y = P[b + 1] - ay, e1z = P[b + 2] - az;
          const e2x = P[c] - ax, e2y = P[c + 1] - ay, e2z = P[c + 2] - az;
          nx += e1y * e2z - e1z * e2y;
          ny += e1z * e2x - e1x * e2z;
          nz += e1x * e2y - e1y * e2x;
        }
      }
      const l = Math.sqrt(nx * nx + ny * ny + nz * nz);
      const iv = v * 3;
      if (l > 1e-20) { const s = 1 / l; N[iv] = nx * s; N[iv + 1] = ny * s; N[iv + 2] = nz * s; }
      // markVert(v) のインライン展開
      if (v < dMin) dMin = v;
      if (v > dMax) dMax = v;
      const bb = v >> DIRTY_SHIFT;
      VB[bb] = 1;
      if (bb < bMin) bMin = bb;
      if (bb > bMax) bMax = bb;
    }
    this.vDirtyMin = dMin; this.vDirtyMax = dMax;
    this.vBlockMin = bMin; this.vBlockMax = bMax;
  }

  /**
   * 離散平均曲率を求める。ラプラシアン（1-ring 重心 − 自身）を法線方向へ射影し、
   * 平均エッジ長で割ってスケール不変にする。凹 > 0 / 凸 < 0。
   * キャビティシェーディングと Relax ブラシで使う。
   */
  // 辺長は二乗和の平方根（RMS）で代用する。平均長との差は正則なメッシュでは小さく、
  // 陰影用の量なので実用上問題ない。内側ループから sqrt を丸ごと外せる。
  // 内側は「三角形の 3 頂点のうち v でない 2 つ」を足す。以前は e=0..3 を回して
  // u === v を弾いていたが、どれが v かは比較 2 回で分かるので
  // ループと分岐をまとめて消せる（近傍 6 個に対して 18 反復 → 12 回の読み出し）。
  // 各近傍が 2 回数えられるのは平均を取るので結果に影響しない。
  computeCurvatureFor(list, count = list.length) {
    const P = this.positions, N = this.normals, T = this.tris, CV = this.curv;
    const RD = this.ringData, RC = this.ringCount, REX = this.ringExt;
    for (let k = 0; k < count; k++) {
      const v = list[k];
      const rc = RC[v];
      if (rc === 0) { CV[v] = 0; continue; }
      const inline = rc <= RING_STRIDE;
      const base = inline ? v * RING_STRIDE : 0;
      const ex = inline ? null : REX[v];
      const iv = v * 3;
      const px = P[iv], py = P[iv + 1], pz = P[iv + 2];
      let sx = 0, sy = 0, sz = 0, e2 = 0, cnt = 0;
      for (let j = 0; j < rc; j++) {
        const ti = (inline ? RD[base + j] : ex[j]) * 3;
        const t0 = T[ti], t1 = T[ti + 1], t2 = T[ti + 2];
        let u1, u2;
        if (t0 === v) { u1 = t1; u2 = t2; }
        else if (t1 === v) { u1 = t2; u2 = t0; }
        else { u1 = t0; u2 = t1; }
        const i1 = u1 * 3;
        let dx = P[i1] - px, dy = P[i1 + 1] - py, dz = P[i1 + 2] - pz;
        sx += dx; sy += dy; sz += dz;
        e2 += dx * dx + dy * dy + dz * dz;
        const i2 = u2 * 3;
        dx = P[i2] - px; dy = P[i2 + 1] - py; dz = P[i2 + 2] - pz;
        sx += dx; sy += dy; sz += dz;
        e2 += dx * dx + dy * dy + dz * dz;
        cnt += 2;
      }
      if (cnt === 0 || e2 <= 0) { CV[v] = 0; continue; }
      const inv = 1 / cnt;
      const e = Math.sqrt(e2 * inv);
      const d = (sx * N[iv] + sy * N[iv + 1] + sz * N[iv + 2]) * inv / e;
      CV[v] = d < -1 ? -1 : (d > 1 ? 1 : d);
    }
  }

  /** 曲率は 2 次量でノイズが乗りやすいので 1-ring 平均で軽く均す */
  smoothCurvatureFor(list, count = list.length, amount = 0.55) {
    const T = this.tris, CV = this.curv;
    const RD = this.ringData, RC = this.ringCount, REX = this.ringExt;
    const tmp = this._curvTmp && this._curvTmp.length >= count
      ? this._curvTmp : (this._curvTmp = new Float32Array(Math.max(1024, count * 2)));
    for (let k = 0; k < count; k++) {
      const v = list[k];
      const rc = RC[v];
      const cv = CV[v];
      if (rc === 0) { tmp[k] = cv; continue; }
      const inline = rc <= RING_STRIDE;
      const base = inline ? v * RING_STRIDE : 0;
      const ex = inline ? null : REX[v];
      let s = 0;
      for (let j = 0; j < rc; j++) {
        const ti = (inline ? RD[base + j] : ex[j]) * 3;
        const t0 = T[ti], t1 = T[ti + 1], t2 = T[ti + 2];
        // computeCurvatureFor と同じ「v でない 2 つ」の取り出し方
        if (t0 === v) s += CV[t1] + CV[t2];
        else if (t1 === v) s += CV[t2] + CV[t0];
        else s += CV[t0] + CV[t1];
      }
      tmp[k] = cv + (s / (rc * 2) - cv) * amount;
    }
    for (let k = 0; k < count; k++) CV[list[k]] = tmp[k];
  }

  /**
   * 全頂点の曲率。ring[] を辿らず三角形を 1 回走査して隣接和を積む。
   * 配列間接参照が消えるぶん、頂点ごとに ring を舐める版より数倍速い。
   */
  computeAllCurvature() {
    const nv = this.nv;
    if (nv === 0) return;
    const P = this.positions, N = this.normals, T = this.tris, CV = this.curv;

    if (!this._cvSum || this._cvSum.length < nv * 3) {
      this._cvSum = new Float32Array(nv * 3);
      this._cvE2 = new Float32Array(nv);
      this._cvCnt = new Float32Array(nv);
    }
    const S = this._cvSum, E2 = this._cvE2, CN = this._cvCnt;
    S.fill(0, 0, nv * 3); E2.fill(0, 0, nv); CN.fill(0, 0, nv);

    for (let t = 0; t < this.nt; t++) {
      const i = t * 3;
      const ia = T[i], ib = T[i + 1], ic = T[i + 2];
      if (ia === ib && ib === ic) continue;
      const a = ia * 3, b = ib * 3, c = ic * 3;
      const abx = P[b] - P[a], aby = P[b + 1] - P[a + 1], abz = P[b + 2] - P[a + 2];
      const acx = P[c] - P[a], acy = P[c + 1] - P[a + 1], acz = P[c + 2] - P[a + 2];
      const bcx = P[c] - P[b], bcy = P[c + 1] - P[b + 1], bcz = P[c + 2] - P[b + 2];
      const lab = abx * abx + aby * aby + abz * abz;
      const lac = acx * acx + acy * acy + acz * acz;
      const lbc = bcx * bcx + bcy * bcy + bcz * bcz;
      S[a] += abx + acx; S[a + 1] += aby + acy; S[a + 2] += abz + acz;
      S[b] += bcx - abx; S[b + 1] += bcy - aby; S[b + 2] += bcz - abz;
      S[c] += -acx - bcx; S[c + 1] += -acy - bcy; S[c + 2] += -acz - bcz;
      E2[ia] += lab + lac; E2[ib] += lab + lbc; E2[ic] += lac + lbc;
      CN[ia] += 2; CN[ib] += 2; CN[ic] += 2;
    }

    for (let v = 0; v < nv; v++) {
      const cnt = CN[v];
      if (cnt === 0 || E2[v] <= 0) { CV[v] = 0; continue; }
      const iv = v * 3;
      const inv = 1 / cnt;
      const e = Math.sqrt(E2[v] * inv);
      const d = (S[iv] * N[iv] + S[iv + 1] * N[iv + 1] + S[iv + 2] * N[iv + 2]) * inv / e;
      CV[v] = d < -1 ? -1 : (d > 1 ? 1 : d);
    }

    // 平滑化も同じく三角形走査で
    S.fill(0, 0, nv); CN.fill(0, 0, nv);
    for (let t = 0; t < this.nt; t++) {
      const i = t * 3;
      const ia = T[i], ib = T[i + 1], ic = T[i + 2];
      if (ia === ib && ib === ic) continue;
      const ca = CV[ia], cb = CV[ib], cc = CV[ic];
      S[ia] += cb + cc; S[ib] += cc + ca; S[ic] += ca + cb;
      CN[ia] += 2; CN[ib] += 2; CN[ic] += 2;
    }
    const amount = 0.55;
    for (let v = 0; v < nv; v++) {
      const cnt = CN[v];
      if (cnt === 0) continue;
      CV[v] += (S[v] / cnt - CV[v]) * amount;
    }
    this.markAllDirty();
  }

  computeAllNormals() {
    const P = this.positions, N = this.normals, T = this.tris;
    N.fill(0, 0, this.nv * 3);
    for (let t = 0; t < this.nt; t++) {
      const i = t * 3;
      const ia = T[i], ib = T[i + 1], ic = T[i + 2];
      if (ia === ib && ib === ic) continue;
      const a = ia * 3, b = ib * 3, c = ic * 3;
      const e1x = P[b] - P[a], e1y = P[b + 1] - P[a + 1], e1z = P[b + 2] - P[a + 2];
      const e2x = P[c] - P[a], e2y = P[c + 1] - P[a + 1], e2z = P[c + 2] - P[a + 2];
      const nx = e1y * e2z - e1z * e2y;
      const ny = e1z * e2x - e1x * e2z;
      const nz = e1x * e2y - e1y * e2x;
      N[a] += nx; N[a + 1] += ny; N[a + 2] += nz;
      N[b] += nx; N[b + 1] += ny; N[b + 2] += nz;
      N[c] += nx; N[c + 1] += ny; N[c + 2] += nz;
    }
    for (let v = 0; v < this.nv; v++) {
      const i = v * 3;
      const l = Math.sqrt(N[i] * N[i] + N[i + 1] * N[i + 1] + N[i + 2] * N[i + 2]);
      if (l > 1e-20) { N[i] /= l; N[i + 1] /= l; N[i + 2] /= l; }
      else { N[i] = 0; N[i + 1] = 1; N[i + 2] = 0; }
    }
    this.markAllDirty();
  }

  rebuildRings() {
    const nv = this.nv, T = this.tris;
    this.ringCount.fill(0, 0, nv);
    for (let v = 0; v < nv; v++) this.ringExt[v] = null;
    for (let t = 0; t < this.nt; t++) {
      const i = t * 3;
      const a = T[i], b = T[i + 1], c = T[i + 2];
      if (a === b && b === c) continue;
      this._link(a, t); this._link(b, t); this._link(c, t);
    }
  }

  // --- 統計 / 領域 --------------------------------------------------------

  bounds() {
    const P = this.positions;
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (let v = 0; v < this.nv; v++) {
      if (!this.vAlive[v]) continue;
      const i = v * 3;
      if (P[i] < minX) minX = P[i]; if (P[i] > maxX) maxX = P[i];
      if (P[i + 1] < minY) minY = P[i + 1]; if (P[i + 1] > maxY) maxY = P[i + 1];
      if (P[i + 2] < minZ) minZ = P[i + 2]; if (P[i + 2] > maxZ) maxZ = P[i + 2];
    }
    if (minX > maxX) { minX = minY = minZ = -1; maxX = maxY = maxZ = 1; }
    const cx = (minX + maxX) * 0.5, cy = (minY + maxY) * 0.5, cz = (minZ + maxZ) * 0.5;
    const r = Math.max(1e-4, 0.5 * Math.hypot(maxX - minX, maxY - minY, maxZ - minZ));
    return { min: [minX, minY, minZ], max: [maxX, maxY, maxZ], center: [cx, cy, cz], radius: r };
  }

  /** 生きている辺の平均長（サンプリング） */
  averageEdgeLength(sampleTris = 3000) {
    const P = this.positions, T = this.tris;
    let sum = 0, n = 0;
    const step = Math.max(1, Math.floor(this.nt / sampleTris));
    for (let t = 0; t < this.nt; t += step) {
      const i = t * 3;
      const ia = T[i], ib = T[i + 1], ic = T[i + 2];
      if (ia === ib && ib === ic) continue;
      const a = ia * 3, b = ib * 3, c = ic * 3;
      sum += Math.hypot(P[b] - P[a], P[b + 1] - P[a + 1], P[b + 2] - P[a + 2]);
      sum += Math.hypot(P[c] - P[b], P[c + 1] - P[b + 1], P[c + 2] - P[b + 2]);
      sum += Math.hypot(P[a] - P[c], P[a + 1] - P[c + 1], P[a + 2] - P[c + 2]);
      n += 3;
    }
    return n > 0 ? sum / n : 0.05;
  }

  // --- 構築 / 圧縮 --------------------------------------------------------

  /**
   * インデックス付きジオメトリからメッシュを作り直す。
   * colors / mask を渡すとポリペイントとマスクも引き継ぐ。
   */
  setGeometry(positions, indices, colors = null, mask = null) {
    const nv = positions.length / 3;
    const nt = indices.length / 3;
    this.capV = 0; this.capT = 0;
    this.positions = new Float32Array(0);
    this.normals = new Float32Array(0);
    this.colors = new Float32Array(0);
    this.mask = new Float32Array(0);
    this.vAlive = new Uint8Array(0);
    this.tris = new Int32Array(0);
    this.nv = 0; this.nt = 0;
    this.freeVerts.length = 0; this.freeTris.length = 0;
    this._allocVerts(Math.max(1024, Math.ceil(nv * 1.5)));
    this._allocTris(Math.max(2048, Math.ceil(nt * 1.5)));

    this.positions.set(positions);
    if (colors && colors.length >= nv * 3) {
      this.colors.set(colors.subarray(0, nv * 3));
    } else {
      this.colors.fill(1, 0, nv * 3);
    }
    if (mask && mask.length >= nv) {
      this.mask.set(mask.subarray(0, nv));
    } else {
      this.mask.fill(0, 0, nv);
    }
    this.curv.fill(0, 0, nv);
    this.vAlive.fill(1, 0, nv);
    this.nv = nv;
    this.liveVerts = nv;

    this.tris.set(indices);
    this.nt = nt;
    this.liveTris = nt;
    this.rebuildRings();
    this.computeAllNormals();
    this.computeAllCurvature();
    this.topoVersion++;
    this.geomVersion++;
    this.markAllDirty();
  }

  /** フリースロットが多くなったら詰める（ストローク終了時に呼ぶ） */
  /**
   * 死んだスロットを詰めて 0..liveVerts-1 / 0..liveTris-1 が全部生きている状態にする。
   *
   * ゴミが少ないうちは費用に見合わないので既定では何もしない（false を返す）。
   * 「詰まっていること」を前提にする処理（分割レベル）は force=true で呼ぶこと。
   * 実際に、dyntopo で死んだスロットが 2 個（0.03%）残っただけで Divide が
   * 範囲外の頂点を参照して形が崩壊するバグを出した。
   */
  compact(force = false) {
    if (!force && this.freeTris.length < this.nt * 0.2 && this.freeVerts.length < this.nv * 0.2) return false;
    if (this.freeTris.length === 0 && this.freeVerts.length === 0) return false;
    const remapV = new Int32Array(this.nv).fill(-1);
    const P = new Float32Array(this.liveVerts * 3);
    const N = new Float32Array(this.liveVerts * 3);
    const C = new Float32Array(this.liveVerts * 3);
    const M = new Float32Array(this.liveVerts);
    const CV = new Float32Array(this.liveVerts);
    let w = 0;
    for (let v = 0; v < this.nv; v++) {
      if (!this.vAlive[v]) continue;
      remapV[v] = w;
      P[w * 3] = this.positions[v * 3];
      P[w * 3 + 1] = this.positions[v * 3 + 1];
      P[w * 3 + 2] = this.positions[v * 3 + 2];
      N[w * 3] = this.normals[v * 3];
      N[w * 3 + 1] = this.normals[v * 3 + 1];
      N[w * 3 + 2] = this.normals[v * 3 + 2];
      C[w * 3] = this.colors[v * 3];
      C[w * 3 + 1] = this.colors[v * 3 + 1];
      C[w * 3 + 2] = this.colors[v * 3 + 2];
      M[w] = this.mask[v];
      CV[w] = this.curv[v];
      w++;
    }
    const idx = new Int32Array(this.liveTris * 3);
    let wt = 0;
    for (let t = 0; t < this.nt; t++) {
      const i = t * 3, T = this.tris;
      if (T[i] === T[i + 1] && T[i + 1] === T[i + 2]) continue;
      const a = remapV[T[i]], b = remapV[T[i + 1]], c = remapV[T[i + 2]];
      if (a < 0 || b < 0 || c < 0) continue;
      idx[wt * 3] = a; idx[wt * 3 + 1] = b; idx[wt * 3 + 2] = c;
      wt++;
    }

    const nv = w, nt = wt;
    this.capV = 0; this.capT = 0;
    this.positions = new Float32Array(0);
    this.normals = new Float32Array(0);
    this.colors = new Float32Array(0);
    this.mask = new Float32Array(0);
    this.vAlive = new Uint8Array(0);
    this.tris = new Int32Array(0);
    this.nv = 0; this.nt = 0;
    this.freeVerts.length = 0; this.freeTris.length = 0;
    this._allocVerts(Math.max(1024, Math.ceil(nv * 1.4)));
    this._allocTris(Math.max(2048, Math.ceil(nt * 1.4)));
    this.positions.set(P.subarray(0, nv * 3));
    this.normals.set(N.subarray(0, nv * 3));
    this.colors.set(C.subarray(0, nv * 3));
    this.mask.set(M.subarray(0, nv));
    this.curv.set(CV.subarray(0, nv));
    this.vAlive.fill(1, 0, nv);
    this.nv = nv; this.liveVerts = nv;
    this.tris.set(idx.subarray(0, nt * 3));
    this.nt = nt; this.liveTris = nt;
    this.rebuildRings();
    this.topoVersion++;
    this.markAllDirty();
    return true;
  }

  // --- スナップショット（アンドゥ） --------------------------------------

  snapshot() {
    return {
      nv: this.nv, nt: this.nt,
      liveVerts: this.liveVerts, liveTris: this.liveTris,
      positions: this.positions.slice(0, this.nv * 3),
      colors: this.colors.slice(0, this.nv * 3),
      mask: this.mask.slice(0, this.nv),
      vAlive: this.vAlive.slice(0, this.nv),
      tris: this.tris.slice(0, this.nt * 3),
      freeVerts: this.freeVerts.slice(),
      freeTris: this.freeTris.slice(),
    };
  }

  restore(s) {
    this._allocVerts(s.nv);
    this._allocTris(s.nt);
    this.positions.set(s.positions);
    this.colors.set(s.colors);
    this.mask.set(s.mask);
    this.vAlive.set(s.vAlive);
    this.tris.set(s.tris);
    this.nv = s.nv; this.nt = s.nt;
    this.liveVerts = s.liveVerts; this.liveTris = s.liveTris;
    this.freeVerts = s.freeVerts.slice();
    this.freeTris = s.freeTris.slice();
    this.rebuildRings();
    this.computeAllNormals();
    this.computeAllCurvature();
    this.topoVersion++;
    this.geomVersion++;
    this.markAllDirty();
  }

  byteSize() {
    return this.positions.byteLength + this.normals.byteLength + this.colors.byteLength
      + this.mask.byteLength + this.curv.byteLength + this.tris.byteLength;
  }
}

// ---------------------------------------------------------------------------
// プリミティブ

      const f = 0.5 + 0.5 * Math.cos(v * TAU * k);
      const cell = (Math.floor(u * k + 0.5) + Math.floor(v * k + 0.5)) & 1;
      const hi = cell ? w : f;
      const lo = (cell ? f : w) * 0.55;
      return 1 - (hi > lo ? hi : lo);
    },
    depth: 0.8,
  },

  scratch: {
    dome: stampDome,
    // 傷は「線の上だけ効く」形。1 本目を原点ちょうどに通して中心を山にする。
    setup() {
      const n = 9;
      const L = new Float32Array(n * 6);   // px, py, dx, dy, len, phase
      for (let k = 0; k < n; k++) {
        const a = hash1(k, 101) * Math.PI;          // 向き
        const px = k === 0 ? 0 : (hash1(k, 202) * 2 - 1) * 0.72;
        const py = k === 0 ? 0 : (hash1(k, 303) * 2 - 1) * 0.72;
        const i = k * 6;
        L[i] = px; L[i + 1] = py;
        L[i + 2] = Math.cos(a); L[i + 3] = Math.sin(a);
        L[i + 4] = 0.45 + hash1(k, 404) * 0.55;     // 傷の長さ
        L[i + 5] = k === 0 ? 0 : hash1(k, 505) * TAU;  // 揺らぎの位相（0 本目は 0）
      }
      return { L, n };
    },
    field(u, v, ctx) {
      const L = ctx.L, n = ctx.n;
      let mark = 0;
      for (let k = 0; k < n; k++) {
        const i = k * 6;
        const ox = u - L[i], oy = v - L[i + 1];
        const dx = L[i + 2], dy = L[i + 3];
        const t = ox * dx + oy * dy;
        // 直線からの符号付き距離に沿った揺らぎを足して、まっすぐ過ぎない傷にする
        const off = ox * dy - oy * dx + 0.030 * Math.sin(t * 6.3 + L[i + 5]);
        const d = Math.abs(off);
        const len = L[i + 4];
        const taper = 1 - ss((Math.abs(t) - len) / 0.22);
        const m = (1 - ss((d - 0.008) / 0.028)) * taper;
        if (m > mark) mark = m;
      }
      return 1 - mark;
    },
    depth: 1,
  },
};

// ---------------------------------------------------------------------------
// 生成とキャッシュ
// ---------------------------------------------------------------------------

const _cache = new Map();

// SHAPES はオブジェクトリテラルなので SHAPES['toString'] や SHAPES['constructor'] が
// Object.prototype 由来で「在る」ように見えてしまう。保存済みの設定や UI 文字列が
// そのまま id として渡ってきても既定に落ちるよう、自前のキーだけを見る。
// （そのままだと dome が関数でなく TypeError で落ちる）
function shapeFor(id) {
  return Object.prototype.hasOwnProperty.call(SHAPES, id) ? SHAPES[id] : null;
}

function buildAlpha(id) {
  const shp = shapeFor(id) || SHAPES[DEFAULT_ALPHA];
  const size = ALPHA_SIZE;
  const dst = new Float32Array(size * size);
  const ctx = shp.setup ? shp.setup() : null;
  const dome = shp.dome;
  const field = shp.field || null;
  const depth = shp.depth !== undefined ? shp.depth : 0;

  // 中心での窪み量。これを基準にすると「中心の窪み = 0」が保証でき、
  // 中心の値は必ず dome(0) = 1（＝全体の最大）になる。
  const f0 = field ? field(0, 0, ctx) : 0;
  const invk = f0 < 0.999 ? 1 / (1 - f0) : 1;

  for (let y = 0; y < size; y++) {
    const sv = (y - HALF) / HALF;
    const row = y * size;
    for (let x = 0; x < size; x++) {
      const su = (x - HALF) / HALF;
      const r = Math.sqrt(su * su + sv * sv);
      let a = 0;
      if (r < 1) {
        a = rim(r) * dome(r);
        if (a > 0 && field) {
          let carve = (field(su, sv, ctx) - f0) * invk;
          if (carve > 0) a *= 1 - depth * (carve > 1 ? 1 : carve);
        }
      }
      dst[row + x] = a < 0 ? 0 : (a > 1 ? 1 : a);
    }
  }
  return dst;
}

/**
 * アルファのビットマップ（size*size の Float32Array, 0..1）。初回だけ生成する。
 * 未知の id は既定（soft）に落ちる。呼び出し側でキャッシュを持つ必要はない。
 */
function alphaData(id) {
  let d = _cache.get(id);
  if (d) return d;
  if (!shapeFor(id)) id = DEFAULT_ALPHA;
  d = _cache.get(id);
  if (!d) { d = buildAlpha(id); _cache.set(id, d); }
  return d;
}

/**
 * まだ作っていなければ作る。作ったら true（renderer.ensureMatcap と同じ用途）。
 * キャッシュは既定に落ちた後の id で引く。そうしないと未知の id では
 * 毎回 true が返り、「true ならテクスチャを転送」する呼び出し側が毎フレーム
 * 転送し続けてしまう。
 */
function ensureAlpha(id) {
  if (!shapeFor(id)) id = DEFAULT_ALPHA;
  if (_cache.has(id)) return false;
  alphaData(id);
  return true;
}

/**
 * 未生成のアルファを 1 枚だけ埋める。アイドル時に毎フレーム呼んで少しずつ進める。
 * SHAPES に無い id は飛ばす。飛ばさないと（表がずれたときに）その id が永久に
 * キャッシュに入らず、true を返し続けて先読みが終わらなくなる。
 */
function fillNextAlpha() {
  for (let i = 0; i < ALPHA_IDS.length; i++) {
    const id = ALPHA_IDS[i];
    if (shapeFor(id) && !_cache.has(id)) return ensureAlpha(id);
  }
  return false;
}

/** キャッシュを捨てる（メモリを返したいときだけ。作り直しても結果は同一） */
function clearAlphaCache() {
  _cache.clear();
  // sampleAlpha が握っている直前の配列も忘れる。作り直せば同じ中身になるので
  // 実害はないが、捨てたはずの配列を参照し続けるのは紛らわしい。
  _lastId = ''; _lastData = null;
}

/**
 * UI サムネイル / GPU テクスチャ用の RGBA8 バイト列。
 * DOM に触らないので Node からも呼べる。out を渡せば確保しない。
 */
function alphaBytes(id, out = null) {
  const d = alphaData(id);
  const n = d.length;
  const b = out && out.length >= n * 4 ? out : new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) {
    const g = Math.round(d[i] * 255);
    const p = i * 4;
    b[p] = g; b[p + 1] = g; b[p + 2] = g; b[p + 3] = g;
  }
  return b;
}

// ---------------------------------------------------------------------------
// サンプリング
// ---------------------------------------------------------------------------

// 1 ダブで数万頂点ぶん sampleAlpha が呼ばれるので、Map 参照を毎回やらずに
// 直前の id と配列を覚えておく（ダブの途中で id が変わることはない）。
let _lastId = '';
let _lastData = null;

function dataFor(id) {
  if (id === _lastId && _lastData) return _lastData;
  const d = alphaData(id);
  _lastId = id; _lastData = d;
  return d;
}

/**
 * u, v は 0..1（0.5, 0.5 が中心）。バイリニア補間。範囲外は 0。
 * 格子点割り付け（u = x / size）なので u = 0.5 はちょうど中心ピクセルを返す。
 */
function sampleAlpha(id, u, v) {
  if (!(u >= 0) || !(v >= 0) || u > 1 || v > 1) return 0;   // NaN もここで落ちる
  const d = dataFor(id);
  const size = ALPHA_SIZE;
  const fx = u * size, fy = v * size;
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx - x0, ty = fy - y0;
  const x1 = x0 + 1, y1 = y0 + 1;
  const okx0 = x0 >= 0 && x0 < size, okx1 = x1 >= 0 && x1 < size;
  const oky0 = y0 >= 0 && y0 < size, oky1 = y1 >= 0 && y1 < size;
  const a00 = (okx0 && oky0) ? d[y0 * size + x0] : 0;
  const a10 = (okx1 && oky0) ? d[y0 * size + x1] : 0;
  const a01 = (okx0 && oky1) ? d[y1 * size + x0] : 0;
  const a11 = (okx1 && oky1) ? d[y1 * size + x1] : 0;
  const t0 = a00 + (a10 - a00) * tx;
  const t1 = a01 + (a11 - a01) * tx;
  return t0 + (t1 - t0) * ty;
}

/**
 * ダブの接平面に貼ったアルファの重み。ブラシの減衰に掛ける係数（0..1）。
 * @param {string} id
 * @param {number} px,py,pz  頂点のワールド座標
 * @param {ArrayLike<number>} center     ダブ中心（ワールド）
 * @param {ArrayLike<number>} tangent    接平面の基底 1（単位ベクトル）
 * @param {ArrayLike<number>} bitangent  接平面の基底 2（単位ベクトル）
 * @param {number} radius    ブラシ半径。これがアルファの半幅に対応する
 * @param {number} rotation  アルファの回転（rad, 反時計回り）
 */
function alphaWeightAt(id, px, py, pz, center, tangent, bitangent, radius, rotation) {
  const inv = 1 / (radius > 1e-12 ? radius : 1e-12);
  const dx = px - center[0], dy = py - center[1], dz = pz - center[2];
  let x = (dx * tangent[0] + dy * tangent[1] + dz * tangent[2]) * inv;
  let y = (dx * bitangent[0] + dy * bitangent[1] + dz * bitangent[2]) * inv;
  if (rotation) {
    // スタンプを +rotation 回すので、サンプリング座標は -rotation 回す
    const c = Math.cos(rotation), s = Math.sin(rotation);
    const xr = x * c + y * s;
    y = -x * s + y * c;
    x = xr;
  }
  return sampleAlpha(id, x * 0.5 + 0.5, y * 0.5 + 0.5);
}

// ---------------------------------------------------------------------------
// ストロークタイプ
// ---------------------------------------------------------------------------

const STROKES = [
  {
    id: 'dots', jp: 'ドット', hint: '等間隔にダブを置く（既定の挙動）',
    params: ['spacing'],
    def: { spacing: 0.16, scatter: 0, sizeJitter: 0, colorJitter: 0, spin: false, align: false },
  },
  {
    id: 'freehand', jp: 'フリーハンド', hint: '間隔を詰めて連続した線にする',
    params: ['spacing'],
    def: { spacing: 0.04, scatter: 0, sizeJitter: 0, colorJitter: 0, spin: false, align: true },
  },
  {
    id: 'dragRect', jp: 'ドラッグ矩形', hint: '押した点から引いた分でスタンプ 1 個の大きさと向きが決まる',
    params: [],
    def: { spacing: 0, scatter: 0, sizeJitter: 0, colorJitter: 0, spin: false, align: true },
  },
  {
    id: 'spray', jp: 'スプレー', hint: '半径内にばらつかせて撒く',
    params: ['spacing', 'scatter', 'sizeJitter'],
    def: { spacing: 0.22, scatter: 0.85, sizeJitter: 0.45, colorJitter: 0, spin: true, align: false },
  },
  {
    id: 'colorSpray', jp: 'カラースプレー', hint: 'スプレーに加えて色も揺らす',
    params: ['spacing', 'scatter', 'sizeJitter', 'colorJitter'],
    def: { spacing: 0.22, scatter: 0.85, sizeJitter: 0.45, colorJitter: 0.5, spin: true, align: false },
  },
  {
    id: 'sprayLight', jp: 'スプレー（弱）', hint: 'ばらつきの小さいスプレー',
    params: ['spacing', 'scatter', 'sizeJitter'],
    def: { spacing: 0.12, scatter: 0.3, sizeJitter: 0.18, colorJitter: 0, spin: true, align: false },
  },
];

const STROKE_IDS = STROKES.map(s => s.id);
const STROKE_BY_ID = new Map(STROKES.map(s => [s.id, s]));
const DEFAULT_STROKE = 'dots';

/** ダブ 1 個ぶんの要素数: x, y, z, scaleMul, rotation, colorJitter */
const DAB_STRIDE = 6;

/** 1 回の planDabs が返すダブ数の絶対上限（スクラッチの確保量を有界にする） */
const MAX_DABS = 65536;

/** 押した点を基準に 1 個だけスタンプするタイプか（呼び出し側の扱いが変わる） */
function isDragStroke(id) { return id === 'dragRect'; }

/** ばらつきを持つタイプか（アルファの回転をランダム化してよいか） */
function isSprayStroke(id) {
  return id === 'spray' || id === 'colorSpray' || id === 'sprayLight';
}

/** UI の初期値に使うパラメータ既定値（複製を返すので書き換えて構わない） */
function strokeDefaults(id) {
  const s = STROKE_BY_ID.get(id) || STROKE_BY_ID.get(DEFAULT_STROKE);
  return Object.assign({}, s.def);
}

// planDabs は 1 フレームにミラー数 × 区間ぶん呼ばれるので、戻り値も含めて何も
// 確保しない。返るオブジェクトと dabs は使い回しなので、次に planDabs を呼ぶまでしか
// 有効でない（sculptor の MirrorState.verts と同じ規約）。値を跨いで持ちたいときは
// 呼び出し側で写すこと。
let _dabs = new Float32Array(256 * DAB_STRIDE);
const _out = {
  dabs: _dabs, count: 0, stride: DAB_STRIDE,
  step: 0, advance: 0, truncated: false, scattered: 0,
};

const _bt = V3.create();   // 接平面の基底 1
const _bb = V3.create();   // 接平面の基底 2
const _bn = V3.create();

function ensureDabs(n) {
  if (_dabs.length >= n * DAB_STRIDE) return;
  _dabs = new Float32Array(Math.max(256, n) * DAB_STRIDE);
  _out.dabs = _dabs;
}

/**
 * ctx.tangent / bitangent が来ていればそれを使う。無ければ法線から、
 * それも無ければ進行方向から作る。スプレーの散らしと回転はこの基底の上で決まるので、
 * 呼び出し側が毎ダブ同じ基底を渡す限りミラー間でも結果が一致する。
 */
function makeBasis(ctx, dx, dy, dz, dist) {
  // 長さ 0 の基底や NaN 入りの基底を信じると、散らしが 1 次元に潰れる
  // （法線が 0 だと cross が 0 ベクトルになる）か、全ダブが NaN になる。
  // 潰れた面や孤立頂点の法線は実際に 0 になり得るので、使えないと分かったら
  // 黙って次の作り方に落とす。lenSq が NaN / Inf のときも下の比較で弾かれる。
  if (ctx.tangent && ctx.bitangent) {
    const tl = V3.lenSq(ctx.tangent), bl = V3.lenSq(ctx.bitangent);
    if (tl > 1e-20 && tl < Infinity && bl > 1e-20 && bl < Infinity) {
      V3.copy(_bt, ctx.tangent);
      V3.copy(_bb, ctx.bitangent);
      return;
    }
  }
  const nl = ctx.normal ? V3.lenSq(ctx.normal) : 0;
  if (nl > 1e-20 && nl < Infinity) {
    V3.normalize(_bn, ctx.normal);
    if (dist > 1e-12) {
      V3.set(_bt, dx / dist, dy / dist, dz / dist);
      V3.tangential(_bt, _bt, _bn);
      if (V3.lenSq(_bt) < 1e-16) V3.perpendicular(_bt, _bn);
      else V3.normalize(_bt, _bt);
    } else {
      V3.perpendicular(_bt, _bn);
    }
    V3.cross(_bb, _bn, _bt);
    return;
  }
  if (dist > 1e-12) {
    V3.set(_bt, dx / dist, dy / dist, dz / dist);
    V3.perpendicular(_bb, _bt);
  } else {
    V3.set(_bt, 1, 0, 0);
    V3.set(_bb, 0, 1, 0);
  }
}

/**
 * 1 区間ぶんのダブの撒き方を決める。
 *
 * @param {string} strokeId
 * @param {object} ctx
 *   from      : ArrayLike(3) 前回のダブ位置（dragRect では押した点）
 *   to        : ArrayLike(3) 現在のカーソル位置
 *   radius    : number ブラシ半径（world）
 *   spacing   : number ダブ間隔（半径に対する割合）。省略でタイプの既定値
 *   scatter   : number 散らす量（半径に対する割合）
 *   sizeJitter: number 大きさの揺らぎ 0..1
 *   colorJitter: number 色の揺らぎ 0..1
 *   seed      : number ストロークごとの整数シード
 *   dabIndex  : number ストローク内の通し番号（揺らぎの位相に使う）
 *   normal / tangent / bitangent : 散らす平面（省略時は進行方向から作る）
 *   maxDabs   : number 1 回で返す上限（既定 256、MAX_DABS で頭打ち）
 * @returns {{dabs: Float32Array, count: number, stride: number,
 *            step: number, advance: number, truncated: boolean, scattered: number}}
 *   dabs      : (x, y, z, scaleMul, rotation, colorJitter) × count
 *   step      : 実際に使ったダブ間隔（world）。dragRect ではドラッグ長
 *   advance   : from をどこまで進めてよいか。端数は次回に持ち越す
 *   truncated : maxDabs で打ち切ったか（UI に「間隔が細かすぎる」と出せる）
 *   scattered : 散らしたダブの数（統計表示用）
 */
function planDabs(strokeId, ctx) {
  const S = STROKE_BY_ID.get(strokeId) || STROKE_BY_ID.get(DEFAULT_STROKE);
  const def = S.def;
  const R = ctx.radius > 0 ? ctx.radius : 1e-6;
  const from = ctx.from, to = ctx.to;
  const dx = to[0] - from[0], dy = to[1] - from[1], dz = to[2] - from[2];
  let dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
  // from / to に NaN（レイが外れたときの逆投影など）が混ざると dist が NaN になり、
  // dist < step の比較が false 側に落ちて count と advance が NaN のまま外へ出る。
  // advance は呼び出し側のストローク位置に足し込まれるので、一度 NaN を返すと
  // そのストロークが二度と復帰しない。ここで「動いていない」に丸めて閉じる。
  if (!(dist > 0)) dist = 0;

  _out.count = 0; _out.step = 0; _out.advance = 0;
  _out.truncated = false; _out.scattered = 0;

  makeBasis(ctx, dx, dy, dz, dist);
  const tx = _bt[0], ty = _bt[1], tz = _bt[2];
  const bx = _bb[0], by = _bb[1], bz = _bb[2];

  // 進行方向を接平面上の角度に直す（アルファをストロークに沿わせるため）
  let align = 0;
  if (def.align && dist > 1e-12) {
    align = Math.atan2(dx * bx + dy * by + dz * bz, dx * tx + dy * ty + dz * tz);
  }

  // --- ドラッグ 1 個ぶんのスタンプ ---------------------------------------
  if (S.id === 'dragRect') {
    ensureDabs(1);
    const d = _dabs;
    d[0] = from[0]; d[1] = from[1]; d[2] = from[2];
    d[3] = Math.max(0.05, dist / R);     // 引いた長さがそのままスタンプ半径になる
    d[4] = align;
    d[5] = 0;
    _out.count = 1;
    _out.step = dist;
    _out.advance = 0;                    // アンカーは動かさない
    return _out;
  }

  // --- 距離で刻むタイプ ---------------------------------------------------
  const spacing = ctx.spacing > 0 ? ctx.spacing : def.spacing;
  const step = Math.max(R * spacing, 1e-6);
  _out.step = step;
  if (dist < step) return _out;

  // 上限は整数に丸めてから使う。小数のままだと ensureDabs が非整数長の
  // Float32Array を作ろうとして RangeError になり、count も小数になる。
  // さらに MAX_DABS で頭を押さえる。異常な値が来ても数百 MB のスクラッチを
  // 掴んで離さない事故にしないため（打ち切りぶんは truncated で次回に回る）。
  let maxDabs = ctx.maxDabs > 0 ? Math.floor(ctx.maxDabs) : 256;
  if (maxDabs > MAX_DABS) maxDabs = MAX_DABS;
  // radius * spacing は割り切れないことが多く、素の floor だと
  // 「1.0 / (0.1*0.2) = 49.99999999999999」で最後の 1 本が落ちる。
  // 設定した間隔どおりの本数を返したいので丸め誤差ぶんだけ許す。
  let n = Math.floor(dist / step + 1e-9);
  if (n > maxDabs) { n = maxDabs; _out.truncated = true; }
  ensureDabs(n);

  const scatter = ctx.scatter !== undefined ? ctx.scatter : def.scatter;
  const sizeJit = ctx.sizeJitter !== undefined ? ctx.sizeJitter : def.sizeJitter;
  const colJit = ctx.colorJitter !== undefined ? ctx.colorJitter : def.colorJitter;
  const spin = def.spin;
  const seed = (ctx.seed | 0);
  const base = (ctx.dabIndex | 0);
  const ux = dist > 0 ? dx / dist : 0, uy = dist > 0 ? dy / dist : 0, uz = dist > 0 ? dz / dist : 0;
  const fx = from[0], fy = from[1], fz = from[2];
  const d = _dabs;

  let scattered = 0;
  for (let k = 0; k < n; k++) {
    const t = step * (k + 1);
    let px = fx + ux * t, py = fy + uy * t, pz = fz + uz * t;
    let scaleMul = 1, rot = align, cj = 0;

    if (scatter > 0 || sizeJit > 0 || colJit > 0 || spin) {
      // ハッシュのキーは (seed, 通し番号) だけ。時間や乱数状態に依存しないので
      // アンドゥ→リドゥでも、シンメトリの各ミラーでも同じ絵になる。
      const gi = (base + k) * 8;
      if (scatter > 0) {
        // sqrt で円板上に一様に散らす（中心に寄りすぎない）
        const rr = Math.sqrt(hash1(seed, gi)) * scatter * R;
        const aa = hash1(seed, gi + 1) * TAU;
        const ca = Math.cos(aa) * rr, sa = Math.sin(aa) * rr;
        px += tx * ca + bx * sa;
        py += ty * ca + by * sa;
        pz += tz * ca + bz * sa;

    this._tanU = V3.create();
