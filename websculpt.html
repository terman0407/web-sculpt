/** ブラシは数字キーの対応も出す（左の並び順 = キーの順） */
function brushItems() {
  return BRUSHES.map((b, i) => ({
    name: b.jp,
    sub: b.name,
    icon: b.icon,
    key: i < 10 ? String((i + 1) % 10) : '',
    desc: b.hint || '',
  }));
}

function fromTable(list) {
  return list.map(d => ({
    name: d.jp,
    sub: d.name || '',
    desc: d.hint || '',
    // params の形はパレットによって違う。DEFORMS / MASK_OPS は {key, jp, …} の
    // 配列、STROKES は文字列（キー名）の配列。どちらでも読めるようにする。
    params: d.params && d.params.length
      ? d.params.map(p => (typeof p === 'string' ? p : p.jp)).join(' / ')
      : '',
  }));
}

function shortcutRows(shortcuts) {
  const groups = new Map();
  for (const s of shortcuts || []) {
    if (s.hidden || !s.group) continue;
    if (!groups.has(s.group)) groups.set(s.group, []);
    groups.get(s.group).push({ keys: s.keys, jp: s.jp });
  }
  // 表に無いがマウス側で処理しているもの。ここだけは手で足す
  groups.set('視点', [
    { keys: '右ドラッグ', jp: '視点を回す' },
    { keys: 'ホイール', jp: '寄る / 引く' },
    { keys: '中ドラッグ / Space+ドラッグ', jp: '平行移動' },
    ...(groups.get('視点') || []).filter(r => !/Space/.test(r.keys)),
  ]);
  groups.set('押している間だけ', [
    { keys: 'Shift+ドラッグ', jp: 'スムーズ' },
    { keys: 'Ctrl+ドラッグ', jp: 'マスクを塗る' },
    { keys: 'Alt+ドラッグ', jp: 'ブラシの向きを反転' },
  ]);
  return [...groups.entries()].map(([name, rows]) => ({ name, rows }));
}

const TABLES = {
  brushes: brushItems,
  deforms: () => fromTable(DEFORMS),
  maskops: () => fromTable(MASK_OPS),
  groups: () => fromTable(GROUP_METHODS),
  strokes: () => fromTable(STROKES),
  alphas: () => ALPHAS.map(a => ({ name: a.jp, sub: a.id, desc: a.hint || '' })),
};

  // --- 減衰カーブ（フォーカルシフト）+ プレビュー -----------------------

  fCanvas.width = 236; fCanvas.height = 52;
  const fInput = el('input', null, fRow);
  fInput.type = 'range'; fInput.min = -100; fInput.max = 100; fInput.step = 1;
  fInput.value = Math.round(state.focalShift * 100);
  fRow.title = '＋で中心が平らになり当たりが硬く、−で柔らかくなる（ZBrush の Focal Shift）';

  function drawFalloff() {
    const ctx = fCanvas.getContext('2d');
    const W = fCanvas.width, H = fCanvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#2b303a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 1; k < 4; k++) {
      const x = (W - 1) * k / 4 + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    ctx.stroke();
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(217,116,75,0.35)');
    grad.addColorStop(1, 'rgba(217,116,75,0.02)');
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) {
      const t = x / (W - 1);
      const y = H - 1 - falloff(t, state.focalShift) * (H - 3);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W - 1, H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    for (let x = 0; x < W; x++) {
      const t = x / (W - 1);
      const y = H - 1 - falloff(t, state.focalShift) * (H - 3);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#f0925f';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }
  const syncFocal = () => {
    const v = parseInt(fInput.value, 10);
    state.focalShift = v / 100;
    fVal.textContent = (v > 0 ? '+' : '') + v;
    drawFalloff();

  // --- レイジーマウス / 筆圧 --------------------------------------------

  const paintRow = el('div', 'ctl', bs);

  // --- アルファ / ストローク ---------------------------------------------
  // ZBrush の Alpha パレットと Stroke パレット相当。
  const al = section(right, 'アルファ / ストローク', true);
  {

  // --- 仕上げレンダリング（BPR 相当）------------------------------------

  // 速さなので、スライダーを掴んだまま光の向きを回して見られる。
  // 保存だけは指定倍率で描き直す。
  const rpv = document.getElementById('rpv');
  const rpvImg = document.getElementById('rpvImg');
  const rpvInfo = document.getElementById('rpvInfo');
  let rpvUrl = null;
  let rpvPending = false, rpvQueued = false;

  const rpvIsOpen = () => rpv.classList.contains('show');
  /**
   * プレビューを描き直す。描画中に呼ばれたら 1 回だけ予約する
   * （スライダーのドラッグで呼び出しが溜まらないように）。
   */
  const rpvRender = async () => {
    if (!rpvIsOpen()) return;
    if (rpvPending) { rpvQueued = true; return; }
    rpvPending = true;
    rpv.classList.add('busy');
    try {
      for (;;) {
        rpvQueued = false;
        // プレビューは倍率 1（速さ優先）。保存時に本来の倍率で描き直す。
        const r = await app.renderStill({ download: false, scale: 1, preview: true });
        if (r) {
          if (rpvUrl) URL.revokeObjectURL(rpvUrl);
          rpvUrl = URL.createObjectURL(r.blob);
          rpvImg.src = rpvUrl;
          rpvInfo.textContent = `${r.width}×${r.height} / ${r.ms}ms`
            + `（保存は ${state.bprScale}x = ${r.width * state.bprScale}×${r.height * state.bprScale}）`;
        }
        if (!rpvQueued || !rpvIsOpen()) break;
      }
    } finally {
      rpvPending = false;
      rpv.classList.remove('busy');
    }
  };
  const rpvOpen = () => { rpv.classList.add('show'); rpvRender(); };
  const rpvClose = () => {
    rpv.classList.remove('show');
    if (rpvUrl) { URL.revokeObjectURL(rpvUrl); rpvUrl = null; }
    rpvImg.removeAttribute('src');
  };
  document.getElementById('rpvClose').onclick = rpvClose;
  document.getElementById('rpvSave').onclick = () => app.renderStill();
  rpv.addEventListener('pointerdown', (e) => { if (e.target === rpv) rpvClose(); });

    this._nset = new Int32Array(0);       // 法線を直す頂点（領域 + その 1-ring）
    this._nsetCount = 0;
    this._stamp = new Int32Array(0);
    this._stampId = 0;

    this._handles = null;
    this._lastScale = 1;
    this._ringScratch = new Float64Array(12);   // 矢印の先端リング（毎フレーム使い回す）

    // --- ドラッグ状態 ---------------------------------------------------
    this._kind = null;
    this._axis = -1;
    this._dragPivot = new Float32Array(3);   // 開始時のピボット（変換の中心）
    this._dragBasis = new Float32Array(9);   // 開始時の基底（変換の軸）
    this._planeN = new Float32Array(3);      // uniform の参照平面法線（視線で固定）
    this._refDir = new Float32Array(3);      // uniform の参照方向（符号付き半径用）
    this._planeScratch = new Float64Array(3);
    this._s0 = 0;         // move: 軸上の開始位置
    this._sCur = 0;       // move: 直近の軸上位置（退化フレームで前値を保つ）
    this._angPrev = 0;    // rotate: 直近の生の角度
    this._angAcc = 0;     // rotate: 累積角（1 回転を超えても連続する）
    this._r0 = 0;         // scale: 開始半径
    this._u0 = 0; this._v0 = 0;  // scale: 平面内の開始方向（符号付き半径用）
    this._factor = 1;
    this._refOk = false;  // 基準量が取れているか（退化した掴み方だと取れない）
    this._lastChanged = 0;
    this._touched = false;
    this._normalsStale = false;

    this._D = new Float64Array(9);   // 変換 A から単位行列を引いたもの（後述）
    this._result = { changed: 0, kind: null, axis: -1, offset: 0, degrees: 0, factor: 1 };
  }

  _identityBasis() {
    const B = this._basis;
    B[0] = 1; B[1] = 0; B[2] = 0;
    B[3] = 0; B[4] = 1; B[5] = 0;
    B[6] = 0; B[7] = 0; B[8] = 1;
  }

  get active() { return this._active; }

  /**
   * 内部の配列も解放する（トランスポーズモードを抜けるとき）。
   * ドラッグ中なら先に endDrag / cancelDrag を呼ぶこと。mesh を受け取らないので
   * mods.normals = false で後回しにした法線をここでは清算できない。
   */
  clear() {
    this._active = false;
    this._kind = null;
    this._axis = -1;
    this._count = 0;
    this._wsum = 0;
    this._guard = -1;
    this._verts = new Int32Array(0);
    this._weights = new Float32Array(0);
    this._orig = new Float32Array(0);
    this._nset = new Int32Array(0);
    this._nsetCount = 0;
    // stamp は capV ぶん（数百万頂点で 12MB）あるので一緒に返す。
    // _stampId は増やしたままにしておけば、次に確保したゼロ埋め配列と衝突しない。
    this._stamp = new Int32Array(0);
    this._lastChanged = 0;
    this._touched = false;
    this._normalsStale = false;
    this._pivot[0] = 0; this._pivot[1] = 0; this._pivot[2] = 0;
    this._identityBasis();
  }

  /** ピボット（ワールド）。ドラッグ中の移動もここに反映される */
  pivot() { return [this._pivot[0], this._pivot[1], this._pivot[2]]; }

  /**
   * 基底。軸 i は [i * 3 + 0..2]。毎フレーム呼ばれるので内部配列をそのまま返す
   * （書き換えないこと）。
   */
  basis() { return this._basis; }

  /** 領域の統計（UI 表示用） */
  stats() {
    return { active: this._active, verts: this._count, weightSum: this._wsum, dragging: this._kind };
  }

  /**
   * 領域がまだこのメッシュのものか確かめる。ダイナメッシュ / 細分化 / 分離のあとは
   * 同じ頂点番号が別の頂点を指すので、控えた領域で書き込むと無関係な場所が動く
   * （範囲外は黙って捨てられるので気付けない）。false が返ったら setFromMask を
   * やり直す。beginDrag も内部でこれを通す。
   * @returns {boolean} まだ使えるか
   */
  validate(mesh) {
    if (!this._active) return false;
    if (mesh.topoVersion === this._guard) return true;
    this.clear();
    return false;
  }

  // --- 領域とピボットの決定 ----------------------------------------------

  /**
   * マスクされていない領域からピボットと基底を決める。
   * マスクが真っ白（全部 0）なら領域はメッシュ全体になる（ZBrush と同じ）。
   *
   * @param {SculptMesh} mesh
   * @param {object} opts
   *   basis     : 'world'（既定）| 'pca'  領域の主成分をローカル軸にする
   *   threshold : これ以下の weight は領域に入れない（既定 1e-4）
   * @returns {boolean} 領域が空なら false
   */
  setFromMask(mesh, opts = {}) {
    // ドラッグ中に呼ばれたら、その変形は確定済みとして扱い状態だけ捨てる。
    // mods.normals = false で後回しにしていたぶんはここで清算しておく。以後
    // endDrag は来ないので、やらないと法線が永久に 1 フレーム前のままになる。
    if (this._normalsStale && mesh.topoVersion === this._guard) {
      mesh.computeNormalsFor(this._nset, this._nsetCount);
    }
    this._normalsStale = false;
    this._kind = null;
    this._touched = false;
    this._lastChanged = 0;
    const thr = opts.threshold !== undefined ? opts.threshold : 1e-4;
    const nv = mesh.nv;
    const M = mesh.mask, A = mesh.vAlive, P = mesh.positions;

    // 件数を数えてから 1 回で確保する（push を使わないため）
    let n = 0;
    for (let v = 0; v < nv; v++) {
      if (A[v] === 0) continue;
      const mk = M[v];
      if (1 - (mk < 0 ? 0 : (mk > 1 ? 1 : mk)) > thr) n++;
    }
    if (n === 0) { this.clear(); return false; }

    if (this._verts.length < n) {
      this._verts = new Int32Array(n);
      this._weights = new Float32Array(n);
    }
    const V = this._verts, W = this._weights;
    let k = 0;
    let cx = 0, cy = 0, cz = 0, wsum = 0;
    for (let v = 0; v < nv; v++) {
      if (A[v] === 0) continue;
      const mk = M[v];
      const w = 1 - (mk < 0 ? 0 : (mk > 1 ? 1 : mk));
      if (w <= thr) continue;
      V[k] = v; W[k] = w; k++;
      const i = v * 3;
      cx += P[i] * w; cy += P[i + 1] * w; cz += P[i + 2] * w;
      wsum += w;
    }
    this._count = k;
    this._wsum = wsum;
    if (wsum <= 0) { this.clear(); return false; }

    // ピボットは加重重心。マスクのグラデーションがそのまま「引っぱりの中心」に
    // 効くので、部分マスクでも直感どおりの位置になる。
    const inv = 1 / wsum;
    this._pivot[0] = cx * inv; this._pivot[1] = cy * inv; this._pivot[2] = cz * inv;

    if (opts.basis === 'pca') this._basisFromPCA(mesh);
    else this._identityBasis();

    this._guard = mesh.topoVersion;
    this._active = true;
    return true;
  }

  /**
   * 領域の主成分を基底にする（ZBrush の Gizmo のローカル軸相当）。
   * 共分散行列は 3x3 なのでヤコビ回転で十分。
   */
  _basisFromPCA(mesh) {
    const P = mesh.positions, V = this._verts, W = this._weights, n = this._count;
    const px = this._pivot[0], py = this._pivot[1], pz = this._pivot[2];
    let cxx = 0, cyy = 0, czz = 0, cxy = 0, cxz = 0, cyz = 0;
    for (let k = 0; k < n; k++) {
      const i = V[k] * 3, w = W[k];
      const dx = P[i] - px, dy = P[i + 1] - py, dz = P[i + 2] - pz;
      cxx += dx * dx * w; cyy += dy * dy * w; czz += dz * dz * w;
      cxy += dx * dy * w; cxz += dx * dz * w; cyz += dy * dz * w;
    }
    const inv = 1 / this._wsum;
    // 対角が全部ゼロ（1 点に縮退）なら主成分は定まらないのでワールド軸に落とす
    if ((cxx + cyy + czz) * inv < 1e-20) { this._identityBasis(); return; }
    const a = new Float64Array(9);
    a[0] = cxx * inv; a[4] = cyy * inv; a[8] = czz * inv;
    a[1] = a[3] = cxy * inv;
    a[2] = a[6] = cxz * inv;
    a[5] = a[7] = cyz * inv;
    const Vm = new Float64Array(9), ev = new Float64Array(3);
    jacobiEigen3(a, Vm, ev);

    // 固有値の降順に並べる（3 個なので添字を直接入れ替える）
    let i0 = 0, i1 = 1, i2 = 2;
    if (ev[i1] > ev[i0]) { const t = i0; i0 = i1; i1 = t; }
    if (ev[i2] > ev[i0]) { const t = i0; i0 = i2; i2 = t; }
    if (ev[i2] > ev[i1]) { const t = i1; i1 = i2; i2 = t; }

    const B = this._basis;
    // 固有ベクトルの符号は不定なので「絶対値最大の成分を正にする」で固定する。
    // そうしないと同じ形に対して setFromMask を呼び直すたびに軸が反転して、
    // ハンドルの向きがちらつく。
    this._putEigen(B, 0, Vm, i0);
    this._putEigen(B, 1, Vm, i1);
    // 2 本目を 1 本目に直交化（固有ベクトルは数値誤差で完全直交ではない）
    {
      const d = B[3] * B[0] + B[4] * B[1] + B[5] * B[2];
      B[3] -= B[0] * d; B[4] -= B[1] * d; B[5] -= B[2] * d;
      const l = Math.hypot(B[3], B[4], B[5]);
      if (l < 1e-9) { this._identityBasis(); return; }
      B[3] /= l; B[4] /= l; B[5] /= l;
    }
    // 3 本目は外積で作る。第 3 固有ベクトルをそのまま使うと符号固定のあとで
    // 左手系になることがあり、回転の向きが軸ごとに食い違う。
    B[6] = B[1] * B[5] - B[2] * B[4];
    B[7] = B[2] * B[3] - B[0] * B[5];
    B[8] = B[0] * B[4] - B[1] * B[3];
  }

  _putEigen(B, row, Vm, col) {
    let x = Vm[col], y = Vm[3 + col], z = Vm[6 + col];
    const l = Math.hypot(x, y, z);
    if (l < 1e-12) { x = row === 0 ? 1 : 0; y = row === 1 ? 1 : 0; z = row === 2 ? 1 : 0; }
    else { x /= l; y /= l; z /= l; }
    const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
    const m = ax >= ay && ax >= az ? x : (ay >= az ? y : z);
    if (m < 0) { x = -x; y = -y; z = -z; }
    B[row * 3] = x; B[row * 3 + 1] = y; B[row * 3 + 2] = z;
  }

  // --- ハンドル形状 -------------------------------------------------------

  /**
   * ハンドルをワールド座標の線分リストとして返す。
   * points は 2 点ずつが 1 線分（line-list 用）で、要素数は常に 6 の倍数。
   * 回転リングも「円周上の点列」を線分に展開して返すので、呼び出し側は
   * 種類を区別せずそのまま線で描ける。
   *
   * 毎フレーム呼ばれるので配列は使い回す（返ってきた Float32Array を保持せず、
   * その場で GPU へ書くこと）。
   *
   * @param {number} scale ギズモの大きさ（ワールド）。矢印の全長 = リング半径
   */
  handles(scale = 1) {
    // 領域が無いときは空を返す。呼び出し側が active を見ずに描いても何も出ない
    if (!this._active) return EMPTY_HANDLES;
    if (!this._handles) this._handles = makeHandleStore();
    const H = this._handles;
    const L = scale > 0 ? scale : 1;
    this._lastScale = L;
    const B = this._basis;
    const px = this._pivot[0], py = this._pivot[1], pz = this._pivot[2];

    for (let i = 0; i < 3; i++) {
      const ax = B[i * 3], ay = B[i * 3 + 1], az = B[i * 3 + 2];
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
      const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];

      // --- 矢印 ---------------------------------------------------------
      {
        const p = H[i].points, rp = this._ringScratch;
        const bl = L * (1 - HEAD_LEN), hr = L * HEAD_RAD;
        const bx = px + ax * bl, by = py + ay * bl, bz = pz + az * bl;
        const tx = px + ax * L, ty = py + ay * L, tz = pz + az * L;
        p[0] = px; p[1] = py; p[2] = pz;
        p[3] = bx; p[4] = by; p[5] = bz;
        // 先端の底リング 4 点を (+u, +v, -u, -v) の順に作る
        for (let e = 0; e < 4; e++) {
          const su = e === 0 ? 1 : (e === 2 ? -1 : 0);
          const sv = e === 1 ? 1 : (e === 3 ? -1 : 0);
          const o = e * 3;
          rp[o] = bx + (ux * su + vx * sv) * hr;
          rp[o + 1] = by + (uy * su + vy * sv) * hr;
          rp[o + 2] = bz + (uz * su + vz * sv) * hr;
        }
        // 「先端 → 各点」と「隣り合う点どうし」で円錐の輪郭になる
        let o = 6;
        for (let e = 0; e < 4; e++) {
          const a0 = e * 3;
          p[o] = tx; p[o + 1] = ty; p[o + 2] = tz;
          p[o + 3] = rp[a0]; p[o + 4] = rp[a0 + 1]; p[o + 5] = rp[a0 + 2];
          o += 6;
        }
        for (let e = 0; e < 4; e++) {
          const a0 = e * 3, b0 = ((e + 1) & 3) * 3;
          p[o] = rp[a0]; p[o + 1] = rp[a0 + 1]; p[o + 2] = rp[a0 + 2];
          p[o + 3] = rp[b0]; p[o + 4] = rp[b0 + 1]; p[o + 5] = rp[b0 + 2];
          o += 6;
        }
      }

      // --- 平面スケールハンドル（法線が軸 i / 面内が軸 j,k）-------------
      {
        const p = H[3 + i].points;
        const off = L * PLANE_OFF, h = L * PLANE_HALF;
        const cx = px + (ux + vx) * off, cy = py + (uy + vy) * off, cz = pz + (uz + vz) * off;
        let o = 0;
        for (let e = 0; e < 4; e++) {
          const f = (e + 1) & 3;
          p[o] = cx + (ux * QUAD_U[e] + vx * QUAD_V[e]) * h;
          p[o + 1] = cy + (uy * QUAD_U[e] + vy * QUAD_V[e]) * h;
          p[o + 2] = cz + (uz * QUAD_U[e] + vz * QUAD_V[e]) * h;
          p[o + 3] = cx + (ux * QUAD_U[f] + vx * QUAD_V[f]) * h;
          p[o + 4] = cy + (uy * QUAD_U[f] + vy * QUAD_V[f]) * h;
          p[o + 5] = cz + (uz * QUAD_U[f] + vz * QUAD_V[f]) * h;
          o += 6;
        }
      }

      // --- 回転リング ---------------------------------------------------
      {
        const p = H[6 + i].points;
        const dth = (Math.PI * 2) / RING_SEGS;
        let o = 0, c0 = L, s0 = 0;
        for (let e = 0; e < RING_SEGS; e++) {
          const th = (e + 1) * dth;
          const c1 = Math.cos(th) * L, s1 = Math.sin(th) * L;
          p[o] = px + ux * c0 + vx * s0;
          p[o + 1] = py + uy * c0 + vy * s0;
          p[o + 2] = pz + uz * c0 + vz * s0;
          p[o + 3] = px + ux * c1 + vx * s1;
          p[o + 4] = py + uy * c1 + vy * s1;
          p[o + 5] = pz + uz * c1 + vz * s1;
          c0 = c1; s0 = s1;
          o += 6;
        }
      }
    }

    // --- 中心の箱（一様スケール）-----------------------------------------
    {
      const p = H[9].points;
      const h = L * CENTER_HALF;
      for (let e = 0; e < 24; e++) {
        const s = BOX_EDGES[e];
        const sx = (s & 1) ? 1 : -1, sy = (s & 2) ? 1 : -1, sz = (s & 4) ? 1 : -1;
        p[e * 3] = px + (B[0] * sx + B[3] * sy + B[6] * sz) * h;
        p[e * 3 + 1] = py + (B[1] * sx + B[4] * sy + B[7] * sz) * h;
        p[e * 3 + 2] = pz + (B[2] * sx + B[5] * sy + B[8] * sz) * h;
      }
    }
    return H;
  }

  // --- ヒットテスト -------------------------------------------------------

  /**
   * どのハンドルに当たったかを返す。
   *
   * @param {ArrayLike<number>} rayOrigin ワールド
   * @param {ArrayLike<number>} rayDir    ワールド（正規化していなくてよい）
   * @param {number} tol 画面上の許容距離をワールドに換算した値
   * @param {number} scale handles() に渡すのと同じギズモの大きさ
   * @returns {{kind: string, axis: number}|null}
   */
  hitTest(rayOrigin, rayDir, tol, scale = this._lastScale) {
    if (!this._active) return null;
    const L = scale > 0 ? scale : 1;
    this._lastScale = L;
    let dx = rayDir[0], dy = rayDir[1], dz = rayDir[2];
    const dl = Math.hypot(dx, dy, dz);
    if (dl < 1e-20) return null;
    dx /= dl; dy /= dl; dz /= dl;
    const ox = rayOrigin[0], oy = rayOrigin[1], oz = rayOrigin[2];
    const t = tol > 0 ? tol : L * 0.04;
    const B = this._basis;
    const px = this._pivot[0], py = this._pivot[1], pz = this._pivot[2];

    // 「距離 / そのハンドルの許容半径」が最小のものを選ぶ。許容半径がハンドルごとに
    // 違う（点ハンドルは自分の大きさぶん広い）ので、生の距離では比べられない。
    let best = 1, kind = null, axis = -1;

    // 中心は矢印の根元と重なる。先に見て厳密不等号で比べることで、
    // ど真ん中を掴んだら一様スケールになる（他ツールと同じ挙動）。
    {
      const r = t + L * CENTER_HALF;
      const s = Math.sqrt(rayPointDist2(ox, oy, oz, dx, dy, dz, px, py, pz)) / r;
      if (s < best) { best = s; kind = 'uniform'; axis = -1; }
    }
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
      const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];
      const off = L * PLANE_OFF;
      const r = t + L * PLANE_HALF;
      const s = Math.sqrt(rayPointDist2(ox, oy, oz, dx, dy, dz,
        px + (ux + vx) * off, py + (uy + vy) * off, pz + (uz + vz) * off)) / r;
      if (s < best) { best = s; kind = 'scale'; axis = i; }
    }
    for (let i = 0; i < 3; i++) {
      const s = Math.sqrt(raySegDist2(ox, oy, oz, dx, dy, dz, px, py, pz,
        px + B[i * 3] * L, py + B[i * 3 + 1] * L, pz + B[i * 3 + 2] * L)) / t;
      if (s < best) { best = s; kind = 'move'; axis = i; }
    }
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
      const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];
      const dth = (Math.PI * 2) / HIT_RING_SEGS;
      let d2 = Infinity, c0 = L, s0 = 0;
      for (let e = 0; e < HIT_RING_SEGS; e++) {
        const th = (e + 1) * dth;
        const c1 = Math.cos(th) * L, s1 = Math.sin(th) * L;
        const q = raySegDist2(ox, oy, oz, dx, dy, dz,
          px + ux * c0 + vx * s0, py + uy * c0 + vy * s0, pz + uz * c0 + vz * s0,
          px + ux * c1 + vx * s1, py + uy * c1 + vy * s1, pz + uz * c1 + vz * s1);
        if (q < d2) d2 = q;
        c0 = c1; s0 = s1;
      }
      const s = Math.sqrt(d2) / t;
      if (s < best) { best = s; kind = 'rotate'; axis = i; }
    }
    return kind === null ? null : { kind, axis };
  }

  // --- ドラッグ -----------------------------------------------------------

  /**
   * ドラッグ開始。領域の座標を控え、ハンドル種別ごとの基準量を求める。
   * 前回の setFromMask からトポロジが変わっていたら領域を捨てて false を返す
   * （validate 参照）。
   * @returns {boolean} 掴めたか
   */
  beginDrag(mesh, hit, rayOrigin, rayDir) {
    if (!this._active || !hit || this._count === 0) return false;
    if (!this.validate(mesh)) return false;
    const kind = hit.kind;
    if (kind !== 'move' && kind !== 'rotate' && kind !== 'scale' && kind !== 'uniform') return false;
    let dx = rayDir[0], dy = rayDir[1], dz = rayDir[2];
    const dl = Math.hypot(dx, dy, dz);
    if (dl < 1e-20) return false;
    dx /= dl; dy /= dl; dz /= dl;

    // 開始時の座標を控える。これがあるので毎フレーム「元位置からの絶対変換」で
    // 書けて、cancelDrag もビット単位で元へ戻せる（f32 → f32 のコピーは無損失）。
    const n = this._count;
    if (this._orig.length < n * 3) this._orig = new Float32Array(n * 3);
    const P = mesh.positions, V = this._verts, O = this._orig;
    for (let k = 0; k < n; k++) {
      const i = V[k] * 3, o = k * 3;
      O[o] = P[i]; O[o + 1] = P[i + 1]; O[o + 2] = P[i + 2];
    }
    // トポロジはドラッグ中に変わらないので、法線を直す集合は 1 回だけ作る
    this._buildNormalSet(mesh);

    this._kind = kind;
    this._axis = kind === 'uniform' ? -1 : (hit.axis | 0);
    this._dragPivot.set(this._pivot);
    this._dragBasis.set(this._basis);
    this._factor = 1;
    this._angAcc = 0;
    this._lastChanged = 0;
    this._touched = false;
    this._normalsStale = false;
    this._refOk = false;

    const B = this._dragBasis;
    const i3 = this._axis * 3;
    const ox = rayOrigin[0], oy = rayOrigin[1], oz = rayOrigin[2];
    if (kind === 'move') {
      // 視線が軸と重なっていると軸上の位置が決まらない。そこで 0 を基準にすると
      // 最初の有効フレームで形が飛ぶので、回転と同じく「最初に取れたフレーム」を
      // 基準にする（取れるまでは変位ゼロ）。
      const s = this._axisParam(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2], NaN);
      this._refOk = Number.isFinite(s);
      this._s0 = this._refOk ? s : 0;
      this._sCur = this._s0;
    } else if (kind === 'rotate') {
      const a = this._planeAngle(ox, oy, oz, dx, dy, dz, this._axis);
      if (Number.isFinite(a)) { this._angPrev = a; this._refOk = true; }
    } else if (kind === 'scale') {
      const j = (this._axis + 1) % 3, k = (this._axis + 2) % 3;
      const q = this._planeHit(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2]);
      if (q) {
        const cu = q[0] * B[j * 3] + q[1] * B[j * 3 + 1] + q[2] * B[j * 3 + 2];
        const cv = q[0] * B[k * 3] + q[1] * B[k * 3 + 1] + q[2] * B[k * 3 + 2];
        const r = Math.hypot(cu, cv);
        if (r > 1e-9) {
          // 掴んだ向きを基準方向にして「符号付きの半径」で倍率を測る。
          // 単純な距離だとピボットを通り越したときに倍率が折り返してしまう。
          this._u0 = cu / r; this._v0 = cv / r; this._r0 = r; this._refOk = true;
        }
      }
    } else {
      // uniform: 視線に垂直な平面を開始時の向きで固定する。毎フレーム視線から
      // 取り直すと透視投影では法線がわずかに変わり、倍率がふらつく。
      this._planeN[0] = -dx; this._planeN[1] = -dy; this._planeN[2] = -dz;
      const q = this._planeHit(ox, oy, oz, dx, dy, dz,
        this._planeN[0], this._planeN[1], this._planeN[2]);
      if (q) {
        const r = Math.hypot(q[0], q[1], q[2]);
        if (r > 1e-9) {
          this._refDir[0] = q[0] / r; this._refDir[1] = q[1] / r; this._refDir[2] = q[2] / r;
          this._r0 = r; this._refOk = true;
        }
      }
    }
    return true;
  }

  /**
   * 新しいレイでドラッグを更新する。常に開始時の座標から作り直すので、
   * 同じレイで何度呼んでも結果は変わらない（べき等）。
   *
   * @param {object} mods
   *   snap    : 移動 / 角度 / 倍率をきりの良い値に丸める
   *   normals : false を渡すと法線の再計算を飛ばす（endDrag でまとめて直す）。
   *             数百万頂点で対話性を優先したいときだけ使う
   * @returns {{changed:number, kind:string, axis:number, offset:number, degrees:number, factor:number}}
   *          戻り値のオブジェクトは使い回す（毎フレームのゴミを作らないため）。
   */
  updateDrag(mesh, rayOrigin, rayDir, mods = null) {
    const res = this._result;
    res.changed = 0; res.kind = this._kind; res.axis = this._axis;
    res.offset = 0; res.degrees = 0; res.factor = 1;
    if (!this._active || !this._kind) return res;

    let dx = rayDir[0], dy = rayDir[1], dz = rayDir[2];
    const dl = Math.hypot(dx, dy, dz);
    if (dl < 1e-20) return res;
    dx /= dl; dy /= dl; dz /= dl;
    const ox = rayOrigin[0], oy = rayOrigin[1], oz = rayOrigin[2];
    const snap = !!(mods && mods.snap);
    const B = this._dragBasis;
    const px = this._dragPivot[0], py = this._dragPivot[1], pz = this._dragPivot[2];
    const i3 = this._axis * 3;
    let changed = 0;

    if (this._kind === 'move') {
      const ax = B[i3], ay = B[i3 + 1], az = B[i3 + 2];
      const s = this._axisParam(ox, oy, oz, dx, dy, dz, ax, ay, az, NaN);
      if (Number.isFinite(s)) {
        if (!this._refOk) { this._s0 = s; this._refOk = true; }
        this._sCur = s;   // 退化フレームでは前値を保つ（形が飛ばない）
      }
      let off = this._sCur - this._s0;
      if (snap) {
        const step = Math.max(1e-9, this._lastScale * SNAP_MOVE_FRAC);
        off = Math.round(off / step) * step;
      }
      changed = this._applyTranslate(mesh, ax * off, ay * off, az * off);
      this._pivot[0] = px + ax * off;
      this._pivot[1] = py + ay * off;
      this._pivot[2] = pz + az * off;
      res.offset = off;
    } else if (this._kind === 'rotate') {
      const a = this._planeAngle(ox, oy, oz, dx, dy, dz, this._axis);
      if (Number.isFinite(a)) {
        if (!this._refOk) { this._angPrev = a; this._refOk = true; }
        // 差分を -π..π に畳んで足すことで、1 回転を超えても連続に増える
        let d = a - this._angPrev;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        this._angPrev = a;
        this._angAcc += d;
      }
      let ang = this._angAcc;
      if (snap) ang = Math.round(ang / SNAP_ANGLE) * SNAP_ANGLE;
      this._rotationDelta(B[i3], B[i3 + 1], B[i3 + 2], ang);
      changed = this._applyLinear(mesh);
      this._rotateBasis();
      res.degrees = ang * 180 / Math.PI;
    } else {
      let f = this._factor;
      if (this._kind === 'scale') {
        const j = (this._axis + 1) % 3, k = (this._axis + 2) % 3;
        if (this._refOk) {
          const q = this._planeHit(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2]);
          if (q) {
            const cu = q[0] * B[j * 3] + q[1] * B[j * 3 + 1] + q[2] * B[j * 3 + 2];
            const cv = q[0] * B[k * 3] + q[1] * B[k * 3 + 1] + q[2] * B[k * 3 + 2];
            f = (cu * this._u0 + cv * this._v0) / this._r0;
          }
        }
        f = this._snapFactor(f, snap);
        this._factor = f;
        this._planeScaleDelta(j, k, f - 1);
      } else {
        if (this._refOk) {
          const q = this._planeHit(ox, oy, oz, dx, dy, dz,
            this._planeN[0], this._planeN[1], this._planeN[2]);
          if (q) {
            f = (q[0] * this._refDir[0] + q[1] * this._refDir[1] + q[2] * this._refDir[2]) / this._r0;
          }
        }
        f = this._snapFactor(f, snap);
        this._factor = f;
        const D = this._D, g = f - 1;
        D[0] = g; D[1] = 0; D[2] = 0;
        D[3] = 0; D[4] = g; D[5] = 0;
        D[6] = 0; D[7] = 0; D[8] = g;
      }
      changed = this._applyLinear(mesh);
      res.factor = f;
    }

    res.changed = changed;
    // 前フレームで動いていて今フレームで元に戻った場合も法線を直す必要がある
    // （位置は元どおりでも法線が前フレームのままになる）
    if (changed > 0 || this._lastChanged > 0) {
      mesh.geomVersion++;
      if (mods && mods.normals === false) {
        this._normalsStale = true;
      } else {
        mesh.computeNormalsFor(this._nset, this._nsetCount);
        this._normalsStale = false;
      }
    }
    if (changed > 0) this._touched = true;
    this._lastChanged = changed;
    return res;
  }

  /**
   * ドラッグ確定。ピボット / 基底はドラッグ中に更新した値をそのまま残す
   * （移動したら次のドラッグもその位置から始まる）。
   * 履歴の commit と曲率の再計算は呼び出し側で行う。
   */
  endDrag(mesh) {
    const kind = this._kind;
    let changed = 0;
    if (kind && this._touched) {
      if (this._normalsStale) {
        mesh.computeNormalsFor(this._nset, this._nsetCount);
        this._normalsStale = false;
      }
      const P = mesh.positions, V = this._verts, O = this._orig, n = this._count;
      for (let k = 0; k < n; k++) {
        const i = V[k] * 3, o = k * 3;
        if (P[i] !== O[o] || P[i + 1] !== O[o + 1] || P[i + 2] !== O[o + 2]) changed++;
      }
    }
    this._kind = null;
    this._axis = -1;
    this._lastChanged = 0;
    this._touched = false;
    return { changed, kind };
  }

  /** ドラッグ中止。開始時の座標へビット単位で戻す */
  cancelDrag(mesh) {
    if (!this._kind) return { changed: 0, kind: null };
    const kind = this._kind;
    const P = mesh.positions, V = this._verts, O = this._orig, n = this._count;
    let changed = 0;
    for (let k = 0; k < n; k++) {
      const v = V[k], i = v * 3, o = k * 3;
      if (P[i] !== O[o] || P[i + 1] !== O[o + 1] || P[i + 2] !== O[o + 2]) {
        P[i] = O[o]; P[i + 1] = O[o + 1]; P[i + 2] = O[o + 2];
        mesh.markVert(v);
        changed++;
      }
    }
    this._pivot.set(this._dragPivot);
    this._basis.set(this._dragBasis);
    if (changed > 0 || this._normalsStale) {
      mesh.geomVersion++;
      mesh.computeNormalsFor(this._nset, this._nsetCount);
      this._normalsStale = false;
    }
    this._kind = null;
    this._axis = -1;
    this._lastChanged = 0;
    this._touched = false;
    return { changed, kind };
  }

  // --- 内部：レイと基準量 -------------------------------------------------

  /**
   * 直線（ピボット + a * s）とレイの最近接位置 s。ほぼ平行なら fallback を返す。
   * 前フレームの値を fallback にすることで、視線が軸と重なったフレームでも
   * 形が飛ばない。
   */
  _axisParam(ox, oy, oz, dx, dy, dz, ax, ay, az, fallback) {
    const ad = ax * dx + ay * dy + az * dz;
    const den = 1 - ad * ad;
    if (den < 1e-9) return fallback;
    const rx = this._dragPivot[0] - ox, ry = this._dragPivot[1] - oy, rz = this._dragPivot[2] - oz;
    const ar = ax * rx + ay * ry + az * rz;
    const dr = dx * rx + dy * ry + dz * rz;
    return (ad * dr - ar) / den;
  }

  /**
   * ピボットを通り法線 n の平面とレイの交点（ピボット基準の相対座標）。
   * 交わらない / 背後なら null。1 フレーム数回しか呼ばないので配列で返す。
   */
  _planeHit(ox, oy, oz, dx, dy, dz, nx, ny, nz) {
    const nd = nx * dx + ny * dy + nz * dz;
    if (Math.abs(nd) < EPS_DIR) return null;
    const px = this._dragPivot[0], py = this._dragPivot[1], pz = this._dragPivot[2];
    const t = ((px - ox) * nx + (py - oy) * ny + (pz - oz) * nz) / nd;
    if (t <= 0) return null;
    const s = this._planeScratch;
    s[0] = ox + dx * t - px; s[1] = oy + dy * t - py; s[2] = oz + dz * t - pz;
    return s;
  }

  /**
   * 軸 i を法線とする平面上での角度。基底 (u, v, n) = (軸 i+1, 軸 i+2, 軸 i) は
   * u × v = n の右手系に並ぶので、ここで測った角がロドリゲス回転の符号と
   * そのまま一致する（軸ごとに符号を場合分けしなくてよい）。
   */
  _planeAngle(ox, oy, oz, dx, dy, dz, i) {
    const B = this._dragBasis;
    const i3 = i * 3;
    const q = this._planeHit(ox, oy, oz, dx, dy, dz, B[i3], B[i3 + 1], B[i3 + 2]);
    if (!q) return NaN;
    const j = (i + 1) % 3, k = (i + 2) % 3;
    const cu = q[0] * B[j * 3] + q[1] * B[j * 3 + 1] + q[2] * B[j * 3 + 2];
    const cv = q[0] * B[k * 3] + q[1] * B[k * 3 + 1] + q[2] * B[k * 3 + 2];
    if (Math.abs(cu) + Math.abs(cv) < 1e-12) return NaN;
    return Math.atan2(cv, cu);
  }

  _snapFactor(f, snap) {
    if (snap) f = Math.round(f / SNAP_FACTOR) * SNAP_FACTOR;
    return clamp(f, MIN_FACTOR, MAX_FACTOR);
  }

  // --- 内部：変換の適用 ---------------------------------------------------

  // 変換は「ピボット中心の線形変換 A」だが、保持するのは D = A - I。
  // 変位が D * (元位置 - ピボット) の 1 本の式になるので、回転 / 平面スケール /
  // 一様スケールを同じループで書けるうえ、変換なし（D = 0）のときに元の座標が
  // ビット単位でそのまま残る（べき等性がタダで手に入る）。
  _rotationDelta(nx, ny, nz, ang) {
    const D = this._D;
    const c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
    D[0] = t * (nx * nx - 1); D[1] = t * nx * ny - s * nz; D[2] = t * nx * nz + s * ny;
    D[3] = t * ny * nx + s * nz; D[4] = t * (ny * ny - 1); D[5] = t * ny * nz - s * nx;
    D[6] = t * nz * nx - s * ny; D[7] = t * nz * ny + s * nx; D[8] = t * (nz * nz - 1);
  }

  /** 軸 j,k の張る平面内だけを (g + 1) 倍する（軸 i はそのまま） */
  _planeScaleDelta(j, k, g) {
    const B = this._dragBasis, D = this._D;
    const ux = B[j * 3], uy = B[j * 3 + 1], uz = B[j * 3 + 2];
    const vx = B[k * 3], vy = B[k * 3 + 1], vz = B[k * 3 + 2];
    D[0] = g * (ux * ux + vx * vx); D[1] = g * (ux * uy + vx * vy); D[2] = g * (ux * uz + vx * vz);
    D[3] = D[1]; D[4] = g * (uy * uy + vy * vy); D[5] = g * (uy * uz + vy * vz);
    D[6] = D[2]; D[7] = D[5]; D[8] = g * (uz * uz + vz * vz);
  }

  /** 基底も同じ回転で回す（ローカル軸のギズモが形と一緒に回る） */
  _rotateBasis() {
    const D = this._D, B = this._basis, S = this._dragBasis;
    for (let r = 0; r < 3; r++) {
      const x = S[r * 3], y = S[r * 3 + 1], z = S[r * 3 + 2];
      B[r * 3] = x + D[0] * x + D[1] * y + D[2] * z;
      B[r * 3 + 1] = y + D[3] * x + D[4] * y + D[5] * z;
      B[r * 3 + 2] = z + D[6] * x + D[7] * y + D[8] * z;
    }
  }

  /**
   * 平行移動。マスクのグラデーションは変位に weight を掛けるだけでよい。
   * @returns {number} 実際に動いた頂点数
   */
  _applyTranslate(mesh, tx, ty, tz) {
    const P = mesh.positions, V = this._verts, W = this._weights, O = this._orig;
    const n = this._count, VB = mesh.vBlocks;
    let dMin = mesh.vDirtyMin, dMax = mesh.vDirtyMax;
    let bMin = mesh.vBlockMin, bMax = mesh.vBlockMax;
    let changed = 0;
    for (let k = 0; k < n; k++) {
      const w = W[k];
      const ax = tx * w, ay = ty * w, az = tz * w;
      const v = V[k], i = v * 3, o = k * 3;
      P[i] = O[o] + ax; P[i + 1] = O[o + 1] + ay; P[i + 2] = O[o + 2] + az;
      if (ax === 0 && ay === 0 && az === 0) continue;
      changed++;
      // markVert(v) のインライン展開（1 頂点あたり this への読み書きが 8 回あった）
      if (v < dMin) dMin = v;
      if (v > dMax) dMax = v;
      const b = v >> DIRTY_SHIFT;
      VB[b] = 1;
      if (b < bMin) bMin = b;
      if (b > bMax) bMax = b;
    }
    mesh.vDirtyMin = dMin; mesh.vDirtyMax = dMax;
    mesh.vBlockMin = bMin; mesh.vBlockMax = bMax;
    return changed;
  }

  /**
   * D（= A - I）による変換の適用。
   *
   * 部分マスクの頂点は「変換後の位置」と「元の位置」を weight で線形補間する。
   * 行列（回転角や倍率）を weight で補間してはいけない：回転行列と単位行列の
   * 線形補間は回転ではなくなり、体積が痩せたりせん断が入る。位置を補間すれば
   * weight = 1 の頂点は厳密に剛体変換のまま、weight = 0 は 1 ビットも動かない、
   * その間は滑らかに繋がる（= ZBrush のソフトな変形）。
   *
   * @returns {number} 実際に動いた頂点数
   */
  _applyLinear(mesh) {
    const P = mesh.positions, V = this._verts, W = this._weights, O = this._orig;
    const n = this._count, VB = mesh.vBlocks, D = this._D;
    const d0 = D[0], d1 = D[1], d2 = D[2];
    const d3 = D[3], d4 = D[4], d5 = D[5];
    const d6 = D[6], d7 = D[7], d8 = D[8];
    const px = this._dragPivot[0], py = this._dragPivot[1], pz = this._dragPivot[2];
    let dMin = mesh.vDirtyMin, dMax = mesh.vDirtyMax;
    let bMin = mesh.vBlockMin, bMax = mesh.vBlockMax;
    let changed = 0;
    for (let k = 0; k < n; k++) {
      const v = V[k], i = v * 3, o = k * 3;
      const gx = O[o], gy = O[o + 1], gz = O[o + 2];
      const rx = gx - px, ry = gy - py, rz = gz - pz;
      const w = W[k];
      const ax = (d0 * rx + d1 * ry + d2 * rz) * w;
      const ay = (d3 * rx + d4 * ry + d5 * rz) * w;
      const az = (d6 * rx + d7 * ry + d8 * rz) * w;
      P[i] = gx + ax; P[i + 1] = gy + ay; P[i + 2] = gz + az;
      if (ax === 0 && ay === 0 && az === 0) continue;
      changed++;
      if (v < dMin) dMin = v;
      if (v > dMax) dMax = v;
      const b = v >> DIRTY_SHIFT;
      VB[b] = 1;
      if (b < bMin) bMin = b;
      if (b > bMax) bMax = b;
    }
    mesh.vDirtyMin = dMin; mesh.vDirtyMax = dMax;
    mesh.vBlockMin = bMin; mesh.vBlockMax = bMax;
    return changed;
  }

  /**
   * 法線を直す頂点集合（領域 + その 1-ring）を作る。
   * マスク境界の頂点は動かないが、隣が動くので法線は変わる。
   * ドラッグ中はトポロジが変わらないので開始時に 1 回作れば足りる。
   */
  _buildNormalSet(mesh) {
    if (this._stamp.length < mesh.capV) this._stamp = new Int32Array(mesh.capV);
    // stamp は単調増加させる。新しい配列はゼロ埋めで、既存の値は必ず今の id より
    // 小さいので衝突しない。
    const st = this._stamp, id = ++this._stampId;
    const V = this._verts, n = this._count;
    const T = mesh.tris, RC = mesh.ringCount, RD = mesh.ringData, REX = mesh.ringExt;
    let set = this._nset;
    if (set.length < n + 64) { set = new Int32Array(Math.max(1024, (n + 64) * 2)); this._nset = set; }
    let ns = 0;
    for (let k = 0; k < n; k++) {
      const v = V[k];
      const rc = RC[v];
      // v 自身の 1 個ぶんも含めて先に確保する。Int32Array の範囲外書き込みは黙って
      // 捨てられるので、書いてから確保すると集合から頂点が抜けたまま気付けない。
      if (ns + rc * 3 + 1 > set.length) { set = growI32(set, ns + rc * 3 + 1); this._nset = set; }
      if (st[v] !== id) { st[v] = id; set[ns++] = v; }
      if (rc === 0) continue;
      const inline = rc <= RING_STRIDE;
      const rb = inline ? v * RING_STRIDE : 0;
      const rex = inline ? null : REX[v];
      for (let j = 0; j < rc; j++) {

    const x = apx - acx * w, y = apy - acy * w, z = apz - acz * w;
    return x * x + y * y + z * z;
  }

  const va = d3 * d6 - d5 * d4;
  if (va <= 0 && (d4 - d3) >= 0 && (d5 - d6) >= 0) {
    const w = (d4 - d3) / ((d4 - d3) + (d5 - d6));
    out[0] = bx + (cx - bx) * w; out[1] = by + (cy - by) * w; out[2] = bz + (cz - bz) * w;
    const x = bpx + (cpx - bpx) * w, y = bpy + (cpy - bpy) * w, z = bpz + (cpz - bpz) * w;
    return x * x + y * y + z * z;
  }

  const denom = 1 / (va + vb + vc);
  const v = vb * denom, w = vc * denom;
  out[0] = ax + abx * v + acx * w;
  out[1] = ay + aby * v + acy * w;
  out[2] = az + abz * v + acz * w;
  const x = apx - (abx * v + acx * w), y = apy - (aby * v + acy * w), z = apz - (abz * v + acz * w);
  return x * x + y * y + z * z;
}

/**
 * 元の表面への最近点を引くための一様格子。
 *
 * BVH を作らないのは、問い合わせが「緩和で少し動いた頂点を戻す」用途で、
 * 移動量がセル 1 個ぶんに収まるため。1 セル分の近傍を見れば足りる。
 */
class SurfaceRef {
  /**
   * @param {number} cellSize セルの一辺。**元メッシュの平均辺長**を渡すこと。
   *   目標エッジ長（＝粗い側）を渡すと 1 セルに何十枚も入り、1 回の問い合わせで
   *   1000 回近い点‐三角形判定になる（520 万面で 1 クエリ 25.5µs、
   *   260 万頂点 × 5 反復で 330 秒）。
   * @param {number} maxCells セル数の上限。細かくしすぎるとメモリが爆発するので、
   *   超える場合はセルを大きくする。
   */
  constructor(positions, indices, cellSize, maxCells = 6e6) {
    this.P = positions;
    this.I = indices;
    const n = indices.length / 3;
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (let i = 0; i < positions.length; i += 3) {
      if (positions[i] < minX) minX = positions[i];
      if (positions[i] > maxX) maxX = positions[i];
      if (positions[i + 1] < minY) minY = positions[i + 1];
      if (positions[i + 1] > maxY) maxY = positions[i + 1];
      if (positions[i + 2] < minZ) minZ = positions[i + 2];
      if (positions[i + 2] > maxZ) maxZ = positions[i + 2];
    }
    let h = Math.max(cellSize, 1e-6);
    // セル数が予算を超えるならセルを大きくする
    for (let guard = 0; guard < 64; guard++) {
      const cx = Math.ceil((maxX - minX) / h) + 3;
      const cy = Math.ceil((maxY - minY) / h) + 3;
      const cz = Math.ceil((maxZ - minZ) / h) + 3;
      if (cx * cy * cz <= maxCells) break;
      h *= 1.25;
    }
    this.h = h;
    this.ox = minX - h; this.oy = minY - h; this.oz = minZ - h;
    this.nx = Math.max(1, Math.ceil((maxX - minX) / h) + 2);
    this.ny = Math.max(1, Math.ceil((maxY - minY) / h) + 2);
    this.nz = Math.max(1, Math.ceil((maxZ - minZ) / h) + 2);
    const cells = this.nx * this.ny * this.nz;

    // CSR で「セル → 三角形リスト」を作る。件数を数えてから詰める 2 パス。
    const count = new Int32Array(cells + 1);
    const bb = new Int32Array(n * 6);
    for (let t = 0; t < n; t++) {
      const a = indices[t * 3] * 3, b = indices[t * 3 + 1] * 3, c = indices[t * 3 + 2] * 3;
      const i0 = this._clampX(Math.floor((Math.min(positions[a], positions[b], positions[c]) - this.ox) / h));
      const i1 = this._clampX(Math.floor((Math.max(positions[a], positions[b], positions[c]) - this.ox) / h));
      const j0 = this._clampY(Math.floor((Math.min(positions[a + 1], positions[b + 1], positions[c + 1]) - this.oy) / h));
      const j1 = this._clampY(Math.floor((Math.max(positions[a + 1], positions[b + 1], positions[c + 1]) - this.oy) / h));
      const k0 = this._clampZ(Math.floor((Math.min(positions[a + 2], positions[b + 2], positions[c + 2]) - this.oz) / h));
      const k1 = this._clampZ(Math.floor((Math.max(positions[a + 2], positions[b + 2], positions[c + 2]) - this.oz) / h));
      bb[t * 6] = i0; bb[t * 6 + 1] = i1; bb[t * 6 + 2] = j0;
      bb[t * 6 + 3] = j1; bb[t * 6 + 4] = k0; bb[t * 6 + 5] = k1;
      for (let k = k0; k <= k1; k++) {
        for (let j = j0; j <= j1; j++) {
          const base = j * this.nx + k * this.nx * this.ny;
          for (let i = i0; i <= i1; i++) count[base + i + 1]++;
        }
      }
    }
    for (let c = 0; c < cells; c++) count[c + 1] += count[c];
    this.off = count;
    this.tri = new Int32Array(count[cells]);
    const fill = count.slice(0, cells);
    for (let t = 0; t < n; t++) {
      const i0 = bb[t * 6], i1 = bb[t * 6 + 1], j0 = bb[t * 6 + 2];
      const j1 = bb[t * 6 + 3], k0 = bb[t * 6 + 4], k1 = bb[t * 6 + 5];
      for (let k = k0; k <= k1; k++) {
        for (let j = j0; j <= j1; j++) {
          const base = j * this.nx + k * this.nx * this.ny;
          for (let i = i0; i <= i1; i++) this.tri[fill[base + i]++] = t;
        }
      }
    }
    this._c = new Float64Array(3);
  }

  _clampX(i) { return i < 0 ? 0 : (i >= this.nx ? this.nx - 1 : i); }
  _clampY(i) { return i < 0 ? 0 : (i >= this.ny ? this.ny - 1 : i); }
  _clampZ(i) { return i < 0 ? 0 : (i >= this.nz ? this.nz - 1 : i); }

  /**
   * ヒントの三角形（前回この頂点で当たったもの）だけを試す軽量版。
   *
   * 緩和は頂点を接線方向へわずかに動かすだけなので、直前に当たった三角形が
   * そのまま最近傍であることがほとんど。まずここで済ませると格子を引かずに終わる。
   * 「その三角形の内部に落ちた」= 辺や頂点にクランプされていない場合だけ採用する
   * （辺にクランプされたときは隣の三角形のほうが近い可能性がある）。
   *
   * ヒントは頂点スロット番号で持つので、分割・統合でスロットが再利用されると
   * 死んだ頂点のヒントを新しい頂点が引き継いでしまう。そのまま採用すると
   * 表面の遠い場所へ飛ぶ（実測で単位球のモデルを跨ぐ 1.71 のずれが出た）。
   * maxD2 を超える距離のヒントは信用しないことで弾く。
   *
   * @param {number} maxD2 許容する距離の 2 乗。これを超えたら -1
   * @returns {number} 採用できたら距離の 2 乗、できなければ -1
   */
  tryHint(px, py, pz, t, out, maxD2) {
    if (t < 0) return -1;
    const P = this.P, I = this.I;
    const i = t * 3;
    const a = I[i] * 3, b = I[i + 1] * 3, c = I[i + 2] * 3;
    const d = closestOnTri(px, py, pz,
      P[a], P[a + 1], P[a + 2], P[b], P[b + 1], P[b + 2], P[c], P[c + 1], P[c + 2], out);
    // 最近点が三角形の内部か辺の内側にあるかを、重心座標を使わず
    // 「3 頂点のどれとも一致しない」で近似する。頂点にクランプされた場合は
    // 隣の面のほうが近いことがあるので却下する。
    if (d > maxD2) return -1;                     // 使い回されたスロットの古いヒント
    const ex = 1e-12;
    const nearVert = (vi) => (out[0] - P[vi]) ** 2 + (out[1] - P[vi + 1]) ** 2 + (out[2] - P[vi + 2]) ** 2 < ex;
    if (nearVert(a) || nearVert(b) || nearVert(c)) return -1;
    return d;
  }

  /**
   * 点 (px,py,pz) に最も近い表面上の点を out へ入れる。
   * 見つからなければ false（元の点をそのまま使う）。
   * @returns {number} 当たった三角形の番号（-1 で見つからず）。次回のヒントに使う。
   */
  closest(px, py, pz, out) {
    const h = this.h, P = this.P, I = this.I, tmp = this._c;
    const ci = this._clampX(Math.floor((px - this.ox) / h));
    const cj = this._clampY(Math.floor((py - this.oy) / h));
    const ck = this._clampZ(Math.floor((pz - this.oz) / h));
    let best = Infinity;
    let found = false;
    let bestTri = -1;
    const maxRing = 4;
    for (let ring = 0; ring <= maxRing; ring++) {
      const i0 = Math.max(0, ci - ring), i1 = Math.min(this.nx - 1, ci + ring);
      const j0 = Math.max(0, cj - ring), j1 = Math.min(this.ny - 1, cj + ring);
      const k0 = Math.max(0, ck - ring), k1 = Math.min(this.nz - 1, ck + ring);
      for (let k = k0; k <= k1; k++) {
        for (let j = j0; j <= j1; j++) {
          for (let i = i0; i <= i1; i++) {
            // 外殻だけ見る（内側の殻は前の ring で見ている）
            if (ring > 0 && i > i0 && i < i1 && j > j0 && j < j1 && k > k0 && k < k1) continue;
            const c = i + j * this.nx + k * this.nx * this.ny;
            for (let q = this.off[c]; q < this.off[c + 1]; q++) {
              const ti = this.tri[q];
              const t = ti * 3;
              const a = I[t] * 3, b = I[t + 1] * 3, cc = I[t + 2] * 3;
              const d = closestOnTri(px, py, pz,
                P[a], P[a + 1], P[a + 2], P[b], P[b + 1], P[b + 2], P[cc], P[cc + 1], P[cc + 2], tmp);
              if (d < best) {
                best = d;
                out[0] = tmp[0]; out[1] = tmp[1]; out[2] = tmp[2];
                found = true;
                bestTri = ti;
              }
            }
          }
        }
      }
      // この殻の外にはこれより近い面が無いと言えたら打ち切る
      // 打ち切りの下界。「殻 ring まで見たら、未走査の点は少なくとも ring*h 先」
      // という見方だと ring=0 で下界が 0 になり、必ず 27 セル（殻 1）まで
      // 走査してしまう。実測で 1 クエリ 319 回の点-三角形判定になっていた。
      // 走査済みボックスの面までの実距離を使うと下界が h/2 前後まで上がり、
      // 表面上の点はほとんど殻 0（1 セル）で確定する。
      const bound = Math.min(
        px - (this.ox + (ci - ring) * h), (this.ox + (ci + ring + 1) * h) - px,
        py - (this.oy + (cj - ring) * h), (this.oy + (cj + ring + 1) * h) - py,
        pz - (this.oz + (ck - ring) * h), (this.oz + (ck + ring + 1) * h) - pz);
      if (found && best <= bound * bound) break;
    }
    return found ? bestTri : -1;
  }
}

/** 生きている三角形だけを詰めた (positions, indices) を作る */
function snapshot(mesh) {
  const remap = new Int32Array(mesh.nv).fill(-1);
  let nv = 0;
  for (let v = 0; v < mesh.nv; v++) if (mesh.vAlive[v]) remap[v] = nv++;
  const P = new Float32Array(nv * 3);
  for (let v = 0; v < mesh.nv; v++) {
    const r = remap[v];
    if (r < 0) continue;
    P[r * 3] = mesh.positions[v * 3];
    P[r * 3 + 1] = mesh.positions[v * 3 + 1];
    P[r * 3 + 2] = mesh.positions[v * 3 + 2];
  }
  const T = mesh.tris;
  const I = new Int32Array(mesh.liveTris * 3);
  let w = 0;
  for (let t = 0; t < mesh.nt; t++) {
    const i = t * 3, a = T[i], b = T[i + 1], c = T[i + 2];
    if (a === b && b === c) continue;
    I[w++] = remap[a]; I[w++] = remap[b]; I[w++] = remap[c];
  }
  return { positions: P, indices: I.subarray(0, w) };
}

/** 表面積の合計 */
function surfaceArea(mesh) {
  const P = mesh.positions, T = mesh.tris;
  let area = 0;
  for (let t = 0; t < mesh.nt; t++) {
    const i = t * 3, ia = T[i], ib = T[i + 1], ic = T[i + 2];
    if (ia === ib && ib === ic) continue;
    const a = ia * 3, b = ib * 3, c = ic * 3;
    const abx = P[b] - P[a], aby = P[b + 1] - P[a + 1], abz = P[b + 2] - P[a + 2];
    const acx = P[c] - P[a], acy = P[c + 1] - P[a + 1], acz = P[c + 2] - P[a + 2];
    const nx = aby * acz - abz * acy, ny = abz * acx - abx * acz, nz = abx * acy - aby * acx;
    area += Math.sqrt(nx * nx + ny * ny + nz * nz) * 0.5;
  }
  return area;
}

/**
 * 目標三角形数から必要なエッジ長を逆算する。
 * 正三角形の面積は √3/4 · L² なので nTris ≈ Area / (√3/4 · L²)。
 */
function edgeLengthForTris(area, nTris) {
  if (nTris <= 0 || area <= 0) return 0;
  return Math.sqrt((4 * area) / (Math.sqrt(3) * nTris));
}

/**
 * 全辺を (a,b) の組で列挙する（a < b、重複なし）。
 *
 * Set にキーを入れて重複を弾く形だと 520 万面で 1 回 2.7 秒かかっていた
 * （反復ごとに 3 回呼ぶので、それだけで 40 秒以上）。
 * 頂点ごとにリングを舐めて「番号が自分より大きい隣接頂点」だけを出す形に変え、
 * 重複判定は頂点数ぶんのスタンプ配列で O(1) にした。ハッシュも確保も無い。
 */
function collectEdges(mesh, out, stamp, stampId) {
  const T = mesh.tris;
  const RC = mesh.ringCount, RD = mesh.ringData, REX = mesh.ringExt;
  let n = 0;
  let id = stampId;
  const limit = out.length >> 1;
  for (let v = 0; v < mesh.nv; v++) {
    const rc = RC[v];
    if (rc === 0 || !mesh.vAlive[v]) continue;
    id++;
    const inline = rc <= RING_STRIDE;
    const base = inline ? v * RING_STRIDE : 0;
    const ex = inline ? null : REX[v];
    for (let j = 0; j < rc; j++) {
      const ti = (inline ? RD[base + j] : ex[j]) * 3;
      for (let e = 0; e < 3; e++) {
        const u = T[ti + e];
        // 各辺は「番号が小さい側の頂点」から 1 回だけ出す
        if (u <= v) continue;
        if (stamp[u] === id) continue;
        stamp[u] = id;
        if (n >= limit) return { n, stampId: id };
        out[n * 2] = v; out[n * 2 + 1] = u;
        n++;
      }
    }
  }
  return { n, stampId: id };
}

/**
 * 等方（または曲率適応）リメッシュ。
 *
 * @param {SculptMesh} mesh
 * @param {object} opts
 *   targetTris  目標三角形数（0 なら targetLen か現在の平均辺長を使う）
 *   targetLen   目標エッジ長（targetTris があれば無視）
 *   iterations  反復回数（既定 5）
 *   adaptive    曲率適応の強さ 0..1（0 で完全に均一）
 *   minScale    適応時のエッジ長の下限倍率（既定 0.4）
 *   maxScale    上限倍率（既定 2.0）
 *   project     元の表面へ投影して形を保つか（既定 true）
 *   relax       接線緩和の量 0..1（既定 0.5）
 *   maxVerts    頂点数の上限（安全弁）
 * @returns {object} 統計
 */
function remesh(mesh, opts = {}) {
  const t0 = Date.now();
  if (mesh.liveTris === 0) return { ok: false, reason: '空のメッシュです' };

  const iterations = Math.max(1, Math.min(20, Math.round(opts.iterations ?? 5)));
  const adaptive = Math.max(0, Math.min(1, opts.adaptive ?? 0));
  const minScale = Math.max(0.05, opts.minScale ?? 0.4);
  const maxScale = Math.max(minScale, opts.maxScale ?? 2.0);
  const relaxAmt = Math.max(0, Math.min(1, opts.relax ?? 0.5));
  const doProject = opts.project !== false;
  const maxVerts = Math.max(1000, opts.maxVerts || 2000000);
  // 進捗の通知先（ワーカーから UI へ流すため）。同期処理なので、呼ばれた側で
  // 描画はできない。ワーカー側で postMessage するのが前提。
  const report = typeof opts.onProgress === 'function' ? opts.onProgress : null;
  // 補正ラウンドが何回入るかは終わるまで分からないので、最大まで回ったときの
  // パス数で割って進捗を出す。実際は途中で抜けるので最後は一気に 100% になる。
  const estPasses = iterations + (opts.targetTris > 0 ? 6 : 0);
  let donePasses = 0;
  const tell = (stage) => {
    if (!report) return;
    report({ stage, done: donePasses, total: estPasses, tris: mesh.liveTris, verts: mesh.liveVerts });
  };

  const area = surfaceArea(mesh);
  let L = opts.targetLen > 0 ? opts.targetLen : 0;
  if (!L && opts.targetTris > 0) L = edgeLengthForTris(area, opts.targetTris);
  if (!L) L = mesh.averageEdgeLength();
  if (!(L > 0)) return { ok: false, reason: '目標エッジ長を決められません' };

  // 元の形を控えて投影の基準にする。
  // セルは「元メッシュの平均辺長」に合わせる（目標エッジ長にすると 1 セルへ
  // 何十枚も入って問い合わせが 1000 回近い判定になる）。
  const srcEdge = mesh.averageEdgeLength();
  tell('下準備');
  const ref = doProject ? new SurfaceRef(...(() => {
    const s = snapshot(mesh);
    return [s.positions, s.indices, Math.max(srcEdge, 1e-6)];
  })()) : null;
  // 頂点ごとに「前回当たった三角形」を覚えておく。緩和の移動量は小さいので
  // ほとんどの頂点は同じ面に当たり続け、格子を引かずに済む。
  let projHint = doProject ? new Int32Array(mesh.capV).fill(-1) : null;
  // 格子は反復のあいだ変わらないので WASM 側に置いたまま使い回す。
  // 反復ごとに入れ直すと 520 万面で毎回 100MB 超のコピーになる。
  const wasmSurf = ref ? wasmUploadSurface(ref) : null;
  // 投影しない頂点の印（毎反復で作り直す作業配列）
  let skip = null;

  // 曲率適応の重み。mesh.curv は -1..1 に正規化した平均曲率なので、
  // 絶対値が大きいほど（溝や稜線ほど）短いエッジを目標にする。
  // 真の曲率半径ではないが、彫刻の「見た目の細かさ」とはよく対応する。
  mesh.computeAllCurvature();

  const stats = { split: 0, collapse: 0, flip: 0, relaxed: 0, projected: 0, hinted: 0 };
  const phase = { edges: 0, split: 0, collapse: 0, flip: 0, relax: 0, project: 0, normals: 0, curv: 0 };
  const now = () => Date.now();
  let scratchSum = null, scratchCnt = null;
  const edges = new Int32Array(Math.max(4096, mesh.capT * 6));
  let edgeStamp = new Int32Array(mesh.capV);
  let edgeStampId = 0;
  const tmp = new Float64Array(3);
  const target = new Float32Array(mesh.capV);

  // 曲率適応の局所目標長。平ら（curv=0）なところは基準そのまま、
  // 曲率が高いところだけ短くする。
  // 以前は s * maxScale を掛けていて、平らなところが 2 倍の長さになり
  // 目標面数から大きく外れていた（5000 面狙いで 1160 面）。
  let scaleL = 1;
  const localLen = (v) => {
    if (adaptive <= 0) return L * scaleL;
    const k = Math.abs(mesh.curv[v]);
    const s = 1 / (1 + adaptive * 6 * k);
    return L * scaleL * Math.max(minScale, Math.min(maxScale, s));
  };

  // 4/3 と 4/5 のしきい値で落ち着く平均辺長は目標より少し長くなるので、
  // 目標面数を指定されたときは「面数 ∝ L^-2」を使って L を補正しながら回す。
  // 実測では無補正だと一貫して 29% ほど面数が足りなかった。
  const runPasses = (n) => {
  for (let it = 0; it < n; it++) {
    // 分割で増えた頂点の curv は 0 のままなので、適応するなら毎回作り直す。
    // 作り直さないと新しい頂点が全部「平ら」扱いになり、適応がほとんど効かない。
    if (adaptive > 0 && it > 0) { const _t = now(); mesh.computeAllCurvature(); phase.curv += now() - _t; }
    // --- 分割: 目標より 4/3 倍長い辺 -----------------------------------
    tell('分割');
    if (mesh.liveVerts < maxVerts) {
      const _te = now(); const cr = collectEdges(mesh, edges, edgeStamp, edgeStampId); const n = cr.n; edgeStampId = cr.stampId; phase.edges += now() - _te; const _tp = now();
      const P = mesh.positions;
      for (let e = 0; e < n; e++) {

const { remesh, quadDominant, edgeLengthForTris } = __M['remesh.js'];
const { initRemeshWorker, remeshInWorker, remeshWorkerState, remeshWorkerError, remeshWorkerWasm } = __M['remeshworker.js'];
const { clamp } = __M['math.js'];
const { editMeshFromSculpt, editMeshToSculpt, pickVert, pickEdge, pickFace, boxSelect } = __M['editmesh.js'];
const { selectLoopOrRing, loopCut, extrudeSelectedFaces, insetSelectedFaces, subdivideSelectedFaces } = __M['editops.js'];

/** 変形とマスク操作の既定パラメータ一式（state に置く） */
function defaultToolState() {
  const deform = { axis: 1, params: {} };
  for (const d of DEFORMS) deform.params[d.id] = deformDefaults(d.id);
  const mask = { id: MASK_OPS[0].id, mode: 'replace', params: {} };
  for (const op of MASK_OPS) {
    const p = {};
    for (const q of (op.params || [])) p[q.key] = q.def;
    mask.params[op.id] = p;
  }
  // ストロークタイプごとのパラメータ
  const strokeParams = {};
  for (const st of STROKES) strokeParams[st.id] = strokeDefaults(st.id);

class Tools {
  /**
   * @param {object} ctx { state, getMesh, getSculptor, getRenderer, getUI, redraw, autosave }
   *   メッシュとレンダラは差し替わる（newMesh / 起動順）ので getter で受ける。
   */
  constructor(ctx) {
    this.ctx = ctx;
    this.layers = new SculptLayers();
    this.groups = new PolyGroups();
    this.morph = new MorphTarget();
    this.gizmo = new Transpose();

    // 表示に反映済みのポリグループ可視バージョン。変わったときだけ GPU へ送る。
    this._visVersion = -1;
    // グループ色プレビュー用に退避した本来の頂点カラー
    this._savedColors = null;
    this._morphWarned = false;
  }

  get state() { return this.ctx.state; }
  get mesh() { return this.ctx.getMesh(); }
  get sculptor() { return this.ctx.getSculptor(); }
  get renderer() { return this.ctx.getRenderer(); }
  get ui() { return this.ctx.getUI(); }

  toast(msg, ms) { const u = this.ui; if (u) u.toast(msg, ms); }
  redraw() { if (this.ctx.redraw) this.ctx.redraw(); }
  autosave() { if (this.ctx.autosave) this.ctx.autosave(); }

  // --- 彫刻をレイヤーへ記録する仕掛け --------------------------------------

  /**
   * モーフブラシの実処理を sculptor へ差す。
   * ブラシ領域の頂点だけを、減衰重み × 強さで記憶形状へ戻す。
   */
  installMorphHook() {
    const s = this.sculptor;
    if (!s || s.morphHook) return;
    s.morphHook = (mesh, verts, count, center, radius, st) => {
      if (!this.morph.has) {
        // 記憶が無いと何も起きず理由も分からないので 1 回だけ知らせる
        if (!this._morphWarned) {
          this._morphWarned = true;
          this.toast('モーフブラシを使うには先に「モーフターゲット > 記憶」を押します', 4500);
        }
        return;
      }
      if (!this.morph.validate(mesh)) { this.morphInvalid(); return; }
      const w = computeMorphWeights(mesh, verts, count, center, radius, st.focalShift || 0);
      const amount = clamp(st.effStrength !== undefined ? st.effStrength : st.strength, 0, 1);
      this.morph.morphBrush(mesh, verts, count, w, amount);
    };
  }

  /**
   * sculptor の recorder フックを、いまのレイヤー状態に合わせて張り替える。
   * 記録対象のレイヤーが無いときは null にして、ブラシ経路のオーバーヘッドを消す。
   * ついでにモーフブラシのフックも差す（どちらも sculptor へ挿す穴なので一緒に見る）。
   */
  syncRecorder() {
    const s = this.sculptor;
    if (!s) return;
    this.installMorphHook();
    if (this.layers.recording < 0) { s.recorder = null; return; }
    if (!s.recorder) {
      s.recorder = {
        before: (mesh, verts, count) => this.layers.captureBefore(mesh, verts, count),
        after: (mesh, verts, count) => this.layers.commitAfter(mesh, verts, count),
      };
    }
  }

  /**
   * デフォームやギズモのようにメッシュ全体を動かす操作を、記録中のレイヤーへ入れる。
   * ZBrush でもデフォーメーションはアクティブなレイヤーに乗るので、それに合わせる。
   * 記録していなければそのまま実行する。
   */
  withLayerRecording(fn) {
    const rec = this.layers.recording;
    if (rec < 0 || !this.layers.validate(this.mesh)) return fn();
    const all = this._aliveList();
    this.layers.captureBefore(this.mesh, all, all.length);
    const r = fn();
    this.layers.commitAfter(this.mesh, all, all.length);
    return r;
  }

  /** 生存頂点の一覧（パレット操作で 1 回だけ使うので毎回作る） */
  _aliveList() {
    const m = this.mesh;
    const out = new Int32Array(m.liveVerts);
    let n = 0;
    for (let v = 0; v < m.nv; v++) if (m.vAlive[v]) out[n++] = v;
    return n === out.length ? out : out.subarray(0, n);
  }

  /** メッシュが差し替わった（新規作成 / 読み込み / ダイナメッシュ）ときに呼ぶ */
  onMeshReplaced() {
    this.layers.clear();
    this.morph.clear();
    this.gizmo.clear();
    this.syncRecorder();
    this.groups.sync(this.mesh);
    this.restoreColors();
    this.syncVisibility(true);
  }

  // --- デフォーメーション --------------------------------------------------

  /** デフォームを 1 回適用する。ZBrush と同じで破壊的（Undo で戻す） */
  applyDeform(id) {
    const meta = DEFORM_BY_ID.get(id);
    if (!meta) return;
    const st = this.state;
    const opts = Object.assign({}, st.deform.params[id], { axis: st.deform.axis });
    const r = this.withLayerRecording(() => applyDeform(this.mesh, id, opts));
    if (!r.ok) { this.toast(`${meta.jp}: 適用できませんでした`); return; }
    if (r.skipped === r.verts && r.changed === 0) {
      this.toast(`${meta.jp}: パラメータが不正です（NaN が入っていませんか）`, 3500);
      return;
    }
    if (r.changed === 0) {
      // 異常ではない。amount=0、既に球へ spherize、平面への軸方向 taper などは正しく 0。
      this.toast(`${meta.jp}: 変化なし`);
      return;
    }
    // 曲率は applyDeform 内で全再計算済みなので、溜まっている差分更新は捨てる
    this.sculptor.dropPendingCurvature();
    this.afterGeometryChange();
    let msg = `${meta.jp}: ${r.changed.toLocaleString()} / ${r.verts.toLocaleString()} 頂点 (${r.ms}ms)`;
    if (r.masked > 0) msg += ` / マスク保護 ${r.masked.toLocaleString()}`;
    this.toast(msg, 3000);
  }

  // --- マスクツール --------------------------------------------------------

  applyMaskOp(id) {
    const meta = MASK_OP_BY_ID.get(id);
    if (!meta) return;
    const st = this.state;
    const opts = Object.assign({}, st.mask.params[id] || {}, { mode: st.mask.mode });
    // 色は現在のペイント色、法線は視線方向を既定にする。
    // どちらもパレット側に別途スライダーを持たせるより、いま使っている値を
    // そのまま拾うほうが ZBrush の使い方に近い。
    if (id === 'color') opts.rgb = st.paintColor;
    if (id === 'normal') opts.dir = st.toCamera;
    const r = applyMaskOp(this.mesh, id, opts);
    this.sculptor.history.commit(this.mesh);
    this.redraw();
    this.toast(`${meta.jp}: マスク ${r.masked.toLocaleString()} / ${r.live.toLocaleString()} 頂点`);
  }

  // --- スカルプトレイヤー --------------------------------------------------

  /** レイヤーが使える状態か。使えないなら理由を toast で出す */
  layersReady(quiet = false) {
    if (this.layers.count === 0 && !this.layers.validate(this.mesh)) {
      // まだベースが無い
      return false;
    }
    if (!this.layers.validate(this.mesh)) {
      this.layers.clear();
      this.syncRecorder();
      if (!quiet) this.toast('トポロジが変わったためレイヤーを破棄しました（動的トポロジ / ダイナメッシュとは併用できません）', 4500);
      if (this.ui) this.ui.refreshLayers();
      return false;
    }
    return true;
  }

  layerAdd() {
    if (this.state.dynTopo) {
      this.state.dynTopo = false;
      if (this.ui) this.ui.syncFromState();
      this.toast('レイヤーを使うため動的トポロジをオフにしました', 3200);
    }
    if (this.layers.count === 0 || !this.layers.validate(this.mesh)) this.layers.setBase(this.mesh);
    const i = this.layers.add(`レイヤー ${this.layers.count + 1}`);
    this.syncRecorder();
    if (this.ui) this.ui.refreshLayers();
    this.toast(`レイヤーを追加しました（記録中: ${this.layers.list()[i].name}）`);
    return i;
  }

  layerRemove(index) {
    if (!this.layersReady()) return;
    const info = this.layers.list()[index];
    if (!info) return;
    if (!this.layers.remove(index)) return;
    this.syncRecorder();
    this.layers.rebuild(this.mesh);
    this.afterGeometryChange();
    if (this.ui) this.ui.refreshLayers();
    this.toast(`レイヤー「${info.name}」を削除しました`);
  }

  layerDuplicate(index) {
    if (!this.layersReady()) return;
    const i = this.layers.duplicate(index);
    if (i < 0) return;
    this.layers.rebuild(this.mesh);
    this.afterGeometryChange();
    if (this.ui) this.ui.refreshLayers();
    this.toast('レイヤーを複製しました');
  }

  layerRename(index, name) {
    this.layers.rename(index, name);
    if (this.ui) this.ui.refreshLayers();
  }

  layerSelect(index) {
    this.layers.select(index);
    this.syncRecorder();
    if (this.ui) this.ui.refreshLayers();
  }

  layerSetVisible(index, on) {
    if (!this.layersReady()) return;
    this.layers.setVisible(index, on);
    this.layers.rebuild(this.mesh);
    this.afterGeometryChange();
    if (this.ui) this.ui.refreshLayers();
  }

  /** 強度スライダー。ドラッグ中に毎回呼ばれるので履歴には積まない */
  layerSetIntensity(index, v, commit = false) {
    if (!this.layersReady()) return;
    this.layers.setIntensity(index, v);
    this.layers.rebuild(this.mesh);
    this.sculptor.dropPendingCurvature();
    this.mesh.computeAllNormals();
    this.mesh.computeAllCurvature();
    this.mesh.markAllDirty();
    if (commit) this.sculptor.history.commit(this.mesh);
    this.redraw();
    if (this.ui) this.ui.refreshLayers();
  }

  layerBake(index) {
    if (!this.layersReady()) return;
    const r = this.layers.bake(index, this.mesh);
    if (!r) return;
    if (this.ui) this.ui.refreshLayers();
    this.toast(`レイヤー「${r.name}」を焼き込みました（${r.verts.toLocaleString()} 頂点）`);
  }

  // --- ポリグループと部分表示 ----------------------------------------------

  groupAssign(method) {
    const meta = GROUP_METHODS.find((m) => m.id === method);
    const opts = {};
    if (method === 'byNormalAngle') opts.angle = this.state.groupAngle || 35;
    const r = this.groups.assign(this.mesh, method, opts);
    if (!r.ok) { this.toast('グループを作れませんでした'); return; }
    this.syncVisibility(true);
    if (this.state.groupView) this.applyGroupColors();
    this.redraw();
    if (this.ui) this.ui.refreshGroups();
    this.toast(`${meta ? meta.jp : method}: ${r.groups} グループ / ${r.tris.toLocaleString()} 面`);
  }

  /** 表示・非表示の操作をまとめて受ける。name は PolyGroups のメソッド名 */
  groupVisibility(name, ...args) {
    const fn = this.groups[name];
    if (typeof fn !== 'function') return;
    const r = fn.call(this.groups, this.mesh, ...args);
    this.syncVisibility();
    this.redraw();
    if (this.ui) this.ui.refreshGroups();
    if (r && r.hidden !== undefined) {
      this.toast(r.allVisible ? '全体を表示しました'
        : `表示 ${r.visible.toLocaleString()} 面 / 非表示 ${r.hidden.toLocaleString()} 面`);
    }
  }

  /** 可視インデックスを GPU へ送る。変わっていなければ何もしない */
  syncVisibility(force = false) {
    const r = this.renderer;
    if (!r) return;
    this.groups.sync(this.mesh);
    if (this.groups.allVisible) {
      if (force || this._visVersion !== -1) { r.setVisibleIndices(null, 0); this._visVersion = -1; }
      return;
    }
    const v = this.groups.buildVisibleIndices(this.mesh);
    if (!force && v.version === this._visVersion) return;
    r.setVisibleIndices(v.indices, v.count);
    this._visVersion = v.version;
  }

  /** グループ色を頂点カラーへ焼いてプレビューする（元の色は退避しておく） */
  applyGroupColors() {
    const m = this.mesh;
    if (!this._savedColors) this._savedColors = m.colors.slice(0, m.nv * 3);
    const r = this.groups.buildVertexGroupColors(m);
    m.colors.set(r.colors.subarray(0, m.nv * 3));
    m.markAllDirty();
    this.redraw();
  }

  /** グループ色プレビューを解除して元の頂点カラーへ戻す */
  restoreColors() {
    if (!this._savedColors) return;
    const m = this.mesh;
    const n = Math.min(this._savedColors.length, m.colors.length);
    m.colors.set(this._savedColors.subarray(0, n));
    this._savedColors = null;
    m.markAllDirty();
    this.redraw();
  }

  setGroupView(on) {
    this.state.groupView = on;
    if (on) this.applyGroupColors(); else this.restoreColors();
  }

  // --- モーフターゲット ----------------------------------------------------

  morphStore() {
    this._morphWarned = false;
    const r = this.morph.store(this.mesh);
    if (this.ui) this.ui.refreshMorph();
    this.toast(`モーフターゲットを記憶しました（${r.verts.toLocaleString()} 頂点 / ${(r.bytes / 1048576).toFixed(1)} MB）`);
  }

  morphSwitch() {
    if (!this.morph.has) { this.toast('モーフターゲットがありません'); return; }
    const r = this.morph.switchTo(this.mesh);
    if (!r.valid) { this.morphInvalid(); return; }
    this.afterGeometryChange();
    this.toast('モーフターゲットと入れ替えました');
  }

  morphRestore(amount) {
    if (!this.morph.has) { this.toast('モーフターゲットがありません'); return; }
    const r = this.withLayerRecording(() => this.morph.restore(this.mesh, amount));
    if (!r.valid) { this.morphInvalid(); return; }
    if (r.changed === 0) { this.toast('変化なし'); return; }
    this.afterGeometryChange();
    this.toast(`モーフへ ${Math.round(amount * 100)}% 戻しました（${r.changed.toLocaleString()} 頂点）`);
  }

  morphAmplify(factor) {
    if (!this.morph.has) { this.toast('モーフターゲットがありません'); return; }
    const r = this.withLayerRecording(() => this.morph.amplify(this.mesh, factor));
    if (!r.valid) { this.morphInvalid(); return; }
    if (r.changed === 0) { this.toast('変化なし'); return; }
    this.afterGeometryChange();
    this.toast(`差分を ${factor.toFixed(2)} 倍にしました（${r.changed.toLocaleString()} 頂点）`);
  }

  morphDiff() {
    if (!this.morph.has) return null;
    return this.morph.createDiff(this.mesh);
  }

  morphInvalid() {
    this.morph.clear();
    if (this.ui) this.ui.refreshMorph();
    this.toast('トポロジが変わったためモーフターゲットを破棄しました', 4000);
  }

  // --- リメッシュ（ZRemesher 相当） ----------------------------------------

  /** UI の設定から remesh() のオプションを作る */
  remeshOpts() {
    const st = this.state;
    return {
      targetTris: Math.max(100, Math.round(st.remeshTris || 20000)),
      iterations: Math.max(1, Math.round(st.remeshIterations || 5)),
      adaptive: st.remeshAdaptive || 0,
      relax: st.remeshRelax === undefined ? 0.5 : st.remeshRelax,
      project: st.remeshProject !== false,
      maxVerts: st.maxVerts,
    };
  }

  _remeshToast(before, r, where) {
    this.toast(`リメッシュ: ${before.toLocaleString()} → ${r.tris.toLocaleString()} 面`
      + ` / 目標辺長 ${r.targetLen.toFixed(4)} / ${r.ms}ms${where}`
      + `（分割 ${r.split} / 統合 ${r.collapse} / 反転 ${r.flip}）`, 5000);
  }

  /**
   * 目標ポリゴン数でリメッシュする（メインスレッド）。
   * トポロジが変わるので分割レベル・レイヤー・モーフは破棄される。
   */
  applyRemesh() {
    const m = this.mesh;
    const before = m.liveTris;
    const r = remesh(m, this.remeshOpts());
    if (!r.ok) { this.toast('リメッシュできませんでした: ' + r.reason, 4000); return; }
    this.afterTopologyChange();
    this._remeshToast(before, r, '');
  }

  /**
   * リメッシュをワーカーで走らせる。
   *
   * 520 万面だと 6 秒台かかる。メインスレッドで回すとビジー表示すら描き直されず
   * ブラウザが固まって見える（実際にそう報告された）ので、別スレッドへ出して
   * 進捗を出しながら待つ。ワーカーが使えない環境（file://、単一ファイル版、
   * Worker 無効）では黙ってメインスレッドに落ちる。
   *
   * @param {(p: object) => void} [onProgress] { stage, done, total, tris } を受ける
   * @returns {Promise<boolean>} ワーカーで実行できたか
   */
  async applyRemeshAsync(onProgress = null) {
    const m = this.mesh;
    const before = m.liveTris;
    const ok = await initRemeshWorker();
    if (!ok) { this.applyRemesh(); return false; }
    const res = await remeshInWorker(m, this.remeshOpts(), onProgress);
    if (!res) {
      // ワーカーで失敗した。理由を出してメインスレッドでやり直す。
      const why = remeshWorkerError();
      if (why) console.warn('リメッシュのワーカー実行に失敗、メインスレッドで再試行:', why);
      this.applyRemesh();
      return false;
    }
    m.setGeometry(res.positions, res.indices, res.colors, res.mask);
    this.afterTopologyChange();
    this._remeshToast(before, res.stats, ' / 別スレッド');
    return true;
  }

  /** リメッシュのワーカーが使える状態か（診断とテスト用） */
  remeshWorkerInfo() {
    return { state: remeshWorkerState(), error: remeshWorkerError(), wasm: remeshWorkerWasm() };
  }

  /** 現在の形を四角優勢にしたときの面の内訳（書き出しと表示用） */
  quadStats() {
    const q = quadDominant(this.mesh);
    return q;
  }

  /** いまの面数から、目標ポリゴン数の目安を返す（UI の初期値用） */
  suggestRemeshTris() {
    return Math.max(1000, Math.min(500000, Math.round(this.mesh.liveTris / 2)));
  }

  // --- クリップ / トリム / スライス / ミラー&ウェルド -----------------------

  /**
   * 画面のドラッグから作った平面で切る。
   * @param {string} kind 'clip' | 'trim' | 'slice'
   */
  applyPlane(kind, plane) {
    if (!plane) { this.toast('平面を作れませんでした（ドラッグが短すぎます）'); return; }
    const m = this.mesh;
    let r;
    if (kind === 'trim') r = trimPlane(m, plane, {});
    else if (kind === 'slice') r = slicePlane(m, plane, {});
    else r = clipPlane(m, plane, { falloff: this.state.clipFalloff || 0 });
    if (r.refused) { this.toast(`実行できませんでした: ${r.refused}`, 4000); return; }
    if (!r.changed) { this.toast('平面の裏側に形がありませんでした'); return; }
    this.afterTopologyChange();
    if (kind === 'trim') {
      this.toast(`トリム: ${r.removed.toLocaleString()} 頂点を削除 / ${r.added.toLocaleString()} 頂点を追加（切り口 ${r.loops} 個）`, 3500);
    } else if (kind === 'slice') {
      this.toast(`スライス: ${r.added.toLocaleString()} 頂点を追加`);
    } else {
      this.toast(`クリップ: ${r.moved.toLocaleString()} 頂点を平面上へ`);
    }
  }

  applyAxisPlane(kind, axis, offset, keep) {
    this.applyPlane(kind, planeFromAxis(axis, offset, keep));
  }

  planeFromDrag(a, b, viewDir) { return planeFromScreenLine(a, b, viewDir); }

  mirrorWeld(axis, keep) {
    const r = mirrorWeld(this.mesh, axis, { keep });
    if (r.refused) { this.toast(`ミラー&ウェルド: ${r.refused}`, 4000); return; }
    if (!r.changed) { this.toast('変化なし'); return; }
    this.afterTopologyChange();
    this.toast(`ミラー&ウェルド: ${r.removed.toLocaleString()} 頂点を削除 / 接合 ${r.welded.toLocaleString()} 頂点`, 3500);
  }

  // --- トランスポーズ ------------------------------------------------------

  /** マスクされていない領域からギズモを立てる */
  gizmoActivate() {
    const ok = this.gizmo.setFromMask(this.mesh, { local: !!this.state.transposeLocal });
    if (!ok) {
      this.toast('マスクされていない領域がありません（マスクを塗ってから使います）', 4000);
      return false;
    }
    const s = this.gizmo.stats();
    this.toast(`トランスポーズ: ${s.verts.toLocaleString()} 頂点が対象`);
    return true;
  }

  /** ギズモのドラッグ開始時に呼ぶ。レイヤー記録の「前」を押さえる */
  gizmoBeginRecord() {

  },
  clearMask() { sculptor.clearMask(); ui.toast('マスクをクリアしました'); },
  invertMask() { sculptor.invertMask(); ui.toast('マスクを反転しました'); },

  setRenderScale(v) { renderer.setRenderScale(v); },

  // --- 分割レベル（SDiv） ----------------------------------------------
  divide() {
    if (busy) return;
    const before = mesh.liveVerts;
    if (state.maxVerts && before * 4 > state.maxVerts) {

  /**
   * リメッシュ。数百 ms〜数秒かかるのでオーバーレイを出してから実行する。
   * 本体はワーカーで走るので、待っている間も画面は動き進捗が出る。
   */
  async remeshAdaptive() {
    if (busy) return;
    busy = true;
    ui.showBusy('リメッシュ中…');
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);
    try {
      await tools.applyRemeshAsync((p) => {
        const pct = Math.min(99, Math.round(p.done / Math.max(1, p.total) * 100));
        ui.showBusy(`リメッシュ中… ${pct}%（${p.stage} / ${p.tris.toLocaleString()} 面）`);
      });

      ui.toast('リメッシュでエラー: ' + e.message, 5000);
