<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebSculpt — WebGPU 3D スカルプト</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9744b'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23f5c0a4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">Web<b>Sculpt</b><span class="tag">WebGPU</span></div>
    <div id="meshBar" class="meshbar"></div>
    <div id="stats" class="stats"></div>
  </header>

  <div id="bodyrow">
    <aside id="leftbar">
      <div id="brushList" class="brushlist"></div>
    </aside>

    <main id="viewport">
      <canvas id="gpu"></canvas>
      <div id="toast" class="toast"></div>
      <div id="busy" class="busy">
        <div class="busy-card">
          <div class="spinner"></div>
          <p id="busyMsg">処理中…</p>
        </div>
      </div>
      <div id="ask" class="ask">
        <div class="ask-card">
          <p id="askMsg"></p>
          <div class="ask-btns">
            <button id="askNo" class="btn">いいえ</button>
            <button id="askYes" class="btn primary">はい</button>
          </div>
        </div>
      </div>
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>WebGPU デバイスと MatCap を初期化中…</p>
      </div>
      <!-- 使い方ページ。中身は js/help.js が組み立てる（ツール一覧を
           各パレットの表から生成するので、ここに書き写さない） -->
      <div id="help" class="help"></div>
      <!-- レンダリングプレビュー。設定を動かすと描き直す -->
      <!-- 編集モードの矩形選択。オーバーレイ線のバッファは編集メッシュの
           ワイヤ表示に使っているので、矩形は DOM で描く -->
      <div id="editbox" class="editbox"></div>
      <!-- モーダル変形（G / R / S）中の表示。いまの操作・軸・量と操作方法を出す -->
      <div id="modalhud" class="modalhud"></div>
      <div id="rpv" class="rpv">
        <div class="rpv-card">
          <div class="rpv-head">
            <span class="rpv-title">レンダリングプレビュー</span>
            <span id="rpvInfo" class="rpv-info"></span>
            <button id="rpvSave" class="btn primary">PNG 保存</button>
            <button id="rpvClose" class="btn">閉じる</button>
          </div>
          <div class="rpv-body"><img id="rpvImg" alt="レンダリング結果"></div>
        </div>
      </div>
    </main>

    <aside id="rightbar">
      <div id="rightPanel" class="panel"></div>
    </aside>
  </div>
</div>

<div id="fatal" class="fatal">
  <div class="card">
    <div class="ico">⚠</div>
    <h2 id="fatalMsg">エラー</h2>
    <p id="fatalDetail"></p>
    <p class="small">
      対応環境: Chrome / Edge 113+、Safari 18+、WebGPU を有効化した Firefox。<br>
      <code>chrome://gpu</code> で WebGPU の状態を確認できます。
    </p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
